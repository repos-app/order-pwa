<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <title>Sales</title>
  <style>
    :root{ --bg:#f6f7f9; --surface:#fff; --border:#e5e7eb; --navy:#0f172a; --text-3:#64748b; --red:#c62828; --filter-control-h:46px; }
    *{ box-sizing:border-box; }
    body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans JP',sans-serif; background:var(--bg); color:var(--navy); }
    .head{ position:sticky; top:0; z-index:20; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:space-between; padding:12px 16px; }
    .head h1{ font-size:18px; margin:0; font-weight:900; }
    .hbtn{ background:rgba(255,255,255,.14); color:#fff; border:0; border-radius:9px; padding:8px 12px; font-size:13px; font-weight:800; cursor:pointer; text-decoration:none; }
    .wrap{ padding:16px; max-width:900px; margin:0 auto; }
    .card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:14px; }
    .card-title{ font-weight:900; font-size:15px; margin-bottom:12px; }
    .chart-wrap{ height:220px; }
    /* [iPhone表示対応] min-widthで表全体の最小幅を確保し、外側のoverflow:autoラッパーで横スクロールさせる
       （分析テーブルは列数が多いため700px。#monthlyは元々ラッパー無しだったのでここで追加する）。 */
    table{ width:100%; min-width:700px; border-collapse:collapse; font-size:13px; }
    th,td{ padding:8px 6px; border-bottom:1px solid var(--border); text-align:left; white-space:nowrap; }
    th{ font-size:11px; color:var(--text-3); }
    #monthly{ overflow:auto; }
    #monthly table{ min-width:0; } /* 月別サマリーは2列のみのため表全体の最小幅制約は不要 */
    #popList{ overflow:hidden; width:100%; }
    #popList table{ min-width:0; width:100%; table-layout:fixed; }
    #popList th,#popList td{ padding:7px 4px; white-space:normal; vertical-align:middle; }
    #popList .pop-rank{ width:32px; text-align:center; }
    #popList .pop-item{ overflow-wrap:anywhere; word-break:break-word; }
    #popList .pop-cat{ display:block; margin-top:2px; color:var(--text-3); font-size:10.5px; line-height:1.25; }
    #popList .pop-qty{ width:42px; text-align:right; }
    #popList .pop-score{ width:112px; }
    #popList .pop-score-row{ display:flex; align-items:center; gap:4px; min-width:0; }
    #popList .pop-bar{ flex:1 1 auto; min-width:34px; max-width:58px; height:8px; background:#eef1f5; border-radius:5px; overflow:hidden; }
    #popList .pop-bar > span{ display:block; height:100%; }
    #popList .pop-score-num{ flex:0 0 auto; font-weight:800; font-size:11px; }
    #popList .pop-status{ display:block; margin-top:2px; font-weight:800; font-size:10px; line-height:1.2; }
    @media (max-width:420px){
      #popList th,#popList td{ padding-left:3px; padding-right:3px; }
      #popList .pop-rank{ width:28px; }
      #popList .pop-qty{ width:38px; }
      #popList .pop-score{ width:96px; }
      #popList .pop-bar{ max-width:46px; }
    }
    .form-label{ font-size:12px; font-weight:700; display:block; margin-bottom:4px; }
    .fc{ width:100%; padding:10px; border:1px solid var(--border); border-radius:9px; font-size:15px; font-family:inherit; background:var(--surface); }
    .btn{ height:var(--filter-control-h); border:0; border-radius:10px; padding:0 16px; font-size:14px; font-weight:800; background:var(--navy); color:#fff; cursor:pointer; font-family:inherit; display:inline-flex; align-items:center; justify-content:center; white-space:nowrap; }
    .filter-bar{ display:flex; gap:12px; align-items:flex-end; margin-bottom:12px; flex-wrap:wrap; }
    .month-field{ flex:0 0 188px; min-width:0; max-width:188px; padding-right:8px; overflow:visible; }
    .month-field .fc{ display:block; inline-size:100%!important; width:100%!important; min-inline-size:0!important; min-width:0!important; max-inline-size:100%!important; max-width:100%!important; box-sizing:border-box; }
    .filter-bar > .btn{ flex:0 0 auto; align-self:flex-end; }
    @media (max-width:520px){ .fc{ min-width:0; font-size:16px; } }
    .hint{ color:var(--text-3); font-size:13px; }
    .row-click{ cursor:pointer; }
  </style>
  <link rel="stylesheet" href="./date-controls.css?v=3">
</head>
<body>
  <div class="head"><h1 data-t="title">📊 売上管理</h1><div style="display:flex;gap:8px;"><button class="hbtn" data-tlang onclick="I18n.toggle()">EN</button><a class="hbtn" href="./manage.html" data-t="back">← 管理へ</a></div></div>
  <div class="wrap">
    <div class="card">
      <div class="card-title" data-t="dailyTitle">📈 日別売上</div>
      <div class="chart-wrap"><canvas id="dailyChart"></canvas></div>
      <p id="noData" style="display:none;text-align:center;color:#aaa;padding:20px 0;"></p>
    </div>
    <div class="card">
      <div class="card-title" data-t="monthlyTitle">📅 月別サマリー</div>
      <div id="monthly"><div class="hint" data-t="loading">読み込み中…</div></div>
    </div>
    <div class="card">
      <div class="card-title" data-t="anaTitle">🔎 分析（商品・時間帯・曜日）</div>
      <div class="filter-bar">
        <div class="month-field"><label class="form-label" for="anaMonth" data-t="month">対象月</label><input type="month" id="anaMonth" class="fc"></div>
        <button class="btn" onclick="loadAnalytics()" data-t="analyze">🔍 分析</button>
      </div>
      <div id="anaSummary" class="hint" style="margin-bottom:10px;"></div>
      <div style="font-weight:800;margin:6px 0;" data-t="byItem">🏆 商品別（ABC分析）</div>
      <div style="overflow:auto;"><table id="anaItems"><tbody><tr><td style="color:#aaa;padding:14px;">—</td></tr></tbody></table></div>
      <div style="font-weight:800;margin:14px 0 6px;" data-t="byCat">🍱 カテゴリ別売上</div>
      <div style="overflow:auto;"><table id="anaCat"><tbody><tr><td style="color:#aaa;padding:14px;">—</td></tr></tbody></table></div>
      <div style="font-weight:800;margin:14px 0 6px;" data-t="byHour">🕐 時間帯別</div>
      <div style="height:180px;"><canvas id="hourChart"></canvas></div>
      <div style="font-weight:800;margin:16px 0 6px;" data-t="byDow">📅 曜日別</div>
      <div style="height:180px;"><canvas id="dowChart"></canvas></div>
    </div>
    <div class="card">
      <div class="card-title" data-t="popTitle">🍽️ メニュー人気度スコア（直近30日）</div>
      <div class="hint" style="margin-bottom:8px;" data-t="popHint">直近30日の注文数量で算出（最も売れた商品=100）。低スコア・未売上はメニュー見直しの参考に。</div>
      <div id="popList"><div class="hint" data-t="loading">読み込み中…</div></div>
    </div>
  </div>

  <script src="./date-display.js?v=auth4" data-iz-date-display></script><script src="./config.js?v=auth2"></script>
  <script src="./api.js?v=auth2"></script>
  <script src="./i18n.js?v=auth3"></script>
  <script>
    var TOKEN = localStorage.getItem(window.APP_CONFIG.AUTH_STORAGE_PREFIX + 'mgmtToken') || '';
    if (!TOKEN) location.href = './manage.html';
    // opts: {silent:bool, timeoutMs:number, noInternalRetry:bool}（[GPT第22回レポート対応/G22-1・G22-2]）
    function rpc(fn,args,opts){
      opts = opts || {};
      var payload = { fn:fn, args:args||[], token:TOKEN };
      if (opts.silent) payload.__silent = true;
      if (typeof opts.timeoutMs === 'number') payload.__timeoutMs = opts.timeoutMs;
      if (opts.noInternalRetry) payload.__noInternalRetry = true;
      return API.post('rpc',payload).then(function(r){ return r.data; });
    }
    // [GPT第22回レポート対応/G22-1] 実測でSales分析が約69〜72秒、Dashboardが約115秒かかっていた。
    // 原因はapi.js自身の内部再送（最大2 fetch）と、この画面のrpcBusyRetry（追加1回＝内部で
    // さらに最大2 fetch）が重なり、最悪ケースで合計4 fetch・fetch上限25秒×4＋backoffという
    // 事実上無制限に近い総待ち時間になっていたこと。再試行の責務をこの画面（rpcBusyRetry）だけに
    // 一本化し、API.post側の内部再送は無効化（__noInternalRetry）した上で、fetchタイムアウトを
    // サーバー側single-flightの壁時計上限（20秒）より確実に長く・api.js既定（30秒）より短い23秒に
    // 個別指定する。これにより総待ち時間の上限は「23秒×2回＋backoff」＝約47〜49秒に固定される
    // （旧設計の理論値100秒超から半分以下に短縮。真の解決はG22-3の集計高速化）。
    // [タイムアウト共通化(2026-08-22)] 値の定義元はapi.js（API.TIMEOUT_MS.heavy=23000）に一本化した。
    var _HEAVY_RPC_TIMEOUT_MS = API.TIMEOUT_MS.heavy;
    function rpcHeavy(fn, args){
      // [GPT第22回レポート対応/G22-2] silent:trueにより、api.js共通の全画面オーバーレイ（#izLoad）を
      // 表示しない。重い集計の間もヘッダーのEN切替・「← 管理へ」・他画面への遷移操作を塞がない。
      // 進捗表示は各セクション内（anaItems/popList等）のインライン表示のみで行う。
      return rpc(fn, args, { silent:true, timeoutMs:_HEAVY_RPC_TIMEOUT_MS, noInternalRetry:true });
    }
    function _isBusyOrTimeoutError(e){
      if (!e) return false;
      var msg = String(e.message||e||'');
      if (msg === 'server_busy_retry') return true;
      if (e.name === 'AbortError') return true;
      if (/timeout|abort/i.test(msg)) return true;
      return false;
    }
    function rpcBusyRetry(fn, args, retriesLeft){
      retriesLeft = (retriesLeft==null) ? 1 : retriesLeft;
      return rpcHeavy(fn, args).catch(function(e){
        var isBusy = _isBusyOrTimeoutError(e);
        if (isBusy && retriesLeft > 0) {
          var waitMs = 1000 + Math.floor(Math.random()*2000);
          return new Promise(function(resolve){ setTimeout(resolve, waitMs); }).then(function(){
            return rpcBusyRetry(fn, args, retriesLeft - 1);
          });
        }
        if (isBusy) {
          var busyErr = new Error(loc('集計が混み合っています。しばらくしてから「再試行」を押してください。', 'This analysis is busy. Please wait a moment and tap Retry.'));
          throw busyErr;
        }
        throw e;
      });
    }
    // [GPT第22回レポート対応/G22-2] エラー内容＋最終試行時刻＋「再試行」ボタン（onclickで指定した
    // 関数を再実行）を表示する共通ヘルパー。長時間の自動再試行を重ねる代わりに、自動再試行が
    // 尽きた時点で操作を利用者に委ねる（総待ち時間の上限を明確にする）。
    function _retryTs(){ return new Date().toLocaleTimeString(isEN()?'en-US':'ja-JP'); }
    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
    // 言語切替の一元ヘルパー（新しい表示・候補リストを追加する際は必ずこれを通すこと）
    function isEN(){ return !!(window.I18n && I18n.lang && I18n.lang()==='en'); }
    function loc(ja, en){ ja=(ja||'').trim(); en=(en||'').trim(); return isEN() ? (en || ja) : (ja || en); }
    var SYM = '₱';
    function money(v){ return SYM + (Number(v)||0).toLocaleString(); }
    var dailyChart, hourChart, dowChart;
    var _sales=null, _ana=null, _pop=null;

    // [GPTレビュー(2026-08-19再確認レポート)対応/C-4、2026-08-20再確認レポート対応/S-8]
    // getSalesSummaryは、初回集計の分割移行が完了するまで{daily:[],monthly:[],building:true}を
    // 返すようになった（36,000件規模でも画面をブロックしないよう、移行は日次集計に関わる
    // リクエストのついでに少しずつ進む）。buildingの間は「集計を構築中」表示にして自動で再試行し、
    // 通常のsalesが空というケースと区別する。
    // [S-8対応] 以前は再試行間隔が常に4秒固定・無期限で、しかも分析（getSalesAnalytics）・
    // 人気度（getMenuPopularity）という重いRPCを構築中かどうかに関わらず初回表示時に並行実行して
    // いたため、移行処理と重い集計処理が同時に走って余計な負荷・timeoutを増やしていた。
    // 今回、(1) 再試行間隔を4秒→6秒→8秒→10秒…と徐々に伸ばし、既定30回（合計6〜7分程度）で
    // 自動再試行を打ち切って手動再読み込みを促す、(2) 分析・人気度の読み込みはgetSalesSummaryが
    // building:false（構築完了）になってから初めて開始する、の2点を修正した。
    var _buildingRetryTimer = null;
    var _buildingRetryCount = 0;
    var _BUILDING_RETRY_MAX = 30;
    var _heavyLoadsStarted = false;
    // [GPT第3回確認レポート(2026-08-20)対応/T-6] 分析（getSalesAnalytics）・人気度（getMenuPopularity）
    // を同時並行で開始すると、どちらも重いRPCのため実環境で両方timeoutしていた。順番に実行する
    // （分析が終わってから人気度を開始する）ことで、同時に走る重いリクエストを1つに減らす。
    // [GPT第22回レポート対応/G22-2] 初回は分析→人気度の順に1回だけ自動起動する（従来通り）。
    // 人気度は_popularityStartedで「初回のみ」を保証し、以降は再試行ボタン（_loadPopularity()）でのみ起動する。
    var _popularityStarted = false;
    function _startHeavyLoadsOnce(){
      if (_heavyLoadsStarted) return;
      _heavyLoadsStarted = true;
      loadAnalytics();
    }
    function _loadPopularityOnce(){
      if (_popularityStarted) return;
      _popularityStarted = true;
      _loadPopularity();
    }
    function _loadPopularity(){
      document.getElementById('popList').innerHTML = '<div class="hint">'+I18n.t('loading')+'</div>';
      rpcBusyRetry('getMenuPopularity',[30]).then(renderPopularity).catch(function(e){
        document.getElementById('popList').innerHTML = '<div style="color:#b91c1c;">'+esc(API.userErrorText(e))
          +'<div style="margin-top:6px;font-size:12px;color:var(--text-3);">'+loc('最終試行: ','Last attempt: ')+_retryTs()+'</div>'
          +'<button type="button" class="btn" style="margin-top:8px;" onclick="_loadPopularity()">'+loc('🔄 再試行','🔄 Retry')+'</button>'
          +'</div>';
      });
    }
    // [T-9対応] getSalesSummaryのbuilding応答に含まれる進捗（processedRows/totalRows/percent）と
    // 最終稼働時刻(lastHeartbeat)を使い、単に「構築中…」と出すだけでなく、実際に進んでいるのか
    // 止まっているのかが分かる表示にする。
    function _buildingText(data){
      var pct = (data && typeof data.percent === 'number') ? data.percent : null;
      var base = isEN() ? 'Building sales summary for the first time. This can take a bit — retrying automatically…' : '売上集計を初回構築中です。しばらくすると自動で再取得します…';
      if (pct === null) return base;
      var pctText = isEN() ? (' (' + pct + '% , ' + data.processedRows + '/' + data.totalRows + ' rows)') : ('（' + pct + '%、' + data.processedRows + '/' + data.totalRows + '件）');
      var stalled = data.lastHeartbeat && (Date.now() - data.lastHeartbeat > 5 * 60 * 1000);
      var stalledText = stalled ? (isEN() ? ' — no progress for a while. Try reloading, or open the sales screen once more to nudge it.' : ' — しばらく進んでいません。再読み込みするか、もう一度この画面を開いて進めてみてください。') : '';
      return base + pctText + stalledText;
    }
    function renderSales(data){
      _sales = data || _sales;
      data = _sales;
      if (data && data.building){
        document.getElementById('noData').style.display='block';
        if (_buildingRetryTimer) clearTimeout(_buildingRetryTimer);
        if (_buildingRetryCount >= _BUILDING_RETRY_MAX){
          document.getElementById('noData').innerText = isEN() ? 'Still building the sales summary. Please reload in a bit.' : '売上集計の構築にまだ時間がかかっています。しばらくしてから再読み込みしてください。';
          document.getElementById('monthly').innerHTML = '<div class="hint">'+(isEN() ? 'Building…' : '構築中…')+'</div>';
          return;
        }
        document.getElementById('noData').innerText = _buildingText(data);
        document.getElementById('monthly').innerHTML = '<div class="hint">'+(isEN() ? 'Building…' : '構築中…')+'</div>';
        var delay = Math.min(4000 + _buildingRetryCount * 2000, 20000);
        _buildingRetryCount++;
        _buildingRetryTimer = setTimeout(function(){ rpc('getSalesSummary',[],{silent:true}).then(renderSales).catch(function(){}); }, delay);
        return;
      }
      // [T-8対応] buildingからdaily表示へ切り替わった際、「初回構築中」のバナーや自動再試行タイマーが
      // 残ったままにならないよう、正常データを受け取った時点で明示的にリセットする。
      if (_buildingRetryTimer) { clearTimeout(_buildingRetryTimer); _buildingRetryTimer = null; }
      _buildingRetryCount = 0;
      document.getElementById('noData').style.display='none';
      document.getElementById('noData').innerText='';
      _startHeavyLoadsOnce();
      if (!data || !data.daily || !data.daily.length){ document.getElementById('noData').style.display='block'; document.getElementById('noData').innerText=I18n.t('noSales'); document.getElementById('monthly').innerHTML='<div class="hint">'+I18n.t('noData')+'</div>'; return; }
      var labels = data.daily.map(function(r){ return window.DateDisplay?DateDisplay.format(r.date):r.date; });
      var totals = data.daily.map(function(r){ return r.total; });
      if (dailyChart) dailyChart.destroy();
      dailyChart = new Chart(document.getElementById('dailyChart').getContext('2d'), {
        type:'line', data:{ labels:labels, datasets:[{ label:I18n.t('dailySales'), data:totals, borderColor:'#c62828', backgroundColor:'rgba(198,40,40,0.12)', fill:true, tension:0.3, pointBackgroundColor:'#c62828' }] },
        // [表示改善] x軸を明示的に指定しないと、Chart.jsがラベル（'yyyy-MM-dd'文字列）を日時として
        // 自動解釈し、曜日・タイムゾーン付きの冗長な表記（例："Fri Apr 03 2026 ... GMT+0900"）で
        // 描画してしまい、データ件数が多いと軸がぐちゃぐちゃになっていた。x軸を'category'として
        // 明示し、ラベルはサーバーが返す'yyyy-MM-dd'をそのまま年/月/日だけの表記に整形して使う。
        // 件数が多い日は自動間引き(autoSkip)し、回転もかけない。
        options:{ responsive:true, maintainAspectRatio:false, scales:{
          x:{ type:'category', ticks:{ autoSkip:true, maxRotation:0, minRotation:0, callback:function(v, i){ var s=labels[i]; return s ? s.replace(/-/g,'/') : s; } } },
          y:{ beginAtZero:true, ticks:{ callback:function(v){ return money(v); } } }
        } }
      });
      var mh = '<table><thead><tr><th>'+I18n.t('colMonth')+'</th><th style="text-align:right;">'+I18n.t('colTotal')+'</th></tr></thead><tbody>';
      data.monthly.forEach(function(r){ mh += '<tr><td>'+esc(window.DateDisplay?DateDisplay.formatMonth(r.month):r.month)+'</td><td style="text-align:right;"><strong>'+money(r.total)+'</strong></td></tr>'; });
      mh += '</tbody></table>';
      document.getElementById('monthly').innerHTML = mh;
    }

    window.loadAnalytics = function(){
      var month = document.getElementById('anaMonth').value; if(!month) return;
      document.getElementById('anaItems').innerHTML = '<tbody><tr><td style="padding:14px;">'+I18n.t('loading')+'</td></tr></tbody>';
      rpcBusyRetry('getSalesAnalytics',[month]).then(renderAnalytics).catch(function(e){
        document.getElementById('anaItems').innerHTML = '<tbody><tr><td style="color:#b91c1c;padding:14px;">'+esc(API.userErrorText(e))
          +'<div style="margin-top:6px;font-size:12px;color:var(--text-3);">'+loc('最終試行: ','Last attempt: ')+_retryTs()+'</div>'
          +'<button type="button" class="btn" style="margin-top:8px;" onclick="loadAnalytics()">'+loc('🔄 再試行','🔄 Retry')+'</button>'
          +'</td></tr></tbody>';
      }).then(function(){
        // [G22-2] 分析の成功・失敗いずれの場合も、初回に限り人気度の読み込みへ進む
        // （従来からの「分析→人気度を直列」の動線を維持。並行実行は過去のT-6で回帰済みのため避ける）。
        _loadPopularityOnce();
      });
    };
    function renderAnalytics(d){
      _ana = d || _ana || { items:[], byHour:[], byDow:[], total:0, count:0 };
      d = _ana;
      document.getElementById('anaSummary').innerText = I18n.t('sOrders')+d.count+I18n.t('sOrdersU')+' ・ '+I18n.t('sSales')+money(d.total)+' ・ '+I18n.t('sAvg')+money(d.avg||0)+' ・ '+I18n.t('sCost')+(d.costRate||0)+'%';
      var abc = { A:'#16a34a', B:'#f59e0b', C:'#94a3b8' };
      var html = '<thead><tr><th>'+I18n.t('cItem')+'</th><th style="text-align:right;">'+I18n.t('cQty')+'</th><th style="text-align:right;">'+I18n.t('cRev')+'</th><th style="text-align:right;">'+I18n.t('cCost')+'</th><th style="text-align:right;">'+I18n.t('cCostR')+'</th><th style="text-align:right;">'+I18n.t('cCum')+'</th><th>ABC</th></tr></thead><tbody>';
      if (!d.items.length) html += '<tr><td colspan="7" style="color:#aaa;padding:14px;">'+I18n.t('noData')+'</td></tr>';
      d.items.forEach(function(it){ html += '<tr><td>'+esc(loc(it.name, it.nameEn))+'</td><td style="text-align:right;">'+it.qty+'</td><td style="text-align:right;">'+money(it.revenue)+'</td><td style="text-align:right;color:var(--text-3);">'+money(it.cost||0)+'</td><td style="text-align:right;">'+(it.costRate||0)+'%</td><td style="text-align:right;">'+it.cumPct+'%</td><td><span style="background:'+(abc[it.abc]||'#94a3b8')+';color:#fff;font-weight:800;font-size:11px;padding:1px 8px;border-radius:999px;">'+it.abc+'</span></td></tr>'; });
      html += '</tbody>';
      document.getElementById('anaItems').innerHTML = html;
      var ch = '<thead><tr><th>'+I18n.t('cCat')+'</th><th style="text-align:right;">'+I18n.t('cRev')+'</th></tr></thead><tbody>';
      (d.byCategory||[]).forEach(function(c){ ch += '<tr><td>'+esc(loc(c.category, c.categoryEn)||I18n.t('other'))+'</td><td style="text-align:right;">'+money(c.revenue)+'</td></tr>'; });
      if(!(d.byCategory||[]).length) ch += '<tr><td colspan="2" style="color:#aaa;padding:14px;">—</td></tr>';
      ch += '</tbody>'; document.getElementById('anaCat').innerHTML = ch;
      var hLabels = d.byHour.map(function(x){ return x.hour+I18n.t('hourU'); });
      if (hourChart) hourChart.destroy();
      hourChart = new Chart(document.getElementById('hourChart').getContext('2d'), { type:'bar', data:{ labels:hLabels, datasets:[{ data:d.byHour.map(function(x){return x.revenue;}), backgroundColor:'#2563eb' }] }, options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true}} } });
      var dowNames = I18n.t('dowNames').split(',');
      if (dowChart) dowChart.destroy();
      dowChart = new Chart(document.getElementById('dowChart').getContext('2d'), { type:'bar', data:{ labels:dowNames, datasets:[{ data:d.byDow.map(function(x){return x.revenue;}), backgroundColor:'#16a34a' }] }, options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true}} } });
    }

    // 通貨記号
    API.post('getSettings', {}).then(function(r){ if(r.data && r.data.currencySymbol) SYM = r.data.currencySymbol; }).catch(function(){});
    // 2026-08-24修正: toISOString()はUTC基準のため、フィリピン時間で月初の午前0〜8時頃に開くと
    // 前月が選択されてしまう不具合があった（profit_sim.htmlで先に見つけて修正済みだった同じ問題を
    // 横展開）。ローカル時間（店舗のタイムゾーン）で当月を決める。
    API.initStoreDateInputs([{id:'anaMonth',kind:'month'}], function(){ if(_heavyLoadsStarted) loadAnalytics(); });
    rpc('getSalesSummary',[],{silent:true}).then(renderSales).catch(function(e){ if(String(e.message||e).indexOf('unauthorized')>=0){ location.href='./manage.html'; return; } document.getElementById('monthly').innerHTML='<div style="color:#b91c1c;">'+I18n.t('loadErr')+esc(API.userErrorText(e))
      +'<div style="margin-top:6px;font-size:12px;color:var(--text-3);">'+loc('最終試行: ','Last attempt: ')+_retryTs()+'</div>'
      +'<button type="button" class="btn" style="margin-top:8px;" onclick="rpc(\'getSalesSummary\',[],{silent:true}).then(renderSales)">'+loc('🔄 再試行','🔄 Retry')+'</button></div>'; });

    function renderPopularity(d){
      _pop = d || _pop || { items:[] };
      d = _pop;
      var lb = { hot:[I18n.t('lHot'),'#16a34a'], ok:[I18n.t('lOk'),'#2563eb'], low:[I18n.t('lLow'),'#f59e0b'], unsold:[I18n.t('lUnsold'),'#b91c1c'] };
      var html = '<table class="pop-table"><thead><tr><th class="pop-rank">#</th><th>'+I18n.t('cItem')+'</th><th class="pop-qty">'+I18n.t('cQty')+'</th><th class="pop-score">'+I18n.t('cScore')+'</th></tr></thead><tbody>';
      if(!d.items.length){ html += '<tr><td colspan="4" style="color:#aaa;padding:14px;">'+I18n.t('noData')+'</td></tr>'; }
      d.items.forEach(function(it,i){
        var l = lb[it.label]||lb.ok;
        var bar = '<div class="pop-score-row"><div class="pop-bar"><span style="width:'+it.score+'%;background:'+l[1]+';"></span></div><span class="pop-score-num">'+it.score+'</span></div><span class="pop-status" style="color:'+l[1]+';">'+l[0]+'</span>';
        html += '<tr><td class="pop-rank">'+(i+1)+'</td><td class="pop-item">'+esc(loc(it.name, it.nameEn))+'<span class="pop-cat">'+esc(loc(it.category, it.categoryEn))+'</span></td><td class="pop-qty">'+it.qty+'</td><td class="pop-score">'+bar+'</td></tr>';
      });
      html += '</tbody></table>';
      document.getElementById('popList').innerHTML = html;
    }
    // [S-8対応] 人気度の初回読み込みは_startHeavyLoadsOnce()（renderSales内、構築完了後に1回だけ）で
    // 行う。ここでは即時実行しない（構築中の重複負荷を避けるため）。

    I18n.init({
      ja:{ title:'📊 売上管理', back:'← 管理へ', dailyTitle:'📈 日別売上', monthlyTitle:'📅 月別サマリー', anaTitle:'🔎 分析（商品・時間帯・曜日）', month:'対象月', analyze:'🔍 分析', byItem:'🏆 商品別（ABC分析）', byCat:'🍱 カテゴリ別売上', byHour:'🕐 時間帯別', byDow:'📅 曜日別', popTitle:'🍽️ メニュー人気度スコア（直近30日）', popHint:'直近30日の注文数量で算出（最も売れた商品=100）。低スコア・未売上はメニュー見直しの参考に。', loading:'読み込み中…', noData:'データがありません', noSales:'売上データがありません。', dailySales:'日別売上', colMonth:'月', colTotal:'合計', sOrders:'注文 ', sOrdersU:'件', sSales:'売上 ', sAvg:'客単価 ', sCost:'原価率 ', cItem:'商品', cQty:'数量', cRev:'売上', cCost:'原価', cCostR:'原価率', cCum:'累計比', cCat:'カテゴリ', cScore:'スコア', other:'その他', hourU:'時', dowNames:'日,月,火,水,木,金,土', lHot:'🔥人気', lOk:'標準', lLow:'⚠️低調', lUnsold:'❌未売上', loadErr:'読み込みエラー: ' },
      en:{ title:'📊 Sales', back:'← Manage', dailyTitle:'📈 Daily sales', monthlyTitle:'📅 Monthly summary', anaTitle:'🔎 Analysis (items / hours / days)', month:'Target month', analyze:'🔍 Analyze', byItem:'🏆 By item (ABC analysis)', byCat:'🍱 Sales by category', byHour:'🕐 By hour', byDow:'📅 By day of week', popTitle:'🍽️ Menu popularity score (last 30 days)', popHint:'Based on order quantity over the last 30 days (top seller = 100). Low-score / unsold items help you review the menu.', loading:'Loading…', noData:'No data', noSales:'No sales data.', dailySales:'Daily sales', colMonth:'Month', colTotal:'Total', sOrders:'Orders ', sOrdersU:'', sSales:'Sales ', sAvg:'Avg/order ', sCost:'Cost rate ', cItem:'Item', cQty:'Qty', cRev:'Revenue', cCost:'Cost', cCostR:'Cost %', cCum:'Cum %', cCat:'Category', cScore:'Score', other:'Other', hourU:':00', dowNames:'Sun,Mon,Tue,Wed,Thu,Fri,Sat', lHot:'🔥Popular', lOk:'Normal', lLow:'⚠️Low', lUnsold:'❌Unsold', loadErr:'Load error: ' }
    }, function(){ if(_sales) renderSales(); if(_ana) renderAnalytics(); if(_pop) renderPopularity(); });
  </script>
