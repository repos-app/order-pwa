<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Manage">
  <link rel="manifest" href="./manage.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <title>Management</title>
  <style>
    :root{ --bg:#f6f7f9; --surface:#fff; --border:#e5e7eb; --navy:#0f172a; --text-3:#64748b; --red:#c62828; }
    *{ box-sizing:border-box; }
    body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans JP',sans-serif; background:var(--bg); color:var(--navy); -webkit-tap-highlight-color:transparent; }
    .head{ position:sticky; top:0; z-index:20; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:space-between; padding:12px 16px; }
    .head h1{ font-size:18px; margin:0; font-weight:900; }
    .head .r{ display:flex; gap:8px; align-items:center; font-size:13px; }
    .hbtn{ background:rgba(255,255,255,.14); color:#fff; border:0; border-radius:9px; padding:8px 12px; font-size:13px; font-weight:800; cursor:pointer; }
    .wrap{ padding:16px; max-width:900px; margin:0 auto; }
    /* Login */
    .login{ max-width:340px; margin:8vh auto; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:26px 22px; box-shadow:0 8px 24px rgba(0,0,0,.06); }
    .login .emoji{ font-size:42px; text-align:center; }
    .login h2{ text-align:center; font-size:19px; margin:8px 0 4px; }
    .login p{ text-align:center; color:var(--text-3); font-size:13px; margin:0 0 16px; }
    .fc{ width:100%; padding:12px; border:1px solid var(--border); border-radius:10px; font-size:16px; font-family:inherit; margin-bottom:12px; }
    .btn{ width:100%; border:0; border-radius:11px; padding:14px; font-size:15px; font-weight:900; color:#fff; background:var(--navy); cursor:pointer; font-family:inherit; }
    .err{ display:none; color:var(--red); font-size:13px; font-weight:700; text-align:center; margin-bottom:10px; }
    /* Hub */
    .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
    .tile{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px 14px; text-decoration:none; color:var(--navy); display:flex; flex-direction:column; gap:6px; cursor:pointer; }
    .tile .ic{ font-size:26px; }
    .tile .tt{ font-weight:800; font-size:15px; }
    .tile .ds{ font-size:12px; color:var(--text-3); }
    .hidden{ display:none; }
    .mtabs{ display:flex; gap:8px; overflow-x:auto; padding-bottom:12px; -webkit-overflow-scrolling:touch; }
    .mtab{ flex:0 0 auto; background:var(--surface); border:1px solid var(--border); color:var(--text-3); border-radius:999px; padding:9px 16px; font-size:14px; font-weight:800; cursor:pointer; font-family:inherit; white-space:nowrap; }
    .mtab.on{ background:var(--navy); color:#fff; border-color:var(--navy); }
.deletion-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;padding:12px 14px;border:2px solid #dc2626;border-radius:13px;background:#fef2f2;color:#991b1b;font-size:13px;font-weight:900}.deletion-banner.hidden{display:none}.deletion-banner a{flex:none;border-radius:9px;background:#b91c1c;color:#fff;padding:8px 11px;text-decoration:none;font-weight:900}
  </style>
</head>
<body>
  <div class="head">
    <h1 id="title" data-t="title">管理</h1>
    <div class="r"><span id="who"></span><button class="hbtn" data-tlang onclick="I18n.toggle()">EN</button><button class="hbtn hidden" id="logoutBtn" onclick="logout()" data-t="logout">ログアウト</button></div>
  </div>

  <!-- Loading view (トークン確認中はこれを表示し、ログイン画面のちらつきを防ぐ) -->
  <div class="wrap" id="loadingView"><p style="text-align:center;color:var(--text-3);margin-top:14vh;font-size:14px;" data-t="loading">読み込み中…</p></div>

  <!-- Login view -->
  <div class="wrap hidden" id="loginView">
    <div class="login" id="loginCard">
      <img id="loginPic" alt="" style="display:none;width:100%;max-height:120px;object-fit:contain;border-radius:12px;margin-bottom:14px;">
      <div class="emoji">🔒</div>
      <h2 data-t="login">ログイン</h2>
      <p data-t="loginSub">ログインIDとパスワードを入力</p>
      <div class="err" id="loginErr" data-t="loginErr">IDまたはパスワードが違います</div>
      <input class="fc" id="loginId" placeholder="ログインID" data-tph="ph_loginId" autocapitalize="none" autocomplete="username">
      <input class="fc" id="loginPass" type="password" placeholder="パスワード" data-tph="ph_pass" autocomplete="current-password">
      <button class="btn" id="loginBtn" onclick="doLogin()" data-t="loginBtn">🔓 ログイン</button>
      <div style="text-align:center;margin-top:14px;"><a href="#" onclick="toggleChgPw(true);return false;" style="font-size:13px;font-weight:700;color:var(--text-3);" data-t="chgPwLink">🔑 パスワードを変更</a></div>
    </div>
    <div class="login hidden" id="chgPwCard">
      <div class="emoji">🔑</div>
      <h2 data-t="chgTitle">パスワード変更</h2>
      <p data-t="chgSub">ログインIDと現在のパスワードで変更できます</p>
      <div id="chgMsg" style="display:none;font-size:13px;font-weight:700;text-align:center;margin-bottom:10px;"></div>
      <input class="fc" id="cpLoginId" placeholder="ログインID" data-tph="ph_loginId" autocapitalize="none" autocomplete="username">
      <input class="fc" id="cpOldPass" type="password" placeholder="現在のパスワード" data-tph="ph_cpOld" autocomplete="current-password">
      <input class="fc" id="cpNewPass" type="password" placeholder="新しいパスワード（8文字以上）" minlength="8" data-tph="ph_cpNew" autocomplete="new-password">
      <input class="fc" id="cpNewPass2" type="password" placeholder="新しいパスワード（確認）" minlength="8" data-tph="ph_cpNew2" autocomplete="new-password">
      <button class="btn" id="cpBtn" onclick="doChangePw()" data-t="cpBtn">🔑 変更する</button>
      <div style="text-align:center;margin-top:14px;"><a href="#" onclick="toggleChgPw(false);return false;" style="font-size:13px;color:var(--text-3);" data-t="backToLogin">← ログインに戻る</a></div>
    </div>
  </div>

  <!-- Hub view -->
  <div class="wrap hidden" id="hubView">
    <div class="deletion-banner hidden" id="deletionBanner"><span id="deletionBannerText"></span><a href="./account.html" id="deletionBannerLink">確認</a></div>
    <div class="mtabs" id="mtabs"></div>
    <div class="grid" id="tiles"></div>
  </div>

  <script src="./config.js?v=auth2"></script>
  <script src="./api.js?v=auth2"></script>
  <script src="./i18n.js?v=auth3"></script>
  <script>
    var TOKEN = localStorage.getItem(window.APP_CONFIG.AUTH_STORAGE_PREFIX + 'mgmtToken') || '';
    var NAME = localStorage.getItem(window.APP_CONFIG.AUTH_STORAGE_PREFIX + 'mgmtName') || '';
    var ROLE = localStorage.getItem(window.APP_CONFIG.AUTH_STORAGE_PREFIX + 'mgmtRole') || '';
    var HUB_CACHE_KEY=window.APP_CONFIG.AUTH_STORAGE_PREFIX+'manageHubCache';
    var hubCache=(function(){try{return JSON.parse(sessionStorage.getItem(HUB_CACHE_KEY)||'{}')||{};}catch(e){return{};}})();
    var lastAllowed = (hubCache.allowed&&typeof hubCache.allowed==='object')?hubCache.allowed:{}, ACCOUNT_OWNER = hubCache.accountOwner===true;
    var authAttempt = 0;
    var authCheckSeq = 0;

    // key: 権限キー（null=公開・常時表示）, active: 移設済みか
    var GROUPS = [
      { id:'orders',   ja:'接客・注文',   en:'Service & Orders' },
      { id:'sales',    ja:'売上・経営',   en:'Sales & Mgmt' },
      { id:'stock',    ja:'在庫・仕入',   en:'Inventory' },
      { id:'staff',    ja:'スタッフ・勤怠', en:'Staff' },
      { id:'customer', ja:'顧客・予約',   en:'Customers' },
      { id:'system',   ja:'システム・設定', en:'System' }
    ];
    var TILES = [
      { grp:'orders', key:'admin', ic:'🧾', tt:'注文管理', ds:'テーブル別・会計', ttEn:'Orders', dsEn:'Tables · billing', url:'./admin.html', active:true },
      { grp:'orders', key:'kds', ic:'🍳', tt:'キッチン画面', ds:'未提供オーダー', ttEn:'Kitchen', dsEn:'Pending orders', url:'./kds.html', active:true },
      { grp:'orders', key:'takeout', ic:'🥡', tt:'テイクアウト', ds:'オンライン注文', ttEn:'Takeout', dsEn:'Online orders', url:'./takeout.html', active:true },
      { grp:'orders', key:null, ic:'✍️', tt:'オーダー入力', ds:'口頭注文を店員が入力', ttEn:'New order', dsEn:'Staff order entry', url:'./index.html', active:true },
      { grp:'sales', key:'dashboard', ic:'📊', tt:'ダッシュボード', ds:'今日/今月・目標・粗利', ttEn:'Dashboard', dsEn:'Today · target · profit', url:'./dashboard.html', active:true },
      { grp:'sales', key:'sales', ic:'📈', tt:'売上管理', ds:'集計・分析', ttEn:'Sales', dsEn:'Reports · analytics', url:'./sales.html', active:true },
      { grp:'sales', key:'expenses', ic:'💰', tt:'経費一覧', ds:'固定費・仕入・備品', ttEn:'Expenses', dsEn:'Costs · purchases', url:'./expenses.html', active:true },
      { grp:'sales', key:'profit', ic:'📉', tt:'月間粗利', ds:'売上−原価', ttEn:'Gross profit', dsEn:'Revenue − costs', url:'./profit.html', active:true },
      { grp:'sales', key:null, ic:'📐', tt:'営業利益シミュレーション', ds:'経費入力・実績読込で試算', ttEn:'Operating profit sim.', dsEn:'Estimate from costs · actuals', url:'./profit_sim.html', active:true },
      { grp:'sales', key:'register', ic:'💵', tt:'レジ締め', ds:'現金過不足・X/Z', ttEn:'Register', dsEn:'Cash close · X/Z', url:'./register.html', active:true },
      { grp:'sales', key:'receipts', ic:'🧾', tt:'会計履歴', ds:'過去の会計・再印刷', ttEn:'Receipts', dsEn:'Past bills · reprint', url:'./receipts.html', active:true },
      { grp:'sales', key:'feedback', ic:'⭐', tt:'お客様の声', ds:'評価・コメント', ttEn:'Feedback', dsEn:'Ratings · comments', url:'./feedback.html', active:true },
      { grp:'stock', key:'inventory', ic:'📦', tt:'在庫管理', ds:'在庫数・原価・低在庫', ttEn:'Inventory', dsEn:'Stock · cost · low-stock', url:'./inventory.html', active:true },
      { grp:'stock', key:'purchasing', ic:'🚚', tt:'仕入・発注', ds:'発注提案・仕入先', ttEn:'Purchasing', dsEn:'Reorder · suppliers', url:'./purchasing.html', active:true },
      { grp:'stock', key:'order_items', ic:'📋', tt:'発注アイテム管理', ds:'発注時の品目マスタ', ttEn:'Order items', dsEn:'Item master for orders', url:'./order_items.html', active:true },
      { grp:'stock', key:'menu_editor', ic:'🍽️', tt:'メニュー編集', ds:'商品の追加・編集・並び替え', ttEn:'Menu', dsEn:'Add · edit · reorder', url:'./menu_editor.html', active:true },
      { grp:'stock', key:'recipe', ic:'📖', tt:'レシピ・原価', ds:'材料・自動減算', ttEn:'Recipes · cost', dsEn:'Ingredients · auto-deduct', url:'./recipe.html', active:true },
      { grp:'staff', key:'clock', ic:'⏰', tt:'出勤打刻', ds:'出退勤・休憩', ttEn:'Time clock', dsEn:'Clock in/out', url:'./clock.html', active:true },
      { grp:'staff', key:'attendance', ic:'🕐', tt:'勤怠管理', ds:'勤怠・給与概算', ttEn:'Attendance', dsEn:'Shifts · payroll', url:'./attendance.html', active:true },
      { grp:'staff', key:'users', ic:'👥', tt:'ユーザー管理', ds:'アカウント・権限', ttEn:'Users', dsEn:'Accounts · roles', url:'./users.html', active:true },
      { grp:'staff', key:'todo', ic:'✅', tt:'Todo管理', ds:'タスク・担当者の共有', ttEn:'To-dos', dsEn:'Tasks · assignees', url:'./todo.html', active:true },
      { grp:'staff', key:'requests', ic:'📮', tt:'申し入れ', ds:'不具合・困りごとの報告', ttEn:'Staff requests', dsEn:'Report issues', url:'./requests.html', active:true },
      { grp:'customer', key:'members', ic:'🎁', tt:'会員管理', ds:'ポイント・来店', ttEn:'Members', dsEn:'Points · visits', url:'./members.html', active:true },
      { grp:'customer', key:'birthdays', ic:'🎂', tt:'誕生日クーポン', ds:'今月の会員・発行', ttEn:'Birthdays', dsEn:'This month · issue', url:'./birthdays.html', active:true },
      { grp:'customer', key:'coupons', ic:'🎟️', tt:'クーポン', ds:'割引・バウチャー', ttEn:'Coupons', dsEn:'Discounts · vouchers', url:'./coupons.html', active:true },
      { grp:'customer', key:'reservations', ic:'🗓️', tt:'予約管理', ds:'受付・確定・来店', ttEn:'Reservations', dsEn:'Requests · status', url:'./reservations.html', active:true },
      { grp:'system', key:'printers', ic:'🖨️', tt:'プリンタ・出力設定', ds:'厨房印刷の設定と履歴', ttEn:'Printer & output settings', dsEn:'Kitchen printing setup and history', url:'./printers.html', active:true },
      { grp:'system', key:'audit', ic:'🧾', tt:'監査ログ', ds:'注文取消・承認履歴', ttEn:'Audit log', dsEn:'Voids · approvals', url:'./audit.html', active:true },
      // バックアップとデータ管理を1画面へ統合。ZIP/CSV書き出しはbackup権限で利用でき、
      // 削除・全置換・復元は統合画面内とAPI側の両方でシステムロールだけに限定する。
      { grp:'system', key:'backup', ic:'💾', tt:'データバックアップ・管理', ds:'書出・削除・復元', ttEn:'Data backup & management', dsEn:'Export · delete · restore', url:'./data_admin.html', active:true },
      { grp:'system', key:'settings', ic:'⚙️', tt:'設定', ds:'店舗設定', ttEn:'Settings', dsEn:'Store settings', url:'./settings.html', active:true },
      { grp:'system', key:null, ic:'📖', tt:'全体利用ガイド', ds:'店舗運営の使い方・流れ', ttEn:'Store operations guide', dsEn:'Daily workflow · how to use', url:'./overview.html', active:true },
      { grp:'system', key:null, ownerOnly:true, ic:'👤', tt:'アカウントとデータ削除', ds:'オーナー本人による削除申請', ttEn:'Account & data deletion', dsEn:'Owner deletion request', url:'./account.html', active:true },
    ];
    var curTab = (function(){ try { return localStorage.getItem('mgmtTab') || null; } catch(e){ return null; } })();

    function showLogin(){ ACCOUNT_OWNER=false; var db=document.getElementById('deletionBanner');if(db)db.classList.add('hidden'); document.getElementById('loadingView').classList.add('hidden'); document.getElementById('loginView').classList.remove('hidden'); document.getElementById('hubView').classList.add('hidden'); document.getElementById('logoutBtn').classList.add('hidden'); document.getElementById('who').innerText=''; var _lc=document.getElementById('loginCard'); if(_lc)_lc.classList.remove('hidden'); var _cc=document.getElementById('chgPwCard'); if(_cc)_cc.classList.add('hidden'); }
    function showHub(allowed, accountOwner){
      ACCOUNT_OWNER=accountOwner===true;
      document.getElementById('loadingView').classList.add('hidden');
      document.getElementById('loginView').classList.add('hidden');
      document.getElementById('hubView').classList.remove('hidden');
      document.getElementById('logoutBtn').classList.remove('hidden');
      document.getElementById('who').innerText = NAME ? ('👤 '+NAME) : '';
      lastAllowed = allowed || {};
      try{sessionStorage.setItem(HUB_CACHE_KEY,JSON.stringify({allowed:lastAllowed,accountOwner:ACCOUNT_OWNER}));}catch(e){}
      renderHub();
      loadDeletionBanner();
    }
    function deletionDeadlineText(value){
      if(!value)return '-';
      try{return new Intl.DateTimeFormat((window.I18n&&I18n.lang()==='en')?'en-US':'ja-JP',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(value));}
      catch(e){return String(value);}
    }
    function loadDeletionBanner(){
      var box=document.getElementById('deletionBanner'),textEl=document.getElementById('deletionBannerText'),link=document.getElementById('deletionBannerLink');
      if(!box||!textEl||!link)return;
      if(!ACCOUNT_OWNER||!TOKEN){box.classList.add('hidden');return;}
      API.post('rpc',{fn:'getAccountDeletionStatus',args:[],token:TOKEN,__silent:true,__noInternalRetry:true}).then(function(r){
        var d=r&&r.data||{},en=window.I18n&&I18n.lang()==='en';
        if(d.status!=='pending'){box.classList.add('hidden');return;}
        textEl.textContent=d.phase==='processing'?(en?'Cancellation deadline passed. Deletion is being processed.':'取消期限を過ぎました。削除処理中です。'):(en?'Deletion request pending — Cancel by: ':'削除申請中　取消期限: ')+deletionDeadlineText(d.cancelDeadlineAt);
        link.textContent=en?'Review':'確認';box.classList.remove('hidden');
      }).catch(function(){box.classList.add('hidden');});
    }
    function renderHub(){
      var allowed = lastAllowed || {};
      var en = (window.I18n && I18n.lang()==='en');
      var isSystem = ROLE==='システム' || ROLE==='system';
      // 権限のあるタイルを持つタブだけ表示
      var visGroups = GROUPS.filter(function(g){
        return TILES.some(function(x){ return x.grp===g.id && (!x.sysOnly || isSystem) && (!x.ownerOnly || ACCOUNT_OWNER) && (!x.key || allowed[x.key]); });
      });
      if (!visGroups.length){ document.getElementById('mtabs').innerHTML=''; document.getElementById('tiles').innerHTML=''; return; }
      if (!curTab || !visGroups.some(function(g){ return g.id===curTab; })) curTab = visGroups[0].id;
      // タブバー
      document.getElementById('mtabs').innerHTML = visGroups.map(function(g){
        return '<button class="mtab'+(g.id===curTab?' on':'')+'" onclick="selectTab(\''+g.id+'\')">'+(en?g.en:g.ja)+'</button>';
      }).join('');
      // タイル（現在のタブ）
      var html = '';
      TILES.forEach(function(x){
        if (x.grp!==curTab) return;
        if (x.sysOnly && !isSystem) return;
        if (x.ownerOnly && !ACCOUNT_OWNER) return;
        if (x.key && !allowed[x.key]) return;
        var tt = (en && x.ttEn) ? x.ttEn : x.tt, ds = (en && x.dsEn) ? x.dsEn : x.ds;
        if (x.active){ html += '<a class="tile" href="'+x.url+'"><span class="ic">'+x.ic+'</span><span class="tt">'+tt+'</span><span class="ds">'+ds+'</span></a>'; }
        else { html += '<div class="tile soon"><span class="ic">'+x.ic+'</span><span class="tt">'+tt+'</span><span class="ds">'+ds+'</span></div>'; }
      });
      document.getElementById('tiles').innerHTML = html;
    }
    window.selectTab = function(id){ curTab = id; try{ localStorage.setItem('mgmtTab', id); }catch(e){} renderHub(); };

    window.doLogin = function(){
      var idEl = document.getElementById('loginId'), passEl = document.getElementById('loginPass');
      var id = idEl.value.trim(), pass = passEl.value;
      var errEl = document.getElementById('loginErr');
      if (!API.authReady || !API.authReady()) {
        errEl.textContent = '認証設定の更新が必要です。ページを再読み込みしてください。 / Authentication update required. Reload this page.';
        errEl.style.display='block'; return;
      }
      if (!id || !pass){ errEl.textContent = I18n.t('needLogin'); errEl.style.display='block'; (!id ? idEl : passEl).focus(); return; }
      errEl.style.display='none';
      var btn = document.getElementById('loginBtn'); btn.disabled=true;
      var attempt = ++authAttempt;
      API.post('login', { loginId: id, pass: pass }).then(function(r){
        if (attempt !== authAttempt) return;
        API.acceptLogin(r);
        btn.disabled=false;
        TOKEN = r.token; NAME = r.name || ''; ROLE = r.role || '';
        // [応答速度改善(2026-08-22)/ログイン再改善] loginレスポンスに権限メニュー(me)が
        // 同封されるようになったため、直後のcheckToken往復を省いて即座に表示する。
        // 念のため未同封（旧サーバー版との混在デプロイ等）の場合のみ従来通りcheckAndShowにフォールバック。
        if (r.me) { showHub(r.me.allowed || {}, r.me.accountOwner); } else { checkAndShow(); }
      }).catch(function(e){
        if (attempt !== authAttempt) return;
        btn.disabled=false;
        if (e.message === 'auth') errEl.textContent = I18n.t('loginErr');
        else if (e.message === 'email_unverified') errEl.textContent = I18n.t('emailUnverified');
        else if (e.message === 'login_rate_limited') errEl.textContent = I18n.t('loginRateLimited');
        else errEl.textContent = I18n.t('authUnavailable');
        errEl.style.display='block';
      });
    };
    window.logout = async function(){ ++authAttempt; await API.logoutSession(); localStorage.removeItem(window.APP_CONFIG.AUTH_STORAGE_PREFIX + 'mgmtName'); localStorage.removeItem(window.APP_CONFIG.AUTH_STORAGE_PREFIX + 'mgmtRole'); TOKEN=''; NAME=''; ROLE=''; showLogin(); };

    // ログイン画面からのパスワード変更（ログインID＋現在のパスワードで本人確認）
    window.toggleChgPw = function(show){
      document.getElementById('loginCard').classList.toggle('hidden', !!show);
      document.getElementById('chgPwCard').classList.toggle('hidden', !show);
      var m=document.getElementById('chgMsg'); if(m) m.style.display='none';
    };
    window.doChangePw = function(){
      var g=function(id){ return document.getElementById(id); };
      var id=g('cpLoginId').value.trim(), o=g('cpOldPass').value, n=g('cpNewPass').value, n2=g('cpNewPass2').value;
      function msg(t,ok){ var m=g('chgMsg'); m.style.display='block'; m.style.color=ok?'#15803d':'#c62828'; m.innerText=t; }
      if(!id){ msg(I18n.t('m_needId'),false); return; }
      if(!o){ msg(I18n.t('m_needOld'),false); return; }
      if(!n||n.length<8){ msg(I18n.t('m_short'),false); return; }
      if(n!==n2){ msg(I18n.t('m_mismatch'),false); return; }
      var b=g('cpBtn'); b.disabled=true;
      API.post('changePasswordByLogin',{loginId:id, oldPass:o, newPass:n}).then(function(r){
        b.disabled=false;
        if(r && r.data && r.data.success){ msg(I18n.t('m_ok'),true); g('cpOldPass').value=''; g('cpNewPass').value=''; g('cpNewPass2').value=''; }
        else if(r&&r.data&&r.data.error==='password_change_rate_limited'){ msg(I18n.lang()==='en'?'Too many password-change attempts. Please wait and try again.':'パスワード変更の試行回数が上限に達しました。しばらく待ってから再試行してください。',false); }
        else { msg((r&&r.data&&r.data.error==='too_short')?I18n.t('m_short'):I18n.t('m_wrong'),false); }
      }).catch(function(e){ b.disabled=false; msg(I18n.t('m_err')+API.userErrorText(e),false); });
    };

    function checkAndShow(){
      if (!TOKEN){ showLogin(); return; }
      var attempt = authAttempt;
      var checkSeq = ++authCheckSeq;
      var checkedToken = localStorage.getItem(window.APP_CONFIG.AUTH_STORAGE_PREFIX + 'mgmtToken') || TOKEN;
      API.post('checkToken', { token: checkedToken, __timeoutMs:6000, __silent:true }).then(function(r){
        if (attempt !== authAttempt || checkSeq !== authCheckSeq || !API.isCurrentToken ||
            (!API.isCurrentToken(checkedToken) && !API.isCurrentToken(r.newToken))) return;
        if (r.valid && r.me){
          // 2026-08-27追記: ROLEをここでもサーバー応答から更新する（ログイン後にロールが
          // 変更された場合、次回ログインまで古いROLEのままdata_adminタイル等が出続ける/消えない
          // という表示上のズレを防ぐ。実際の実行可否は常にサーバー側で再検証されるため、これは
          // あくまで表示の鮮度の話）。
          if (r.me.role !== undefined) { ROLE = r.me.role || ''; try { localStorage.setItem(window.APP_CONFIG.AUTH_STORAGE_PREFIX + 'mgmtRole', ROLE); } catch(e){} }
          showHub(r.me.allowed || {}, r.me.accountOwner);
        }
        else { logout(); }
      }).catch(function(){
        if (attempt !== authAttempt || checkSeq !== authCheckSeq) return;
        var current = localStorage.getItem(window.APP_CONFIG.AUTH_STORAGE_PREFIX + 'mgmtToken') || '';
        if (!current) { showLogin(); return; }
        if ((lastAllowed && Object.keys(lastAllowed).length) || ROLE) {
          showHub(lastAllowed, ACCOUNT_OWNER);
          return;
        }
        var p=document.querySelector('#loadingView p');
        if(p){
          p.textContent=I18n.lang()==='en'?'Could not connect. Tap to retry.':'接続できません。タップして再試行';
          p.style.cursor='pointer';
          p.onclick=function(){ p.textContent=I18n.t('loading'); p.style.cursor=''; p.onclick=null; checkAndShow(); };
        }
      });
    }
    // ログイン画面の画像（設定で登録した画像を表示。getSettingsはログイン前でも公開）
    API.post('getSettings', {}).then(function(r){ var d=(r&&r.data)||{}; if(d.systemTopImageId){ var im=document.getElementById('loginPic'); if(im){ im.src=API.imageUrl(d.systemTopImageId); im.style.display='block'; } } }).catch(function(){});
    I18n.init({
      ja: { title:'管理', logout:'ログアウト', loading:'読み込み中…', login:'ログイン', loginSub:'ログインIDとパスワードを入力', loginErr:'IDまたはパスワードが違います', emailUnverified:'メールアドレスの確認が完了していません。確認メール内のリンクを開いてからログインしてください。', loginRateLimited:'ログイン失敗が続いたため一時的に制限しています。しばらく待って再試行してください。', authUnavailable:'認証サービスを利用できません。時間をおいて再試行してください。', needLogin:'ログインIDとパスワードを入力してください', ph_loginId:'ログインID', ph_pass:'パスワード', loginBtn:'🔓 ログイン', chgPwLink:'🔑 パスワードを変更', chgTitle:'パスワード変更', chgSub:'ログインIDと現在のパスワードで変更できます', ph_cpOld:'現在のパスワード', ph_cpNew:'新しいパスワード（8文字以上）', ph_cpNew2:'新しいパスワード（確認）', cpBtn:'🔑 変更する', backToLogin:'← ログインに戻る', m_needId:'ログインIDを入力してください', m_needOld:'現在のパスワードを入力してください', m_short:'新しいパスワードは8文字以上にしてください', m_mismatch:'新しいパスワードが一致しません', m_ok:'✅ 変更しました。新しいパスワードでログインしてください', m_wrong:'ログインIDまたは現在のパスワードが違います', m_err:'エラー: ' },
      en: { title:'Management', logout:'Logout', loading:'Loading…', login:'Login', loginSub:'Enter your login ID and password', loginErr:'Incorrect ID or password', emailUnverified:'Your email address is not verified. Open the link in the verification email, then log in.', loginRateLimited:'Too many failed attempts. Please wait and try again.', authUnavailable:'Authentication service is unavailable. Please wait and try again.', needLogin:'Please enter your login ID and password', ph_loginId:'Login ID', ph_pass:'Password', loginBtn:'🔓 Login', chgPwLink:'🔑 Change password', chgTitle:'Change password', chgSub:'Change it with your login ID and current password', ph_cpOld:'Current password', ph_cpNew:'New password (8+ chars)', ph_cpNew2:'New password (confirm)', cpBtn:'🔑 Change', backToLogin:'← Back to login', m_needId:'Please enter your login ID', m_needOld:'Please enter your current password', m_short:'New password must be 8+ characters', m_mismatch:'New passwords do not match', m_ok:'✅ Changed. Please log in with your new password', m_wrong:'Login ID or current password is incorrect', m_err:'Error: ' }
    }, function(){ if(!document.getElementById('hubView').classList.contains('hidden')) showHub(lastAllowed, ACCOUNT_OWNER); });
    document.addEventListener('DOMContentLoaded', checkAndShow);
    window.addEventListener('pageshow', function(e){
      if(e.persisted && !document.getElementById('loadingView').classList.contains('hidden')) checkAndShow();
    });
    document.addEventListener('visibilitychange', function(){
      if(document.visibilityState && document.visibilityState!=='visible') return;
      if(!document.getElementById('loadingView').classList.contains('hidden')) checkAndShow();
    });
  </script>
