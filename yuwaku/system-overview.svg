<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 1120" font-family="'Noto Sans JP','Segoe UI',Roboto,sans-serif">
  <rect width="1300" height="1120" fill="#f8fafc"/>
  <rect x="0" y="0" width="1300" height="70" fill="#0f172a"/>
  <text x="36" y="44" fill="#ffffff" font-size="27" font-weight="800">🍶 izakanpai POS 店舗運営ガイド</text>
  <text x="1264" y="30" fill="#93c5fd" font-size="13" text-anchor="end">はじめての設定から毎日の営業まで</text>
  <text x="1264" y="51" fill="#cbd5e1" font-size="12" text-anchor="end">店舗スタッフ・管理者向け</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker></defs>
  <text x="50" y="112" fill="#0f172a" font-size="19" font-weight="800">まずはこの流れを覚えれば営業できます</text>
  <g stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arrow)"><line x1="230" y1="160" x2="295" y2="160"/><line x1="480" y1="160" x2="545" y2="160"/><line x1="730" y1="160" x2="795" y2="160"/><line x1="980" y1="160" x2="1045" y2="160"/></g>
  <g font-size="15" font-weight="800" text-anchor="middle">
    <rect x="40" y="130" width="190" height="62" rx="14" fill="#dbeafe" stroke="#60a5fa"/><text x="135" y="156" fill="#1d4ed8">① 開店前</text><text x="135" y="178" fill="#334155" font-size="12">店舗・メニュー・スタッフ確認</text>
    <rect x="295" y="130" width="190" height="62" rx="14" fill="#ecfdf5" stroke="#34d399"/><text x="390" y="156" fill="#047857">② 注文受付</text><text x="390" y="178" fill="#334155" font-size="12">QR注文／スタッフ入力</text>
    <rect x="545" y="130" width="190" height="62" rx="14" fill="#fff7ed" stroke="#fb923c"/><text x="640" y="156" fill="#c2410c">③ 厨房・提供</text><text x="640" y="178" fill="#334155" font-size="12">調理 → 提供済</text>
    <rect x="795" y="130" width="190" height="62" rx="14" fill="#fef3c7" stroke="#f59e0b"/><text x="890" y="156" fill="#92400e">④ 会計</text><text x="890" y="178" fill="#334155" font-size="12">割引・支払・レシート</text>
    <rect x="1045" y="130" width="215" height="62" rx="14" fill="#f3e8ff" stroke="#c084fc"/><text x="1152" y="156" fill="#7e22ce">⑤ 閉店・振り返り</text><text x="1152" y="178" fill="#334155" font-size="12">売上・在庫・勤怠を確認</text>
  </g>
  <rect x="40" y="225" width="590" height="260" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="64" y="260" fill="#1d4ed8" font-size="19" font-weight="800">🏁 開店前に管理者が確認すること</text>
  <g fill="#1e293b" font-size="14"><text x="66" y="298">• ⚙️ 設定：国・通貨・税率・サービス料・席数を確認</text><text x="66" y="330">• 🍽️ メニュー：商品、価格、提供時間、厨房表示を確認</text><text x="66" y="362">• 👥 スタッフ：利用者を登録し、必要な権限だけを付与</text><text x="66" y="394">• 📦 在庫を使う店舗は、初期在庫・最低在庫・レシピを登録</text><text x="66" y="426">• 🖨️ 必要ならプリンタ、レシート、決済方法を確認</text><text x="66" y="458" fill="#64748b" font-size="12.5">初回セットアップ後も、これらは「設定」「メニュー」「スタッフ」から変更できます。</text></g>
  <rect x="670" y="225" width="590" height="260" rx="16" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
  <text x="694" y="260" fill="#047857" font-size="19" font-weight="800">🧾 営業中：注文から会計まで</text>
  <g fill="#1e293b" font-size="14"><text x="696" y="298">1. お客様は卓QRから注文、またはスタッフが「オーダー入力」で代理入力</text><text x="696" y="330">2. 厨房はKDS／注文票を確認し、調理後に「提供済」へ変更</text><text x="696" y="362">3. ホールは注文状況・呼出・会計依頼を確認して対応</text><text x="696" y="394">4. 会計時に人数・割引・支払方法・金額を必ず確認して確定</text><text x="696" y="426">5. 必要に応じて紙レシート／eレシートを渡す</text><text x="696" y="458" fill="#64748b" font-size="12.5">取消・返金・割引など重要操作は、店舗ルールに沿ってマネージャー以上が承認してください。</text></g>
  <rect x="40" y="520" width="590" height="245" rx="16" fill="#ffffff" stroke="#fed7aa" stroke-width="2"/>
  <text x="64" y="555" fill="#c2410c" font-size="19" font-weight="800">🍳 役割別：スタッフがよく使う画面</text>
  <g fill="#1e293b" font-size="14"><text x="66" y="594">🙋 ホール：注文管理／オーダー入力／会計／呼出対応</text><text x="66" y="626">🍳 厨房：KDS／注文票／提供済への更新</text><text x="66" y="658">⏰ スタッフ：出勤・休憩・退勤の打刻</text><text x="66" y="690">🧑‍💼 管理者：売上、在庫、スタッフ、顧客、設定の確認</text><text x="66" y="722" fill="#64748b" font-size="12.5">画面に表示される機能は、ユーザー権限やFree／Proプランによって異なります。</text></g>
  <rect x="670" y="520" width="590" height="245" rx="16" fill="#ffffff" stroke="#ddd6fe" stroke-width="2"/>
  <text x="694" y="555" fill="#7e22ce" font-size="19" font-weight="800">📊 閉店後・管理者の日常業務</text>
  <g fill="#1e293b" font-size="14"><text x="696" y="594">• 💵 売上・会計履歴を確認し、必要ならレジ締め・再印刷</text><text x="696" y="626">• 📦 在庫・棚卸・仕入を確認し、不足品を補充</text><text x="696" y="658">• 🕐 勤怠・給与概算、スタッフの権限やTodoを確認</text><text x="696" y="690">• 🎁 会員・クーポン・予約、売上分析・利益を必要に応じて確認</text><text x="696" y="722" fill="#64748b" font-size="12.5">重要な売上・会計・勤怠データは定期的に確認し、必要に応じて書き出してください。</text></g>
  <rect x="40" y="800" width="1220" height="270" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="64" y="838" fill="#0f172a" font-size="20" font-weight="800">🆘 困ったとき・安全に使うために</text>
  <g fill="#1e293b" font-size="14"><text x="66" y="878">• 画面がおかしい場合：まず更新／画面を開き直す → 改善しなければ再ログイン</text><text x="66" y="910">• 注文・会計が合わない場合：注文状況と会計履歴を確認し、むやみに同じ操作を繰り返さない</text><text x="66" y="942">• 権限不足の場合：管理者が「スタッフ／ユーザー管理」で役割・権限を確認</text><text x="66" y="974">• 不具合や要望：「サポート」から内容を送信。店舗内の依頼は「申し入れ」「Todo」を利用</text><text x="66" y="1006">• 大切な操作：取消・返金・割引・税率・勤怠・給与概算などは店舗側で最終確認</text><text x="66" y="1038" fill="#64748b" font-size="12.5">このガイドは日々の使い方をまとめたものです。各画面の「？」ヘルプには、その画面だけの詳しい操作手順があります。</text></g>
  <text x="650" y="1100" fill="#64748b" font-size="12" text-anchor="middle">izakanpai POS — 店舗運営の流れを、利用者目線でまとめたガイド</text>
</svg>