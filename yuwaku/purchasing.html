<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Purchasing">

  <link rel="manifest" href="./purchasing.webmanifest">
  <title>Purchasing</title>
  <style>
    :root{ --bg:#f6f7f9; --surface:#fff; --border:#e5e7eb; --navy:#0f172a; --text-3:#64748b; --red:#c62828; }
    *{ box-sizing:border-box; }
    body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans JP',sans-serif; background:var(--bg); color:var(--navy); }
    .head{ position:sticky; top:0; z-index:20; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:space-between; padding:12px 16px; }
    .head h1{ font-size:18px; margin:0; font-weight:900; }
    .hbtn{ background:rgba(255,255,255,.14); color:#fff; border:0; border-radius:9px; padding:8px 12px; font-size:13px; font-weight:800; cursor:pointer; text-decoration:none; }
    .wrap{ padding:16px; max-width:920px; margin:0 auto; }
    .card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:14px; }
    .card-title{ font-weight:900; font-size:15px; margin-bottom:12px; }
    .muted{ color:var(--text-3); font-size:12px; }
    /* [iPhone表示対応] min-widthで表全体の最小幅を確保し、外側のoverflow:autoラッパーで横スクロールさせる。 */
    table{ width:100%; min-width:640px; border-collapse:collapse; font-size:13px; }
    th,td{ padding:8px 6px; border-bottom:1px solid var(--border); text-align:left; white-space:nowrap; }
    th{ font-size:11px; color:var(--text-3); white-space:nowrap; }
    td.num,th.num{ text-align:right; font-variant-numeric:tabular-nums; }
    .grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .fg{ margin-bottom:8px; } .form-label{ font-size:12px; font-weight:700; display:block; margin-bottom:4px; }
    .fc{ width:100%; padding:10px; border:1px solid var(--border); border-radius:9px; font-size:15px; font-family:inherit; background:var(--surface); }
    .btn{ border:0; border-radius:11px; padding:12px 16px; font-size:15px; font-weight:900; cursor:pointer; font-family:inherit; background:var(--navy); color:#fff; }
    .btn-sm{ background:#eef2f7; color:var(--navy); border:0; border-radius:8px; padding:7px 10px; font-weight:800; cursor:pointer; }
    .sup-group{ border:1px solid var(--border); border-radius:12px; padding:10px 12px; margin-bottom:10px; }
    .sup-h{ font-weight:900; margin-bottom:6px; }
    .alert{ margin-top:10px; display:none; padding:11px; border-radius:9px; font-size:14px; font-weight:700; }
    .low{ color:#b91c1c; font-weight:800; }
    .po-table-wrap{ overflow:hidden; margin-top:6px; width:100%; }
    .po-table{ width:100%; min-width:0; table-layout:fixed; }
    .po-table th,.po-table td{ padding:8px 4px; }
    .po-table .po-qty,.po-table .po-unit{ width:72px; }
    .po-table .po-del{ width:44px; }
    .po-table input{ display:block; width:100%; min-width:0; max-width:100%; padding:9px 7px; border:1px solid var(--border); border-radius:7px; font:inherit; background:var(--surface); }
    .po-table .po-del .btn-sm{ width:36px; min-width:0; padding:7px 0; }
    @media (max-width:520px){
      .po-table th,.po-table td{ padding-left:3px; padding-right:3px; }
      .po-table .po-qty,.po-table .po-unit{ width:58px; }
      .po-table .po-del{ width:38px; }
      .po-table input{ font-size:16px; padding:8px 5px; }
      .po-table .po-del .btn-sm{ width:32px; padding-left:0; padding-right:0; }
    }
  </style>
</head>
<body>
  <div class="head"><h1 data-t="title">🚚 仕入・発注</h1><div style="display:flex;gap:8px;flex-wrap:wrap;"><button class="hbtn" data-tlang onclick="I18n.toggle()">EN</button><a class="hbtn" href="./order_items.html" data-t="orderItemsLink">📋 発注アイテム</a><a class="hbtn" href="./inventory.html" data-t="inv">📦 在庫</a><a class="hbtn" href="./manage.html" data-t="back">← 管理へ</a></div></div>
  <div class="wrap">
    <div class="card">
      <div class="card-title" data-t="newOrderTitle">🆕 新規発注</div>
      <div class="muted" data-t="newOrderHint" style="margin-bottom:10px;">仕入先を選び、品目を追加してください。メニュー・発注アイテムマスタから選ぶか、直接入力できます。</div>
      <div class="fg"><label class="form-label" data-t="poSupplier">仕入先</label><select id="poSupplier" class="fc" onchange="onPoSupplierChange()"></select></div>
      <div class="alert" id="poSupplierWarn" style="background:#fef9c3;color:#854d0e;"></div>
      <div class="po-table-wrap">
        <table class="po-table"><thead><tr>
          <th data-t="thItem">品目</th><th class="po-qty" data-t="poThQty">数量</th><th class="po-unit" data-t="poThUnit">単位</th><th class="po-del"></th>
        </tr></thead>
        <tbody id="poRows"></tbody></table>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;">
        <button class="btn-sm" onclick="poAddRow()" data-t="poAddRow">＋ 行を追加</button>
        <button class="btn-sm" onclick="openPoPicker('menu')" data-t="poFromMenu">🍽️ メニューから追加</button>
        <button class="btn-sm" onclick="openPoPicker('item')" data-t="poFromItem">📋 発注アイテムから追加</button>
      </div>
      <button class="btn" style="margin-top:12px;" id="poSendBtn" onclick="sendPo()" data-t="poSendBtn">📧 発注依頼</button>
      <div class="alert" id="poMsg"></div>
    </div>

    <div class="card">
      <div class="card-title" data-t="reorderTitle">🔔 発注提案（最小在庫以下）</div>
      <div class="muted" data-t="reorderHint" style="margin-bottom:10px;">在庫が最小在庫を下回った品目を仕入先ごとにまとめます。推奨数＝最小在庫の2倍を目標に補充。</div>
      <div id="reorder"><div class="muted" data-t="loading">読み込み中…</div></div>
    </div>

    <div class="card">
      <div class="card-title" data-t="supTitle">🏢 仕入先マスタ</div>
      <div class="grid">
        <div class="fg" id="fieldSupplierNameJa"><label class="form-label" data-t="sNameJa">仕入先名（日本語）</label><input id="sName" class="fc"></div>
        <div class="fg" id="fieldSupplierNameEn"><label class="form-label" data-t="sNameEn">仕入先名（English）</label><input id="sNameEn" class="fc" data-tph="phNameEn" placeholder="e.g. ABC Trading Co."></div>
      </div>
      <div class="fg"><label class="form-label" data-t="sContact">連絡先</label><input id="sContact" class="fc" data-tph="phContact" placeholder="電話・担当など"></div>
      <div class="fg"><label class="form-label" data-t="sEmail">メールアドレス（任意・発注メール送信用）</label><input id="sEmail" type="email" class="fc" data-tph="phEmail" placeholder="order@supplier.example"></div>
      <div class="fg" style="max-width:260px;"><label class="form-label" data-t="sLanguage">発注メール言語</label><select id="sLanguage" class="fc"><option value="ja" data-t="langJa">日本語</option><option value="en" data-t="langEn">英語</option><option value="both" data-t="langBoth">日本語＋英語（両方）</option></select></div>
      <div class="fg"><label class="form-label" data-t="sItems">取扱品目（任意）</label><input id="sItems" class="fc" data-tph="phItems" placeholder="例: ビール, 焼酎, 生鮮"></div>
      <div class="fg"><label class="form-label" data-t="sMemo">備考（任意）</label><input id="sMemo" class="fc"></div>
      <input type="hidden" id="sId">
      <button class="btn" id="saveBtn" onclick="save()" data-t="add">💾 登録</button>
      <div class="alert" id="msg"></div>
      <div style="overflow:auto;margin-top:14px;">
        <table><thead><tr>
          <th data-t="thName">仕入先</th><th data-t="thContact">連絡先</th><th data-t="thEmail">メール</th><th data-t="thLanguage">言語</th><th data-t="thItems">取扱品目</th><th style="width:90px;"></th>
        </tr></thead>
        <tbody id="supRows"><tr><td colspan="6" class="muted" style="padding:14px;text-align:center;" data-t="loading">読み込み中…</td></tr></tbody></table>
      </div>
    </div>
  </div>

  <!-- 新規発注：メニュー／発注アイテムマスタから品目を選ぶピッカー -->
  <div id="poPickOv" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:56;align-items:center;justify-content:center;">
    <div style="background:#fff;border-radius:16px;padding:20px;max-width:380px;width:calc(100% - 32px);">
      <div id="poPickTitle" style="font-weight:900;font-size:15px;margin-bottom:10px;"></div>
      <select id="poPickSel" class="fc" style="margin-bottom:14px;"></select>
      <button class="btn" onclick="confirmPoPick()" data-t="poPickAdd">＋ 追加</button>
      <button class="btn-sm" style="margin-top:8px;width:100%;" onclick="closePoPicker()" data-t="mvClose">閉じる</button>
    </div>
  </div>

  <script src="./config.js?v=auth2"></script>
  <script src="./api.js?v=auth2"></script>
  <script src="./i18n.js?v=auth3"></script>
  <script src="./confirm.js?v=auth2"></script>
  <script>
    var TOKEN = localStorage.getItem(window.APP_CONFIG.AUTH_STORAGE_PREFIX + 'mgmtToken') || '';
    if (!TOKEN) location.href = './manage.html';
    function rpc(fn,args){ return API.post('rpc',{fn:fn,args:args||[],token:TOKEN}).then(function(r){ return r.data; }); }
    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
    // 言語切替の一元ヘルパー（新しい表示・候補リストを追加する際は必ずこれを通すこと）
    function isEN(){ return !!(window.I18n && I18n.lang && I18n.lang()==='en'); }
    function loc(ja, en){ ja=(ja||'').trim(); en=(en||'').trim(); return isEN() ? (en || ja) : (ja || en); }
    function syncSupplierNameOrder(){var a=document.getElementById('fieldSupplierNameJa'),b=document.getElementById('fieldSupplierNameEn');if(a&&b){a.style.order=isEN()?'2':'1';b.style.order=isEN()?'1':'2';}}
    var SUPS = [], REORDER = [], SYM='₱', __loaded=false;
    var MENU_ALL_PO = [], ORDER_ITEMS_PO = [];
    var PO_ROWS = [{ name:'', nameJa:'', nameEn:'', qty:1, unit:'' }];

    // ── 新規発注（自由入力） ──
    function poRenderRows(){
      var html = PO_ROWS.map(function(r,i){
        var ja=(r.nameJa!==undefined?r.nameJa:r.name||''), val=loc(ja,r.nameEn), prop=isEN()?'nameEn':'nameJa';
        return '<tr>'+
          '<td><input value="'+esc(val)+'" oninput="PO_ROWS['+i+'].'+prop+'=this.value;PO_ROWS['+i+'].name=(PO_ROWS['+i+'].nameJa||PO_ROWS['+i+'].nameEn||\'\')"></td>'+
          '<td class="po-qty"><input type="number" min="0" step="any" value="'+(r.qty||'')+'" oninput="PO_ROWS['+i+'].qty=Number(this.value)||0"></td>'+
          '<td class="po-unit"><input value="'+esc(r.unit||'')+'" oninput="PO_ROWS['+i+'].unit=this.value"></td>'+
          '<td class="po-del"><button class="btn-sm" onclick="poDelRow('+i+')">🗑</button></td></tr>';
      }).join('');
      if(!PO_ROWS.length) html = '<tr><td colspan="4" style="color:#aaa;padding:14px;text-align:center;">'+I18n.t('poEmpty')+'</td></tr>';
      document.getElementById('poRows').innerHTML = html;
    }
    window.poAddRow = function(){ PO_ROWS.push({ name:'', nameJa:'', nameEn:'', qty:1, unit:'' }); poRenderRows(); };
    window.poDelRow = function(i){ PO_ROWS.splice(i,1); poRenderRows(); };

    function fillPoSupplierSel(){
      var sel = document.getElementById('poSupplier'); var cur = sel.value;
      sel.innerHTML = '<option value="">'+I18n.t('poSupplierPh')+'</option>' +
        SUPS.map(function(s){ return '<option value="'+esc(s.name)+'">'+esc(loc(s.nameJa!==undefined?s.nameJa:s.name, s.nameEn))+(s.email?'':(' — '+I18n.t('poNoEmailTag')))+'</option>'; }).join('');
      sel.value = cur;
      onPoSupplierChange();
    }
    window.onPoSupplierChange = function(){
      var name = document.getElementById('poSupplier').value;
      var s = SUPS.filter(function(x){ return x.name===name; })[0];
      var w = document.getElementById('poSupplierWarn');
      if(name && (!s || !s.email)){ w.style.display='block'; w.innerText = I18n.t('poNoEmailWarn'); }
      else { w.style.display='none'; }
    };

    var poPickMode = null;
    window.openPoPicker = function(mode){
      poPickMode = mode;
      var sel = document.getElementById('poPickSel');
      var opts = '<option value="">'+I18n.t('poPickPh')+'</option>';
      if(mode==='menu'){
        document.getElementById('poPickTitle').textContent = I18n.t('poFromMenu');
        opts += MENU_ALL_PO.map(function(m){
          var nm = m['商品名']; if(!nm) return '';
          var ja=m['商品名_JA']!==undefined?m['商品名_JA']:nm, en=m['商品名_EN']||'', disp=loc(ja,en);
          return '<option value="'+esc(nm)+'" data-unit="" data-nameja="'+esc(ja)+'" data-nameen="'+esc(en)+'">'+esc(disp)+'</option>';
        }).join('');
      } else {
        document.getElementById('poPickTitle').textContent = I18n.t('poFromItem');
        opts += ORDER_ITEMS_PO.map(function(it){
          var ja=it.nameJa!==undefined?it.nameJa:it.name, disp = loc(ja, it.nameEn);
          return '<option value="'+esc(it.name)+'" data-unit="'+esc(it.unit||'')+'" data-nameja="'+esc(ja||'')+'" data-nameen="'+esc(it.nameEn||'')+'">'+esc(disp)+(it.unit?(' ('+esc(it.unit)+')'):'')+'</option>';
        }).join('');
      }
      sel.innerHTML = opts; sel.value='';
      document.getElementById('poPickOv').style.display='flex';
    };
    window.closePoPicker = function(){ document.getElementById('poPickOv').style.display='none'; };
    window.confirmPoPick = function(){
      var sel = document.getElementById('poPickSel');
      var name = sel.value; if(!name) return;
      var opt = sel.options[sel.selectedIndex];
      var unit = opt.getAttribute('data-unit') || '';
      var nameJa = opt.getAttribute('data-nameja') || '';
      var nameEn = opt.getAttribute('data-nameen') || '';
      // 空の最終行があればそこに入れる。無ければ新規行を追加。
      var last = PO_ROWS[PO_ROWS.length-1];
      if(last && !(last.nameJa||last.nameEn||last.name) && !last.qty){ last.name=name; last.nameJa=nameJa; last.nameEn=nameEn; last.qty=1; last.unit=unit; }
      else { PO_ROWS.push({ name:name, nameJa:nameJa, nameEn:nameEn, qty:1, unit:unit }); }
      poRenderRows(); closePoPicker();
    };
    function poMsg(text, ok){ var m=document.getElementById('poMsg'); m.style.display='block'; m.style.background=ok?'#dcfce7':'#fee2e2'; m.style.color=ok?'#15803d':'#b91c1c'; m.innerText=text; }
    // 2026-08-25: sendPurchaseOrderEmailが実装され（src/purchasing.js、Resend経由でsrc/email.js
    // を利用）、実際に仕入先へ発注メールを送信するようにした。仕入先にメールアドレスが未登録、
    // またはRPCが失敗した場合（settings.htmlでメール送信が未設定な場合等）は、従来どおり発注内容を
    // テキスト化してクリップボードへコピーする代替動作へ自動的にフォールバックする。
    function poClipboardFallback(supplierName, items, reasonMsg){
      var lines = [I18n.t('poCopyHeader')+'「'+supplierName+'」'];
      items.forEach(function(it){ lines.push('・'+loc(it.nameJa!==undefined?it.nameJa:it.name,it.nameEn)+' × '+it.qty+(it.unit?(' '+it.unit):'')); });
      var text = lines.join('\n');
      var done = function(){ poMsg((reasonMsg?reasonMsg+'\n':'')+I18n.t('poCopyDone'), false); };
      var fail = function(){ poMsg((reasonMsg?reasonMsg+'\n':'')+text, false); };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(done).catch(fail);
      } else { fail(); }
    }
    var PO_EMAIL_REQUEST_ID='', PO_EMAIL_REQUEST_SIG='';
    var REORDER_EMAIL_REQUESTS=Object.create(null);
    function nextEmailRequestId(prefix){
      try{ if(crypto&&typeof crypto.randomUUID==='function') return prefix+crypto.randomUUID(); }catch(e){}
      return prefix+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
    }
    function emailRequestFor(sig,current){ return current&&current.sig===sig?current:{sig:sig,id:nextEmailRequestId('mail-')}; }
    function deterministicEmailReject(code){ return /^(?:no_supplier|no_email|no_items|no_reorder_items|not_configured|monthly_limit_reached)$/.test(String(code||'')); }
    // 2026-08-27修正（GPT確認レポート_Claude追加修正依頼_2026-08-27.md 指摘事項）: poSendConfirm
    // 文言は定義済みだったが未使用で、確認なしにメールが即送信されていた。宛先・品目・数量を
    // 表示するUIConfirmを送信直前に追加する。
    window.sendPo = function(){
      var supplierName = document.getElementById('poSupplier').value;
      if(!supplierName){ poMsg(I18n.t('poNeedSupplier'), false); return; }
      var sup = SUPS.filter(function(s){ return s.name===supplierName; })[0];
      var items = PO_ROWS.filter(function(r){ return String(r.nameJa||r.nameEn||r.name||'').trim() && Number(r.qty)>0; })
        .map(function(r){ var ja=String(r.nameJa!==undefined?r.nameJa:r.name||'').trim(),en=String(r.nameEn||'').trim();return { name:ja||en, nameJa:ja, nameEn:en, qty:Number(r.qty)||0, unit:(r.unit||'').trim() }; });
      if(!items.length){ poMsg(I18n.t('poNeedItems'), false); return; }
      if(!sup || !sup.email){ poClipboardFallback(supplierName, items, I18n.t('poNeedEmailFirst')); return; }
      var lines = items.map(function(it){ return '・'+loc(it.nameJa!==undefined?it.nameJa:it.name, it.nameEn)+' × '+it.qty+(it.unit?(' '+it.unit):''); });
      var confirmMsg = I18n.t('poSendConfirm') + loc(sup.nameJa!==undefined?sup.nameJa:sup.name,sup.nameEn) + '（' + sup.email + '）\n' + lines.join('\n');
      UIConfirm(confirmMsg).then(function(ok){
        if(!ok) return;
        var btn = document.getElementById('poSendBtn'); if(btn) btn.disabled = true;
        var sig=JSON.stringify([supplierName,sup.email||'',sup.language||'ja',items]);
        if(!PO_EMAIL_REQUEST_ID||PO_EMAIL_REQUEST_SIG!==sig){ PO_EMAIL_REQUEST_SIG=sig; PO_EMAIL_REQUEST_ID=nextEmailRequestId('po-'); }
        rpc('sendPurchaseOrderEmail', [supplierName, items, PO_EMAIL_REQUEST_ID]).then(function(r){
          if(btn) btn.disabled = false;
          if(r && r.success){ PO_EMAIL_REQUEST_ID=''; PO_EMAIL_REQUEST_SIG=''; poMsg(I18n.t('poSendDone'), true); }
          else { if(deterministicEmailReject(r&&r.error)){ PO_EMAIL_REQUEST_ID=''; PO_EMAIL_REQUEST_SIG=''; } poClipboardFallback(supplierName, items, I18n.t('sendMailFail')+API.userErrorText((r&&r.error)||'')); }
        }).catch(function(e){
          if(btn) btn.disabled = false;
          poClipboardFallback(supplierName, items, I18n.t('sendMailFail')+API.userErrorText(e));
        });
      });
    };

    function renderReorder(){
      if(!REORDER.length){ document.getElementById('reorder').innerHTML='<div class="muted">'+I18n.t('reorderEmpty')+'</div>'; return; }
      document.getElementById('reorder').innerHTML = REORDER.map(function(g, gi){
        var head = esc(g.supplier?loc(g.supplierJa!==undefined?g.supplierJa:g.supplier,g.supplierEn):I18n.t('noSupplier')) + (g.contact?(' <span class="muted">('+esc(g.contact)+')</span>'):'');
        var rows = g.items.map(function(it){
          return '<tr><td>'+esc(loc(it.nameJa!==undefined?it.nameJa:it.name, it.nameEn))+'</td><td class="num low">'+it.stock+' '+esc(it.unit)+'</td><td class="num muted">'+it.minimum+'</td><td class="num" style="font-weight:800;">+'+it.suggest+' '+esc(it.unit)+'</td></tr>';
        }).join('');
        var mailBtn = g.supplier ?
          '<button class="btn-sm" style="background:#dcfce7;color:#15803d;" id="mailBtn'+gi+'" onclick="sendOrderEmail('+gi+')" title="'+(g.email?'':esc(I18n.t('noEmailHint')))+'">'+I18n.t('sendMailBtn')+(g.email?'':(' <span class="muted" style="font-weight:400;">('+I18n.t('noEmailBadge')+')</span>'))+'</button>'
          : '';
        return '<div class="sup-group"><div class="sup-h" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;"><span>🏢 '+head+'</span>'+mailBtn+'</div>'+
          '<table><thead><tr><th>'+I18n.t('thItem')+'</th><th class="num">'+I18n.t('thStock')+'</th><th class="num">'+I18n.t('thMin')+'</th><th class="num">'+I18n.t('thSuggest')+'</th></tr></thead><tbody>'+rows+'</tbody></table>'+
          '<div class="muted" id="mailStatus'+gi+'" style="margin-top:6px;"></div></div>';
      }).join('');
    }
    // 2026-08-25: sendReorderEmailが実装され、発注提案の推奨発注数をそのまま使って
    // 対象仕入先へ1クリックで発注メールを送信できるようにした（内部でgetReorderSuggestionsの
    // 内容をsendPurchaseOrderEmailへ渡している）。失敗時（メールアドレス未登録・未設定等）は
    // 従来どおりクリップボードコピーへフォールバックする。
    function reorderClipboardFallback(g, st, reasonMsg){
      var lines = [I18n.t('poCopyHeader')+'「'+g.supplier+'」'];
      (g.items||[]).forEach(function(it){ lines.push('・'+loc(it.nameJa!==undefined?it.nameJa:it.name, it.nameEn)+' × '+it.suggest+(it.unit?(' '+it.unit):'')); });
      var text = lines.join('\n');
      var prefix = reasonMsg ? (reasonMsg+' ') : '';
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(function(){ if(st) st.innerText = prefix + I18n.t('poCopyDone'); }).catch(function(){ if(st) st.innerText = prefix + text; });
      } else if(st){ st.innerText = prefix + text; }
    }
    // 2026-08-27修正（GPT確認レポート_Claude追加修正依頼_2026-08-27.md 指摘事項）: sendMailConfirm
    // 文言は定義済みだったが未使用で、確認なしにメールが即送信されていた。宛先・品目・推奨発注数を
    // 表示するUIConfirmを送信直前に追加する。
    window.sendOrderEmail = function(gi){
      var g = REORDER[gi]; if(!g) return;
      var st = document.getElementById('mailStatus'+gi);
      if(!g.email){ reorderClipboardFallback(g, st, I18n.t('poNeedEmailFirst')); return; }
      var lines = (g.items||[]).map(function(it){ return '・'+loc(it.nameJa!==undefined?it.nameJa:it.name, it.nameEn)+' × '+it.suggest+(it.unit?(' '+it.unit):''); });
      var confirmMsg = I18n.t('sendMailConfirm') + loc(g.supplierJa!==undefined?g.supplierJa:g.supplier,g.supplierEn) + '（' + g.email + '）\n' + lines.join('\n');
      UIConfirm(confirmMsg).then(function(ok){
        if(!ok) return;
        var btn = document.getElementById('mailBtn'+gi); if(btn) btn.disabled = true;
        var sup=SUPS.filter(function(s){ return s.name===g.supplier; })[0]||{};
        var sig=JSON.stringify([g.supplier,sup.email||g.email||'',sup.language||'ja',(g.items||[]).map(function(it){return [it.name,it.nameJa,it.nameEn,it.suggest,it.unit];})]);
        var req=emailRequestFor(sig,REORDER_EMAIL_REQUESTS[g.supplier]); REORDER_EMAIL_REQUESTS[g.supplier]=req;
        rpc('sendReorderEmail', [g.supplier, req.id]).then(function(r){
          if(btn) btn.disabled = false;
          if(r && r.success){ delete REORDER_EMAIL_REQUESTS[g.supplier]; if(st) st.innerText = I18n.t('poSendDone'); }
          else { if(deterministicEmailReject(r&&r.error)) delete REORDER_EMAIL_REQUESTS[g.supplier]; reorderClipboardFallback(g, st, I18n.t('sendMailFail')+API.userErrorText((r&&r.error)||'')); }
        }).catch(function(e){
          if(btn) btn.disabled = false;
          reorderClipboardFallback(g, st, I18n.t('sendMailFail')+API.userErrorText(e));
        });
      });
    };
    function langLabel(v){ return v==='en' ? I18n.t('langEn') : (v==='both' ? I18n.t('langBoth') : I18n.t('langJa')); }
    function renderSups(){
      if(!SUPS.length){ document.getElementById('supRows').innerHTML='<tr><td colspan="6" class="muted" style="padding:14px;text-align:center;">'+I18n.t('supEmpty')+'</td></tr>'; return; }
      document.getElementById('supRows').innerHTML = SUPS.map(function(s){
        var nmCell = '<td style="font-weight:800;">'+esc(loc(s.nameJa!==undefined?s.nameJa:s.name,s.nameEn))+'</td>';
        return '<tr>'+nmCell+'<td>'+esc(s.contact)+'</td><td class="muted">'+esc(s.email||'')+'</td><td class="muted">'+esc(langLabel(s.language))+'</td><td class="muted" style="white-space:normal;max-width:200px;">'+esc(s.items)+'</td>'+
          '<td><button class="btn-sm" onclick="edit(\''+s.id+'\')">'+I18n.t('edit')+'</button> <button class="btn-sm" style="background:#fee2e2;color:#b91c1c;" onclick="del(\''+s.id+'\')">'+I18n.t('del')+'</button></td></tr>';
      }).join('');
    }
    function msg(text, ok){ var m=document.getElementById('msg'); m.style.display='block'; m.style.background=ok?'#dcfce7':'#fee2e2'; m.style.color=ok?'#15803d':'#b91c1c'; m.innerText=text; }
    function clearForm(){ ['sId','sName','sNameEn','sContact','sEmail','sItems','sMemo'].forEach(function(id){ document.getElementById(id).value=''; }); document.getElementById('sLanguage').value='ja'; }

    window.edit = function(id){ var s=SUPS.filter(function(x){return x.id===id;})[0]; if(!s) return; document.getElementById('sId').value=s.id; document.getElementById('sName').value=(s.nameJa!==undefined?s.nameJa:s.name)||''; document.getElementById('sNameEn').value=s.nameEn||''; document.getElementById('sContact').value=s.contact; document.getElementById('sEmail').value=s.email||''; document.getElementById('sLanguage').value=s.language||'ja'; document.getElementById('sItems').value=s.items; document.getElementById('sMemo').value=s.memo||''; window.scrollTo({top:9999,behavior:'smooth'}); };
    // [応答速度対応] 以前は保存時にsaveSupplier→reloadReorder→reloadSupsの3回連続RPCで、
    // 削除時もdeleteSupplier→reloadSupsの2回連続RPCで、いずれも一覧全体を再取得・再描画していた。
    // saveSupplierが保存済み行を返すようになったので、その行をSUPS配列にローカル反映するだけにする。
    // 発注提案（REORDER）はグループの仕入先名・連絡先・メール表示のみに関わり在庫数には影響しないため、
    // 該当グループがあればローカルで名前・連絡先・メールを補正し、reloadReorderの往復を省略する。
    function _patchReorderSupplierInfo(row){
      REORDER.forEach(function(g){ if(g.supplier===row.name){ g.contact=row.contact; g.email=row.email; } });
      renderReorder();
    }
    window.del = function(id){
      UIConfirm(I18n.t('delConfirm')).then(function(ok){
        if(!ok) return;
        rpc('deleteSupplier',[id]).then(function(d){
          if(d&&d.error){ msg(I18n.t('errPrefix')+API.userErrorText(d.error), false); return; }
          SUPS = SUPS.filter(function(s){ return s.id!==id; });
          renderSups(); fillPoSupplierSel();
        }).catch(function(e){ msg(I18n.t('errPrefix')+API.userErrorText(e), false); });
      });
    };
    window.save = function(){
      var nameJa=document.getElementById('sName').value.trim(),nameEn=document.getElementById('sNameEn').value.trim();
      var sup = { id:document.getElementById('sId').value, name:nameJa||nameEn, nameJa:nameJa, nameEn:nameEn, contact:document.getElementById('sContact').value.trim(), email:document.getElementById('sEmail').value.trim(), language:document.getElementById('sLanguage').value, items:document.getElementById('sItems').value.trim(), memo:document.getElementById('sMemo').value.trim() };
      if(!nameJa&&!nameEn){ msg(I18n.t('needName'), false); return; }
      var btn=document.getElementById('saveBtn'); btn.disabled=true;
      rpc('saveSupplier',[sup]).then(function(d){
        btn.disabled=false;
        if(d&&d.error){ msg(I18n.t('errPrefix')+API.userErrorText(d.error), false); return; }
        msg(I18n.t('saved'), true); clearForm();
        if(d && d.row){
          var idx = SUPS.findIndex(function(s){ return s.id===d.row.id; });
          if(idx>=0) SUPS[idx]=d.row; else SUPS.push(d.row);
          renderSups(); fillPoSupplierSel();
          _patchReorderSupplierInfo(d.row);
        } else {
          reloadReorder(); reloadSups(); // 想定外形状のフォールバックのみ再取得
        }
      }).catch(function(e){ btn.disabled=false; msg(I18n.t('errPrefix')+API.userErrorText(e), false); });
    };
    function reloadSups(){ return rpc('getSuppliers',[]).then(function(l){ SUPS=l||[]; renderSups(); fillPoSupplierSel(); }); }
    function reloadReorder(){ return rpc('getReorderSuggestions',[]).then(function(l){ REORDER=l||[]; renderReorder(); }).catch(function(){}); }

    API.post('getSettings', {}).then(function(r){ if(r.data && r.data.currencySymbol) SYM=r.data.currencySymbol; }).catch(function(){});
    rpc('getReorderSuggestions',[]).then(function(l){ REORDER=l||[]; renderReorder(); }).catch(function(e){ document.getElementById('reorder').innerHTML='<div class="muted" style="color:#b91c1c;">'+I18n.t('loadErr')+esc(API.userErrorText(e))+'</div>'; });
    rpc('getSuppliers',[]).then(function(l){ SUPS=l||[]; __loaded=true; renderSups(); fillPoSupplierSel(); })
      .catch(function(e){ if(String(e.message||e).indexOf('unauthorized')>=0){ location.href='./manage.html'; return; } document.getElementById('supRows').innerHTML='<tr><td colspan="6" style="color:#b91c1c;padding:14px;">'+I18n.t('loadErr')+esc(API.userErrorText(e))+'</td></tr>'; });
    rpc('getAllMenuForAdmin',[]).then(function(l){ MENU_ALL_PO=l||[]; }).catch(function(){});
    rpc('getOrderItems',[]).then(function(l){ ORDER_ITEMS_PO=l||[]; }).catch(function(){});
    poRenderRows();
