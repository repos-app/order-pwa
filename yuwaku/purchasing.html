<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Purchasing">

  <link rel="manifest" href="./purchasing.webmanifest">
  <title>Purchasing</title>
  <style>
    :root{ --bg:#f6f7f9; --surface:#fff; --border:#e5e7eb; --navy:#0f172a; --text-3:#64748b; --red:#c62828; }
    *{ box-sizing:border-box; }
    body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans JP',sans-serif; background:var(--bg); color:var(--navy); }
    .head{ position:sticky; top:0; z-index:20; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:space-between; padding:12px 16px; }
    .head h1{ font-size:18px; margin:0; font-weight:900; }
    .hbtn{ background:rgba(255,255,255,.14); color:#fff; border:0; border-radius:9px; padding:8px 12px; font-size:13px; font-weight:800; cursor:pointer; text-decoration:none; }
    .wrap{ padding:16px; max-width:920px; margin:0 auto; }
    .card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:14px; }
    .card-title{ font-weight:900; font-size:15px; margin-bottom:12px; }
    .muted{ color:var(--text-3); font-size:12px; }
    /* [iPhone表示対応] min-widthで表全体の最小幅を確保し、外側のoverflow:autoラッパーで横スクロールさせる。 */
    table{ width:100%; min-width:640px; border-collapse:collapse; font-size:13px; }
    th,td{ padding:8px 6px; border-bottom:1px solid var(--border); text-align:left; white-space:nowrap; }
    th{ font-size:11px; color:var(--text-3); white-space:nowrap; }
    td.num,th.num{ text-align:right; font-variant-numeric:tabular-nums; }
    .grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .fg{ margin-bottom:8px; } .form-label{ font-size:12px; font-weight:700; display:block; margin-bottom:4px; }
    .fc{ width:100%; padding:10px; border:1px solid var(--border); border-radius:9px; font-size:15px; font-family:inherit; background:var(--surface); }
    .btn{ border:0; border-radius:11px; padding:12px 16px; font-size:15px; font-weight:900; cursor:pointer; font-family:inherit; background:var(--navy); color:#fff; }
    .btn-sm{ background:#eef2f7; color:var(--navy); border:0; border-radius:8px; padding:7px 10px; font-weight:800; cursor:pointer; }
    .sup-group{ border:1px solid var(--border); border-radius:12px; padding:10px 12px; margin-bottom:10px; min-width:0; max-width:100%; }
    .sup-h span{min-width:0;overflow-wrap:normal;}
    /* IZK-UT-073: supplier strings wrap without expanding the action column. */
    #supRows td:not(:last-child){white-space:normal;overflow-wrap:normal;word-break:normal;}
    #supRows td:last-child{white-space:nowrap;}
    .sup-group [id^="mailStatus"]{overflow-wrap:normal;}
    .reorder-table-wrap{max-width:100%;overflow-x:auto;overscroll-behavior-x:contain;}
    .sup-h{ font-weight:900; margin-bottom:6px; }
    .alert{ margin-top:10px; display:none; padding:11px; border-radius:9px; font-size:14px; font-weight:700; }
    .low{ color:#b91c1c; font-weight:800; }
    .po-table-wrap{ overflow:hidden; margin-top:6px; width:100%; }
    .po-table{ width:100%; min-width:0; table-layout:fixed; }
    .po-table th,.po-table td{ padding:8px 4px; }
    .po-table .po-qty,.po-table .po-unit{ width:72px; }
    .po-table .po-del{ width:44px; }
    .po-table input{ display:block; width:100%; min-width:0; max-width:100%; padding:9px 7px; border:1px solid var(--border); border-radius:7px; font:inherit; background:var(--surface); }
    .po-table .po-del .btn-sm{ width:36px; min-width:0; padding:7px 0; }
    @media (max-width:520px){
      .po-table th,.po-table td{ padding-left:3px; padding-right:3px; }
      .po-table .po-qty,.po-table .po-unit{ width:58px; }
      .po-table .po-del{ width:38px; }
      .po-table input{ font-size:16px; padding:8px 5px; }
      .po-table .po-del .btn-sm{ width:32px; padding-left:0; padding-right:0; }
    }
    @media (orientation:landscape) and (max-height:500px){
      .wrap{max-width:none;padding:8px 12px 220px;}
      .grid{grid-template-columns:minmax(0,1fr);}
      .fg{min-width:0;}
      .fg .fc{width:min(100%,320px);max-width:100%;font-size:16px;}
      .fg .fc:focus{scroll-margin-top:65px;scroll-margin-bottom:12px;}
    }
    @media (max-width:430px){ .head{flex-wrap:wrap;gap:8px} .head h1{flex:1 1 100%;min-width:0;overflow-wrap:anywhere} .head>div{min-width:0;flex-wrap:wrap} }
  </style>
</head>
<body>
  <div class="head"><h1 data-t="title">🚚 仕入・発注</h1><div style="display:flex;gap:8px;flex-wrap:wrap;"><button class="hbtn" data-tlang onclick="I18n.toggle()">EN</button><a class="hbtn" href="./order_items.html" data-t="orderItemsLink">📋 発注アイテム</a><a class="hbtn" href="./inventory.html" data-t="inv">📦 在庫</a><a class="hbtn" href="./manage.html" data-t="back">← 管理へ</a></div></div>
  <div class="wrap">
    <div class="card">
      <div class="card-title" data-t="newOrderTitle">🆕 新規発注</div>
      <div class="muted" data-t="newOrderHint" style="margin-bottom:10px;">仕入先を選び、品目を追加してください。メニュー・発注アイテムマスタから選ぶか、直接入力できます。</div>
      <div class="fg"><label class="form-label" data-t="poSupplier">仕入先</label><select id="poSupplier" class="fc" onchange="onPoSupplierChange()"></select></div>
      <div id="poSenderInfo" class="muted" style="margin-bottom:12px;line-height:1.7;" aria-live="polite"></div>
      <div class="alert" id="poSupplierWarn" style="background:#fef9c3;color:#854d0e;"></div>
      <div class="po-table-wrap">
        <table class="po-table"><thead><tr>
          <th data-t="thItem">品目</th><th class="po-qty" data-t="poThQty">数量</th><th class="po-unit" data-t="poThUnit">単位</th><th class="po-del"></th>
        </tr></thead>
        <tbody id="poRows"></tbody></table>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;">
        <button class="btn-sm" onclick="poAddRow()" data-t="poAddRow">＋ 行を追加</button>
        <button class="btn-sm" onclick="openPoPicker('menu')" data-t="poFromMenu">🍽️ メニューから追加</button>
        <button class="btn-sm" onclick="openPoPicker('item')" data-t="poFromItem">📋 発注アイテムから追加</button>
      </div>
      <button class="btn" style="margin-top:12px;" id="poSendBtn" onclick="sendPo()" data-t="poSendBtn">📧 発注依頼</button>
      <button class="btn" type="button" id="poCreateBtn" onclick="createPoRecord()" style="margin-top:12px;" data-t="poCreateBtn">💾 発注を記録</button>
      <button class="btn-sm" type="button" id="poNewBtn" onclick="prepareNewPo()" style="margin-top:12px;display:none;" data-t="poNewBtn">🔄 同じ内容で新しい発注</button>
      <div class="alert" id="poMsg"></div>
    </div>
    <div class="card"><div class="card-title" id="poHistoryTitle" data-t="poHistoryTitle">📋 発注履歴</div><button class="btn-sm" id="poHistoryRefresh" type="button" onclick="loadPoHistory()" data-t="poHistoryRefresh">更新</button><div id="poHistory" class="muted"></div></div>

    <div class="card">
      <div class="card-title" data-t="reorderTitle">🔔 発注提案（最小在庫以下）</div>
      <div class="muted" data-t="reorderHint" style="margin-bottom:10px;">在庫が最小在庫を下回った品目を仕入先ごとにまとめます。推奨数＝最小在庫の2倍を目標に補充。</div>
      <div id="reorder"><div class="muted" data-t="loading">読み込み中…</div></div>
    </div>

    <div class="card">
      <div class="card-title" data-t="supTitle">🏢 仕入先マスタ</div>
      <div class="grid">
        <div class="fg" id="fieldSupplierNameJa"><label class="form-label" data-t="sNameJa">仕入先名（日本語）</label><input id="sName" class="fc"></div>
        <div class="fg" id="fieldSupplierNameEn"><label class="form-label" data-t="sNameEn">仕入先名（English）</label><input id="sNameEn" class="fc" data-tph="phNameEn" placeholder="e.g. ABC Trading Co."></div>
      </div>
      <div class="fg"><label class="form-label" data-t="sContact">連絡先</label><input id="sContact" class="fc" data-tph="phContact" placeholder="電話・担当など"></div>
      <div class="fg"><label class="form-label" data-t="sEmail">メールアドレス（任意・発注メール送信用）</label><input id="sEmail" type="email" class="fc" data-tph="phEmail" placeholder="order@supplier.example"></div>
      <div class="fg" style="max-width:260px;"><label class="form-label" data-t="sLanguage">発注メール言語</label><select id="sLanguage" class="fc"><option value="ja" data-t="langJa">日本語</option><option value="en" data-t="langEn">英語</option><option value="both" data-t="langBoth">日本語＋英語（両方）</option></select></div>
      <div class="fg"><label class="form-label" data-t="sItems">取扱品目（任意）</label><input id="sItems" class="fc" data-tph="phItems" placeholder="例: ビール, 焼酎, 生鮮"></div>
      <div class="fg"><label class="form-label" data-t="sMemo">備考（任意）</label><input id="sMemo" class="fc"></div>
      <input type="hidden" id="sId">
      <button class="btn" id="saveBtn" onclick="save()" data-t="add">💾 登録</button>
      <div class="alert" id="msg"></div>
      <div style="overflow:auto;margin-top:14px;">
        <table><thead><tr>
          <th data-t="thName">仕入先</th><th data-t="thContact">連絡先</th><th data-t="thEmail">メール</th><th data-t="thLanguage">言語</th><th data-t="thItems">取扱品目</th><th style="width:90px;"></th>
        </tr></thead>
        <tbody id="supRows"><tr><td colspan="6" class="muted" style="padding:14px;text-align:center;" data-t="loading">読み込み中…</td></tr></tbody></table>
      </div>
    </div>
  </div>

  <!-- 新規発注：メニュー／発注アイテムマスタから品目を選ぶピッカー -->
  <div id="poPickOv" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:56;align-items:center;justify-content:center;">
    <div style="background:#fff;border-radius:16px;padding:20px;max-width:380px;width:calc(100% - 32px);">
      <div id="poPickTitle" style="font-weight:900;font-size:15px;margin-bottom:10px;"></div>
      <select id="poPickSel" class="fc" style="margin-bottom:14px;"></select>
      <button class="btn" onclick="confirmPoPick()" data-t="poPickAdd">＋ 追加</button>
      <button class="btn-sm" style="margin-top:8px;width:100%;" onclick="closePoPicker()" data-t="mvClose">閉じる</button>
    </div>
  </div>

  <script src="./date-display.js?v=auth5" data-iz-date-display></script><script src="./config.js?v=auth2"></script>
  <script src="./api.js?v=auth2"></script>
  <script src="./pending-write-replay.js?v=s6-1"></script>
  <script src="./i18n.js?v=auth3"></script>
  <script src="./confirm.js?v=auth2"></script>
  <script>
    var TOKEN = localStorage.getItem(window.APP_CONFIG.AUTH_STORAGE_PREFIX + 'mgmtToken') || '';
    if (!TOKEN) location.href = './manage.html';
    function rpc(fn,args){ return API.post('rpc',{fn:fn,args:args||[],token:TOKEN}).then(function(r){ return r.data; }); }
    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
    // 言語切替の一元ヘルパー（新しい表示・候補リストを追加する際は必ずこれを通すこと）
    function isEN(){ return !!(window.I18n && I18n.lang && I18n.lang()==='en'); }
    function loc(ja, en){ ja=(ja||'').trim(); en=(en||'').trim(); return isEN() ? (en || ja) : (ja || en); }
    function syncSupplierNameOrder(){var a=document.getElementById('fieldSupplierNameJa'),b=document.getElementById('fieldSupplierNameEn');if(a&&b){a.style.order=isEN()?'2':'1';b.style.order=isEN()?'1':'2';}}
    var SUPS = [], REORDER = [], SYM='₱', __loaded=false;
    var MENU_ALL_PO = [], ORDER_ITEMS_PO = [];
    var PO_ROWS = [{ name:'', nameJa:'', nameEn:'', qty:'', unit:'' }];
    var PO_SENDER = {shopName:'',deliveryAddress:''};
    function poSenderLines(){
      return [I18n.t('poOrderingStore')+': '+(PO_SENDER.shopName||I18n.t('poUnconfigured')),
        I18n.t('poDeliveryAddress')+': '+(PO_SENDER.deliveryAddress||I18n.t('poUnconfigured'))];
    }
    function poRenderSender(){
      var node=document.getElementById('poSenderInfo');
      node.innerHTML=poSenderLines().map(function(s){return '<div>'+esc(s)+'</div>';}).join('')+
        ((!PO_SENDER.shopName||!PO_SENDER.deliveryAddress)?'<div style="color:#b45309;">'+esc(I18n.t('poSenderSetup'))+'</div>':'');
    }
    var PO_RECORD_KEY='',PO_RECORD_SIG='',PO_HISTORY=null,PO_ACTION_PENDING=false;
    async function poIdForSignature(sig){
      var ticket=await IZPendingWrite.begin('purchase_order',sig,function(){
        return nextEmailRequestId('record-');
      });
      PO_RECORD_SIG=sig;PO_RECORD_KEY=ticket.id;
      return ticket.id;
    }
    function poSetBusy(busy){
      PO_ACTION_PENDING=!!busy;
      ['poCreateBtn','poSendBtn','poNewBtn'].forEach(function(id){var el=document.getElementById(id);if(el)el.disabled=busy;});
    }
    function poMarkSaved(){var b=document.getElementById('poNewBtn');if(b)b.style.display='inline-block';}
    window.prepareNewPo=async function(){
      if(PO_ACTION_PENDING)return;
      poSetBusy(true);
      try{
        if(PO_RECORD_KEY)await IZPendingWrite.clear('purchase_order',PO_RECORD_KEY);
      }catch(e){poMsg(API.userErrorText(e),false);poSetBusy(false);return;}
      PO_RECORD_KEY='';PO_RECORD_SIG='';
      var b=document.getElementById('poNewBtn');if(b)b.style.display='none';
      poMsg(isEN()?'New order ready: items retained. Save or send to create a separate PO.':'新しい発注として登録できます。品目はそのままです。保存または発注依頼で別の発注番号になります。',true);
      poSetBusy(false);
    };
    function currentPoItems(){return PO_ROWS.filter(function(r){return String(r.nameJa||r.nameEn||r.name||'').trim()&&Number(r.qty)>0;}).map(function(r){var ja=String(r.nameJa!==undefined?r.nameJa:r.name||'').trim(),en=String(r.nameEn||'').trim(),item={name:ja||en,nameJa:ja,nameEn:en,qty:Number(r.qty),unit:(r.unit||'').trim()};if(String(r.note||'').trim())item.note=String(r.note).trim();return item;});}
    function poHasIncompleteRows(){
      return PO_ROWS.some(function(r){
        var named=!!String(r.nameJa||r.nameEn||r.name||'').trim();
        return (named && !(Number(r.qty)>0)) ||
          (!named && (String(r.unit||'').trim() || String(r.note||'').trim() || (r.qty!=null && r.qty!=='')));
      });
    }
    function poValidateRows(){if(!poHasIncompleteRows())return true;poMsg(isEN()?'Enter an item name and quantity above zero for every started row.':'入力した各行に品目名と0より大きい数量を指定してください。',false);return false;}
    function poLineLengthError(){poMsg(isEN()?'Item names must be at most 160 characters, units 32, and notes 200.':'発注品目名は160文字以内、単位は32文字以内、備考は200文字以内で入力してください。',false);}
    function poLineLengthsValid(){return PO_ROWS.every(function(r){return String(r.name||'').length<=160&&String(r.nameJa||'').length<=160&&String(r.nameEn||'').length<=160&&String(r.unit||'').length<=32&&String(r.note||'').length<=200;});}
    document.getElementById('poRows').addEventListener('paste',function(e){var el=e.target;if(!el.matches('input[data-po-max]'))return;var n=Number(el.dataset.poMax),s=e.clipboardData.getData('text');if(el.value.length-(el.selectionEnd-el.selectionStart)+s.length>n){e.preventDefault();poLineLengthError();}});
    document.getElementById('poRows').addEventListener('beforeinput',function(e){var el=e.target;if(!el.matches('input[data-po-max]')||e.isComposing||e.inputType==='insertCompositionText'||!e.inputType||!e.inputType.startsWith('insert'))return;var s=e.data;if(s===null&&e.dataTransfer)s=e.dataTransfer.getData('text/plain');if(s!==null&&el.value.length-(el.selectionEnd-el.selectionStart)+s.length>Number(el.dataset.poMax)){e.preventDefault();poLineLengthError();}});
    window.createPoRecord=async function(){
      if(PO_ACTION_PENDING)return;
      if(!poLineLengthsValid()){poLineLengthError();return;}
      if(!poValidateRows())return;
      var name=document.getElementById('poSupplier').value,items=currentPoItems();
      if(!name||!items.length){poMsg(!name?I18n.t('poNeedSupplier'):I18n.t('poNeedItems'),false);return;}
      var sig=JSON.stringify([name,items]);
      poSetBusy(true);
      try{await poIdForSignature(sig);}
      catch(e){poMsg(API.userErrorText(e),false);poSetBusy(false);return;}
      rpc('createPurchaseOrder',[name,items,PO_RECORD_KEY]).then(function(r){
        if(!r||!r.success||!r.po||!r.po.id)throw Error((r&&r.error)||'save_failed');
        poMarkSaved();poMsg((isEN()?'✅ Saved (not emailed): ':'✅ 履歴に保存しました（メール未送信）: ')+r.po.id,true);loadPoHistory();
      }).catch(function(e){poMsg(API.userErrorText(e),false);}).finally(function(){poSetBusy(false);});
    };
    function renderPoHistory(){
      if(!PO_HISTORY)return;
      document.getElementById('poHistory').innerHTML=PO_HISTORY.map(function(po){
        // purchase_orders.created_at is SQLite UTC (no Z suffix); never treat it as local wall time.
        var stamp=window.DateDisplay?DateDisplay.formatUtcDateTime(po.createdAt):po.createdAt;
        var status=po.emailStatus==='sent'?(isEN()?'✅ Email sent':'✅ メール送信済み'):
          po.emailStatus==='failed'?(isEN()?'⚠️ Email not sent':'⚠️ メール未送信'):
          (!po.emailStatus||po.emailStatus==='unknown')?(isEN()?'ℹ️ Legacy order (delivery unverified)':'ℹ️ 旧発注（送信状態未確認）'):
          (isEN()?'💾 Saved (not emailed)':'💾 記録済み（メール未送信）');
        if(po.emailStatus==='failed'){
          var reason=po.emailError==='no_email'?(isEN()?' (no supplier email)':'（仕入先メール未設定）'):
            po.emailError==='monthly_limit_reached'?(isEN()?' (monthly limit)':'（月間送信上限）'):
            (isEN()?' (delivery failed)':'（送信失敗）');
          status+=reason;
        }
        return '<div style="padding:10px 0;border-bottom:1px solid #e5e7eb;"><strong>'+esc(po.supplierName)+'</strong> · '+esc(stamp)+'<br>'+esc(status)+'<br>'+(po.items||[]).map(function(it){return esc(it.name)+' × '+esc(it.qty)+' '+esc(it.unit)+(it.note?'<div class="muted">'+esc(I18n.t('poNote')+': '+it.note)+'</div>':'');}).join('<br>')+'</div>';
      }).join('')||(isEN()?'No saved purchase orders':'発注履歴はありません');
    }
    var PO_HISTORY_SEQ=0;
    window.loadPoHistory=function(){
      var seq=++PO_HISTORY_SEQ;
      rpc('getPurchaseOrders',[]).then(function(rows){
        if(seq!==PO_HISTORY_SEQ)return;
        PO_HISTORY=rows||[];renderPoHistory();
      }).catch(function(e){
        if(seq!==PO_HISTORY_SEQ)return;
        PO_HISTORY=null;document.getElementById('poHistory').textContent=API.userErrorText(e);
      });
    };

    // ── 新規発注（自由入力） ──
    function poRenderRows(){
      var html = PO_ROWS.map(function(r,i){
        var ja=(r.nameJa!==undefined?r.nameJa:r.name||''), val=loc(ja,r.nameEn), prop=isEN()?'nameEn':'nameJa';
        return '<tr>'+
          '<td><input data-po-max="160" value="'+esc(val)+'" oninput="PO_ROWS['+i+'].'+prop+'=this.value;PO_ROWS['+i+'].name=(PO_ROWS['+i+'].nameJa||PO_ROWS['+i+'].nameEn||\'\')"></td>'+
          '<td class="po-qty"><input required aria-required="true" type="number" min="0.000001" step="any" value="'+(r.qty??'')+'" oninput="PO_ROWS['+i+'].qty=this.value.length?Number(this.value):null"></td>'+
          '<td class="po-unit"><input data-po-max="32" value="'+esc(r.unit||'')+'" oninput="PO_ROWS['+i+'].unit=this.value"></td>'+
          '<td class="po-del"><button class="btn-sm" onclick="poDelRow('+i+')">🗑</button></td></tr>'+
          '<tr><td colspan="4" style="padding-top:0;"><label class="muted" for="poNote'+i+'">'+I18n.t('poNote')+'</label>'+
          '<input id="poNote'+i+'" class="fc" style="padding:7px 9px;" data-po-max="200" maxlength="200" value="'+esc(r.note||'')+'" oninput="PO_ROWS['+i+'].note=this.value"></td></tr>';
      }).join('');
      if(!PO_ROWS.length) html = '<tr><td colspan="4" style="color:#aaa;padding:14px;text-align:center;">'+I18n.t('poEmpty')+'</td></tr>';
      document.getElementById('poRows').innerHTML = html;
    }
    window.poAddRow = function(){ PO_ROWS.push({ name:'', nameJa:'', nameEn:'', qty:'', unit:'' }); poRenderRows(); };
    window.poDelRow = function(i){ PO_ROWS.splice(i,1); poRenderRows(); };

    function fillPoSupplierSel(){
      var sel = document.getElementById('poSupplier'); var cur = sel.value;
      sel.innerHTML = '<option value="">'+I18n.t('poSupplierPh')+'</option>' +
        SUPS.map(function(s){ return '<option value="'+esc(s.name)+'">'+esc(loc(s.nameJa!==undefined?s.nameJa:s.name, s.nameEn))+(s.email?'':(' — '+I18n.t('poNoEmailTag')))+'</option>'; }).join('');
      sel.value = cur;
      onPoSupplierChange();
    }
    window.onPoSupplierChange = function(){

<script>
  // Keep the active supplier field in the ~190px viewport after Android IME rotation.
  (function(){
    function recoverPurchasingFocus(){
      if(!matchMedia('(orientation:landscape) and (max-height:500px)').matches)return;
      var field=document.activeElement;
      if(!field||!field.matches('input.fc,textarea.fc,select.fc')||!field.closest('.wrap'))return;
      var viewport=window.visualViewport;
      var top=(viewport?viewport.offsetTop:0)+Math.max(56,document.querySelector('.head')?.getBoundingClientRect().height||0)+6;
      var bottom=(viewport?viewport.offsetTop+viewport.height:innerHeight)-8;
      if(bottom-top<field.getBoundingClientRect().height)return;
      var rect=field.getBoundingClientRect();
      var offset=rect.top<top?rect.top-top:rect.bottom>bottom?rect.bottom-bottom:0;
      if(offset)window.scrollBy(0,offset);
    }
    function afterPurchasingLayout(){
      recoverPurchasingFocus();
      setTimeout(recoverPurchasingFocus,120);
      setTimeout(recoverPurchasingFocus,380);
    }
    window.addEventListener('orientationchange',afterPurchasingLayout);
    window.addEventListener('resize',afterPurchasingLayout);
    window.visualViewport?.addEventListener('resize',afterPurchasingLayout);
    window.visualViewport?.addEventListener('scroll',recoverPurchasingFocus);
    document.addEventListener('focusin',afterPurchasingLayout);
  })();
</script>
