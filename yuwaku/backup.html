<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta http-equiv="refresh" content="0;url=./data_admin.html">
  <script>location.replace('./data_admin.html');</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Backup">

  <link rel="manifest" href="./backup.webmanifest">
  <title>Backup</title>
  <style>
    :root{ --bg:#f6f7f9; --surface:#fff; --border:#e5e7eb; --navy:#0f172a; --text-3:#64748b; --green:#16a34a; }
    *{ box-sizing:border-box; }
    body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans JP',sans-serif; background:var(--bg); color:var(--navy); }
    .head{ position:sticky; top:0; z-index:20; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:space-between; padding:12px 16px; }
    .head h1{ font-size:18px; margin:0; font-weight:900; }
    .hbtn{ background:rgba(255,255,255,.14); color:#fff; border:0; border-radius:9px; padding:8px 12px; font-size:13px; font-weight:800; cursor:pointer; text-decoration:none; }
    .wrap{ padding:16px; max-width:720px; margin:0 auto; }
    .card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:14px; }
    .card-title{ font-weight:900; font-size:15px; margin-bottom:8px; }
    .muted{ color:var(--text-3); font-size:13px; line-height:1.7; }
    .btn{ border:0; border-radius:11px; padding:13px 16px; font-size:15px; font-weight:900; cursor:pointer; font-family:inherit; background:var(--navy); color:#fff; }
    .btn.green{ background:var(--green); }
    .fc{ padding:11px; border:1px solid var(--border); border-radius:9px; font-size:15px; font-family:inherit; background:var(--surface); }
    .row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .alert{ margin-top:12px; display:none; padding:12px; border-radius:9px; font-size:14px; font-weight:700; }
    a.dl{ color:#2563eb; font-weight:800; }
  </style>
</head>
<body>
  <div class="head"><h1 data-t="title">💾 バックアップ / 書き出し</h1><div style="display:flex;gap:8px;"><button class="hbtn" data-tlang onclick="I18n.toggle()">EN</button><a class="hbtn" href="./manage.html" data-t="back">← 管理へ</a></div></div>
  <div class="wrap">
    <div class="card">
      <div class="card-title" data-t="bkTitle">📦 全データを一括バックアップ</div>
      <button class="btn green" id="bkBtn" onclick="backup()" data-t="bkBtn">📦 全データをZIPでダウンロード</button>
      <div class="alert" id="bkMsg"></div>
    </div>
    <div class="card">
      <div class="card-title" data-t="csvTitle">📄 シートをCSVで書き出し</div>
      <div class="muted" data-t="csvHint" style="margin-bottom:12px;">シートを選んでCSVをダウンロードできます（Excel等で開けます）。</div>
      <div class="row">
        <select id="sheetSel" class="fc" style="min-width:180px;"></select>
        <button class="btn" onclick="exportCsv()" data-t="csvBtn">⬇ CSVを書き出し</button>
      </div>
      <div class="alert" id="csvMsg"></div>
    </div>
  </div>

  <script src="./config.js?v=auth2"></script>
  <script src="./api.js?v=auth2"></script>
  <script src="./i18n.js?v=auth3"></script>
  <script src="./native-file-export.js?v=native-export1"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script>
    var TOKEN = localStorage.getItem(window.APP_CONFIG.AUTH_STORAGE_PREFIX + 'mgmtToken') || '';
    if (!TOKEN) location.href = './manage.html';
    function rpc(fn,args){ return API.post('rpc',{fn:fn,args:args||[],token:TOKEN}).then(function(r){ return r.data; }); }
    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
    function alertBox(id, html, ok){ var m=document.getElementById(id); m.style.display='block'; m.style.background=ok===true?'#dcfce7':ok===false?'#fee2e2':'#fef3c7'; m.style.color=ok===true?'#15803d':ok===false?'#b91c1c':'#92400e'; m.innerHTML=html; }
    function exportDone(id,result,webKey){ if(result&&result.mode==='native'){ if(result.status==='shared') alertBox(id,I18n.t('nativeShared')+' '+esc(result.fileName),true); else alertBox(id,I18n.t('nativeDismissed')+' '+esc(result.fileName),null); return; } alertBox(id,I18n.t(webKey)+' '+esc(result&&result.fileName||''),true); }
    function exportFailed(id,e,fileName){ if(window.NativeFileExport&&NativeFileExport.isCancellationError(e)){ alertBox(id,I18n.t('nativeDismissed')+' '+esc(e&&e.fileName||fileName||''),null); return; } var code=String(e&&e.message||e||''); if(code==='native_export_plugins_missing'||code==='native_share_unavailable'){ alertBox(id,I18n.t('nativeUnavailable'),false); return; } alertBox(id,I18n.t('errPrefix')+API.userErrorText(e),false); }

    function csvCell(v){ var s=(v==null)?'':String(v); if(/[",\n]/.test(s)) s='"'+s.replace(/"/g,'""')+'"'; return s; }
    function toCsv(rows){ return (rows||[]).map(function(row){ return row.map(csvCell).join(','); }).join('\r\n'); }
    function pad2(n){ return (n<10?'0':'')+n; }

    // 2026-08-23: 「全データを一括バックアップ」。GAS版の「スプレッドシート丸ごとコピー」の
    // 代替として、全テーブルをexportSheetDataで順に取得し、1テーブル1CSVとしてZIPにまとめて
    // ダウンロードする（サーバー側の新規実装は不要。既存のgetSheetNames/exportSheetDataを
    // ループで呼ぶだけ）。テーブル数が多い店舗でも1件ずつ順番に取得するので、途中でエラーが
    // 出ても「どのテーブルで失敗したか」が分かるようにしている。
    window.backup = function(){
      var btn = document.getElementById('bkBtn');
      btn.disabled = true; var origTxt = btn.textContent; btn.textContent = I18n.t('bkWorking');
      rpc('getSheetNames', []).then(function(names){
        names = names || [];
        var zip = new JSZip();
        var chain = Promise.resolve();
        names.forEach(function(name){
          chain = chain.then(function(){
            return rpc('exportSheetData', [name]).then(function(d){
              d = d || {};
              if (d.error) { zip.file(name + '.csv', '# error: ' + API.userErrorText(d.error)); return; }
              zip.file(name + '.csv', '﻿' + toCsv(d.rows));
            });
          });
        });
        return chain.then(function(){ return zip.generateAsync({ type: 'blob' }); });
      }).then(function(blob){
        var now = new Date();
        var stamp = now.getFullYear() + pad2(now.getMonth()+1) + pad2(now.getDate()) + '_' + pad2(now.getHours()) + pad2(now.getMinutes());
        var fname = 'izakanpai_backup_' + stamp + '.zip';
        return NativeFileExport.saveOrShare(blob,fname,{title:fname,dialogTitle:I18n.t('nativeShareTitle')}).then(function(result){ exportDone('bkMsg',result,'bkDone'); });
      }).catch(function(e){
        exportFailed('bkMsg',e,'');
      }).finally(function(){
        btn.disabled = false; btn.textContent = origTxt;
      });
    };
    window.exportCsv = function(){
      var name=document.getElementById('sheetSel').value; if(!name) return;
      rpc('exportSheetData',[name]).then(function(d){ d=d||{};
        if(d.error){ alertBox('csvMsg', I18n.t('errPrefix')+API.userErrorText(d.error), false); return; }
        var blob=new Blob(['﻿'+toCsv(d.rows)], {type:'text/csv;charset=utf-8;'});
        var fileName=name+'.csv';
        return NativeFileExport.saveOrShare(blob,fileName,{title:fileName,dialogTitle:I18n.t('nativeShareTitle')}).then(function(result){ exportDone('csvMsg',result,'csvDone'); });
      }).catch(function(e){ exportFailed('csvMsg',e,name+'.csv'); });
    };

    rpc('getSheetNames',[]).then(function(names){ document.getElementById('sheetSel').innerHTML=(names||[]).map(function(n){ return '<option value="'+esc(n)+'">'+esc(n)+'</option>'; }).join(''); })
      .catch(function(e){
        if(String(e.message||e).indexOf('unauthorized')>=0){ location.href='./manage.html'; return; }
        alertBox('csvMsg', I18n.t('errPrefix')+API.userErrorText(e), false);
      });

    I18n.init({
      ja:{ title:'💾 バックアップ / 書き出し', back:'← 管理へ', bkTitle:'📦 全データを一括バックアップ', bkBtn:'📦 全データをZIPでダウンロード', bkWorking:'作成中…', bkDone:'✅ ダウンロードしました:', csvTitle:'📄 シートをCSVで書き出し', csvHint:'シートを選んでCSVをダウンロードできます（Excel等で開けます）。', csvBtn:'⬇ CSVを書き出し', csvDone:'✅ 書き出しました:', nativeShareTitle:'保存 / 共有', nativeShared:'✅ 共有先へ渡しました:', nativeDismissed:'共有画面を閉じました。保存先を選択していない場合は未保存です:', nativeUnavailable:'この端末ではファイルの保存/共有機能を利用できません。アプリを最新版へ更新してください。', errPrefix:'エラー: ' },
      en:{ title:'💾 Backup / Export', back:'← Manage', bkTitle:'📦 Back up all data', bkBtn:'📦 Download all data (ZIP)', bkWorking:'Preparing…', bkDone:'✅ Downloaded:', csvTitle:'📄 Export a sheet to CSV', csvHint:'Pick a sheet and download it as CSV (opens in Excel, etc.).', csvBtn:'⬇ Export CSV', csvDone:'✅ Exported:', nativeShareTitle:'Save / Share', nativeShared:'✅ Sent to the selected share destination:', nativeDismissed:'The share sheet was closed. If you did not choose a destination, the file was not saved:', nativeUnavailable:'File save/share is unavailable on this device. Update the app and try again.', errPrefix:'Error: ' }
    }, function(){});
  </script>

  <script src="./help.js?v=auth2"></script>
  <script>
    HelpUI.register({
      title: 'バックアップ・書き出し',
      titleEn: 'Backup & export',
      items: [
        { ja: '① 「📦 全データをZIPでダウンロード」ボタンを押すと、店舗の全テーブルをそれぞれCSVファイルにして1つのZIPにまとめ、端末にダウンロードします。作成には時間がかかることがあります。', en: '① The "Download all data (ZIP)" button exports every table as a CSV and bundles them all into one ZIP file, downloaded to your device. This can take a while.' },
        { ja: '② 「シートをCSVで書き出し」では、プルダウンから1つのシート（テーブル）を選び、「⬇ CSVを書き出し」を押すとそのシートだけをCSVファイルとしてダウンロードできます（Excel等で開けます）。', en: '② In "Export a sheet to CSV", pick one sheet/table from the dropdown and press "Export CSV" to download just that sheet as a CSV file (opens in Excel, etc).' },
        { ja: '③ ダウンロードが完了すると、それぞれの操作の下に緑色で完了メッセージ（ファイル名）が表示されます。失敗した場合は赤色でエラーが表示されます。', en: '③ After a successful download, a green message with the file name appears below the button. Failures show a red error message instead.' },
        { ja: '④ 「← 管理へ」で管理メニューに戻ります。', en: '④ "← Manage" returns you to the management menu.' }
      ]
    });
  </script>
</body>
</html>
