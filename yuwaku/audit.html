<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Audit log">

  <link rel="manifest" href="./audit.webmanifest">
  <title>Audit log</title>
  <style>
    :root{ --bg:#f6f7f9; --surface:#fff; --border:#e5e7eb; --navy:#0f172a; --text-3:#64748b; --red:#c62828; }
    *{ box-sizing:border-box; }
    body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans JP',sans-serif; background:var(--bg); color:var(--navy); }
    .head{ position:sticky; top:0; z-index:20; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:space-between; padding:12px 16px; }
    .head h1{ font-size:18px; margin:0; font-weight:900; }
    .hbtn{ background:rgba(255,255,255,.14); color:#fff; border:0; border-radius:9px; padding:8px 12px; font-size:13px; font-weight:800; cursor:pointer; text-decoration:none; }
    .wrap{ padding:16px; max-width:960px; margin:0 auto; }
    .card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; }
    /* [iPhone表示対応] min-widthで表全体の最小幅を確保し、外側のoverflow:autoラッパーで横スクロールさせる
       （狭い画面に全列を無理に収めようとして文字が縮小・ズレるのを防ぐ）。 */
    table{ width:100%; min-width:760px; border-collapse:collapse; font-size:13px; }
    th,td{ padding:8px 6px; border-bottom:1px solid var(--border); text-align:left; vertical-align:top; white-space:nowrap; }
    th{ font-size:11px; color:var(--text-3); white-space:nowrap; }
    td.num,th.num{ text-align:right; font-variant-numeric:tabular-nums; }
    .muted{ color:var(--text-3); }
    .badge{ display:inline-block; background:#fee2e2; color:#b91c1c; border-radius:6px; padding:1px 7px; font-size:11px; font-weight:800; }
    .appr{ font-weight:800; }
  </style>
</head>
<body>
  <div class="head"><h1 data-t="title">🧾 監査ログ</h1><div style="display:flex;gap:8px;"><button class="hbtn" data-tlang onclick="I18n.toggle()">EN</button><button class="hbtn" onclick="reload()" data-t="reload">↻ 更新</button><a class="hbtn" href="./manage.html" data-t="back">← 管理へ</a></div></div>
  <div class="wrap">
    <div class="card">
      <div style="font-weight:900;font-size:15px;margin-bottom:4px;" data-t="auditTitle">🧾 会計確定・取消ログ</div>
      <div class="muted" data-t="auditHint" style="font-size:12px;margin-bottom:8px;">会計確定・取消・割引承認など、金額が動く操作の記録です。</div>
      <div style="overflow:auto;">
        <table><thead><tr>
          <th data-t="thTime">日時</th><th data-t="thAction">操作</th><th data-t="thTable">卓</th>
          <th data-t="thDetails">明細</th><th class="num" data-t="thAmount">金額</th>
          <th data-t="thReason">理由</th><th data-t="thApprover">承認者</th>
        </tr></thead>
        <tbody id="rows"><tr><td colspan="7" style="color:#aaa;padding:16px;text-align:center;" data-t="loading">読み込み中…</td></tr></tbody></table>
      </div>
    </div>
    <div class="card" style="margin-top:14px;">
      <div style="font-weight:900;font-size:15px;margin-bottom:8px;" data-t="opTitle">🛡️ 操作ログ</div>
      <div class="muted" data-t="opHint" style="font-size:12px;margin-bottom:8px;">誰が・いつ・どの変更操作を行ったかの記録です。</div>
      <div style="overflow:auto;">
        <table><thead><tr>
          <th data-t="thTime">日時</th><th data-t="opWho">実行者</th><th data-t="opRole">ロール</th><th data-t="opAct">操作</th><th data-t="opSum">概要</th>
        </tr></thead>
        <tbody id="opRows"><tr><td colspan="5" style="color:#aaa;padding:16px;text-align:center;" data-t="loading">読み込み中…</td></tr></tbody></table>
      </div>
    </div>
  </div>

  <script src="./date-display.js?v=auth4" data-iz-date-display></script><script src="./config.js?v=auth2"></script>
  <script src="./api.js?v=auth2"></script>
  <script src="./i18n.js?v=auth3"></script>
  <script>
    var TOKEN = localStorage.getItem(window.APP_CONFIG.AUTH_STORAGE_PREFIX + 'mgmtToken') || '';
    if (!TOKEN) location.href = './manage.html';
    function rpc(fn,args){ return API.post('rpc',{fn:fn,args:args||[],token:TOKEN}).then(function(r){ return r.data; }); }
    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
    var ROWS = [], SYM='₱', __loaded=false;

    // 2026-08-24修正: バックエンドはSQLiteのdatetime('now')でUTC時刻を'YYYY-MM-DD HH:MM:SS'形式
    // （末尾にZ無し）のまま保存・返却している。この形式のままnew Date()に渡すとブラウザによっては
    // 「既にローカル時刻」として解釈してしまい、UTC→ローカル変換が一切行われず表示が数時間ずれる
    // （例: 実際は現地時間の夜でも、記録直後なのに"11時"のような値になる）。ここで明示的にUTCと
    // 分かる形式（Tで区切りZを付与）へ直してから変換することで、この端末のタイムゾーンで正しく表示する。
    function toUtcDate(ts){
      var s = String(ts||'');
      if(s && s.indexOf('Z')===-1 && s.indexOf('+')===-1){ s = s.replace(' ','T')+'Z'; }
      return new Date(s);
    }
    function fmt(ts){ try{ var d=toUtcDate(ts); return window.DateDisplay?DateDisplay.formatDateTime(d.toISOString()):d.toLocaleString(); }catch(e){ return esc(ts); } }
    function render(){
      if(!ROWS.length){ document.getElementById('rows').innerHTML='<tr><td colspan="7" style="color:#aaa;padding:16px;text-align:center;">'+I18n.t('empty')+'</td></tr>'; return; }
      document.getElementById('rows').innerHTML = ROWS.map(function(r){
        return '<tr><td class="muted" style="white-space:nowrap;">'+esc(fmt(r.ts))+'</td>'+
          '<td><span class="badge">'+esc(I18n.systemText(r.action))+'</span></td>'+
          '<td>'+esc(I18n.systemText(r.table))+'</td>'+
          '<td>'+esc(r.details)+'</td>'+
          '<td class="num">'+SYM+(Number(r.price)||0).toLocaleString()+'</td>'+
          '<td>'+esc(r.reason)+'</td>'+
          '<td class="appr">'+esc(r.approver)+(r.role?(' <span class="muted">('+esc(I18n.systemText(r.role))+')</span>'):'')+'</td></tr>';
      }).join('');
    }
    var OPS = [];
    function renderOps(){
      if(!OPS.length){ document.getElementById('opRows').innerHTML='<tr><td colspan="5" style="color:#aaa;padding:16px;text-align:center;">'+I18n.t('empty')+'</td></tr>'; return; }
      document.getElementById('opRows').innerHTML = OPS.map(function(r){
        return '<tr><td class="muted" style="white-space:nowrap;">'+esc(fmt(r.ts))+'</td>'+
          '<td style="font-weight:700;">'+esc(r.actor)+'</td><td class="muted">'+esc(I18n.systemText(r.role))+'</td>'+
          '<td><span class="badge" style="background:#e0e7ff;color:#3730a3;">'+esc(I18n.systemText(r.fn))+'</span></td>'+
          '<td class="muted" style="max-width:360px;overflow:hidden;text-overflow:ellipsis;">'+esc(r.summary)+'</td></tr>';
      }).join('');
    }
    function loadError(target, colspan, e){ document.getElementById(target).innerHTML='<tr><td colspan="'+colspan+'" style="color:#b91c1c;padding:16px;">'+I18n.t('loadErr')+esc(API.userErrorText(e))+'</td></tr>'; }
    function loadOps(){ rpc('getOpLog',[300]).then(function(l){ OPS=l||[]; renderOps(); }).catch(function(e){ loadError('opRows',5,e); }); }
    window.reload = function(){ rpc('getAuditLog',[200]).then(function(l){ ROWS=l||[]; __loaded=true; render(); }).catch(function(e){ loadError('rows',7,e); }); loadOps(); };

    API.post('getSettings', {}).then(function(r){ if(r.data && r.data.currencySymbol) SYM=r.data.currencySymbol; render(); }).catch(function(){});
    rpc('getAuditLog',[200]).then(function(l){ ROWS=l||[]; __loaded=true; render(); })
      .catch(function(e){ if(String(e.message||e).indexOf('unauthorized')>=0){ location.href='./manage.html'; return; } document.getElementById('rows').innerHTML='<tr><td colspan="7" style="color:#b91c1c;padding:16px;">'+I18n.t('loadErr')+esc(API.userErrorText(e))+'</td></tr>'; });
    loadOps();

    I18n.init({
      ja:{ title:'🧾 監査ログ', back:'← 管理へ', reload:'↻ 更新', auditTitle:'🧾 会計確定・取消ログ', auditHint:'会計確定・取消・割引承認など、金額が動く操作の記録です。', thTime:'日時', thAction:'操作', thTable:'卓', thDetails:'明細', thAmount:'金額', thReason:'理由', thApprover:'承認者', loading:'読み込み中…', empty:'記録はありません', loadErr:'読み込みエラー: ', opTitle:'🛡️ 操作ログ', opHint:'誰が・いつ・どの変更操作を行ったかの記録です。', opWho:'実行者', opRole:'ロール', opAct:'操作', opSum:'概要' },
      en:{ title:'🧾 Audit log', back:'← Manage', reload:'↻ Reload', auditTitle:'🧾 Billing (finalize/void) log', auditHint:'Record of money-affecting actions: finalizing bills, voids, discount approvals, etc.', thTime:'Time', thAction:'Action', thTable:'Table', thDetails:'Details', thAmount:'Amount', thReason:'Reason', thApprover:'Approver', loading:'Loading…', empty:'No records', loadErr:'Load error: ', opTitle:'🛡️ Operation log', opHint:'Record of who changed what and when.', opWho:'User', opRole:'Role', opAct:'Action', opSum:'Summary' }
    }, function(){ if(__loaded){ render(); renderOps(); } });
  </script>

  <script src="./help.js?v=auth2"></script>
  <script>
    HelpUI.register({
      title: '監査ログ・操作ログ',
      titleEn: 'Audit log & operation log',
      items: [
        { ja: '① 上の表「会計確定・取消ログ」では、会計確定・取消・割引承認など、金額が動く操作の履歴を日時・卓・明細・金額・理由・承認者つきで確認できます。', en: '① The top table (billing log) shows a history of money-affecting actions — bill finalize, void, discount approval — with time, table, details, amount, reason and approver.' },
        { ja: '② 下の表「操作ログ」では、誰が・いつ・どの機能を使ったか（実行者・ロール・操作名・概要）を確認できます。', en: '② The bottom table (operation log) shows who did what and when — user, role, action name and a short summary.' },
        { ja: '③ 右上の「↻ 更新」ボタンで両方の表を最新の状態に読み込み直せます。', en: '③ The "↻ Reload" button at top right refreshes both tables with the latest records.' },
        { ja: '④ 右上の「EN」ボタンで画面表示を日本語⇔英語に切り替えられます。', en: '④ The "EN" button at top right switches the screen language between Japanese and English.' },
        { ja: '⑤ 「← 管理へ」で管理メニューに戻ります。', en: '⑤ "← Manage" returns you to the management menu.' }
      ]
    });
  </script>
</body>
</html>
