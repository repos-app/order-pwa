<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Birthdays">

  <link rel="manifest" href="./birthdays.webmanifest">
  <title>Birthdays</title>
  <style>
    :root{ --bg:#f6f7f9; --surface:#fff; --border:#e5e7eb; --navy:#0f172a; --text-3:#64748b; }
    *{ box-sizing:border-box; }
    body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans JP',sans-serif; background:var(--bg); color:var(--navy); }
    .head{ position:sticky; top:0; z-index:20; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:space-between; padding:12px 16px; }
    .head h1{ font-size:18px; margin:0; font-weight:900; }
    .hbtn{ background:rgba(255,255,255,.14); color:#fff; border:0; border-radius:9px; padding:8px 12px; font-size:13px; font-weight:800; cursor:pointer; text-decoration:none; }
    .wrap{ padding:16px; max-width:820px; margin:0 auto; }
    .card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; }
    .bar{ display:flex; gap:12px; align-items:flex-end; margin-bottom:12px; flex-wrap:wrap; }
    .fc{ padding:10px; border:1px solid var(--border); border-radius:9px; font-size:15px; font-family:inherit; background:var(--surface); }
    .form-label{ font-size:12px; font-weight:700; display:block; margin-bottom:4px; }
    .muted{ color:var(--text-3); font-size:12px; }
    /* [iPhone表示対応] nowrapで、狭い画面幅に列が無理に収まろうとして文字が縮小・ズレるのを防ぐ。 */
    table{ width:100%; border-collapse:collapse; font-size:13px; }
    th,td{ padding:8px 6px; border-bottom:1px solid var(--border); text-align:left; white-space:nowrap; }
    th{ font-size:11px; color:var(--text-3); }
    .btn-sm{ background:#0f172a; color:#fff; border:0; border-radius:8px; padding:7px 11px; font-weight:800; cursor:pointer; }
    .code{ font-family:monospace; font-weight:800; color:#15803d; }
  </style>
  <link rel="stylesheet" href="./date-controls.css?v=3">
</head>
<body>
  <div class="head"><h1 data-t="title">🎂 誕生日クーポン</h1><div style="display:flex;gap:8px;"><button class="hbtn" data-tlang onclick="I18n.toggle()">EN</button><a class="hbtn" href="./manage.html" data-t="back">← 管理へ</a></div></div>
  <div class="wrap"><div class="card">
    <div class="bar">
      <div><label class="form-label" data-t="month">対象月</label><input id="month" type="month" class="fc"></div>
    </div>
    <div class="muted" data-t="hint" style="margin-bottom:10px;">対象月が誕生月の会員一覧です。「クーポン発行」で当月末まで有効・1回限りのクーポンを作成します。金額は設定 birthdayCouponAmount（既定 ₱100）。</div>
    <div style="overflow:auto;">
      <table><thead><tr><th data-t="thName">氏名</th><th data-t="thPhone">電話</th><th data-t="thBday">誕生日</th><th data-t="thVisits">来店</th><th></th></tr></thead>
      <tbody id="rows"><tr><td colspan="5" class="muted" style="padding:16px;text-align:center;" data-t="loading">読み込み中…</td></tr></tbody></table>
    </div>
  </div></div>

  <script src="./date-display.js?v=auth4" data-iz-date-display></script><script src="./config.js?v=auth2"></script>
  <script src="./api.js?v=auth2"></script>
  <script src="./i18n.js?v=auth3"></script>
  <script src="./confirm.js?v=auth2"></script>
  <script>
    var TOKEN = localStorage.getItem(window.APP_CONFIG.AUTH_STORAGE_PREFIX + 'mgmtToken') || '';
    if (!TOKEN) location.href = './manage.html';
    function rpc(fn,args){ return API.post('rpc',{fn:fn,args:args||[],token:TOKEN}).then(function(r){ return r.data; }); }
    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
    var ROWS=[], ISSUED={}, __loaded=false;

    function render(){
      if(!ROWS.length){ document.getElementById('rows').innerHTML='<tr><td colspan="5" class="muted" style="padding:16px;text-align:center;">'+I18n.t('empty')+'</td></tr>'; return; }
      document.getElementById('rows').innerHTML = ROWS.map(function(r){
        var iss = ISSUED[r.phone];
        var cell = iss ? ('<span class="code">'+esc(iss.code)+'</span> <span class="muted">'+I18n.t('expTil')+' '+esc(window.DateDisplay?DateDisplay.format(iss.expiry||''):(iss.expiry||''))+'</span>')
                       : ('<button class="btn-sm" onclick="issue(\''+esc(r.phone).replace(/'/g,"\\'")+'\')">'+I18n.t('issue')+'</button>');
        return '<tr><td style="font-weight:800;">'+esc(r.name||'-')+'</td><td class="muted">'+esc(r.phone)+'</td><td>'+esc(window.DateDisplay?DateDisplay.format(r.birthday):r.birthday)+'</td><td class="muted">'+r.visits+'</td><td>'+cell+'</td></tr>';
      }).join('');
    }
    window.issue = function(phone){ rpc('issueBirthdayCoupon',[phone]).then(function(d){ d=d||{}; if(d.ok){ ISSUED[phone]=d; render(); } else { UIAlert(I18n.t('errPrefix')+API.userErrorText(d.error||'error')); } }).catch(function(e){ UIAlert(I18n.t('errPrefix')+API.userErrorText(e)); }); };
    function load(){ var mo=document.getElementById('month').value; rpc('getBirthdayMembers',[mo]).then(function(l){ ROWS=l||[]; render(); }).catch(function(e){ if(String(e.message||e).indexOf('unauthorized')>=0){ location.href='./manage.html'; return; } document.getElementById('rows').innerHTML='<tr><td colspan="5" style="color:#b91c1c;padding:16px;">'+I18n.t('loadErr')+esc(API.userErrorText(e))+'</td></tr>'; }); }
    // 2026-08-24修正: toISOString()はUTC基準のため、フィリピン時間で月初の午前0〜8時頃に開くと
    // 前月が選択されてしまう不具合があった（profit_sim.htmlで先に見つけて修正済みだった同じ問題を
    // 横展開）。ローカル時間（店舗のタイムゾーン）で当月を決める。
    API.initStoreDateInputs([{id:'month',kind:'month'}], function(){ ISSUED={}; load(); });
    document.getElementById('month').addEventListener('change', function(){ ISSUED={}; load(); });

    __loaded=true; load();
    I18n.init({
      ja:{ title:'🎂 誕生日クーポン', back:'← 管理へ', month:'対象月', hint:'対象月が誕生月の会員一覧です。「クーポン発行」で当月末まで有効・1回限りのクーポンを作成します。金額は設定 birthdayCouponAmount（既定 ₱100）。', thName:'氏名', thPhone:'電話', thBday:'誕生日', thVisits:'来店', issue:'クーポン発行', expTil:'〜', loading:'読み込み中…', empty:'対象の会員はいません', errPrefix:'エラー: ', loadErr:'読み込みエラー: ' },
      en:{ title:'🎂 Birthday coupons', back:'← Manage', month:'Target month', hint:'Members whose birthday is in the selected month. “Issue coupon” creates a one-time coupon valid until month end. Amount = setting birthdayCouponAmount (default ₱100).', thName:'Name', thPhone:'Phone', thBday:'Birthday', thVisits:'Visits', issue:'Issue coupon', expTil:'until', loading:'Loading…', empty:'No matching members', errPrefix:'Error: ', loadErr:'Load error: ' }
    }, function(){ if(__loaded) render(); });
  </script>

  <script src="./help.js?v=auth2"></script>
  <script>
    HelpUI.register({
      title: '誕生日クーポン発行',
      titleEn: 'Birthday coupons',
      items: [
        { ja: '① 上部の「対象月」で月を選ぶと、その月が誕生月の会員が一覧表示されます（初期表示は今月）。', en: '① Pick a month in “Target month” at the top to list members whose birthday falls in that month (defaults to the current month).' },
        { ja: '② 一覧には氏名・電話番号・誕生日・来店回数が表示されます。', en: '② Each row shows the member’s name, phone number, birthday, and number of visits.' },
        { ja: '③ 「クーポン発行」ボタンを押すと、その会員向けに当月末まで有効・1回限りのクーポンが発行されます。', en: '③ Tap “Issue coupon” to create a one-time coupon for that member, valid until the end of the selected month.' },
        { ja: '④ クーポン金額は店舗設定（birthdayCouponAmount、既定 ₱100）で決まります。', en: '④ The coupon amount is determined by the store setting birthdayCouponAmount (default ₱100).' },
        { ja: '⑤ 発行済みの会員には発行したクーポンコードと有効期限が表示され、二重発行はされません。', en: '⑤ Once issued, the coupon code and expiry date are shown for that member, preventing duplicate issuance.' },
        { ja: '⑥ 月を切り替えると発行状況の表示はリセットされ、最新の対象月で再取得します。', en: '⑥ Switching the month resets the issued-status display and reloads the list for the newly selected month.' }
      ]
    });
  </script>
</body>
</html>
