<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Inventory">

  <link rel="manifest" href="./inventory.webmanifest">
  <title>Inventory</title>
  <style>
    :root{ --bg:#f6f7f9; --surface:#fff; --border:#e5e7eb; --navy:#0f172a; --text-3:#64748b; --red:#c62828; }
    *{ box-sizing:border-box; }
    body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans JP',sans-serif; background:var(--bg); color:var(--navy); }
    .head{ position:sticky; top:0; z-index:20; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:space-between; padding:12px 16px; }
    .head h1{ font-size:18px; margin:0; font-weight:900; }
    .hbtn{ background:rgba(255,255,255,.14); color:#fff; border:0; border-radius:9px; padding:8px 12px; font-size:13px; font-weight:800; cursor:pointer; text-decoration:none; white-space:nowrap; }
    .wrap{ padding:16px; max-width:900px; margin:0 auto; }
    .card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; }
    .hint{ color:var(--text-3); font-size:13px; line-height:1.7; margin-bottom:12px; }
    table{ width:100%; min-width:880px; border-collapse:collapse; font-size:13px; }
    th,td{ padding:8px 6px; border-bottom:1px solid var(--border); text-align:left; }
    th{ font-size:11px; color:var(--text-3); white-space:nowrap; }
    input{ width:100%; padding:8px; border:1px solid var(--border); border-radius:8px; font-size:14px; font-family:inherit; background:var(--surface); }
    .low td{ background:#fff4f4; }
    .btn{ border:0; border-radius:11px; padding:13px; font-size:15px; font-weight:900; cursor:pointer; font-family:inherit; }
    .btn-sec{ background:#eef2f7; color:var(--navy); width:100%; margin-top:10px; }
    .btn-pri{ background:var(--navy); color:#fff; width:100%; margin-top:10px; }
    .btn-sm{ background:#eef2f7; color:var(--navy); padding:8px 10px; border-radius:8px; font-weight:800; border:0; cursor:pointer; }
    .alert{ margin-top:10px; display:none; padding:11px; border-radius:9px; font-size:14px; font-weight:700; }
  </style>
</head>
<body>
  <div class="head"><h1 data-t="title">📦 在庫管理</h1><div style="display:flex;gap:8px;"><button class="hbtn" data-tlang onclick="I18n.toggle()">EN</button><a class="hbtn" href="./moves.html" data-t="movesLink">📋 履歴</a><a class="hbtn" href="./manage.html" data-t="back">← 管理へ</a></div></div>
  <div class="wrap"><div class="card">
    <div class="hint" data-t="hint">ドリンク・食材・備品などをまとめて数量管理できます。最小在庫を下回ると赤く表示され、日報・レポートに低在庫として通知。レシピ（材料名一致）で注文時に自動減算されます。</div>
    <div class="hint" data-t="scrollHint" style="margin:-6px 0 8px;font-size:11px;">👉 表は横にスクロールできます</div>
    <div style="overflow-x:auto;-webkit-overflow-scrolling:touch;">
      <table><thead><tr>
        <th style="min-width:130px;" data-t="thName">商品名</th>
        <th style="min-width:100px;" data-t="thCat">カテゴリ</th>
        <th style="min-width:100px;" data-t="thSupplier">仕入先</th>
        <th style="width:88px;" data-t="thUnit">単位</th>
        <th style="width:84px;" data-t="thStock">在庫数</th>
        <th style="width:92px;" data-t="thMin">最小在庫</th>
        <th style="width:110px;" data-t="thCost">原価</th>
        <th style="width:150px;"></th>
      </tr></thead>
      <tbody id="rows"><tr><td colspan="8" style="color:#aaa;padding:16px;text-align:center;" data-t="loading">読み込み中…</td></tr></tbody></table>
    </div>
    <button class="btn btn-sec" onclick="addRow()" data-t="addRow">＋ 行を追加</button>
    <button class="btn btn-sec" onclick="openAiScan()" data-t="aiScanBtn">🤖 AIスキャン</button>
    <button class="btn btn-sec" onclick="openLinkPicker(-1)" data-t="linkFromMenuBtn">🔗 メニューから追加</button>
    <button class="btn btn-pri" id="saveBtn" onclick="save()" data-t="save">💾 保存</button>
    <div class="alert" id="msg"></div>
  </div></div>

  <!-- Stock movement modal -->
  <div id="moveOv" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:50;align-items:center;justify-content:center;">
    <div style="background:#fff;border-radius:16px;padding:20px;max-width:340px;width:calc(100% - 32px);">
      <div style="font-weight:900;font-size:16px;margin-bottom:4px;" id="mvItem"></div>
      <div class="hint" id="mvStockNow" style="margin-bottom:10px;"></div>
      <div style="display:flex;gap:6px;margin-bottom:12px;">
        <button class="btn-sm mv-tab" data-k="in" onclick="mvTab('in')" id="mvTabIn">＋ 入荷</button>
        <button class="btn-sm mv-tab" data-k="waste" onclick="mvTab('waste')" id="mvTabWaste">− 廃棄</button>
        <button class="btn-sm mv-tab" data-k="count" onclick="mvTab('count')" id="mvTabCount">棚卸</button>
      </div>
      <div class="fg" style="margin-bottom:8px;"><label class="form-label" id="mvQtyL" style="font-size:12px;font-weight:700;display:block;margin-bottom:4px;">数量</label>
        <div style="display:flex;gap:8px;"><input id="mvQty" type="number" step="any" min="0" style="flex:1;"><button type="button" class="btn-sm" id="camBtn" style="background:#0f172a;color:#fff;padding:8px 12px;" onclick="camOpen()">📷</button></div>
      </div>
      <div class="fg" id="mvCostWrap" style="margin-bottom:8px;"><label class="form-label" id="mvCostL" style="font-size:12px;font-weight:700;display:block;margin-bottom:4px;">原価（任意・単価更新）</label><input id="mvCost" type="number" step="any" min="0"></div>
      <div class="fg" id="mvReasonWrap" style="margin-bottom:8px;display:none;"><label class="form-label" id="mvReasonL" style="font-size:12px;font-weight:700;display:block;margin-bottom:4px;">理由</label><input id="mvReason"></div>
      <div class="alert" id="mvAlert" style="display:none;"></div>
      <button class="btn btn-pri" style="margin-top:6px;" id="mvGo" onclick="doMove()">実行</button>
      <button class="btn btn-sec" id="mvCxl" onclick="closeMove()">閉じる</button>
    </div>
  </div>

  <!-- Camera tap-to-count -->
  <div id="camOv" style="display:none;position:fixed;inset:0;background:#000;z-index:60;flex-direction:column;">
    <div id="camHint" style="color:#fff;text-align:center;font-size:13px;padding:8px;background:#111;"></div>
    <div style="flex:1;position:relative;overflow:hidden;">
      <video id="camVid" autoplay playsinline muted style="width:100%;height:100%;object-fit:contain;background:#000;"></video>
      <canvas id="camCan" style="position:absolute;inset:0;width:100%;height:100%;display:none;touch-action:none;"></canvas>
      <div id="camCount" style="position:absolute;top:10px;left:10px;background:rgba(15,23,42,.75);color:#fff;padding:6px 14px;border-radius:12px;font-weight:900;font-size:20px;">0</div>
    </div>
    <div style="display:flex;gap:8px;padding:12px;background:#111;">
      <button class="btn btn-pri" id="camShotBtn" onclick="camShot()" style="flex:2;">📸</button>
      <button class="btn btn-sec" id="camUndoBtn" onclick="camUndo()" style="flex:1;">↩</button>
      <button class="btn" id="camDoneBtn" onclick="camDone()" style="flex:2;background:#16a34a;color:#fff;">✓</button>
      <button class="btn btn-sec" onclick="camClose()" style="flex:1;">✕</button>
    </div>
  </div>

  <!-- AI stocktake scan -->
  <div id="aiOv" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:55;align-items:center;justify-content:center;">
    <div style="background:#fff;border-radius:16px;padding:20px;max-width:420px;width:calc(100% - 32px);max-height:88vh;overflow:auto;">
      <div style="font-weight:900;font-size:16px;margin-bottom:12px;" data-t="aiTitle">🤖 AI在庫スキャン</div>
      <div id="aiPhotoArea" style="width:100%;padding-top:56%;position:relative;background:#0f172a;border-radius:12px;overflow:hidden;cursor:pointer;margin-bottom:12px;" onclick="document.getElementById('aiInput').click()">
        <img id="aiPreview" src="" style="display:none;position:absolute;inset:0;width:100%;height:100%;object-fit:cover;">
        <div id="aiPlaceholder" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:rgba(255,255,255,.6);">
          <div style="font-size:40px;">📷</div>
          <div style="font-size:13px;font-weight:700;margin-top:6px;" data-t="aiTapText">タップして撮影</div>
        </div>
      </div>
      <input type="file" id="aiInput" accept="image/*" capture="environment" style="display:none;" onchange="onAiPhotoSelected(event)">
      <button class="btn btn-pri" id="aiAnalyzeBtn" style="display:none;" onclick="analyzeAiPhoto()" data-t="aiAnalyzeBtn">🤖 AI分析開始</button>
      <div class="hint" style="margin-top:8px;" data-t="aiManualHint">AIを利用できない場合も、閉じて在庫表を手動で入力・保存できます。</div>
      <div id="aiResultWrap" style="display:none;margin-top:12px;">
        <div style="font-size:12px;font-weight:800;color:var(--text-3);margin-bottom:2px;" data-t="aiResultTitle">AI検出結果 — 商品名・数量は自由に編集できます</div>
        <div style="font-size:11px;color:var(--text-3);margin-bottom:8px;" data-t="aiResultHint">商品名は直接書き換えできます。下のプルダウンから既存の在庫を選ぶと自動で入力されます。✕で1件だけ除外できます。</div>
        <div id="aiResultList"></div>
        <button class="btn btn-pri" style="margin-top:8px;" onclick="applyAiResults()" data-t="aiApplyBtn">✅ 在庫に反映</button>
      </div>
      <div class="alert" id="aiAlert" style="display:none;margin-top:10px;"></div>
      <button class="btn btn-sec" style="margin-top:10px;" onclick="closeAiScan()" data-t="mvClose">閉じる</button>
    </div>
  </div>

  <!-- Link inventory item to a menu item -->
  <div id="linkOv" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:56;align-items:center;justify-content:center;">
    <div style="background:#fff;border-radius:16px;padding:20px;max-width:380px;width:calc(100% - 32px);">
      <div id="linkModalTitle" style="font-weight:900;font-size:15px;margin-bottom:4px;"></div>
      <div class="hint" id="linkModalHint" style="margin-bottom:10px;"></div>
      <select id="linkMenuSel" class="fc" style="margin-bottom:14px;"></select>
      <div class="alert" id="linkAlert" style="display:none;margin-bottom:10px;"></div>
      <button class="btn btn-pri" onclick="confirmLink()" data-t="linkConfirmBtn">🔗 リンク</button>
      <button class="btn btn-sec" style="margin-top:8px;" onclick="closeLinkPicker()" data-t="mvClose">閉じる</button>
    </div>
  </div>

  <script src="./config.js?v=auth2"></script>
  <script src="./api.js?v=auth2"></script>
  <script src="./i18n.js?v=auth3"></script>
  <script>
    var TOKEN = localStorage.getItem(window.APP_CONFIG.AUTH_STORAGE_PREFIX + 'mgmtToken') || '';
    if (!TOKEN) location.href = './manage.html';
    function rpc(fn,args,opts){ return API.post('rpc',Object.assign({fn:fn,args:args||[],token:TOKEN},opts||{})).then(function(r){ return r.data; }); }
    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
    // 言語切替の一元ヘルパー。商品名・カテゴリ等、日本語/英語を出し分ける箇所は必ずこれを通すこと
    // （新しいUI要素・候補リストを追加するたびに毎回このチェックを忘れないための共通実装）。
    function isEN(){ return !!(window.I18n && I18n.lang && I18n.lang()==='en'); }
    function loc(ja, en){ ja=(ja||'').trim(); en=(en||'').trim(); return isEN() ? (en || ja) : (ja || en); }
    window.rows = [];

    function render(){
      var html = '';
      var EN = (window.I18n && I18n.lang && I18n.lang()==='en');
      window.rows.forEach(function(r,i){
        var low = (Number(r.minimum)>0 && Number(r.stock)<=Number(r.minimum));
        var nameJa = (r.nameJa!==undefined ? r.nameJa : (r.name||''));
        var categoryJa = (r.categoryJa!==undefined ? r.categoryJa : (r.category||''));
        var nmVal = EN ? (r.nameEn||'') : nameJa;
        var catVal = EN ? (r.categoryEn||'') : categoryJa;
        var nmPh = EN ? (nameJa||r.name||'') : (r.nameEn||r.name||'');
        var catPh = EN ? (categoryJa||r.category||'') : (r.categoryEn||r.category||'');
        var nmT = EN ? 'nameEn' : 'nameJa';
        var catT = EN ? 'categoryEn' : 'categoryJa';
        var supObj = SUPPLIER_OPTIONS.find(function(s){return s.key===String(r.supplier||'');});
        var supVal = supObj ? loc(supObj.ja,supObj.en) : (r.supplier||'');
        html += '<tr'+(low?' class="low"':'')+'>'+
          '<td><input value="'+esc(nmVal)+'" placeholder="'+esc(nmPh)+'" oninput="window.rows['+i+'].'+nmT+'=this.value"></td>'+
          '<td><input value="'+esc(catVal)+'" placeholder="'+esc(catPh)+'" oninput="window.rows['+i+'].'+catT+'=this.value" list="catList"></td>'+
          '<td><input value="'+esc(supVal)+'" oninput="setSupplierInput('+i+',this.value)" list="supList"></td>'+
          '<td><input value="'+esc(r.unit||'本')+'" oninput="window.rows['+i+'].unit=this.value"></td>'+
          '<td><input type="number" step="any" value="'+(r.stock||0)+'" oninput="window.rows['+i+'].stock=Number(this.value)||0"></td>'+
          '<td><input type="number" step="any" value="'+(r.minimum||0)+'" oninput="window.rows['+i+'].minimum=Number(this.value)||0"></td>'+
          '<td><input type="number" step="any" value="'+(r.cost||0)+'" oninput="window.rows['+i+'].cost=Number(this.value)||0"></td>'+
          (function(){
            var linkedMenus = MENU_ALL.filter(function(m){ return m['在庫紐づけ']===r.name; }).map(function(m){ return loc(m['商品名_JA']!==undefined?m['商品名_JA']:m['商品名'], m['商品名_EN']); });
            var linkLabel = linkedMenus.length ? '🔗✓' : '🔗';
            var linkTitle = linkedMenus.length ? (I18n.t('linkedWith')+linkedMenus.join('、')) : I18n.t('linkBtnTitle');
            return '<td style="white-space:nowrap;"><button class="btn-sm" style="background:#dcfce7;color:#15803d;" onclick="openMove('+i+')">'+I18n.t('moveBtn')+'</button> '+
              '<button class="btn-sm" style="background:#eff6ff;color:#2563eb;" onclick="openLinkPicker('+i+')" title="'+esc(linkTitle)+'">'+linkLabel+'</button> '+
              '<button class="btn-sm" onclick="delRow('+i+')">🗑</button></td></tr>';
          })();
      });
      if (!window.rows.length) html = '<tr><td colspan="8" style="color:#aaa;padding:16px;text-align:center;">'+I18n.t('empty')+'</td></tr>';
      document.getElementById('rows').innerHTML = html;
      // カテゴリ候補（既存値。英語モードでは英語カテゴリ名を候補に出す＝表示中の言語と必ず一致させる）
      var cats = []; window.rows.forEach(function(r){ var c=loc(r.categoryJa!==undefined?r.categoryJa:r.category, r.categoryEn).trim(); if(c && cats.indexOf(c)<0) cats.push(c); });
      var dl = document.getElementById('catList'); if(dl) dl.innerHTML = cats.map(function(c){ return '<option value="'+esc(c)+'">'; }).join('');
      // 仕入先候補（既存値＋マスタ）
      var supLabels = SUPPLIER_OPTIONS.map(function(s){return loc(s.ja,s.en);});
      window.rows.forEach(function(r){ var s=(r.supplier||'').trim(); if(s&&!SUPPLIER_OPTIONS.some(function(x){return x.key===s;})&&supLabels.indexOf(s)<0)supLabels.push(s); });
      var sl = document.getElementById('supList'); if(sl) sl.innerHTML = supLabels.map(function(s){ return '<option value="'+esc(s)+'">'; }).join('');
    }
    var SUPPLIER_OPTIONS = [];
    window.setSupplierInput=function(i,value){var raw=String(value||'').trim();var found=SUPPLIER_OPTIONS.find(function(s){return raw===s.key||raw===loc(s.ja,s.en);});window.rows[i].supplier=found?found.key:raw;};
    var MENU_ALL = [];
    window.addRow = function(){ window.rows.push({ name:'', nameJa:'', nameEn:'', category:'', categoryJa:'', categoryEn:'', supplier:'', unit:'本', stock:0, minimum:0, cost:0 }); render(); };
    window.delRow = function(i){ window.rows.splice(i,1); render(); };
    window.save = function(){
      var clean = window.rows.filter(function(r){ return ((r.nameJa||'')+(r.nameEn||'')+(r.name||'')).trim(); })
        .map(function(r){ var x=Object.assign({},r); var ja=(x.nameJa!==undefined?x.nameJa:x.name||'').trim(), en=(x.nameEn||'').trim(); var cja=(x.categoryJa!==undefined?x.categoryJa:x.category||'').trim(), cen=(x.categoryEn||'').trim(); x.nameJa=ja; x.nameEn=en; x.name=ja||en; x.categoryJa=cja; x.categoryEn=cen; x.category=cja||cen; return x; });
      var btn = document.getElementById('saveBtn'); btn.disabled=true;
      rpc('saveDrinkInventory',[clean]).then(function(r){
        if(!r||r.success!==true) throw new Error((r&&r.error)||'save_failed');
        return rpc('getDrinkInventory',[]);
      }).then(function(list){
        window.rows=(list||[]).slice(); render(); btn.disabled=false; msg(I18n.t('saved'), true);
      }).catch(function(e){ btn.disabled=false; msg(I18n.t('errPrefix')+API.userErrorText(e), false); });
    };
    function msg(text, ok){ var m=document.getElementById('msg'); m.style.display='block'; m.style.background=ok?'#dcfce7':'#fee2e2'; m.style.color=ok?'#15803d':'#b91c1c'; m.innerText=text; }
    // [性能改善] 一覧の読込では翻訳しない（読込を遅くしないため）。未翻訳分はここで明示的にまとめて翻訳する。
    // ── 在庫変動（入荷・廃棄・棚卸） ──
    var mvIdx = -1, mvKind = 'in', mvRequestId = '', mvRequestSignature = '';
    function nextMoveRequestId(){ return 'move-' + Date.now() + '-' + Math.random().toString(36).slice(2,10); }
    function resetMoveRequestId(){ mvRequestId=''; mvRequestSignature=''; }
    window.openMove = function(i){
      var r = window.rows[i]; if(!r) return;
      if(!(r.name||r.nameJa||r.nameEn||'').trim()){ msg(I18n.t('mvNeedSave'), false); return; }
      resetMoveRequestId();
      mvIdx = i;
      document.getElementById('mvItem').innerText = loc(r.nameJa!==undefined?r.nameJa:r.name, r.nameEn);
      document.getElementById('mvStockNow').innerText = I18n.t('mvStockNow')+': '+(Number(r.stock)||0)+' '+(r.unit||'');
      document.getElementById('mvTabIn').innerText = I18n.t('mvIn');
      document.getElementById('mvTabWaste').innerText = I18n.t('mvWaste');
      document.getElementById('mvTabCount').innerText = I18n.t('mvCount');
      document.getElementById('mvGo').innerText = I18n.t('mvGo');
      document.getElementById('mvCxl').innerText = I18n.t('mvClose');
      document.getElementById('mvCostL').innerText = I18n.t('mvCostL');
      document.getElementById('mvReasonL').innerText = I18n.t('mvReasonL');
      document.getElementById('mvQty').value=''; document.getElementById('mvCost').value=''; document.getElementById('mvReason').value='';
      document.getElementById('mvAlert').style.display='none';
      mvTab('in');
      document.getElementById('moveOv').style.display='flex';
    };
    window.mvTab = function(k){
      mvKind = k;
      Array.prototype.forEach.call(document.querySelectorAll('.mv-tab'), function(b){ var on=b.getAttribute('data-k')===k; b.style.background=on?'#0f172a':'#eef2f7'; b.style.color=on?'#fff':'#0f172a'; });
      document.getElementById('mvCostWrap').style.display = (k==='in')?'block':'none';
      document.getElementById('mvReasonWrap').style.display = (k==='waste')?'block':'none';
      document.getElementById('mvQtyL').innerText = (k==='count') ? I18n.t('mvCounted') : I18n.t('mvQty');
    };
    window.closeMove = function(){ document.getElementById('moveOv').style.display='none'; mvIdx=-1; };
    function mvErr(m){ var a=document.getElementById('mvAlert'); a.style.display='block'; a.style.background='#fee2e2'; a.style.color='#b91c1c'; a.innerText=m; }
    window.doMove = function(){
      var r = window.rows[mvIdx]; if(!r) return;
      var qty = Number(document.getElementById('mvQty').value);
      if(!isFinite(qty) || qty<0){ mvErr(I18n.t('mvBad')); return; }
      var go = document.getElementById('mvGo'); go.disabled=true;
      var p, cost=Number(document.getElementById('mvCost').value)||0, reason=document.getElementById('mvReason').value;
      var sig=JSON.stringify([mvKind,r.name,qty,cost,reason]);
      if(!mvRequestId || mvRequestSignature!==sig){ mvRequestId=nextMoveRequestId(); mvRequestSignature=sig; }
      if(mvKind==='in'){ p = rpc('receiveStock',[r.name, qty, cost, mvRequestId]); }
      else if(mvKind==='waste'){ p = rpc('logWaste',[r.name, qty, reason, mvRequestId]); }
      else { p = rpc('stocktake',[r.name, qty, mvRequestId]); }
      p.then(function(d){
        go.disabled=false; d=d||{};
        if(d.error==='not_found'){ resetMoveRequestId(); mvErr(I18n.t('mvNeedSave')); return; }
        if(d.error){ resetMoveRequestId(); mvErr(I18n.t('errPrefix')+API.userErrorText(d.error)); return; }
        resetMoveRequestId();
        closeMove(); msg(I18n.t('mvDone'), true);
        rpc('getDrinkInventory',[]).then(function(list){ window.rows=(list||[]).slice(); render(); })
          .catch(function(e){ document.getElementById('rows').innerHTML='<tr><td colspan="9" style="color:#b91c1c;padding:16px;">'+I18n.t('loadErr')+esc(API.userErrorText(e))+'</td></tr>'; });
      }).catch(function(e){ go.disabled=false; mvErr(I18n.t('errPrefix')+API.userErrorText(e)); });
    };

    // ── カメラでタップ計数（棚卸補助） ──
    var camStream=null, camDots=[], camFrozen=false, camBase=null;
    window.camOpen=function(){
      camDots=[]; camFrozen=false; camBase=null;
      document.getElementById('camCount').innerText='0';
      var can=document.getElementById('camCan'), vid=document.getElementById('camVid');
      can.style.display='none'; vid.style.display='';
      document.getElementById('camHint').innerText=I18n.t('camHintShoot');
      document.getElementById('camOv').style.display='flex';
      if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){ document.getElementById('camHint').innerText=I18n.t('camNoCam'); return; }
      navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:'environment' } }, audio:false })
        .then(function(s){ camStream=s; vid.srcObject=s; })
        .catch(function(){ document.getElementById('camHint').innerText=I18n.t('camNoCam'); });
    };
    function camStop(){ if(camStream){ camStream.getTracks().forEach(function(t){ t.stop(); }); camStream=null; } }
    window.camClose=function(){ camStop(); document.getElementById('camOv').style.display='none'; };
    window.camShot=function(){
      var v=document.getElementById('camVid'), can=document.getElementById('camCan');
      var w=v.videoWidth||640, h=v.videoHeight||480; can.width=w; can.height=h;
      var ctx=can.getContext('2d'); ctx.drawImage(v,0,0,w,h);
      camBase=ctx.getImageData(0,0,w,h);
      v.style.display='none'; can.style.display='block'; camStop(); camFrozen=true; camDots=[];
      document.getElementById('camHint').innerText=I18n.t('camHintTap'); camRedraw();
    };
    function camRedraw(){
      var can=document.getElementById('camCan'); if(!camBase) return; var ctx=can.getContext('2d');
      ctx.putImageData(camBase,0,0);
      var r=Math.max(9, can.width*0.014), fs=Math.max(12, can.width*0.024);
      camDots.forEach(function(d,i){
        ctx.beginPath(); ctx.arc(d.x,d.y,r,0,Math.PI*2); ctx.fillStyle='rgba(22,163,74,.85)'; ctx.fill();
        ctx.fillStyle='#fff'; ctx.font='bold '+fs+'px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(String(i+1), d.x, d.y);
      });
      document.getElementById('camCount').innerText=String(camDots.length);
    }
    window.camUndo=function(){ if(camDots.length){ camDots.pop(); camRedraw(); } };
    window.camDone=function(){ var q=document.getElementById('mvQty'); q.value=camDots.length; camClose(); };
    (function(){ var can=document.getElementById('camCan'); if(!can) return;
      can.addEventListener('click', function(e){
        if(!camFrozen) return; var rect=can.getBoundingClientRect();
        var scale=Math.min(rect.width/can.width, rect.height/can.height);
        var dispW=can.width*scale, dispH=can.height*scale;
        var offX=(rect.width-dispW)/2, offY=(rect.height-dispH)/2;
        var x=(e.clientX-rect.left-offX)/scale, y=(e.clientY-rect.top-offY)/scale;
        if(x<0||y<0||x>can.width||y>can.height) return;
        camDots.push({x:x,y:y}); camRedraw();
      });
    })();

    // ── AIスキャン（写真から複数商品の在庫数をまとめてAI判定・一括反映） ──
    var aiFile=null, aiCounts=null, aiKeys=null, aiRequestId='';
    function nextAiRequestId(){ try{return crypto.randomUUID();}catch(e){return Date.now()+'-'+Math.random().toString(16).slice(2);} }
    window.openAiScan = function(){
      aiFile=null; aiCounts=null; aiKeys=null; aiRequestId='';
      document.getElementById('aiPreview').style.display='none';
      document.getElementById('aiPreview').src='';
      document.getElementById('aiPlaceholder').style.display='block';
      document.getElementById('aiAnalyzeBtn').style.display='none';
      document.getElementById('aiResultWrap').style.display='none';
      document.getElementById('aiAlert').style.display='none';
      document.getElementById('aiOv').style.display='flex';
    };
    window.closeAiScan = function(){ document.getElementById('aiOv').style.display='none'; };
    function aiErr(m){ var a=document.getElementById('aiAlert'); a.style.display='block'; a.style.background='#fee2e2'; a.style.color='#b91c1c'; a.innerText=m; }
    window.onAiPhotoSelected = function(e){
      var file = e.target.files && e.target.files[0]; if(!file) return;
      aiFile = file;
      aiRequestId = nextAiRequestId();
      var preview=document.getElementById('aiPreview'), url=URL.createObjectURL(file);
      preview.onload=function(){ URL.revokeObjectURL(url); };
      preview.onerror=function(){ URL.revokeObjectURL(url); aiErr(I18n.t('errPrefix')+'file_read_failed'); };
      preview.src = url;
      preview.style.display='block';
      document.getElementById('aiPlaceholder').style.display='none';
      document.getElementById('aiAnalyzeBtn').style.display='block';
      document.getElementById('aiResultWrap').style.display='none';
      document.getElementById('aiAlert').style.display='none';
    };
    function aiResizeImage(file, maxW, maxH, quality, cb, errCb){
      API.readFileAsDataURL(file).then(function(dataUrl){
        var img = new Image();
        img.onload = function(){
          var ratio = Math.min(maxW/img.width, maxH/img.height, 1);
          var can = document.createElement('canvas');
          can.width = Math.round(img.width*ratio); can.height = Math.round(img.height*ratio);
          can.getContext('2d').drawImage(img,0,0,can.width,can.height);
          var url = can.toDataURL('image/jpeg', quality);
          cb(url.split(',')[1], 'image/jpeg');
        };
        img.onerror = function(){ if(errCb) errCb(new Error('image_decode_failed')); };
        img.src = dataUrl;
      }).catch(function(e){ if(errCb) errCb(e); });
    }
    window.analyzeAiPhoto = function(){
      if(!aiFile) return;
      var btn = document.getElementById('aiAnalyzeBtn'); btn.disabled=true; btn.innerText=I18n.t('aiAnalyzing');
      document.getElementById('aiAlert').style.display='none';
      aiResizeImage(aiFile, 1024, 768, 0.75, function(b64, mime){
        // [P4] システムAI応答待ちの間、
        // 全画面のローディング表示で他操作までブロックしないようにする。ボタン自体は既にローカルの
        // 「解析中」busy表示になっているため、二重ブロックを避ける。
        // [タイムアウト共通化(2026-08-22)] 個別のマジックナンバーではなくapi.jsの共通設定
        // （API.TIMEOUT_MS.ai=45秒）を参照する。外部AI呼び出しは他の処理より大きく余裕を持たせている。
        rpc('countDrinksWithAI',[b64, mime, aiRequestId],{__silent:true,__timeoutMs:API.TIMEOUT_MS.ai,__noInternalRetry:true}).then(function(res){
          btn.disabled=false; btn.innerText=I18n.t('aiAnalyzeBtn');
          res = res || {};
          if(res.error){ aiErr(I18n.t('aiUnavailable')); return; }
          renderAiResults(res.counts || res.raw || {});
        }).catch(function(){ btn.disabled=false; btn.innerText=I18n.t('aiAnalyzeBtn'); aiErr(I18n.t('aiUnavailable')); });
      }, function(e){ btn.disabled=false; btn.innerText=I18n.t('aiAnalyzeBtn'); aiErr(I18n.t('errPrefix')+API.userErrorText(e)); });
    };
    function renderAiResults(countsOrRaw){
      var listEl = document.getElementById('aiResultList');
      if (typeof countsOrRaw === 'string'){
        listEl.innerHTML = '<div style="white-space:pre-wrap;font-size:13px;color:var(--text-3);">'+esc(countsOrRaw)+'</div>';
        document.getElementById('aiResultWrap').style.display='block';
        aiKeys=null;
        return;
      }
      var names = window.rows.map(function(r){ return r.name; });
      var keys = Object.keys(countsOrRaw);
      if(!keys.length){
        listEl.innerHTML='<div style="padding:14px;text-align:center;color:var(--text-3);">'+I18n.t('aiNoDetect')+'</div>';
        document.getElementById('aiResultWrap').style.display='block';
        aiKeys=null;
        return;
      }
      var pickOpts = '<option value="">'+esc(I18n.t('aiPickPh'))+'</option>'+
        names.map(function(n){ return n ? '<option value="'+esc(n)+'">'+esc(n)+'</option>' : ''; }).join('');
      var html='';
      keys.forEach(function(key,ki){
        var qty = countsOrRaw[key];
        // AIが検出した名前に近い既存アイテムがあれば初期値として提案（完全一致は稀なため、あくまで下書き。自由に書き換え可）
        var bestMatch=''; names.forEach(function(n){ if(n && (n.indexOf(key)>=0 || key.indexOf(n)>=0)) bestMatch=n; });
        html += '<div style="padding:8px 0;border-bottom:1px solid var(--border);">'+
          '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">'+
            '<input type="text" id="ai-name-'+ki+'" value="'+esc(bestMatch||key)+'" style="flex:1;min-width:0;padding:7px 8px;border:1px solid var(--border);border-radius:7px;font-size:13px;font-weight:700;">'+
            '<input type="number" id="ai-qty-'+ki+'" value="'+esc(qty)+'" min="0" step="any" style="width:58px;padding:7px 4px;border:1px solid var(--border);border-radius:7px;font-size:13px;font-weight:900;text-align:right;">'+
            '<button type="button" onclick="var el=document.getElementById(\'ai-name-'+ki+'\'); el.value=\'\'; el.style.opacity=.4;" title="'+esc(I18n.t('aiSkip'))+'" style="background:none;border:0;color:#b91c1c;font-size:16px;cursor:pointer;padding:2px 4px;flex:0 0 auto;">✕</button>'+
          '</div>'+
          '<select onchange="if(this.value){ document.getElementById(\'ai-name-'+ki+'\').value=this.value; document.getElementById(\'ai-name-'+ki+'\').style.opacity=1; } this.value=\'\';" style="width:100%;font-size:12px;padding:6px;border:1px solid var(--border);border-radius:7px;color:var(--text-3);background:var(--surface);">'+
            pickOpts+
          '</select>'+
        '</div>';
      });
      listEl.innerHTML = html;
      aiKeys = keys;
      document.getElementById('aiResultWrap').style.display='block';
    }
    window.applyAiResults = function(){
      if(!aiKeys) return;
      var count = 0;
      aiKeys.forEach(function(key,ki){
        var nameEl = document.getElementById('ai-name-'+ki); if(!nameEl) return;
        var name = (nameEl.value||'').trim(); if(!name) return; // 空欄＝その1件は適用しない
        var qty = Number(document.getElementById('ai-qty-'+ki).value) || 0;
        var idx=-1; for(var i=0;i<window.rows.length;i++){ if(window.rows[i].name===name){ idx=i; break; } }
        if(idx>=0){ window.rows[idx].stock=qty; } else { var en=isEN(); window.rows.push({ name:name, nameJa:en?'':name, nameEn:en?name:'', category:'', categoryJa:'', categoryEn:'', supplier:'', unit:'本', stock:qty, minimum:0, cost:0 }); }
        count++;
      });
      render(); closeAiScan(); msg(count ? I18n.t('aiApplied') : I18n.t('aiNoDetect'), !!count);
    };

    // ── メニューとの紐づけ（在庫画面からメニュー品目を選んでリンク／新規追加） ──
    var linkTargetRow = -1; // -1 = 新規追加モード、0以上 = 既存行を紐づけ
    function linkErr(m){ var a=document.getElementById('linkAlert'); a.style.display='block'; a.style.background='#fee2e2'; a.style.color='#b91c1c'; a.innerText=m; }
    window.openLinkPicker = function(rowIndex){
      linkTargetRow = rowIndex;
      document.getElementById('linkAlert').style.display='none';
      var sel = document.getElementById('linkMenuSel');
      var opts = '<option value="">'+I18n.t('linkPickPh')+'</option>';
      // value（送信値）は常に日本語の商品名（サーバ側のメニューシート照合キー）。表示テキストのみ現在の言語に合わせる。
      opts += MENU_ALL.map(function(m){
        var nm = m['商品名']; if(!nm) return '';
        var nmDisp = loc(m['商品名_JA']!==undefined?m['商品名_JA']:nm, m['商品名_EN']);
        var linkedTag = m['在庫紐づけ'] ? ' — 🔗'+m['在庫紐づけ'] : '';
        return '<option value="'+esc(nm)+'">'+esc(nmDisp)+esc(linkedTag)+'</option>';
      }).join('');
      sel.innerHTML = opts; sel.value='';
      if (rowIndex >= 0 && window.rows[rowIndex]) {
        document.getElementById('linkModalTitle').textContent = I18n.t('linkExistingTitle');
        document.getElementById('linkModalHint').textContent = I18n.t('linkExistingHint')+'「'+loc(window.rows[rowIndex].nameJa!==undefined?window.rows[rowIndex].nameJa:window.rows[rowIndex].name, window.rows[rowIndex].nameEn)+'」';
      } else {
        document.getElementById('linkModalTitle').textContent = I18n.t('linkNewTitle');
        document.getElementById('linkModalHint').textContent = I18n.t('linkNewHint');
      }
      document.getElementById('linkOv').style.display='flex';
    };
    window.closeLinkPicker = function(){ document.getElementById('linkOv').style.display='none'; };
    window.confirmLink = function(){
      var menuName = document.getElementById('linkMenuSel').value;
      if (!menuName){ linkErr(I18n.t('linkNeedSel')); return; }
      if (linkTargetRow >= 0) {
        var r = window.rows[linkTargetRow]; var canonicalName=r&&String(r.name||r.nameJa||r.nameEn||'').trim(); if(!canonicalName){ linkErr(I18n.t('linkRowNeedName')); return; }
        rpc('linkMenuInventory',[menuName, canonicalName]).then(function(res){
          if (res && res.success){ closeLinkPicker(); msg(I18n.t('linkDone'), true); return reloadMenuLinks(); }
          linkErr(I18n.t('errPrefix')+API.userErrorText((res&&res.error)||''));
        }).catch(function(e){ linkErr(I18n.t('errPrefix')+API.userErrorText(e)); });
      } else {
        var exists = window.rows.some(function(r){ return r.name===menuName; });
        var menuObj = MENU_ALL.filter(function(m){ return m['商品名']===menuName; })[0] || {};
        rpc('linkMenuInventory',[menuName, menuName]).then(function(res){
          if (!(res && res.success)){ linkErr(I18n.t('errPrefix')+API.userErrorText((res&&res.error)||'')); return; }
          closeLinkPicker();
          if (!exists){ window.rows.push({ name:menuName, nameJa:(menuObj['商品名_JA']!==undefined?menuObj['商品名_JA']:menuName), nameEn:menuObj['商品名_EN']||'', category:'', categoryJa:'', categoryEn:'', supplier:'', unit:'本', stock:0, minimum:0, cost:0 }); render(); }
          msg(I18n.t('linkAddedNeedSave'), true);
          return reloadMenuLinks();
        }).catch(function(e){ linkErr(I18n.t('errPrefix')+API.userErrorText(e)); });
      }
    };
    function reloadMenuLinks(){ return rpc('getAllMenuForAdmin',[]).then(function(l){ MENU_ALL=l||[]; render(); }).catch(function(){}); }

    rpc('getSuppliers',[]).then(function(l){ SUPPLIER_OPTIONS=(l||[]).map(function(s){return {key:s.name,ja:(s.nameJa!==undefined?s.nameJa:s.name),en:s.nameEn};}); render(); }).catch(function(){});
    rpc('getAllMenuForAdmin',[]).then(function(l){ MENU_ALL=l||[]; render(); }).catch(function(){});
    var __loaded=false;
    rpc('getDrinkInventory',[]).then(function(list){ window.rows=(list||[]).slice(); __loaded=true; render(); })
      .catch(function(e){ if(String(e.message||e).indexOf('unauthorized')>=0){ location.href='./manage.html'; return; } document.getElementById('rows').innerHTML='<tr><td colspan="8" style="color:#b91c1c;padding:16px;">'+I18n.t('loadErr')+esc(API.userErrorText(e))+'</td></tr>'; });

    I18n.init({
      ja:{ title:'📦 在庫管理', back:'← 管理へ', movesLink:'📋 履歴', hint:'ドリンク・食材・備品などをまとめて数量管理できます。最小在庫を下回ると赤く表示され、日報・レポートに低在庫として通知。レシピ（材料名一致）で注文時に自動減算されます。「変動」から入荷・廃棄・棚卸を記録すると履歴に残ります。', scrollHint:'👉 表は横にスクロールできます', thName:'商品名', thCat:'カテゴリ', thSupplier:'仕入先', thUnit:'単位', thStock:'在庫数', thMin:'最小在庫', thCost:'原価', addRow:'＋ 行を追加', save:'💾 保存', loading:'読み込み中…', empty:'「＋ 行を追加」で登録してください', saved:'✅ 保存しました', errPrefix:'エラー: ', loadErr:'読み込みエラー: ', moveBtn:'変動', mvIn:'＋ 入荷', mvWaste:'− 廃棄', mvCount:'棚卸', mvQty:'数量', mvCounted:'実棚卸数', mvCostL:'原価（任意・単価更新）', mvReasonL:'理由', mvStockNow:'現在庫', mvGo:'実行', mvClose:'閉じる', mvDone:'✅ 記録しました', mvBad:'数量を確認してください', mvNeedSave:'先に「保存」で商品を登録してください', camHintShoot:'📸を押して撮影 → 写真を1つずつタップして数えます', camHintTap:'商品を1つずつタップ。↩で取消、✓で数量を採用', camNoCam:'カメラを利用できません（権限/対応をご確認ください）',
        aiScanBtn:'🤖 AIスキャン', aiTitle:'🤖 AI在庫スキャン', aiTapText:'タップして撮影', aiAnalyzeBtn:'🤖 システムAIで分析', aiAnalyzing:'システムAIで分析中…', aiManualHint:'AIを利用できない場合も、閉じて在庫表を手動で入力・保存できます。', aiUnavailable:'AI分析を利用できません。時間をおいて再度お試しください。手動での在庫入力・保存は引き続き利用できます。', aiResultTitle:'AI検出結果 — 商品名・数量は自由に編集できます', aiResultHint:'商品名は直接書き換えできます。下のプルダウンから既存の在庫を選ぶと自動で入力されます。✕で1件だけ除外できます。', aiApplyBtn:'✅ 在庫に反映', aiNoDetect:'ドリンクが検出されませんでした。別の角度で撮り直してください。', aiSkip:'この項目を除外', aiPickPh:'（既存の在庫から選ぶ）', aiApplied:'✅ 反映しました（「💾 保存」で確定してください）',

        linkedWith:'紐づくメニュー: ', linkBtnTitle:'メニューと紐づけ（未設定）' },
      en:{ title:'📦 Inventory', back:'← Manage', movesLink:'📋 History', hint:'Track drinks, ingredients and supplies together by quantity. Rows below the minimum turn red and appear as low-stock in reports. Auto-deducted on orders via recipes (material-name match). Use “Move” to log receiving, waste and stocktake — all kept in history.', scrollHint:'👉 Swipe sideways to see the whole table', thName:'Item', thCat:'Category', thSupplier:'Supplier', thUnit:'Unit', thStock:'Stock', thMin:'Min stock', thCost:'Cost', addRow:'＋ Add row', save:'💾 Save', loading:'Loading…', empty:'Tap “＋ Add row” to register', saved:'✅ Saved', errPrefix:'Error: ', loadErr:'Load error: ', moveBtn:'Move', mvIn:'＋ Receive', mvWaste:'− Waste', mvCount:'Stocktake', mvQty:'Quantity', mvCounted:'Counted qty', mvCostL:'Cost (optional, updates unit cost)', mvReasonL:'Reason', mvStockNow:'Current', mvGo:'Apply', mvClose:'Close', mvDone:'✅ Recorded', mvBad:'Please check the quantity', mvNeedSave:'Please save the item first', camHintShoot:'Tap 📸 to capture, then tap each item to count', camHintTap:'Tap each item. ↩ to undo, ✓ to use the count', camNoCam:'Camera unavailable (check permission/support)',
        aiScanBtn:'🤖 AI Scan', aiTitle:'🤖 AI Stocktake Scan', aiTapText:'Tap to take a photo', aiAnalyzeBtn:'🤖 Analyze with system AI', aiAnalyzing:'Analyzing with system AI…', aiManualHint:'If AI is unavailable, close this dialog and continue entering and saving inventory manually.', aiUnavailable:'AI analysis is currently unavailable. Please try again later. Manual inventory entry and saving are still available.', aiResultTitle:'AI results — item name & quantity are fully editable', aiResultHint:'Edit the name directly, or pick an existing item from the dropdown below to auto-fill it. Use ✕ to skip a single row.', aiApplyBtn:'✅ Apply to inventory', aiNoDetect:'No drinks detected. Try a different angle.', aiSkip:'Skip this item', aiPickPh:'(Pick from existing items)', aiApplied:'✅ Applied (press “💾 Save” to confirm)',
        linkFromMenuBtn:'🔗 Add from menu', linkConfirmBtn:'🔗 Link', linkPickPh:'Select a menu item…', linkNeedSel:'Please select a menu item', linkRowNeedName:'Please enter an item name first',
        linkNewTitle:'🔗 Add inventory item from menu', linkNewHint:'Adds a new inventory item using the selected menu item’s name and links it (fill in stock/min after adding).',
        linkExistingTitle:'🔗 Link to a menu item', linkExistingHint:'Choose a menu item to link: ', linkDone:'✅ Linked', linkAddedNeedSave:'✅ Added and linked (press “💾 Save” to confirm)',

  <script src="./help.js?v=auth2"></script>
  <script>
    HelpUI.register({
      title: '在庫管理',
      titleEn: 'Inventory',
      items: [
        { ja: '① ドリンク・食材・備品などをまとめて一覧で数量管理します。「＋ 行を追加」で新しい商品を追加し、商品名・カテゴリ・仕入先・単位・在庫数・最小在庫・原価を入力後「💾 保存」で確定します。', en: '① Track drinks, ingredients, and supplies together in one list. Press "＋ Add row" to add a new item, fill in name/category/supplier/unit/stock/min stock/cost, then press "💾 Save" to confirm.' },
        { ja: '② 在庫数が「最小在庫」を下回った行は赤く表示され、日報・レポートにも低在庫として通知されます。', en: '② Any row whose stock falls at or below its minimum turns red and is flagged as low stock in daily reports.' },
