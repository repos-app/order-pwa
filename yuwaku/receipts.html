<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Receipts">

  <link rel="manifest" href="./receipts.webmanifest">
  <title>Receipts</title>
  <style>
    :root{ --bg:#f6f7f9; --surface:#fff; --border:#e5e7eb; --navy:#0f172a; --text-3:#64748b; }
    *{ box-sizing:border-box; }
    body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans JP',sans-serif; background:var(--bg); color:var(--navy); }
    .head{ position:sticky; top:0; z-index:20; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:space-between; padding:12px 16px; }
    .head h1{ font-size:18px; margin:0; font-weight:900; }
    .hbtn{ background:rgba(255,255,255,.14); color:#fff; border:0; border-radius:9px; padding:8px 12px; font-size:13px; font-weight:800; cursor:pointer; text-decoration:none; }
    .wrap{ padding:16px; max-width:1200px; margin:0 auto; }
    .card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; }
    .bar{ display:flex; gap:12px; align-items:flex-end; margin-bottom:12px; flex-wrap:wrap; }
    .fc{ padding:10px; border:1px solid var(--border); border-radius:9px; font-size:15px; font-family:inherit; background:var(--surface); }
    .form-label{ font-size:12px; font-weight:700; display:block; margin-bottom:4px; }
    .muted{ color:var(--text-3); }
    .tot{ font-weight:900; font-size:16px; }
    table{ width:100%; border-collapse:collapse; font-size:13px; }
    th,td{ padding:8px 6px; border-bottom:1px solid var(--border); text-align:left; white-space:nowrap; }
    th{ font-size:11px; color:var(--text-3); }
    td.num,th.num{ text-align:right; font-variant-numeric:tabular-nums; }
    .btn-sm{ background:#eef2f7; color:var(--navy); border:0; border-radius:8px; padding:6px 10px; font-weight:800; cursor:pointer; }
  </style>
  <link rel="stylesheet" href="./date-controls.css?v=3">
</head>
<body>
  <div class="head"><h1 data-t="title">🧾 会計履歴</h1><div style="display:flex;gap:8px;"><button class="hbtn" data-tlang onclick="I18n.toggle()">EN</button><a class="hbtn" href="./admin.html" data-t="toOrders">← 注文一覧</a><a class="hbtn" href="./manage.html" data-t="back">管理へ</a></div></div>
  <div class="wrap"><div class="card">
    <div class="bar">
      <div><label class="form-label" data-t="month">対象月</label><input id="month" type="month" class="fc"></div>
      <div style="flex:1;"></div>
      <div style="text-align:right;"><div class="muted" data-t="monthTotal">月合計</div><div class="tot" id="total">—</div><div class="muted" id="cnt"></div></div>
    </div>
    <div style="overflow:auto;">
      <table><thead><tr>
        <th data-t="thTime">日時</th><th data-t="thOr">OR番号</th><th data-t="thTable">卓</th>
        <th class="num" data-t="thTotal">合計</th><th data-t="thMethod">支払</th><th data-t="thDisc">割引</th><th></th>
      </tr></thead>
      <tbody id="rows"><tr><td colspan="7" class="muted" style="padding:16px;text-align:center;" data-t="loading">読み込み中…</td></tr></tbody></table>
    </div>
    <div style="text-align:center;margin-top:12px;"><button class="btn-sm" id="moreBtn" style="display:none;" onclick="loadMore()" data-t="loadMore">さらに読み込む</button></div>
  </div></div>

  <script src="./date-display.js?v=auth4" data-iz-date-display></script><script src="./config.js?v=auth2"></script>
  <script src="./api.js?v=auth2"></script>
  <script src="./i18n.js?v=auth3"></script>
  <script src="./confirm.js?v=auth2"></script>
  <script>
    var TOKEN = localStorage.getItem(window.APP_CONFIG.AUTH_STORAGE_PREFIX + 'mgmtToken') || '';
    if (!TOKEN) location.href = './manage.html';
    function rpc(fn,args){ return API.post('rpc',{fn:fn,args:args||[],token:TOKEN}).then(function(r){ return r.data; }); }
    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
    var ROWS=[], SYM='₱', SETTINGS={}, __loaded=false;
    // [負荷試験レビュー対応/優先#4] サーバー側ページングに対応。月合計(SUM_TOTAL)・件数(CNT_TOTAL)は
    // 「その月の全レシート」に対してサーバー側で集計した値を使う（表示中の行数に依存しない、常に正確な値）。
    // 一覧本体は1ページ100件ずつ「さらに読み込む」で追加取得する（一度に全件は読まない）。
    var PAGE=1, PAGE_SIZE=100, HAS_MORE=false, SUM_TOTAL=0, CNT_TOTAL=0;
    function seatLabel(v){ var s=String(v==null?'':v); var en=(window.I18n&&I18n.lang&&I18n.lang()==='en'); var tableTerm=(en?(SETTINGS.tableLabelEn||SETTINGS.tableLabelJa):(SETTINGS.tableLabelJa||SETTINGS.tableLabelEn))||(en?'Table':'テーブル'); var counterTerm=(en?(SETTINGS.counterLabelEn||SETTINGS.counterLabelJa):(SETTINGS.counterLabelJa||SETTINGS.counterLabelEn))||(en?'Counter':'カウンター'); var m=s.match(/^テーブル(\d+)$/)||s.match(/^(\d+)$/); if(m) return tableTerm+' '+m[1]; var c=s.match(/^カウンター(\d+)$/); if(c) return counterTerm+' '+c[1]; return s; }
    var MENU_LABELS={};
    function receiptItemName(nm){
      nm=String(nm||'').trim();var enMode=window.I18n&&I18n.lang&&I18n.lang()==='en';
      var match=nm.match(/^(.+?)\s*[（(]([^（）()]*)[)）]\s*$/),base=(match?match[1]:nm).trim(),entry=MENU_LABELS[base];
      if(!entry)return nm;
      var label=enMode?(entry.en||entry.ja||base):(entry.ja||entry.en||base);
      if(match&&match[2].trim())label+=' ('+match[2].split(',').map(function(raw){var key=raw.trim(),choice=entry.choices[key];return choice?(enMode?(choice.en||choice.ja||key):(choice.ja||choice.en||key)):key;}).join(', ')+')';
      return label;
    }
    function readableDetails(details){
      var raw=String(details||'').trim();if(!raw)return '';
      try{var parsed=JSON.parse(raw);if(Array.isArray(parsed))return parsed.map(function(it){
        var enMode=window.I18n&&I18n.lang&&I18n.lang()==='en';
        var n=enMode?((it&&it.nameEn)||(it&&it.nameJa)):((it&&it.nameJa)||(it&&it.nameEn));
        var rawName=String(it&&((it.item_name)||(it.name))||''),name=String((/[（(][^（）()]*[)）]\s*$/.test(rawName)?receiptItemName(rawName):(n||receiptItemName(rawName)))||'').trim(),qty=Number(it&&it.qty)||0;
        return name?name+' x'+qty:'';
      }).filter(Boolean).join(', ');}catch(e){}
      return raw.split(/,\s*(?![^（）()]*[)）])/).map(function(tok){var m=tok.trim().match(/^(.+?)x(\d+)$/);return m?receiptItemName(m[1])+'x'+m[2]:tok;}).join(', ');
    }

    function render(){
      var seatHead=document.querySelector('[data-t="thTable"]'),en=(window.I18n&&I18n.lang&&I18n.lang()==='en'); if(seatHead) seatHead.textContent=(en?(SETTINGS.seatGroupLabelEn||SETTINGS.seatGroupLabelJa):(SETTINGS.seatGroupLabelJa||SETTINGS.seatGroupLabelEn))||(en?'Seating':'席');
      document.getElementById('total').innerText = SYM + SUM_TOTAL.toLocaleString();
      document.getElementById('cnt').innerText = CNT_TOTAL + ' ' + I18n.t('bills');
      document.getElementById('moreBtn').style.display = HAS_MORE ? '' : 'none';
      if(!ROWS.length){ document.getElementById('rows').innerHTML='<tr><td colspan="7" class="muted" style="padding:16px;text-align:center;">'+I18n.t('empty')+'</td></tr>'; return; }
      document.getElementById('rows').innerHTML = ROWS.map(function(r){
        var disc = (Number(r.discountAmount)>0) ? ('-'+SYM+(Number(r.discountAmount)||0).toLocaleString()+(r.discountType?(' '+esc(r.discountType)):'')) : '';
        var main = '<tr><td class="muted">'+esc(window.DateDisplay?DateDisplay.formatDateTime(r.datetime):r.datetime)+'</td><td style="font-weight:800;">'+esc(r.orNo)+'</td><td>'+esc(seatLabel(r.table))+'</td>'+
          '<td class="num" style="font-weight:800;">'+SYM+(Number(r.total)||0).toLocaleString()+'</td><td>'+esc(en?(r.methodLabelEn||r.methodLabelJa||r.methodLabel||r.method):(r.methodLabelJa||r.methodLabelEn||r.methodLabel||r.method))+'</td><td class="muted">'+disc+'</td>'+
          '<td><button class="btn-sm" onclick="reprint(\''+esc(r.orNo).replace(/'/g,"\\'")+'\')">'+I18n.t('reprint')+'</button></td></tr>';
        // 明細（あれば2行目に表示）
        var det = readableDetails(r.details);
        var detRow = det ? ('<tr><td></td><td colspan="6" class="muted" style="white-space:normal;padding-top:0;font-size:12px;">🧾 '+esc(det)+'</td></tr>') : '';
        return main + detRow;
      }).join('');
    }
    var REPRINT_REQUESTS=Object.create(null);
    function nextReprintRequestId(){ try{ if(crypto&&typeof crypto.randomUUID==='function') return 'receipt-reprint-'+crypto.randomUUID(); }catch(e){} return 'receipt-reprint-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2); }
    function showReprintError(error){ var code=String(error&&error.message||error||''); var msg=I18n.t('errPrefix')+API.userErrorText(error); if(code==='no_printer'){ var en=I18n.lang&&I18n.lang()==='en'; UIConfirm(msg,{okLabel:en?'Printer Settings':'プリンター設定へ',cancelLabel:en?'Close':'閉じる'}).then(function(ok){ if(ok) location.href='./printers.html'; }); } else UIAlert(msg); }
    window.reprint = function(orNo){ var requestId=REPRINT_REQUESTS[orNo]||(REPRINT_REQUESTS[orNo]=nextReprintRequestId()); rpc('reprintReceipt',[orNo,requestId]).then(function(d){ delete REPRINT_REQUESTS[orNo]; d=d||{}; if(d.ok){ UIAlert(I18n.t('sent')); } else { showReprintError(d.error||'error'); } }).catch(function(e){ showReprintError(e); }); };
    function load(){
      var mo=document.getElementById('month').value;
      PAGE=1; ROWS=[];
      document.getElementById('rows').innerHTML='<tr><td colspan="7" class="muted" style="padding:16px;text-align:center;" data-t="loading">'+I18n.t('loading')+'</td></tr>';
      rpc('getReceipts',[mo, PAGE, PAGE_SIZE]).then(function(d){
        d=d||{}; ROWS=d.rows||[]; SUM_TOTAL=Number(d.sumTotal)||0; CNT_TOTAL=Number(d.count)||0; HAS_MORE=!!d.hasMore;
        render();
      }).catch(function(e){ if(String(e.message||e).indexOf('unauthorized')>=0){ location.href='./manage.html'; return; } document.getElementById('rows').innerHTML='<tr><td colspan="7" style="color:#b91c1c;padding:16px;">'+I18n.t('loadErr')+esc(API.userErrorText(e))+'</td></tr>'; });
    }
    window.loadMore = function(){
      var mo=document.getElementById('month').value;
      var nextPage=PAGE+1;
      rpc('getReceipts',[mo, nextPage, PAGE_SIZE]).then(function(d){
        d=d||{}; PAGE=nextPage; ROWS=ROWS.concat(d.rows||[]); SUM_TOTAL=Number(d.sumTotal)||0; CNT_TOTAL=Number(d.count)||0; HAS_MORE=!!d.hasMore;
        render();
      }).catch(function(e){ UIAlert(I18n.t('errPrefix')+API.userErrorText(e)); });
    };
    // 2026-08-24修正: toISOString()はUTC基準のため、フィリピン時間で月初の午前0〜8時頃に開くと
    // 前月が選択されてしまう不具合があった（profit_sim.htmlで先に見つけて修正済みだった同じ問題を
    // 横展開）。ローカル時間（店舗のタイムゾーン）で当月を決める。
    API.initStoreDateInputs([{id:'month',kind:'month'}], load);
    document.getElementById('month').addEventListener('change', load);

    API.post('getSettings', {}).then(function(r){ SETTINGS=r.data||{}; if(SETTINGS.currencySymbol) SYM=SETTINGS.currencySymbol; render(); }).catch(function(){});
    rpc('getAllMenuForAdmin',[]).then(function(l){ MENU_LABELS=Object.create(null);(l||[]).forEach(function(m){
      var key=String(m['商品名']||'').trim();if(!key)return;
      var entry={ja:String(m['商品名_JA']||'').trim(),en:String(m['商品名_EN']||'').trim(),choices:Object.create(null)};
      try{var groups=typeof m['オプション']==='string'?JSON.parse(m['オプション']||'[]'):m['オプション'];(Array.isArray(groups)?groups:[]).forEach(function(g){(g.choices||[]).forEach(function(c){[c.label,c.labelJa,c.labelEn].forEach(function(a){a=String(a||'').trim();if(a&&!entry.choices[a])entry.choices[a]={ja:String(c.labelJa||'').trim(),en:String(c.labelEn||'').trim()};});});});}catch(e){}
      MENU_LABELS[key]=entry;
    });render(); }).catch(function(){});
    __loaded=true; load();

    I18n.init({
      ja:{ title:'🧾 会計履歴', back:'管理へ', toOrders:'← 注文一覧', month:'対象月', monthTotal:'月合計', bills:'件', thTime:'日時', thOr:'OR番号', thTable:'卓', thTotal:'合計', thMethod:'支払', thDisc:'割引', reprint:'🖨️ 再印刷', sent:'印刷キューに送信しました', loading:'読み込み中…', empty:'この月の会計はありません', errPrefix:'エラー: ', loadErr:'読み込みエラー: ', loadMore:'さらに読み込む' },
      en:{ title:'🧾 Receipts', back:'Manage', toOrders:'← Orders', month:'Target month', monthTotal:'Month total', bills:'bills', thTime:'Time', thOr:'OR no.', thTable:'Table', thTotal:'Total', thMethod:'Paid', thDisc:'Discount', reprint:'🖨️ Reprint', sent:'Sent to print queue', loading:'Loading…', empty:'No receipts this month', errPrefix:'Error: ', loadErr:'Load error: ', loadMore:'Load more' }
    }, function(){ if(__loaded) render(); });
  </script>
  <script src="./help.js?v=auth2"></script>
  <script>
    HelpUI.register({
      title: '会計履歴',
      titleEn: 'Receipts',
      items: [
        { ja: '① 「対象月」で月を選ぶと、その月に会計した伝票（日時・OR番号・卓・合計・支払方法・割引）が一覧表示されます。', en: '① Pick a "Target month" to list bills closed that month (time, OR no., table, total, payment method, discount).' },
        { ja: '② 画面右上に月合計金額と件数が表示されます。', en: '② The month\'s total amount and count are shown at the top right.' },
        { ja: '③ 各行に明細（注文した商品と数量）が表示されます。', en: '③ Each row shows the order details (items and quantities).' },
        { ja: '④ 各行の「🖨️ 再印刷」ボタンを押すと、そのレシートを印刷キューに再送信できます。', en: '④ Tap "🖨️ Reprint" on a row to resend that receipt to the print queue.' },
        { ja: '⑤ 「さらに読み込む」ボタンで、100件ずつ追加の会計データを読み込めます。', en: '⑤ Tap "Load more" to fetch additional receipts, 100 at a time.' }
      ]
    });
  </script>
</body>
</html>
