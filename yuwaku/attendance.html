<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Attendance">

  <link rel="manifest" href="./attendance.webmanifest">
  <title>Attendance</title>
  <style>
    :root{ --bg:#f6f7f9; --surface:#fff; --border:#e5e7eb; --navy:#0f172a; --text-3:#64748b; --filter-control-h:44px; }
    *{ box-sizing:border-box; }
    body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans JP',sans-serif; background:var(--bg); color:var(--navy); }
    .head{ position:sticky; top:0; z-index:20; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:space-between; padding:12px 16px; }
    .head h1{ font-size:18px; margin:0; font-weight:900; }
    .hbtn{ background:rgba(255,255,255,.14); color:#fff; border:0; border-radius:9px; padding:8px 12px; font-size:13px; font-weight:800; cursor:pointer; text-decoration:none; }
    .wrap{ padding:16px; max-width:900px; margin:0 auto; }
    .card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; }
    .bar{ display:flex; gap:12px; align-items:flex-end; margin-bottom:14px; flex-wrap:wrap; }
    .fc{ width:100%; padding:10px; border:1px solid var(--border); border-radius:9px; font-size:15px; font-family:inherit; background:var(--surface); }
    .month-field{ flex:0 0 188px; min-width:0; max-width:188px; padding-right:8px; overflow:visible; }
    .month-field .fc{ display:block; inline-size:100%!important; width:100%!important; min-inline-size:0!important; min-width:0!important; max-inline-size:100%!important; max-width:100%!important; box-sizing:border-box; }
    .filter-control-shell{ position:relative; min-width:0; width:100%; height:var(--filter-control-h); padding-right:8px; overflow:visible; border-radius:10px; box-sizing:border-box; }
    .filter-control-shell .fc{ display:block; inline-size:100%!important; width:100%!important; min-inline-size:0!important; min-width:0!important; max-inline-size:100%!important; max-width:100%!important; margin:0; overflow:visible; }
    .form-label{ font-size:12px; font-weight:700; display:block; margin-bottom:4px; }
    @media (max-width:520px){ .fc{ min-width:0; font-size:16px; } }
    .btn{ height:var(--filter-control-h); border:0; border-radius:10px; padding:0 16px; font-size:14px; font-weight:800; background:var(--navy); color:#fff; cursor:pointer; font-family:inherit; display:inline-flex; align-items:center; justify-content:center; }
    table{ width:100%; border-collapse:collapse; font-size:13px; }
    th,td{ padding:9px 8px; border-bottom:1px solid var(--border); text-align:left; white-space:nowrap; }
    th{ font-size:11px; color:var(--text-3); }
    td.num{ text-align:right; font-variant-numeric:tabular-nums; }
    .est{ font-weight:900; color:#16a34a; }
    .hint{ color:var(--text-3); font-size:13px; }
  </style>
  <link rel="stylesheet" href="./date-controls.css?v=3">
</head>
<body>
  <div class="head"><h1 data-t="title">🕐 勤怠管理</h1><div style="display:flex;gap:8px;"><button class="hbtn" data-tlang onclick="I18n.toggle()">EN</button><a class="hbtn" href="./manage.html" data-t="back">← 管理へ</a></div></div>
  <div class="wrap"><div class="card">
    <div class="bar">
      <div class="month-field"><label class="form-label" for="month" data-t="month">対象月</label><input type="month" id="month" class="fc"></div>
      <button class="btn" onclick="load()" data-t="show">🔍 表示</button>
    </div>
    <div class="hint" style="margin-bottom:8px;" data-t="hint">労働時間・残業（8時間超）・深夜（22-5時）・出勤日数・給与概算を集計します。概算＝時給×労働時間。</div>
    <div style="overflow:auto;">
      <table><thead><tr><th data-t="colEmp">従業員</th><th style="text-align:right;" data-t="colDays">出勤日</th><th style="text-align:right;" data-t="colWork">労働</th><th style="text-align:right;" data-t="colOt">残業</th><th style="text-align:right;" data-t="colNight">深夜</th><th style="text-align:right;" data-t="colWage">時給</th><th style="text-align:right;" data-t="colEst">概算</th></tr></thead>
      <tbody id="rows"><tr><td colspan="7" style="color:#aaa;padding:16px;text-align:center;" data-t="pickMonth">月を選んで表示</td></tr></tbody></table>
    </div>
  </div></div>

  <script src="./date-display.js?v=auth4" data-iz-date-display></script><script src="./config.js?v=auth2"></script>
  <script src="./api.js?v=auth2"></script>
  <script src="./i18n.js?v=auth3"></script>
  <script>
    var TOKEN = localStorage.getItem(window.APP_CONFIG.AUTH_STORAGE_PREFIX + 'mgmtToken') || '';
    if (!TOKEN) location.href = './manage.html';
    function rpc(fn,args){ return API.post('rpc',{fn:fn,args:args||[],token:TOKEN}).then(function(r){ return r.data; }); }
    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
    var SYM='₱';
    function hm(min){ min = Math.round(Number(min)||0); var h=Math.floor(min/60), m=min%60; return h+':'+('0'+m).slice(-2); }

    window.load = function(){
      var month = document.getElementById('month').value; if(!month) return;
      document.getElementById('rows').innerHTML = '<tr><td colspan="7" style="padding:14px;">'+I18n.t('loading')+'</td></tr>';
      rpc('getAttendanceMonthlySummary',[month]).then(function(list){
        list = (list||[]).filter(function(e){ return e.days>0 || e.workedMin>0; }).sort(function(a,b){ return (b.estimate||0)-(a.estimate||0); });
        if (!list.length){ document.getElementById('rows').innerHTML='<tr><td colspan="7" style="color:#aaa;padding:16px;text-align:center;">'+I18n.t('noData')+'</td></tr>'; return; }
        document.getElementById('rows').innerHTML = list.map(function(e){
          return '<tr><td>'+esc(e.name)+'</td>'+
            '<td class="num">'+(e.days||0)+'</td>'+
            '<td class="num">'+hm(e.workedMin)+'</td>'+
            '<td class="num">'+hm(e.overtimeMin)+'</td>'+
            '<td class="num">'+hm(e.nightMin)+'</td>'+
            '<td class="num">'+SYM+(Number(e.wage)||0).toLocaleString()+'</td>'+
            '<td class="num est">'+SYM+(Number(e.estimate)||0).toLocaleString()+'</td></tr>';
        }).join('');
      }).catch(function(e){ if(String(e.message||e).indexOf('unauthorized')>=0){ location.href='./manage.html'; return; } document.getElementById('rows').innerHTML='<tr><td colspan="7" style="color:#b91c1c;padding:14px;">'+I18n.t('loadErr')+esc(API.userErrorText(e))+'</td></tr>'; });
    };

    API.post('getSettings', {}).then(function(r){ if(r.data && r.data.currencySymbol) SYM=r.data.currencySymbol; }).catch(function(){});
    // 2026-08-24修正: toISOString()はUTC基準のため、フィリピン時間で月初の午前0〜8時頃に開くと
    // 前月が選択されてしまう不具合があった（profit_sim.htmlで先に見つけて修正済みだった同じ問題を
    // 横展開）。ローカル時間（店舗のタイムゾーン）で当月を決める。
    API.initStoreDateInputs([{id:'month',kind:'month'}], load);

    I18n.init({
      ja:{ title:'🕐 勤怠管理', back:'← 管理へ', month:'対象月', show:'🔍 表示', hint:'労働時間・残業（8時間超）・深夜（22-5時）・出勤日数・給与概算を集計します。概算＝時給×労働時間。', colEmp:'従業員', colDays:'出勤日', colWork:'労働', colOt:'残業', colNight:'深夜', colWage:'時給', colEst:'概算', pickMonth:'月を選んで表示', loading:'読み込み中…', noData:'この月の勤怠データはありません', loadErr:'読み込みエラー: ' },
      en:{ title:'🕐 Attendance', back:'← Manage', month:'Target month', show:'🔍 Show', hint:'Summarizes work hours, overtime (over 8h), late-night (22–5), days worked and estimated pay. Estimate = wage × work hours.', colEmp:'Employee', colDays:'Days', colWork:'Work', colOt:'OT', colNight:'Night', colWage:'Wage', colEst:'Estimate', pickMonth:'Pick a month to show', loading:'Loading…', noData:'No attendance data for this month', loadErr:'Load error: ' }
    }, function(){ load(); });

    load();
  </script>

  <script src="./help.js?v=auth2"></script>
  <script>
    HelpUI.register({
      title: '勤怠管理',
      titleEn: 'Attendance',
      items: [
        { ja: '① 上部の「対象月」で月を選び「🔍 表示」を押すと、その月の従業員ごとの勤怠が一覧表示されます。', en: '① Pick a month in "Target month" and press "🔍 Show" to list each employee\'s attendance for that month.' },
        { ja: '② 一覧には出勤日数・労働時間・残業（8時間超）・深夜（22〜5時）・時給・給与概算（時給×労働時間）が表示されます。', en: '② The list shows days worked, work hours, overtime (over 8h/day), late-night hours (22:00–5:00), hourly wage, and estimated pay (wage × hours).' },
        { ja: '③ 画面を開くと自動的に当月のデータが表示されます。過去の月を確認したい場合は「対象月」を変更してください。', en: '③ The current month loads automatically when you open the screen. Change "Target month" to view a past month.' }
      ]
    });
  </script>
</body>
</html>
