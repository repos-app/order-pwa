<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Order Items">

  <link rel="manifest" href="./order_items.webmanifest">
  <title>Order Items</title>
  <style>
    :root{ --bg:#f6f7f9; --surface:#fff; --border:#e5e7eb; --navy:#0f172a; --text-3:#64748b; --red:#c62828; }
    *{ box-sizing:border-box; }
    body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans JP',sans-serif; background:var(--bg); color:var(--navy); }
    .head{ position:sticky; top:0; z-index:20; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:space-between; padding:12px 16px; }
    .head h1{ font-size:18px; margin:0; font-weight:900; }
    .hbtn{ background:rgba(255,255,255,.14); color:#fff; border:0; border-radius:9px; padding:8px 12px; font-size:13px; font-weight:800; cursor:pointer; text-decoration:none; }
    .wrap{ padding:16px; max-width:920px; margin:0 auto; }
    .card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:14px; }
    .card-title{ font-weight:900; font-size:15px; margin-bottom:12px; }
    .hint{ color:var(--text-3); font-size:13px; line-height:1.7; margin-bottom:12px; }
    /* [iPhone表示対応] min-widthで表全体の最小幅を確保し、外側のoverflow:autoラッパーで横スクロールさせる。 */
    table{ width:100%; min-width:560px; border-collapse:collapse; font-size:13px; }
    th,td{ padding:8px 6px; border-bottom:1px solid var(--border); text-align:left; white-space:nowrap; }
    th{ font-size:11px; color:var(--text-3); white-space:nowrap; }
    .grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .fg{ margin-bottom:8px; } .form-label{ font-size:12px; font-weight:700; display:block; margin-bottom:4px; }
    .fc{ width:100%; padding:10px; border:1px solid var(--border); border-radius:9px; font-size:15px; font-family:inherit; background:var(--surface); }
    .btn{ border:0; border-radius:11px; padding:12px 16px; font-size:15px; font-weight:900; cursor:pointer; font-family:inherit; background:var(--navy); color:#fff; }
    .btn-sm{ background:#eef2f7; color:var(--navy); border:0; border-radius:8px; padding:7px 10px; font-weight:800; cursor:pointer; }
    .alert{ margin-top:10px; display:none; padding:11px; border-radius:9px; font-size:14px; font-weight:700; }
  </style>
</head>
<body>
  <div class="head"><h1 data-t="title">📋 発注アイテム管理</h1><div style="display:flex;gap:8px;"><button class="hbtn" data-tlang onclick="I18n.toggle()">EN</button><a class="hbtn" href="./purchasing.html" data-t="pur">🚚 仕入・発注</a><a class="hbtn" href="./manage.html" data-t="back">← 管理へ</a></div></div>
  <div class="wrap">
    <div class="card">
      <div class="card-title" data-t="cardTitle">📋 発注アイテムマスタ</div>
      <div class="hint" data-t="hint">在庫・メニューとは別に、発注時によく使う品目をあらかじめ登録しておけます。新規発注画面の「発注アイテムから選ぶ」で使用します。</div>
      <div class="grid">
        <div class="fg" id="fieldItemNameJa"><label class="form-label" data-t="iNameJa">品目名（日本語）</label><input id="iName" class="fc"></div>
        <div class="fg" id="fieldItemNameEn"><label class="form-label" data-t="iNameEn">品目名（English）</label><input id="iNameEn" class="fc" data-tph="phNameEn" placeholder="e.g. Beer bottle"></div>
      </div>
      <div class="fg"><label class="form-label" data-t="iUnit">単位（任意）</label><input id="iUnit" class="fc" data-tph="phUnit" placeholder="例: 本, kg, 箱"></div>
      <div class="fg"><label class="form-label" data-t="iSupplier">既定仕入先（任意）</label><select id="iSupplier" class="fc"></select></div>
      <div class="fg"><label class="form-label" data-t="iMemo">備考（任意）</label><input id="iMemo" class="fc"></div>
      <input type="hidden" id="iId">
      <button class="btn" id="saveBtn" onclick="save()" data-t="add">💾 登録</button>
      <div class="alert" id="msg"></div>
      <div style="overflow:auto;margin-top:14px;">
        <table><thead><tr>
          <th data-t="thName">品目名</th><th data-t="thUnit">単位</th><th data-t="thSupplier">既定仕入先</th><th data-t="thMemo">備考</th><th style="width:90px;"></th>
        </tr></thead>
        <tbody id="rows"><tr><td colspan="5" class="muted" style="padding:14px;text-align:center;color:var(--text-3);" data-t="loading">読み込み中…</td></tr></tbody></table>
      </div>
    </div>
  </div>

  <script src="./config.js?v=auth2"></script>
  <script src="./api.js?v=auth2"></script>
  <script src="./i18n.js?v=auth3"></script>
  <script src="./confirm.js?v=auth2"></script>
  <script>
    var TOKEN = localStorage.getItem(window.APP_CONFIG.AUTH_STORAGE_PREFIX + 'mgmtToken') || '';
    if (!TOKEN) location.href = './manage.html';
    function rpc(fn,args){ return API.post('rpc',{fn:fn,args:args||[],token:TOKEN}).then(function(r){ return r.data; }); }
    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
    // 表示する日本語/英語の出し分けは必ずこの2関数経由で行うこと（新しい表示箇所を追加する際も同様。過去に個別対応漏れで再発したため）。
    function isEN(){ return !!(window.I18n && I18n.lang && I18n.lang()==='en'); }
    function loc(ja, en){ ja=(ja||'').trim(); en=(en||'').trim(); return isEN() ? (en || ja) : (ja || en); }
    function syncNameOrder(){ var a=document.getElementById('fieldItemNameJa'),b=document.getElementById('fieldItemNameEn'); if(a&&b){a.style.order=isEN()?'2':'1';b.style.order=isEN()?'1':'2';} }
    var ITEMS = [], SUPS = [], __loaded=false;

    function fillSupSel(){
      var sel = document.getElementById('iSupplier'); var cur = sel.value;
      var h = '<option value="">'+I18n.t('supUnset')+'</option>';
      h += SUPS.map(function(s){ return '<option value="'+esc(s.name)+'">'+esc(loc(s.nameJa!==undefined?s.nameJa:s.name, s.nameEn))+'</option>'; }).join('');
      sel.innerHTML = h; sel.value = cur;
    }
    function render(){
      if(!ITEMS.length){ document.getElementById('rows').innerHTML='<tr><td colspan="5" style="color:#aaa;padding:14px;text-align:center;">'+I18n.t('empty')+'</td></tr>'; return; }
      document.getElementById('rows').innerHTML = ITEMS.map(function(it){
        var nmCell = esc(loc(it.nameJa!==undefined?it.nameJa:it.name,it.nameEn));
        return '<tr><td style="font-weight:800;">'+nmCell+'</td><td>'+esc(it.unit)+'</td><td>'+esc(it.supplier)+'</td><td style="color:var(--text-3);white-space:normal;max-width:200px;">'+esc(it.memo)+'</td>'+
          '<td><button class="btn-sm" onclick="edit(\''+it.id+'\')">'+I18n.t('edit')+'</button> <button class="btn-sm" style="background:#fee2e2;color:#b91c1c;" onclick="del(\''+it.id+'\')">'+I18n.t('del')+'</button></td></tr>';
      }).join('');
    }
    function msg(text, ok){ var m=document.getElementById('msg'); m.style.display='block'; m.style.background=ok?'#dcfce7':'#fee2e2'; m.style.color=ok?'#15803d':'#b91c1c'; m.innerText=text; }
    function clearForm(){ ['iId','iName','iNameEn','iUnit','iMemo'].forEach(function(id){ document.getElementById(id).value=''; }); document.getElementById('iSupplier').value=''; }
    var ORDER_ITEM_REQUEST_ID='', ORDER_ITEM_REQUEST_SIG='';
    function nextOrderItemRequestId(){ try{ if(crypto&&typeof crypto.randomUUID==='function') return 'order-item-'+crypto.randomUUID(); }catch(e){} return 'order-item-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2); }

    window.edit = function(id){ var it=ITEMS.filter(function(x){return x.id===id;})[0]; if(!it) return; document.getElementById('iId').value=it.id; document.getElementById('iName').value=(it.nameJa!==undefined?it.nameJa:it.name)||''; document.getElementById('iNameEn').value=it.nameEn||''; document.getElementById('iUnit').value=it.unit||''; document.getElementById('iSupplier').value=it.supplier||''; document.getElementById('iMemo').value=it.memo||''; window.scrollTo({top:9999,behavior:'smooth'}); };
    // [応答速度対応] 削除成功時は全件再取得せず、ローカル配列からその1件だけ除去する。
    // [負荷試験レビュー対応/優先#6] deleteOrderItemは失敗時も例外を投げず{error:...}を返すため、
    // 結果を見ずに一覧から消していたのを修正（成功時のみローカル配列から除去する）。
    window.del = function(id){ UIConfirm(I18n.t('delConfirm')).then(function(ok){ if(!ok) return; rpc('deleteOrderItem',[id]).then(function(r){ if(r && r.ok){ ITEMS = ITEMS.filter(function(x){ return x.id!==id; }); render(); } else { msg(I18n.t('errPrefix')+API.userErrorText((r&&r.error)||'delete_failed'), false); } }).catch(function(e){ msg(I18n.t('errPrefix')+API.userErrorText(e), false); }); }); };
    window.save = function(){
      var nameJa=document.getElementById('iName').value.trim(), nameEn=document.getElementById('iNameEn').value.trim();
      var it = { id:document.getElementById('iId').value, name:nameJa||nameEn, nameJa:nameJa, nameEn:nameEn, unit:document.getElementById('iUnit').value.trim(), supplier:document.getElementById('iSupplier').value, memo:document.getElementById('iMemo').value.trim() };
      if(!nameJa&&!nameEn){ msg(I18n.t('needName'), false); return; }
      if(!it.id){ var sig=JSON.stringify(it); if(!ORDER_ITEM_REQUEST_ID||ORDER_ITEM_REQUEST_SIG!==sig){ ORDER_ITEM_REQUEST_SIG=sig; ORDER_ITEM_REQUEST_ID=nextOrderItemRequestId(); } it.clientRequestId=ORDER_ITEM_REQUEST_ID; }
      var btn=document.getElementById('saveBtn'); btn.disabled=true;
      // [応答速度対応] saveOrderItemが保存済み行を返すので、全件再取得(getOrderItems)せず
      // ローカル配列を新規追加/置換するだけで一覧に反映する。
      rpc('saveOrderItem',[it]).then(function(d){
        btn.disabled=false;
        if(d&&d.error){ ORDER_ITEM_REQUEST_ID=''; ORDER_ITEM_REQUEST_SIG=''; msg(I18n.t('errPrefix')+API.userErrorText(d.error), false); return; }
        ORDER_ITEM_REQUEST_ID=''; ORDER_ITEM_REQUEST_SIG='';
        msg(I18n.t('saved'), true); clearForm();
        if (d && d.row) {
          var idx = ITEMS.findIndex(function(x){ return x.id===d.row.id; });
          if (idx>=0) ITEMS[idx]=d.row; else ITEMS.push(d.row);
          render();
        } else { return reload(); } // 想定外形状のフォールバックのみ再取得
      }).catch(function(e){ btn.disabled=false; msg(I18n.t('errPrefix')+API.userErrorText(e), false); });
    };
    function reload(){ return rpc('getOrderItems',[]).then(function(l){ ITEMS=l||[]; render(); }); }

    rpc('getSuppliers',[]).then(function(l){ SUPS=l||[]; fillSupSel(); }).catch(function(){});
    rpc('getOrderItems',[]).then(function(l){ ITEMS=l||[]; __loaded=true; render(); })
      .catch(function(e){ if(String(e.message||e).indexOf('unauthorized')>=0){ location.href='./manage.html'; return; } document.getElementById('rows').innerHTML='<tr><td colspan="5" style="color:#b91c1c;padding:14px;">'+I18n.t('loadErr')+esc(API.userErrorText(e))+'</td></tr>'; });

    I18n.init({
      ja:{ title:'📋 発注アイテム管理', pur:'🚚 仕入・発注', back:'← 管理へ', cardTitle:'📋 発注アイテムマスタ', hint:'在庫・メニューとは別に、発注時によく使う品目をあらかじめ登録しておけます。新規発注画面の「発注アイテムから選ぶ」で使用します。', iNameJa:'品目名（日本語）', iNameEn:'品目名（English）', phNameEn:'e.g. Beer bottle', iUnit:'単位（任意）', phUnit:'例: 本, kg, 箱', iSupplier:'既定仕入先（任意）', supUnset:'（未選択）', iMemo:'備考（任意）', add:'💾 登録', thName:'品目名', thUnit:'単位', thSupplier:'既定仕入先', thMemo:'備考', loading:'読み込み中…', empty:'まだ発注アイテムが登録されていません', edit:'編集', del:'削除', delConfirm:'このアイテムを削除しますか？', needName:'品目名は日本語または英語のどちらかを入力してください', saved:'✅ 登録しました', errPrefix:'エラー: ', loadErr:'読み込みエラー: ' },
      en:{ title:'📋 Order Items', pur:'🚚 Purchasing', back:'← Manage', cardTitle:'📋 Order item master', hint:'Register items you order often, separate from inventory or the menu. Used by “Add from order items” on the new purchase order screen.', iNameJa:'Item name (Japanese)', iNameEn:'Item name (English)', phNameEn:'e.g. Beer bottle', iUnit:'Unit (optional)', phUnit:'e.g. bottle, kg, box', iSupplier:'Default supplier (optional)', supUnset:'(none)', iMemo:'Memo (optional)', add:'💾 Save', thName:'Item', thUnit:'Unit', thSupplier:'Default supplier', thMemo:'Memo', loading:'Loading…', empty:'No order items registered yet', edit:'Edit', del:'Delete', delConfirm:'Delete this item?', needName:'Enter the item name in either English or Japanese', saved:'✅ Saved', errPrefix:'Error: ', loadErr:'Load error: ' }
    }, function(){ syncNameOrder(); if(__loaded) render(); fillSupSel(); });
  </script>

  <script src="./help.js?v=auth2"></script>
  <script>
    HelpUI.register({
      title: '発注アイテム管理',
      titleEn: 'Order Items',
      items: [
        { ja: '① この画面では、在庫やメニューとは別に「発注時によく使う品目」をあらかじめ登録できます。品目名・単位・既定仕入先・備考を入力し「💾 登録」で保存します。', en: '① Register items you order often, separate from inventory or the menu. Enter name, unit, default supplier, and memo, then press "💾 Save".' },
        { ja: '② 登録した品目は「仕入・発注」画面の新規発注で「📋 発注アイテムから追加」を押すと一覧から選べます。', en: '② Registered items appear on the "Purchasing" screen when you press "📋 Add from order items" while creating a new order.' },
        { ja: '③ 一覧の「編集」で内容をフォームに呼び出して修正、「削除」で品目を削除できます。', en: '③ Use "Edit" in the list to load an item into the form for changes, or "Delete" to remove it.' },
        { ja: '④ 右上の「🚚 仕入・発注」ボタンで発注画面へ移動できます。', en: '④ Use the "🚚 Purchasing" button at top-right to go to the purchasing screen.' }
      ]
    });
  </script>
</body>
</html>
