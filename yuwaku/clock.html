<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Time Clock</title>
  <style>
    :root { --navy:#0f172a; --green:#16a34a; --amber:#f59e0b; --blue:#2563eb; --red:#dc2626; --border:#e5e7eb; --bg:#f6f7f9; --t2:#475569; --t3:#94a3b8; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans JP',sans-serif; background:var(--bg); color:var(--navy); }
    .bar { position:sticky; top:0; z-index:10; background:var(--navy); color:#fff; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; }
    .bar h1 { font-size:17px; font-weight:800; margin:0; }
    .bar .now { font-size:15px; font-weight:800; }
    .cam-wrap { position:relative; background:#000; }
    video { width:100%; max-height:230px; object-fit:cover; display:block; background:#000; }
    .cam-note { position:absolute; bottom:8px; left:10px; background:rgba(0,0,0,.55); color:#fff; font-size:12px; font-weight:700; padding:3px 9px; border-radius:8px; }
    .banner { display:none; background:#fff7ed; color:#c2410c; padding:9px 14px; font-size:13px; font-weight:700; text-align:center; }
    .banner.show { display:block; }
    .banner.err { background:#fee2e2; color:#b91c1c; }
    .wrap { padding:14px; }
    .lbl { font-size:13px; color:var(--t3); font-weight:700; margin:2px 0 10px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
    .emp { background:#fff; border:1px solid var(--border); border-radius:16px; padding:16px 12px; text-align:center; cursor:pointer; box-shadow:0 1px 3px rgba(0,0,0,.06); }
    .emp.view-only { cursor:default; }
    .view-note { margin-top:7px; font-size:11px; color:var(--t3); font-weight:700; }
    .emp .nm { font-size:16px; font-weight:800; margin-bottom:8px; }
    .stt { display:inline-block; font-size:12px; font-weight:700; padding:3px 12px; border-radius:999px; }
    .s-out{background:#f1f5f9;color:#64748b;} .s-work{background:#dcfce7;color:#15803d;} .s-break{background:#fef3c7;color:#b45309;} .s-done{background:#e0e7ff;color:#4338ca;}
    .modal { display:none; position:fixed; inset:0; background:rgba(15,23,42,.6); z-index:50; align-items:center; justify-content:center; padding:16px; }
    .modal.show { display:flex; }
    .sheet { background:#fff; border-radius:18px; width:100%; max-width:360px; overflow:hidden; }
    .sheet .h { padding:18px; text-align:center; border-bottom:1px solid var(--border); }
    .sheet .h .n { font-size:20px; font-weight:900; } .sheet .h .s { font-size:13px; color:var(--t3); margin-top:4px; }
    .sheet .b { padding:16px 18px 20px; }
    .btn { width:100%; padding:15px; border:none; border-radius:12px; font-size:16px; font-weight:800; color:#fff; cursor:pointer; margin-bottom:10px; }
    .b-in{background:var(--green);} .b-out{background:var(--red);} .b-bs{background:var(--amber);} .b-be{background:var(--blue);}
    .memo { width:100%; padding:11px 12px; border:1px solid var(--border); border-radius:10px; font-size:14px; margin-bottom:12px; }
    .close { width:100%; padding:12px; background:#f1f5f9; color:var(--t2); border:none; border-radius:10px; font-weight:700; cursor:pointer; }
    .toast { position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--navy); color:#fff; padding:13px 22px; border-radius:999px; font-size:14px; font-weight:800; z-index:100; display:none; max-width:90%; text-align:center; }
    .toast.err { background:var(--red); }
    .loading { text-align:center; padding:50px 0; color:var(--t3); }
  </style>
</head>
<body>
  <div class="bar"><a href="./manage.html" data-t="back" style="color:#fff;text-decoration:none;font-weight:800;font-size:13px;background:rgba(255,255,255,.16);padding:6px 11px;border-radius:8px;">← 管理</a><h1 id="title" data-t="title">打刻</h1><div style="display:flex;gap:8px;align-items:center;"><button data-tlang onclick="I18n.toggle()" style="background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;">EN</button><span class="now" id="now">--:--</span></div></div>

  <div class="cam-wrap">
    <video id="video" autoplay playsinline muted></video>
    <div class="cam-note" id="camNote" data-t="cam">📷 カメラ</div>
  </div>
  <div class="banner" id="banner"></div>

  <div class="wrap">
    <div class="lbl" id="sub" data-t="sub">自分の名前をタップして出勤・退勤（写真と位置が記録されます）</div>
    <div id="area"><div class="loading" data-t="loading">読み込み中...</div></div>
  </div>

  <div class="modal" id="modal">
    <div class="sheet">
      <div class="h"><div class="n" id="mName"></div><div class="s" id="mStatus"></div></div>
      <div class="b">
        <input type="text" class="memo" id="mMemo" placeholder="メモ（任意）" data-tph="memo">
        <div id="mBtns"></div>
        <button class="close" id="mClose" data-t="close">閉じる</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script src="./date-display.js?v=auth4" data-iz-date-display></script><script src="./config.js?v=auth2"></script>
  <script src="./api.js?v=auth2"></script>
  <script src="./i18n.js?v=auth3"></script>
  <script>
  (function () {
    'use strict';
    var CFG = window.APP_CONFIG;
    var TOKEN = localStorage.getItem(CFG.AUTH_STORAGE_PREFIX + 'mgmtToken') || '';
    if (!TOKEN) location.href = './manage.html';
    var video = document.getElementById('video');
    var stream = null, camReady = false;
    var employees = [], selected = null, lastGPS = null;
    var PENDING_PUNCH_ID = '', PENDING_PUNCH_SIG = '';

    function $(id){ return document.getElementById(id); }
    function p(n){ return (n<10?'0':'')+n; }

    async function apiPost(action, payload){
      var opts = Object.assign({ token:TOKEN }, payload||{});
      if(action==='punch'){ opts.__timeoutMs=10000; opts.__noInternalRetry=true; }
      var j = await API.post(action, opts);
      return j.data;
    }

    // ---- camera ----
    async function initCamera(){
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user' }, audio:false });
        video.srcObject = stream; camReady = true; hideBanner();
      } catch(e){
        camReady = false;
        showBanner(I18n.t('camDeny'), true);
      }
    }
    function capture(name){
      var w = video.videoWidth||640, h = video.videoHeight||480;
      var scale=Math.min(1,960/Math.max(w,h)); w=Math.max(1,Math.round(w*scale)); h=Math.max(1,Math.round(h*scale));
      var c = document.createElement('canvas'); c.width=w; c.height=h;
      var ctx = c.getContext('2d'); ctx.drawImage(video,0,0,w,h);
      var d = new Date();
      var stamp = window.DateDisplay ? DateDisplay.formatDateTime(d.toISOString()) : d.getFullYear()+'/'+p(d.getMonth()+1)+'/'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
      var bh = Math.max(48, Math.round(h*0.14));
      ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(0,h-bh,w,bh);
      ctx.fillStyle='#fff'; ctx.textBaseline='middle';
      ctx.font='bold '+Math.round(bh*0.34)+'px sans-serif'; ctx.fillText(name||'', 12, h-bh*0.66);
      ctx.font='bold '+Math.round(bh*0.30)+'px sans-serif'; ctx.fillText(stamp, 12, h-bh*0.28);
      return c.toDataURL('image/jpeg', 0.7);
    }

    // ---- gps ----
    function getGPS(){
      return new Promise(function(res){
        if(!navigator.geolocation) return res(null);
        navigator.geolocation.getCurrentPosition(
          function(pos){ res({ lat:pos.coords.latitude, lng:pos.coords.longitude }); },
          function(){ res(null); },
          { enableHighAccuracy:true, timeout:8000, maximumAge:15000 }
        );
      });
    }

    // ---- ui ----
    function showBanner(msg, err){ var b=$('banner'); b.textContent=msg; b.className='banner show'+(err?' err':''); }
    function hideBanner(){ $('banner').className='banner'; }
    function toast(msg, err){ var t=$('toast'); t.textContent=msg; t.className='toast show'+(err?' err':''); t.style.display='block'; setTimeout(function(){ t.style.display='none'; }, 3200); }

    var SMAP = { '未出勤':['s-out','stOut'], '勤務中':['s-work','stWork'], '休憩中':['s-break','stBreak'], '退勤済':['s-done','stDone'] };

    function render(){
      var area = $('area');
      if(!employees.length){ area.innerHTML = '<div class="emp" style="grid-column:1/-1;cursor:default;">'+I18n.t('noEmp')+'</div>'; return; }
      var html = '<div class="grid">';
      employees.forEach(function(e, i){
        var sm = SMAP[e.status] || SMAP['未出勤'];
        var action = e.canPunch === true ? ' onclick="__open('+i+')"' : '';
        html += '<div class="emp'+(e.canPunch===true?'':' view-only')+'"'+action+'><div class="nm">'+esc(e.name)+'</div><span class="stt '+sm[0]+'">'+I18n.t(sm[1])+'</span>'+(e.canPunch===true?'':'<div class="view-note">'+I18n.t('viewOnly')+'</div>')+'</div>';
      });
      html += '</div>';
      area.innerHTML = html;
    }
    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

    window.__open = function(i){
      selected = employees[i];
      if(!selected || selected.canPunch!==true){ selected=null; return; }
      $('mName').textContent = selected.name;
      var sm = SMAP[selected.status] || SMAP['未出勤'];
      $('mStatus').textContent = I18n.t(sm[1]);
      $('mMemo').value = '';
      var b = '';
      if(selected.status==='未出勤' || selected.status==='退勤済') b += '<button class="btn b-in" onclick="__punch(\'出勤\')">🟢 '+I18n.t('pIn')+'</button>';
      else if(selected.status==='勤務中'){ b += '<button class="btn b-bs" onclick="__punch(\'休憩開始\')">☕ '+I18n.t('pBs')+'</button>'; b += '<button class="btn b-out" onclick="__punch(\'退勤\')">🔴 '+I18n.t('pOut')+'</button>'; }
      else if(selected.status==='休憩中') b += '<button class="btn b-be" onclick="__punch(\'休憩終了\')">✅ '+I18n.t('pBe')+'</button>';
      $('mBtns').innerHTML = b;
      $('modal').classList.add('show');
    };
    function closeModal(){ $('modal').classList.remove('show'); selected=null; }
    $('mClose').onclick = closeModal;

    function DONE(type){ return ({ '出勤':I18n.t('dIn'), '退勤':I18n.t('dOut'), '休憩開始':I18n.t('dBs'), '休憩終了':I18n.t('dBe') })[type]; }
    function ERR(e){ return ({ too_far:I18n.t('eFar'), no_location:I18n.t('eLoc'), no_photo:I18n.t('ePhoto'), no_camera:I18n.t('eCam'), already_in:I18n.t('eIn'), not_in:I18n.t('eNotIn'), forbidden_self_punch_only:I18n.t('eSelf') })[e]; }
    function nextPunchId(){ return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():('punch-'+Date.now()+'-'+Math.random().toString(36).slice(2)); }
    function expectedStatus(type){ return ({ '出勤':'勤務中', '休憩開始':'休憩中', '休憩終了':'勤務中', '退勤':'退勤済' })[type]||''; }

    window.__punch = async function(type){
      if(!selected || selected.canPunch!==true) return;
      if(!camReady || !stream){ toast(I18n.t('camDeny'), true); return; }
      var btns = document.querySelectorAll('#mBtns .btn'); btns.forEach(function(b){ b.disabled=true; });
      var empId=selected.id, memo=$('mMemo').value;
      var sig=String(empId)+'|'+type+'|'+memo;
      if(!PENDING_PUNCH_ID || PENDING_PUNCH_SIG!==sig){ PENDING_PUNCH_ID=nextPunchId(); PENDING_PUNCH_SIG=sig; }
      try {
        var photo = capture(selected.name);
        var gps = await getGPS();
        var res = await apiPost('punch', { empId:empId, type:type, memo:memo, photo:photo, lat:gps&&gps.lat, lng:gps&&gps.lng, clientRequestId:PENDING_PUNCH_ID });
        if(res && res.success){ PENDING_PUNCH_ID=''; PENDING_PUNCH_SIG=''; closeModal(); toast('✅ '+(DONE(type)||I18n.t('done'))); loadEmployees(); }
        else {
          var e = res && res.error;
          var msg = ERR(e) || (I18n.t('errG')+(e?'（'+e+'）':''));
          if(e==='too_far' && res.dist!=null) msg += '（'+I18n.t('approx')+res.dist+'m / '+I18n.t('allow')+res.radius+'m）';
          PENDING_PUNCH_ID=''; PENDING_PUNCH_SIG='';
          toast(msg, true);
          btns.forEach(function(b){ b.disabled=false; });
        }
      } catch(err){
        try {
          var latest=await apiPost('getEmployeeStatuses', {});
          var mine=(latest||[]).find(function(e){ return String(e.id)===String(empId); });
          if(mine && mine.status===expectedStatus(type)){
            PENDING_PUNCH_ID=''; PENDING_PUNCH_SIG=''; employees=latest||[]; closeModal(); toast('✅ '+(DONE(type)||I18n.t('done'))); render(); return;
          }
        } catch(ignore){}
        toast(I18n.t('punchUnknown'), true); btns.forEach(function(b){ b.disabled=false; });
      }
    };

    var __loaded=false;
    function loadEmployees(){
      apiPost('getEmployeeStatuses', {}).then(function(d){ employees = d||[]; __loaded=true; render(); })
        .catch(function(e){ $('area').innerHTML = '<div class="loading" style="color:var(--red)">'+I18n.t('errPrefix')+esc(API.userErrorText(e))+'</div>'; });
    }

    function tick(){ var d=new Date(); $('now').textContent = '🕐 '+p(d.getHours())+':'+p(d.getMinutes()); }

    I18n.init({
      ja:{ back:'← 管理', title:'打刻', cam:'📷 カメラ', sub:'自分の名前をタップして出勤・退勤（写真と位置が記録されます）', loading:'読み込み中...', memo:'メモ（任意）', close:'閉じる',
        stOut:'未出勤', stWork:'勤務中', stBreak:'休憩中', stDone:'退勤済', viewOnly:'状態確認のみ',
        noEmp:'従業員が未登録です。管理→ユーザー管理/勤怠で登録してください。',
        pIn:'出勤', pOut:'退勤', pBs:'休憩開始', pBe:'休憩終了',
        dIn:'出勤しました', dOut:'お疲れさまでした', dBs:'休憩開始', dBe:'休憩終了', done:'完了',
        camDeny:'カメラを許可してください（打刻には写真が必要です）',
        eFar:'⛔ 店舗から離れています', eLoc:'⛔ 位置情報を許可してください', ePhoto:'⛔ 写真が撮れませんでした', eCam:'⛔ カメラを許可してください', eIn:'すでに出勤中です', eNotIn:'出勤していません', eSelf:'⛔ 自分の勤怠だけ打刻できます',
        errG:'エラー', errPrefix:'エラー: ', punchUnknown:'通信がタイムアウトしました。登録状況を確認できませんでした。同じボタンでもう一度試せます。', approx:'約', allow:'許容' },
      en:{ back:'← Manage', title:'Time Clock', cam:'📷 Camera', sub:'Tap your name to clock in/out (photo & location recorded)', loading:'Loading...', memo:'Memo (optional)', close:'Close',
        stOut:'Out', stWork:'Working', stBreak:'On break', stDone:'Clocked out', viewOnly:'Status only',
        noEmp:'No employees registered. Add them in Manage → Users/Attendance.',
        pIn:'Clock in', pOut:'Clock out', pBs:'Start break', pBe:'End break',
        dIn:'Clocked in', dOut:'Thanks for your work', dBs:'Break started', dBe:'Break ended', done:'Done',
        camDeny:'Please allow the camera (a photo is required to clock in)',
        eFar:'⛔ Too far from the store', eLoc:'⛔ Please allow location', ePhoto:'⛔ Could not take a photo', eCam:'⛔ Please allow the camera', eIn:'Already clocked in', eNotIn:'Not clocked in', eSelf:'⛔ You can only punch your own attendance',
        errG:'Error', errPrefix:'Error: ', punchUnknown:'The request timed out and the punch status could not be confirmed. You can safely tap the same button again.', approx:'approx ', allow:'limit ' }
    }, function(){ if(__loaded) render(); });

    tick(); setInterval(tick, 10000);
    initCamera();
    loadEmployees();
  })();
  </script>
  <script src="./help.js?v=auth2"></script>
  <script>
    HelpUI.register({
      title: '打刻画面の使い方',
      titleEn: 'How to use the Time Clock',
      items: [
        { ja: '① 画面を開くとカメラが起動します。打刻には顔写真の撮影が必須なので、カメラの利用を許可してください。', en: '① The camera starts automatically when you open this screen. A photo is required to clock in/out, so please allow camera access.' },
        { ja: '② 一覧から自分の名前をタップすると、出勤・休憩開始・休憩終了・退勤のボタンが表示されます（現在の状態によって表示されるボタンが変わります）。', en: '② Tap your own name from the list to see buttons for Clock in / Start break / End break / Clock out (the buttons shown depend on your current status).' },
        { ja: '③ 必要なメモがあれば「メモ（任意）」欄に入力してからボタンを押します。', en: '③ Enter an optional note in the memo field before tapping a button, if needed.' },
        { ja: '④ ボタンを押すと自動で写真を撮影し、位置情報（GPS）も取得して打刻を記録します。店舗から離れすぎている場合や位置情報・カメラが許可されていない場合はエラーになります。', en: '④ Tapping a button captures a photo and GPS location automatically to record the punch. It will show an error if you are too far from the store, or if location/camera access is not allowed.' },
        { ja: '⑤ 名前の下のバッジ（未出勤／勤務中／休憩中／退勤済）で各従業員の現在の状態を確認できます。', en: '⑤ The badge under each name (Out / Working / On break / Clocked out) shows each employee\'s current status.' },
        { ja: '⑥ 右上のEN／JPボタンで表示言語を、「← 管理」ボタンで管理画面に戻れます。', en: '⑥ Use the EN/JP button top-right to switch language, and "← Manage" to return to the management screens.' }
      ]
    });
  </script>
</body>
</html>
