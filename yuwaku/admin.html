<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Orders">

  <link rel="manifest" href="./admin.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <title>Orders</title>
  <style>
    :root{ --bg:#f6f7f9; --surface:#fff; --border:#e5e7eb; --navy:#0f172a; --text-3:#64748b; --red:#c62828; --green:#16a34a; }
    *{ box-sizing:border-box; }
    body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans JP',sans-serif; background:var(--bg); color:var(--navy); -webkit-tap-highlight-color:transparent; }
    .head{ position:sticky; top:0; z-index:20; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:space-between; padding:12px 16px; }
    .head h1{ font-size:18px; margin:0; font-weight:900; }
    .head .r{ display:flex; gap:8px; align-items:center; }
    .hbtn{ background:rgba(255,255,255,.14); color:#fff; border:0; border-radius:9px; padding:8px 12px; font-size:13px; font-weight:800; cursor:pointer; }
    .cnt{ background:#dc2626; border-radius:999px; padding:2px 10px; font-weight:900; font-size:13px; }
    .wrap{ padding:14px; max-width:900px; margin:0 auto; }
    .tg{ background:var(--surface); border:1px solid var(--border); border-radius:14px; margin-bottom:14px; overflow:hidden; }
    .tg-h{ display:flex; justify-content:space-between; align-items:center; gap:8px; padding:12px 14px; background:#0b1220; color:#fff; }
    .tg-h .ti{ font-size:17px; font-weight:900; display:flex; flex:1 1 auto; min-width:0; align-items:center; flex-wrap:wrap; gap:5px; }
    .tg-h .to{ font-size:16px; font-weight:900; color:#fbbf24; white-space:nowrap; flex:0 0 auto; }
    .row{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; padding:10px 14px; border-bottom:1px solid var(--border); }
    .row.served{ opacity:.55; }
    .row .m{ flex:1; min-width:0; }
    .row .tm{ font-size:11px; color:var(--text-3); }
    .row .it{ display:flex;align-items:center;gap:4px;min-width:0;font-size:14px; font-weight:600; margin-top:2px; max-width:100%; overflow:hidden; }
    .row .it .prepaid{flex:0 0 auto;white-space:nowrap}
    /* Allow one row per product while preserving ellipsis on ordinary controls. */
    .row .it [data-iz-ellipsis="item"]{white-space:pre-line;overflow:visible;text-overflow:clip;overflow-wrap:anywhere;font-size:13px;line-height:1.45;}
    #vdItem{white-space:pre-line;overflow-wrap:anywhere;}
    .row .rt{ display:flex; align-items:center; justify-content:flex-end; flex-wrap:wrap; gap:5px; flex:0 1 auto; max-width:50%; min-width:0; }
    .row .pr{ font-weight:900; max-width:100%; white-space:nowrap; overflow-x:auto; text-align:right; }
    /* Keep long item names and order actions in separate rows on narrow devices. */
    @media (max-width:480px){
      .tg .row{ flex-direction:column; align-items:stretch; }
      .tg .row .m{ width:100%; }
      .tg .row .rt{ width:100%; max-width:none; justify-content:flex-start; }
      .tg .row .pr{ margin-right:auto; text-align:left; }
      .tg .row .b-xs{ min-height:44px; white-space:nowrap; }
    }
    .b-xs{ border:0; border-radius:8px; padding:8px 12px; font-size:13px; font-weight:800; cursor:pointer; font-family:inherit; }
    .b-warn{ background:#f59e0b; color:#0f172a; }
    .served-lbl{ font-size:12px; color:var(--green); font-weight:800; }
    .prepaid{ background:#dcfce7; color:#15803d; font-weight:800; font-size:11px; padding:1px 7px; border-radius:999px; }
    .tg-a{ padding:12px 14px; }
    .tg-fees{padding:9px 14px 11px;border-top:1px solid var(--border);background:var(--surface);font-size:12px;}
    .tg-fees-title{font-weight:900;margin-bottom:5px;color:var(--text-2);}
    .tg-fees-line{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 12px;padding:3px 0;align-items:center;}
    .tg-fees-line > span:nth-child(2){white-space:nowrap;font-weight:800;font-variant-numeric:tabular-nums;}
    .tg-fees-included{font-size:11px;color:var(--text-3);}
    .tg-arrivals{padding:9px 14px;border-bottom:1px solid var(--border);background:#f8fafc;font-size:12px;}
    .tg-arrivals-title{font-weight:800;color:#475569;margin-bottom:5px;}
    .tg-arrivals-line{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 10px;padding:3px 0;}
    .tg-arrivals-time{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;}
    .b-pay{ width:100%; border:0; border-radius:11px; padding:13px; font-size:14px; font-weight:900; background:var(--green); color:#fff; cursor:pointer; font-family:inherit; }
    .empty{ text-align:center; color:var(--text-3); padding:50px 20px; font-weight:700; }
    .ov{ position:fixed; inset:0; background:rgba(0,0,0,.62); z-index:9999; display:none; align-items:center; justify-content:center; }
    .ov.on{ display:flex; }
    @keyframes checkoutSpin{to{transform:rotate(360deg)}}
    .checkout-spinner{width:16px;height:16px;border:3px solid #cbd5e1;border-top-color:#2563eb;border-radius:50%;animation:checkoutSpin .75s linear infinite;flex:0 0 auto}
    .card{ background:#fff; border-radius:18px; padding:22px; max-width:340px; width:calc(100% - 32px); margin:16px; max-height:90vh; overflow:auto; }
    .sum{ background:#f8fafc; border:1px solid #e2e8f0; border-radius:10px; padding:14px; margin-bottom:16px; }
    .sr{ display:flex; justify-content:space-between; font-size:13px; color:#555; margin-bottom:3px; }
    .big{ font-size:22px; font-weight:900; color:var(--red); margin-top:4px; }
    .pbtn{ border:0; padding:15px; font-size:15px; font-weight:800; border-radius:12px; cursor:pointer; color:#fff; font-family:inherit; width:100%; margin-bottom:10px; }
    .cancel{ width:100%; padding:11px; background:none; border:1.5px solid #ddd; border-radius:9px; color:#888; font-size:14px; cursor:pointer; font-weight:700; font-family:inherit; }
    .alert{ display:none; padding:11px; border-radius:9px; font-size:13px; margin-bottom:10px; text-align:left; line-height:1.5; }
    .calls-box{ background:#fffbeb; border:1px solid #fcd34d; border-radius:12px; padding:10px 12px; }
    .calls-h{ font-weight:900; font-size:13px; color:#92400e; margin-bottom:6px; }
    .call-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:5px 0; font-size:14px; font-weight:700; border-top:1px solid #fde68a; }
    .call-row > span{ min-width:0; overflow-wrap:anywhere; }
    .call-row > .b-xs{ flex:0 0 auto; white-space:nowrap; }
    .call-row:first-of-type{ border-top:0; }
    .dwell{ font-size:11px; font-weight:800; color:#0f766e; background:#ccfbf1; border-radius:6px; padding:1px 6px; }
    .entry-edit-btn{ flex:0 0 auto; min-width:34px; min-height:34px; border:1px solid #64748b; border-radius:8px; background:#243247; color:#fff; font:inherit; font-size:15px; cursor:pointer; }
    .entry-edit-btn:disabled{opacity:.45;cursor:not-allowed;}
    .entry-input{width:100%;min-height:44px;box-sizing:border-box;padding:10px;border:1px solid #cbd5e1;border-radius:9px;font:inherit;font-size:15px;}
    .entry-time-date{display:flex;gap:6px;align-items:start;min-width:0;}
    .entry-time-date .entry-time-field{flex:1 1 0;min-width:0;}
    .entry-time-clock{display:flex;gap:8px;margin-top:8px;}
    .entry-time-clock .entry-time-field{flex:1;min-width:0;}
    .entry-time-field span{display:block;font-size:11px;font-weight:800;color:#475569;margin-bottom:4px;}
    .entry-time-field select{width:100%;min-width:0;height:44px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;color:#0f172a;font:inherit;font-size:15px;padding:6px 2px;}
    .ctlbar{ display:flex; align-items:center; gap:10px; padding:10px 16px; flex-wrap:wrap; position:sticky; top:0; z-index:15; background:var(--bg,#f6f7f9); border-bottom:1px solid #e5e7eb; }
    .auto-toggle{ border:0; border-radius:12px; padding:12px 20px; font-size:16px; font-weight:900; cursor:pointer; font-family:inherit; min-width:150px; }
    .auto-toggle.on{ background:#16a34a; color:#fff; } .auto-toggle.off{ background:#e2e8f0; color:#64748b; }
    .int-group{ display:flex; gap:6px; }
    .int-btn{ border:1px solid #cbd5e1; background:#fff; color:#334155; border-radius:9px; padding:9px 13px; font-size:14px; font-weight:800; cursor:pointer; font-family:inherit; }
    .int-btn.on{ background:#0f172a; color:#fff; border-color:#0f172a; }
    @keyframes izspin2{ to{ transform:rotate(360deg); } }
    .spin-once{ display:inline-block; animation:izspin2 .6s linear; }
    #izToast{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px); background:#0f172a; color:#fff; font-size:13px; font-weight:800; padding:10px 18px; border-radius:999px; box-shadow:0 8px 24px rgba(0,0,0,.25); z-index:100000; opacity:0; pointer-events:none; transition:opacity .18s, transform .18s; }
    #izToast.on{ opacity:1; transform:translateX(-50%) translateY(0); }
    #opsReadError{display:none;margin:10px 14px 0;padding:12px 14px;border:1px solid #fca5a5;border-radius:10px;background:#fef2f2;color:#991b1b;font-size:13px;line-height:1.5;font-weight:700;}
    #opsReadError.on{display:block;}
  /* Formal Android PT-CTL touch target: independent of common header injection. */
  #autoBtn{min-height:44px;min-width:44px;box-sizing:border-box}
  </style>
  <link rel="stylesheet" href="./ui-ellipsis.css?v=1">
</head>
<body>
  <div class="head">
    <h1 id="title">注文管理</h1>
    <div class="r">
      <span class="cnt" id="headClock" style="background:transparent;font-weight:700;font-variant-numeric:tabular-nums;"></span>
      <a class="hbtn" href="./manage.html">← 管理</a>
      <span class="cnt" id="cnt">0</span>
      <button class="hbtn" id="langBtn" data-tlang onclick="I18n.toggle()">EN</button>
      <button class="hbtn" id="refreshBtn" onclick="manualRefresh()">↻</button>
    </div>
  </div>
  <div class="ctlbar">
    <button id="autoBtn" class="auto-toggle" onclick="toggleAuto()">—</button>
    <div class="int-group" id="intGroup"></div>
    <button class="int-btn" onclick="manualRefresh()" id="manualBtn">↻</button>
    <a class="int-btn" href="./receipts.html" style="text-decoration:none;display:inline-flex;align-items:center;">🧾 <span id="histLbl" style="margin-left:4px;">履歴</span></a>
  </div>
  <div class="wrap" id="callsWrap" style="display:none;"></div>
  <div id="opsReadError" role="alert" aria-live="assertive" aria-atomic="true"></div>
  <div id="offlineCashStatus" class="wrap" role="status" aria-live="polite" style="display:none;margin-top:8px;margin-bottom:8px;"></div>
  <div id="checkoutResumeStatus" class="wrap" role="status" aria-live="polite" style="display:none;"></div>
  <div class="wrap" id="list"><div class="empty" id="loadMsg">読み込み中…</div></div>

  <!-- Payment modal -->
  <div class="ov" id="payModal">
    <div class="card">
      <div id="ps1">
        <div style="font-size:17px;font-weight:900;margin-bottom:12px;" id="ps1t">お会計</div>
        <div class="sum" id="paySum"></div>
        <div id="payScWarning" hidden role="alert" aria-live="polite" style="border:1px solid #fed7aa;background:#fff7ed;color:#9a3412;border-radius:10px;padding:9px 10px;margin-bottom:10px;font-size:12px;font-weight:700;"></div>
        <div id="payDisc" style="border:1px solid #e5e7eb;border-radius:10px;padding:10px;margin-bottom:10px;font-size:13px;">
          <label style="display:flex;gap:8px;align-items:center;font-weight:800;cursor:pointer;"><input type="checkbox" id="dcOn" onchange="recompPay()"><span id="dcLbl">割引</span></label>
          <div id="dcBody" style="display:none;margin-top:8px;">
            <div style="margin-bottom:8px;"><select id="dcRule" onchange="recompPay()" style="width:100%;padding:8px;border:1px solid #e5e7eb;border-radius:8px;font-family:inherit;"></select></div>
            <div style="display:flex;gap:8px;margin-bottom:6px;">
              <input id="dcName" placeholder="対象者氏名" style="flex:1;padding:8px;border:1px solid #e5e7eb;border-radius:8px;font-family:inherit;">
              <input id="dcId" placeholder="ID番号" style="flex:1;padding:8px;border:1px solid #e5e7eb;border-radius:8px;font-family:inherit;">
            </div>
            <div style="display:flex;gap:8px;">
              <input id="dcElig" type="number" min="0" step="any" placeholder="対象額" style="width:120px;padding:8px;border:1px solid #e5e7eb;border-radius:8px;font-family:inherit;" oninput="recompPay()">
            </div>
            <div id="dcNote" style="color:#64748b;margin-top:6px;"></div>
            <div id="dcApprBox" style="margin-top:10px;padding-top:10px;border-top:1px dashed #e5e7eb;">
              <div id="dcApprL" style="font-size:12px;font-weight:800;margin-bottom:4px;">承認者（マネージャー以上のログイン）</div>
              <div style="display:flex;gap:8px;">
                <input id="dcApprLogin" placeholder="ログインID" autocomplete="off" style="flex:1;padding:8px;border:1px solid #e5e7eb;border-radius:8px;font-family:inherit;">
                <input id="dcApprPass" type="password" placeholder="パスワード" autocomplete="off" style="flex:1;padding:8px;border:1px solid #e5e7eb;border-radius:8px;font-family:inherit;">
              </div>
              <div id="dcApprAlert" style="display:none;color:#b91c1c;margin-top:6px;font-weight:700;"></div>
            </div>
          </div>
        </div>
        <div hidden aria-hidden="true" style="display:none;margin-bottom:10px;"><input id="payEmail" type="email" placeholder="e-receipt email (任意)" autocomplete="off" tabindex="-1" style="width:100%;padding:9px;border:1px solid #e5e7eb;border-radius:8px;font-family:inherit;box-sizing:border-box;"></div>
        <button class="pbtn" id="payBtnGcash" style="background:linear-gradient(135deg,#0f4c81,#1565c0);" onclick="gcashPay()">📱 <span id="qrPayLbl">QR決済</span></button>
        <button class="pbtn" id="payBtnCard" style="background:linear-gradient(135deg,#2e7d32,#43a047);" onclick="cardPay()">💳 <span id="cardPayLbl">カード</span></button>
        <button class="pbtn" id="payBtnCash" style="background:#334155;" onclick="cashPay()">💴 <span id="cashLbl">現金</span></button>
        <button class="cancel" onclick="closePay()" id="cxl1">キャンセル</button>
      </div>
      <div id="ps2" style="display:none;text-align:center;">
        <div style="font-size:17px;font-weight:900;margin-bottom:4px;" id="ps2t">QR決済</div>
        <div style="display:inline-block;padding:8px;border:2px solid #e0e8f5;border-radius:12px;margin-bottom:12px;">
          <img id="payQr" src="" alt="QR" style="width:200px;height:200px;display:none;border-radius:6px;">
        </div>
        <div id="ps2hint" style="font-size:12px;color:#64748b;margin-bottom:12px;"></div>
        <button class="pbtn" style="background:#f59e0b;color:#0f172a;" onclick="confirmGcashPaid()" id="checkBtn">入金を確認した</button>
        <div class="alert" id="payAlert"></div>
        <button class="cancel" onclick="closePay()">キャンセル</button>
      </div>
      <div id="ps3" style="display:none;text-align:center;padding:12px 0;">
        <div style="font-size:40px;">✅</div>
        <div id="ps3lbl" style="font-weight:800;margin:8px 0;"></div>
        <div id="ps3amt" style="font-size:20px;font-weight:900;color:var(--green);margin-bottom:16px;"></div>
        <div id="cashTenderBox" style="display:none;text-align:left;margin-bottom:14px;">
          <label for="cashTender" style="display:block;font-size:13px;font-weight:800;margin-bottom:5px;" id="cashTenderLabel">お預かり現金</label>
          <input id="cashTender" type="text" inputmode="decimal" autocomplete="off" oninput="validateCashTender()" style="width:100%;font-size:18px;padding:10px;border:1px solid #cbd5e1;border-radius:8px;box-sizing:border-box;">
          <div id="cashChange" aria-live="polite" style="font-size:14px;margin-top:6px;font-weight:800;"></div>
        </div>
        <button class="pbtn" style="background:var(--green);" onclick="finalize()" id="doneBtn">完了（会計済にする）</button>
        <div id="checkoutSendProgress" role="status" aria-live="polite" style="display:none;align-items:center;justify-content:center;gap:8px;margin:8px 0;font-weight:800;font-size:13px;"><span class="checkout-spinner" aria-hidden="true"></span><span id="checkoutProgressCount"></span></div>
        <button class="cancel" onclick="closePay()" id="cxl3">キャンセル</button>
      </div>
    </div>
  </div>

  <!-- Editable entry clock: checkout completion remains automatic. -->
  <div class="ov" id="entryTimeModal" role="dialog" aria-modal="true" aria-labelledby="entryTimeTitle">
    <div class="card">
      <div id="entryTimeTitle" style="font-size:17px;font-weight:900;margin-bottom:12px;">入場時刻を修正</div>
      <div id="entryTimeSeat" style="font-weight:800;margin-bottom:10px;"></div>
      <div id="entryTimeLabel" style="display:block;font-size:13px;font-weight:800;margin-bottom:5px;">入場日時</div>
      <!-- The native iOS datetime-local UI follows the handset locale even when the app is EN. -->
      <input id="entryTimeInput" type="datetime-local" step="60" hidden tabindex="-1" aria-hidden="true">
      <div id="entryTimePicker" role="group" aria-labelledby="entryTimeLabel" onchange="syncEntryTimeFromControls()">
        <div class="entry-time-date">
          <label id="entryTimeYearField" class="entry-time-field"><span id="entryTimeYearLabel">年</span><select id="entryTimeYear" aria-labelledby="entryTimeYearLabel"></select></label>
          <label id="entryTimeMonthField" class="entry-time-field"><span id="entryTimeMonthLabel">月</span><select id="entryTimeMonth" aria-labelledby="entryTimeMonthLabel"></select></label>
          <label id="entryTimeDayField" class="entry-time-field"><span id="entryTimeDayLabel">日</span><select id="entryTimeDay" aria-labelledby="entryTimeDayLabel"></select></label>
        </div>
        <div class="entry-time-clock">
          <label class="entry-time-field"><span id="entryTimeHourLabel">時</span><select id="entryTimeHour" aria-labelledby="entryTimeHourLabel"></select></label>
          <label class="entry-time-field"><span id="entryTimeMinuteLabel">分</span><select id="entryTimeMinute" aria-labelledby="entryTimeMinuteLabel"></select></label>
        </div>
      </div>
      <div id="entryTimeHint" style="font-size:12px;color:#64748b;line-height:1.5;margin:9px 0 12px;"></div>
      <div id="entryTimeError" role="alert" style="font-size:12px;color:#b91c1c;font-weight:700;margin-bottom:8px;" aria-live="polite"></div>
      <button id="entryTimeSave" class="pbtn" style="background:#0f766e;" type="button" onclick="saveEntryTime()">保存</button>
      <button id="entryTimeCancel" class="cancel" type="button" onclick="closeEntryTime()">キャンセル</button>
    </div>
  </div>

  <!-- Partial checkout modal -->
  <!-- Staff-only correction of a mistaken headcount. A departure is never
       inferred from this operation; the billed arrival cohorts are corrected. -->
  <div class="ov" id="partyCorrectionModal" role="dialog" aria-modal="true" aria-labelledby="partyCorrectionTitle">
    <div class="card">
      <div id="partyCorrectionTitle" style="font-size:17px;font-weight:900;margin-bottom:12px;">オーダー訂正 — 人数</div>
      <div id="partyCorrectionSeat" style="font-weight:800;margin-bottom:10px;"></div>
      <label for="partyCorrectionCount" id="partyCorrectionCountLabel" style="font-size:13px;font-weight:800;display:block;margin-bottom:5px;">正しい人数</label>
      <select id="partyCorrectionCount" class="entry-input" style="margin-bottom:12px;"></select>
      <label for="partyCorrectionReason" id="partyCorrectionReasonLabel" style="font-size:13px;font-weight:800;display:block;margin-bottom:5px;">訂正理由（必須）</label>
      <input id="partyCorrectionReason" class="entry-input" maxlength="300" autocomplete="off" style="margin-bottom:8px;">
      <p id="partyCorrectionHint" style="font-size:12px;color:#64748b;line-height:1.5;margin:0 0 12px;"></p>
      <div id="partyCorrectionError" role="alert" aria-live="polite" style="font-size:12px;color:#b91c1c;font-weight:700;margin-bottom:8px;"></div>
      <button id="partyCorrectionSave" class="pbtn" type="button" style="background:#0f766e;" onclick="savePartyCorrection()">人数を訂正して再計算</button>
      <button id="partyCorrectionCancel" class="cancel" type="button" onclick="closePartyCorrection()">キャンセル</button>
    </div>
  </div>

  <!-- Each correction is scoped to a single active order or visit. -->
  <div class="ov" id="orderItemCorrectionModal" role="dialog" aria-modal="true" aria-labelledby="orderItemCorrectionTitle">
    <div class="card">
      <div id="orderItemCorrectionTitle" style="font-size:17px;font-weight:900;margin-bottom:10px;">商品明細の訂正</div>
      <div id="orderItemCorrectionSeat" style="font-size:12px;margin-bottom:8px;"></div>
      <label for="orderItemCorrectionSelect" style="display:block;font-weight:800;margin-bottom:5px;" id="orderItemCorrectionSelectLbl">訂正する商品</label>
      <select id="orderItemCorrectionSelect" class="entry-input" onchange="showOrderItemCorrectionSelection()" style="margin-bottom:9px;"></select>
      <label for="orderItemCorrectionQty" style="display:block;font-weight:800;margin-bottom:5px;" id="orderItemCorrectionQtyLbl">数量</label>
      <input id="orderItemCorrectionQty" class="entry-input" type="number" inputmode="numeric" min="1" max="99" step="1" style="margin-bottom:9px;">
      <label for="orderItemCorrectionPrice" style="display:block;font-weight:800;margin-bottom:5px;" id="orderItemCorrectionPriceLbl">単価</label>
      <input id="orderItemCorrectionPrice" class="entry-input" type="number" inputmode="decimal" min="0" step="any" style="margin-bottom:9px;">
      <label for="orderItemCorrectionReason" style="display:block;font-weight:800;margin-bottom:5px;" id="orderItemCorrectionReasonLbl">訂正理由（必須）</label>
      <input id="orderItemCorrectionReason" class="entry-input" maxlength="300" style="margin-bottom:9px;" autocomplete="off">

    // 2026-08-24修正: バックエンドが返す注文日時はSQLiteのdatetime('now')によるUTC時刻

    function toUtcDate(d){

    function breakdown(subtotal){

    // [C1修正] Senior/PWD割引の計算式。src/billing.js の seniorPwdCalc と必ず同じ式にすること
    // （2026-08-25: GAS版ManagementSystemDev/code.jsは完全廃止済み。現在の正はsrc/billing.js）
    // （画面プレビューと会計確定額がズレていた不具合の修正。片方だけ直すと再びズレる）。
    function seniorPwdCalc(subtotal, eligible, b){
      var taxRate = Number(SETTINGS.taxRate)||0, taxIncl = String(SETTINGS.taxInclusive)==='true';
      var r = taxRate/100;
      var netEligible = taxIncl ? (eligible/(1+r)) : eligible;
      var discount20 = roundCharge(netEligible*0.20);
      var vatExempt;
      if (taxIncl){ vatExempt = roundCharge(eligible - netEligible); }
      else {
        var nonEligibleAfterSvc = Math.max(0, b.afterSvc - eligible);
        var vatCorrect = roundCharge(nonEligibleAfterSvc*r);
        vatExempt = Math.max(0, b.tax - vatCorrect);
      }
      var totalDiscount = discount20 + vatExempt;
      var nonEligibleSub = Math.max(0, subtotal - eligible);
      var vatDisplay = taxIncl ? roundCharge(nonEligibleSub - nonEligibleSub/(1+r)) : roundCharge(nonEligibleSub*r);
      var total = Math.max(0, b.total - totalDiscount);
      return { discountAmount: totalDiscount, vat: vatDisplay, total: total };
    }
    function selectedDiscountRule(){ var id=document.getElementById('dcRule').value; return DISCOUNT_RULES.find(function(r){return String(r.id)===String(id);})||null; }
    function genericDiscountCalc(subtotal, eligible, b, rule){
      if(rule.legacyType) return seniorPwdCalc(subtotal,eligible,b);
      var taxRate=Math.max(0,Number(SETTINGS.taxRate)||0)/100,taxIncl=String(SETTINGS.taxInclusive)==='true';
      var netEligible=(rule.taxExempt&&taxIncl&&taxRate>0)?eligible/(1+taxRate):eligible;
      var base=rule.taxExempt?netEligible:eligible;
      var ordinary=rule.calculationType==='fixed'?roundCharge(Math.min(Number(rule.value)||0,base)):roundCharge(base*(Number(rule.value)||0)/100);
      var taxExemption=0,vat=b.tax;
      if(rule.taxExempt){if(taxIncl)taxExemption=roundCharge(eligible-netEligible);else{var correct=roundCharge(Math.max(0,b.afterSvc-eligible)*taxRate);taxExemption=Math.max(0,b.tax-correct);}var nonEligible=Math.max(0,subtotal-eligible);vat=taxIncl?roundCharge(nonEligible-nonEligible/(1+taxRate)):roundCharge(nonEligible*taxRate);}
      var amount=roundCharge(ordinary+taxExemption);return {discountAmount:amount,vat:vat,total:Math.max(0,roundCharge(b.total-amount))};
    }

        '<div style="font-size:40px;">✅</div>'
        + '<div id="ps3lbl" style="font-weight:800;margin:8px 0;"></div>'
        + '<div id="ps3amt" style="font-size:20px;font-weight:900;color:var(--green);margin-bottom:16px;"></div>'
        + '<div id="cashTenderBox" style="display:none;text-align:left;margin-bottom:14px;">'
        + '<label for="cashTender" id="cashTenderLabel" style="display:block;font-size:13px;font-weight:800;margin-bottom:5px;"></label>'
        + '<input id="cashTender" type="text" inputmode="decimal" autocomplete="off" oninput="validateCashTender()" style="width:100%;font-size:18px;padding:10px;border:1px solid #cbd5e1;border-radius:8px;box-sizing:border-box;">'
        + '<div id="cashChange" aria-live="polite" style="font-size:14px;margin-top:6px;font-weight:800;"></div></div>'
        + '<button class="pbtn" style="background:var(--green);" onclick="finalize()" id="doneBtn">'+t().done+'</button>'
        + '<div id="checkoutSendProgress" role="status" aria-live="polite" style="display:none;align-items:center;justify-content:center;gap:8px;margin:8px 0;font-weight:800;font-size:13px;"><span class="checkout-spinner" aria-hidden="true"></span><span id="checkoutProgressCount"></span></div>'
        + '<button class="cancel" onclick="closePay()" id="cxl3">'+t().cancel+'</button>';
    }

    // [要望対応] シニア/PWD割引を使う場合、実際の支払い開始（現金確定・オンライン決済QR発行）より前に
    // マネージャー以上の承認を必須にする。オンライン決済は先に決済が動いてしまうため、
    // finalizeBillでの検証だけに頼らず、ここで事前確認する（finalizeBill側も二重防御として必ず再検証する）。
    function _dcAlert(msg){ var a=document.getElementById('dcApprAlert'); a.style.display='block'; a.innerText=msg; }
    function _dcLengthError(){
      var fields=[['dcId',60,'Discount ID'],['dcName',60,'Discount name'],['dcApprLogin',100,'Approver login']];
      for(var i=0;i<fields.length;i++){
        var f=fields[i],el=document.getElementById(f[0]);
        if(el&&el.value.length>f[1]){
          _dcAlert(lang==='en'?f[2]+' must be '+f[1]+' characters or fewer.':f[2]+'は'+f[1]+'文字以内で入力してください。');
          el.focus();return true;
        }
      }
      var rule=selectedDiscountRule();
      if(rule&&String(rule.id||'').length>80){_dcAlert(lang==='en'?'Discount rule ID is too long.':'割引ルールIDが長すぎます。');return true;}
      return false;
    }
    function _dcVerifyThenGo(proceedFn){
      var on = document.getElementById('dcOn').checked;
      if (!on) { proceedFn(); return; }
      if(_dcLengthError())return;
      var rule=selectedDiscountRule();
      if(!rule){_dcAlert('Discount rule is required');return;}
      if(rule.idRequired && !document.getElementById('dcId').value.trim()){_dcAlert(lang==='en'?'ID is required':'ID番号を入力してください');return;}
      if(!rule.managerApprovalRequired){proceedFn();return;}
      if(currentUserCanApprove()){document.getElementById('dcApprAlert').style.display='none';proceedFn();return;}
      var login = document.getElementById('dcApprLogin').value.trim();
      var pass = document.getElementById('dcApprPass').value;
      if (!login || !pass) { _dcAlert(t().discNeedAppr); return; }
      document.getElementById('dcApprAlert').style.display='none';
      API.post('verifyManagerApproval', { login: login, pass: pass, token: TOKEN }).then(function(r){
        var d = r.data || {};
        if (d.error==='discount_auth'){ _dcAlert(t().authFail); return; }
        if (d.error==='discount_not_manager'){ _dcAlert(t().discNotManager); return; }
        if (d.error){ _dcAlert('Error: '+API.userErrorText(d.error)); return; }
        proceedFn();
      }).catch(function(e){ _dcAlert('Error: '+API.userErrorText(e)); });
    }
    // Tender is for change calculation only; the server recomputes the bill.
    window.validateCashTender = function(){
      var box=document.getElementById('cashTenderBox');
      if(!box||box.style.display==='none')return true;
      var el=document.getElementById('cashTender'),status=document.getElementById('cashChange');
      var digits=Object.prototype.hasOwnProperty.call(SETTINGS,'currencyDecimalDigits')
        ?Math.max(0,Math.min(3,Number(SETTINGS.currencyDecimalDigits)||0)):0;
      var scale=Math.pow(10,digits),raw=String(el.value||'').trim();
      var valid=/^(?:0|[1-9]\d*)(?:\.\d+)?$/.test(raw)&&
        raw.length<=16&&(!raw.includes('.')||raw.split('.')[1].length<=digits);
      var cents=valid?Math.round(Number(raw)*scale):NaN;
      var due=Math.round(Number(payTotal)*scale);
      valid=valid&&Number.isSafeInteger(cents)&&cents>=due&&
        Number.isSafeInteger(due)&&due>=0;
      var button=document.getElementById('doneBtn');
      if(button&&!checkoutFinalizeBusy)button.disabled=!valid;
      status.style.color=valid?'#15803d':'#b91c1c';
      status.innerText=valid
        ?(lang==='en'?'Change: ':'お釣り：')+money((cents-due)/scale)
        :(lang==='en'?'Enter cash received (at least the total, valid currency decimals).'
          :'受取金額が不足、マイナス、または通貨の小数桁が不正です。');
      return valid;
    };
    window.cashPay = function(){
      if(typeof navigator!=='undefined'&&navigator.onLine===false){UIAlert(offlineCheckoutWarning());return;}
      _dcVerifyThenGo(function(){
        payMethod = 'cash';
        document.getElementById('ps3lbl').innerText = t().cashRecv;
        document.getElementById('ps3amt').innerText = money(payTotal)+' — '+seatLabel(payTable);
        document.getElementById('doneBtn').innerText = t().done;
        var digits=Object.prototype.hasOwnProperty.call(SETTINGS,'currencyDecimalDigits')
          ?Math.max(0,Math.min(3,Number(SETTINGS.currencyDecimalDigits)||0)):0;
        document.getElementById('cashTenderBox').style.display='block';
        document.getElementById('cashTenderLabel').innerText=lang==='en'?'Cash received':'お預かり現金';
        document.getElementById('cashTender').value=Number(payTotal).toFixed(digits);
        step(3);
        validateCashTender();
      });
    };
    // 2026-08-23: クレジットカードは通常、別のカード決済端末で処理される想定のため、この画面では
    // 「カード決済ボタンを押した＝店舗側の別端末で決済済み」という扱いで、そのまま完了画面(ps3)へ進む。
    // PayMongo等の決済APIとの連携は行わない（設定画面でボタン自体の表示可否のみ制御する）。
    window.cardPay = function(){
      if(typeof navigator!=='undefined'&&navigator.onLine===false){UIAlert(offlineCheckoutWarning());return;}
      _dcVerifyThenGo(function(){
        payMethod = 'card';
        document.getElementById('ps3lbl').innerText = settingLoc('cardPaymentInstruction',t().cardRecv);
        document.getElementById('ps3amt').innerText = money(payTotal)+' — '+seatLabel(payTable);
        document.getElementById('doneBtn').innerText = t().done;
        step(3);
      });
    };
    // 2026-08-23: GCashは設定画面に登録した店舗側の送金先QRコード画像をそのまま表示するだけの
    // 簡易な仕組み。決済APIとの連携は行わず、入金確認は従来どおりスタッフが目視で行い、
    // 「入金を確認した」ボタンを押すと会計完了画面(ps3)へ進む。
    window.gcashPay = function(){
      if(typeof navigator!=='undefined'&&navigator.onLine===false){UIAlert(offlineCheckoutWarning());return;}
      _dcVerifyThenGo(function(){
        payMethod = 'gcash';
        document.getElementById('ps2t').innerText = settingLoc('qrPaymentLabel',t().qrPayment);
        var qr = SETTINGS.gcashQr || '';
        var img = document.getElementById('payQr');
        if (qr){ img.src = qr; img.style.display='block'; } else { img.style.display='none'; }
        document.getElementById('ps2hint').innerText = settingLoc('qrPaymentInstruction',t().gcashHint);
        document.getElementById('checkBtn').innerText = t().gcashConfirm;
        document.getElementById('payAlert').style.display='none';
        step(2);
      });
    };
    window.confirmGcashPaid = function(){
      if(typeof navigator!=='undefined'&&navigator.onLine===false){UIAlert(offlineCheckoutWarning());return;}
      document.getElementById('ps3lbl').innerText = t().confirmed;
      document.getElementById('ps3amt').innerText = money(payTotal)+' — '+seatLabel(payTable);
      document.getElementById('doneBtn').innerText = t().done;
      step(3);
    };
    function checkoutUnconfirmedMessage(){
      return lang==='en'
        ?'Checkout result is not confirmed. Do not charge again. Check the receipt history or tap Check status after reconnecting.'
        :'会計結果を確認できません。再会計せず、領収書履歴を確認するか、通信復旧後に「会計状況を確認」を押してください。';
    }
    function setCheckoutSendProgress(active,phase){
      var progress=document.getElementById('checkoutSendProgress');
      if(progress){
        progress.style.display=active?'flex':'none';
        var label=document.getElementById('checkoutProgressCount');
        if(label)label.textContent=active
          ?(phase==='outcome'
            ?(lang==='en'?'Checking checkout 1/1':'会計照会中 1/1')
            :(lang==='en'?'Sending checkout 1/1':'会計送信中 1/1')):'';
      }
      var cancel=document.getElementById('cxl3');
      if(cancel)cancel.disabled=!!active;
    }
    function checkCheckoutOutcome(){
      if(checkoutOutcomeChecking)return Promise.resolve();
      if(!payRecoveryOrderIds.length){UIAlert(checkoutUnconfirmedMessage());return Promise.resolve();}
      if(typeof navigator!=='undefined'&&navigator.onLine===false){
        UIAlert(checkoutUnconfirmedMessage());return Promise.resolve();
      }
      var ids=payRecoveryOrderIds.slice(),table=payTable,btn=document.getElementById('doneBtn');
      checkoutOutcomeChecking=true;
      if(btn){btn.disabled=true;btn.innerText=t().checking;}
      setCheckoutSendProgress(true,'outcome');
      return API.post('getCheckoutOutcome',{token:TOKEN,table:table,orderIds:ids,
        __silent:true,__noInternalRetry:true,__timeoutMs:API.TIMEOUT_MS.read})
        .then(function(r){
          var d=r&&r.data||{};
          if(payTable!==table||JSON.stringify(payRecoveryOrderIds)!==JSON.stringify(ids))return;
          if(d.status==='settled'&&d.recovered===true&&d.orNo&&
            d.table===table&&Number.isFinite(Number(d.total))){
            checkoutOutcomeUnknown=false;
            CheckoutResume.mark(table,ids);
            showReceipt(d.orNo,{table:table,method:d.method,subtotal:d.subtotal,
              vat:d.vat,service:d.service,discountAmount:d.discountAmount,
              discountType:d.discountType,total:d.total});
            // Readback must never enqueue or automatically print a second receipt.
            UIAlert(lang==='en'?'Checkout was already completed. The saved receipt has been recovered.'
              :'会計はすでに完了しています。保存済みの領収書を復元しました。');
            return;
          }
          checkoutOutcomeUnknown=true;
          UIAlert(checkoutUnconfirmedMessage());
        }).catch(function(){checkoutOutcomeUnknown=true;UIAlert(checkoutUnconfirmedMessage());})
        .finally(function(){
          checkoutOutcomeChecking=false;
          setCheckoutSendProgress(false);
          var current=document.getElementById('doneBtn');
          if(current){current.disabled=false;current.innerText=checkoutOutcomeUnknown?
            (lang==='en'?'🔎 Check checkout status':'🔎 会計状況を確認'):t().done;}
        });
    }
    window.finalize = function(){
      if(offlineCashBusy||checkoutFinalizeBusy||checkoutOutcomeChecking)return;
      if(checkoutOutcomeUnknown)return checkCheckoutOutcome();
      if(payMethod==='cash'&&!validateCashTender())return;
      if(typeof navigator!=='undefined'&&navigator.onLine===false){
        UIAlert(offlineCheckoutWarning());return;
      }
      if(document.getElementById('dcOn').checked&&_dcLengthError())return;
      var btn = document.getElementById('doneBtn'); btn.disabled=true; btn.innerText=t().processing;
      var _em=document.getElementById('payEmail'); var email=_em?_em.value.trim():'';
      var pv = window._bill||{};
      // [P0-1] 会計金額はクライアントから送らず、サーバーが対象注文から再計算する。
      // ここで送るのは対象(orderIds/table)・支払方法・割引の入力値（種別/対象額/ID/氏名）・メールのみ。
      // [修正点一覧C-1対応] card/gcashはサーバー側が決済台帳とPayMongoの実際の支払状況を突き合わせて検証する
      // ため、発行済みのcheckoutIdも一緒に送る。
      var discOn = document.getElementById('dcOn').checked;
      var req = { table: payTable, method: payMethod, orderIds: payOrderIds, email: email, token: TOKEN, checkoutId: payCheckoutId,
        discountType: pv.discountType||'', discountRuleId:pv.discountRuleId||'', discountId: pv.discountId||'', discountName: pv.discountName||'', discountEligible: pv.discountEligible||0,
        discountApproverLogin: discOn&&!currentUserCanApprove()?document.getElementById('dcApprLogin').value.trim():'', discountApproverPass: discOn&&!currentUserCanApprove()?document.getElementById('dcApprPass').value:'',
        __timeoutMs: API.TIMEOUT_MS.write }; // [タイムアウト共通化] 会計確定は複数注文まとめての場合もあり時間がかかり得るため専用枠を使う
      if(payMethod==='cash')req.cashTender=document.getElementById('cashTender').value.trim();
      // Durably retain the exact order set before sending any payment.
      if(!CheckoutResume.begin(payTable,payRecoveryOrderIds)){
        btn.disabled=false;btn.innerText=t().done;
        UIAlert(lang==='en'?'Checkout recovery storage is unavailable or this payment is pending. Recheck receipts before another charge.':
          '会計復旧の記録を保存できないか、同じ会計を確認中です。再決済せず領収書を照会してください。');
        CheckoutResume.refresh();return;
      }
      checkoutFinalizeBusy=true;
      setCheckoutSendProgress(true,'finalize');
      req.__noInternalRetry=true;
      API.post('finalizeBill', req).then(function(r){
        btn.disabled=false; btn.innerText=t().done; var d=(r&&r.data)||{};
        // Some HTTP adapters resolve {ok:false} instead of rejecting. Neither
        // a transport error nor an incomplete success envelope proves that
        // payment failed/succeeded; reconcile instead of showing a fake receipt.
        if(!r||r.ok===false||(!d.error&&!d.demo&&
          (!d.orNo||!Number.isFinite(Number(d.total))))){
          checkoutOutcomeUnknown=true;
          return checkCheckoutOutcome();
        }
        if(d.demo||[
          'discount_auth','discount_not_manager','senior_discount_disabled',
          'discount_rule_not_found','discount_id_required','unserved_orders',
          'commission_staff_unassigned','cash_tender_invalid',
          'cash_tender_insufficient',
        ].indexOf(d.error)>=0)
          CheckoutResume.discard(payTable,payRecoveryOrderIds);
        if (d.error==='discount_auth'){ UIAlert(t().authFail); return; }
        if (d.error==='discount_not_manager'){ UIAlert(t().discNotManager); return; }
        if (d.error==='senior_discount_disabled'){ UIAlert(t().discDisabled); return; }
        if (d.error==='discount_rule_not_found'){ UIAlert(lang==='en'?'The discount is disabled or no longer exists.':'割引が無効化または削除されています。'); return; }
        if (d.error==='discount_id_required'){ UIAlert(lang==='en'?'ID is required.':'ID番号を入力してください。'); return; }
        if (d.error==='unserved_orders'){ closePay(); UIAlert(t().unservedBill); load(true); return; }
        if(d.error==='cash_tender_invalid'||d.error==='cash_tender_insufficient'){
          UIAlert(lang==='en'
            ?'The cash amount is invalid or less than the server-calculated total. Refresh checkout before collecting payment.'
            :'現金預り額が不正か、サーバー計算額に不足しています。再読み込みして請求額を確認してください。');
          return;
        }
        // Concurrent cashier: nothing_to_bill may mean another terminal
        // settled first. Read back the exact saved orders, never resubmit.
        if (d.error==='already_settled'||d.error==='nothing_to_bill'){
          checkoutOutcomeUnknown=true;
          return checkCheckoutOutcome();
        }
        if (d.error){ UIAlert('Error: '+API.userErrorText(d.error)); return; }
        if (d.demo){ closePay(); load(true); UIAlert(t().demoDone); return; }
        // 表示・印刷・eレシートは全てサーバーが再計算した金額を正とする。
        var bill = { table: payTable, method: payMethod, paymentLabel:d.paymentLabel||'', paymentLabelJa:d.paymentLabelJa||'', paymentLabelEn:d.paymentLabelEn||'', receiptPaymentLabel:d.receiptPaymentLabel||'', receiptPaymentLabelJa:d.receiptPaymentLabelJa||'', receiptPaymentLabelEn:d.receiptPaymentLabelEn||'', subtotal: d.subtotal, vat: d.vat, service: d.service,
          scUnallocated:Number(d.commission&&d.commission.serviceChargeUnallocated)||0,
          discountType: d.discountType||pv.discountType||'', discountId: pv.discountId||'', discountAmount: d.discountAmount,
          cashTender:d.cashTender,cashChange:d.cashChange,total: d.total };
        showReceipt(d.orNo||'', bill);
        CheckoutResume.mark(payTable,payRecoveryOrderIds);
      }).catch(function(){
        // The server may have committed the receipt before the response was lost.
        checkoutOutcomeUnknown=true;
        return checkCheckoutOutcome();
      }).finally(function(){checkoutFinalizeBusy=false;setCheckoutSendProgress(false);});
    };

    // ヘッダの現在日時表示
    function _pad2(n){ return (n<10?'0':'')+n; }
    function updateHeadClock(){
      // Update read-only elapsed minutes without rerendering checkout/order rows
      // or making a network request. The existing header timer runs every 15s.
      var live=document.querySelectorAll('[data-arrival-started-at]');
      var now=Date.now();
      Array.prototype.forEach.call(live,function(node){
        var startedAt=Number(node.getAttribute('data-arrival-started-at'));
        if(!Number.isSafeInteger(startedAt)||startedAt<=0)return;
        node.textContent=startedAt>now
          ? (lang==='en'?'0 min (check device clock)':'0分（端末時計を確認）')
          : Math.floor((now-startedAt)/60000)+(lang==='en'?' min elapsed':'分経過');
      });
      var el = document.getElementById('headClock'); if(!el) return;
      var d = new Date();
      el.textContent = window.DateDisplay ? DateDisplay.formatDateTime(d.toISOString()).slice(0,16) : d.getFullYear()+'-'+_pad2(d.getMonth()+1)+'-'+_pad2(d.getDate())+' '+_pad2(d.getHours())+':'+_pad2(d.getMinutes());
    }

    function settingsSnapshot(response){
      var latest=(response&&response.settings)||(response&&response.data&&response.data.settings)||(response&&response.data)||response;
      if(!latest||typeof latest!=='object'||Array.isArray(latest)||latest.error||!Object.keys(latest).length)throw new Error('settings_unavailable');
      // An incomplete successful payload must never silently zero out the store's charges.
      if(!String(latest.currencySymbol||'').trim()||!Object.prototype.hasOwnProperty.call(latest,'serviceRate')
        ||!Object.prototype.hasOwnProperty.call(latest,'taxRate')
        ||!isFinite(Number(latest.serviceRate))||!isFinite(Number(latest.taxRate)))throw new Error('settings_unavailable');
      return latest;
    }
    function ensurePricingReady(){
      if(_pricingReady)return Promise.resolve(true);
      if(_pricingInitPromise)return _pricingInitPromise;
      // Bootstrap and the authoritative settings refresh are independent reads.
      // Start both together instead of serial round trips through Control/D1.
      // Do not render charges until BOTH have settled; settings wins on conflict.
      var bootstrapRequest=API.post('bootstrap',{token:TOKEN}).then(function(r){
        SETTINGS=settingsSnapshot(r.settings);
        PAYMONGO=!!r.paymongo;BASE_DISCOUNT_RULES=r.discountRules||[];
        MENU_MAP=Object.create(null);
        (r.menu||[]).forEach(function(m){
          var key=String(m['商品名']||'').trim();if(!key)return;
          var entry={ja:String(m['商品名_JA']||'').trim(),en:String(m['商品名_EN']||'').trim(),choices:Object.create(null)};
          try{var groups=typeof m['オプション']==='string'?JSON.parse(m['オプション']||'[]'):m['オプション'];(Array.isArray(groups)?groups:[]).forEach(function(g){(g.choices||[]).forEach(function(c){[c.label,c.labelJa,c.labelEn].forEach(function(a){a=String(a||'').trim();if(a&&!entry.choices[a])entry.choices[a]={ja:String(c.labelJa||'').trim(),en:String(c.labelEn||'').trim()};});});});}catch(e){}
          MENU_MAP[key]=entry;
        });
        return true;
      }).catch(function(){return false;});
      var settingsRequest=API.post('getSettings',{token:TOKEN}).then(function(sr){
        return settingsSnapshot(sr);
      }).catch(function(){return null;});
      _pricingInitPromise=Promise.all([bootstrapRequest,settingsRequest]).then(function(results){
        if(results[1])SETTINGS=Object.assign({},SETTINGS,results[1]);
        // Either independent authoritative read can keep pricing available;
        // neither an incomplete bootstrap nor partial settings can unlock it.
        if(!results[0]&&!results[1])throw new Error('settings_unavailable');
      }).then(function(){
        _pricingReady=true;
        _pricingFromCache=false;
        clearOpsReadError();
        renderOfflineCashStatus();
        render(); // Also repaint a cached snapshot if a later delta replies unchanged:true.
        saveOfflineOrders();
        return true;
      }).catch(function(){
        if(_pricingFromCache && typeof navigator!=='undefined' && navigator.onLine===false) return true;
        displayOpsReadError('settings_unavailable');
        render(); // Keep amounts and checkout unavailable rather than show raw prices.
        return false;
      }).finally(function(){_pricingInitPromise=null;});
      return _pricingInitPromise;
    }
    function boot(){
      // 言語の初期化・切替・永続化は共通部品I18nに一本化（他のスタッフ向け画面と同じ仕組み）。
      I18n.init(i18n, onLangChange);
      API.pageReady({auth:'optional'}).then(function(ctx){
        TOKEN=ctx.token||TOKEN;
        CheckoutResume.refresh();
        return refreshOfflineCashStatus().then(function(){
          if(typeof navigator!=='undefined'&&navigator.onLine===false)return restoreOfflineOrders();
          return null; // Historic records are retained; no automatic payment replay.
        });
      }).catch(function(){});
      updateHeadClock();
      setInterval(updateHeadClock, 15000);
      ensurePricingReady().then(function(ready){if(ready)load(true);});
      resetTimer();
      // [P0][慎重レビューH5対応] タブが非表示の間はポーリング間隔を落とし、再表示時に即最新化する。
      // 固定8秒の別タイマーは廃止し、resetTimer（_pollIntervalMs）へ一本化した。
      document.addEventListener('visibilitychange', function(){
        resetTimer();
        if(document.visibilityState==='visible')CheckoutResume.refresh();
        if (document.visibilityState === 'visible' && autoOn && !paused()) load(true);
      });
      // [慎重レビューH1対応] バージョン不一致検知に万一漏れがあっても数分以内に必ず復帰する安全弁。
      setInterval(function(){ if(autoOn && !paused()) load(true); }, 180000); // 3分ごと強制フルリフレッシュ
      if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js').catch(function(){}); }
    }
    document.addEventListener('DOMContentLoaded', boot);
  </script>
  <script src="./help.js?v=auth2"></script>
  <script>
    HelpUI.register({
      title: '注文管理画面の使い方',
      titleEn: 'How to use Orders',
      items: [
        { ja: '① 未会計の注文が卓ごとにグループ表示されます。各注文の表示金額には設定されたサービス料・税が含まれ、その内訳と入場料・延長料・VIP料金も注文の下に表示します。サービス料は二重加算しません。「提供済にする」で提供済み、「取消」で注文取消できます。', en: '① Unpaid orders are grouped by table. Order amounts include service charge and tax; the breakdown below includes those charges and entry, extension and VIP fees. Included service is not added twice. Mark orders served or void them as needed.' },

        { ja: '③ 会計完了後は「🖨️レシート印刷」ボタンで領収書を印刷できます。会計時にeレシート送付先メールも入力できます。', en: '③ After checkout, tap "🖨️ Print receipt" to print a receipt. You can also enter an e-receipt email during checkout.' },
        { ja: '④ 画面上部の🔔呼び出し欄では、お客様のスタッフ呼出・会計希望が自動更新（10/30/60秒）または手動更新時に反映されます。「対応済」で処理できます。自動更新OFF時は手動更新してください。', en: '④ Customer staff-call and bill requests appear at the top after auto-refresh (10/30/60 seconds) or manual refresh. Tap Done to resolve them. When auto-refresh is off, refresh manually.' },
        { ja: '⑤ 「自動更新: ON/OFF」ボタンと10s/30s/60sの間隔ボタンで、画面の自動更新頻度を調整できます。↻ボタンで手動更新もできます。', en: '⑤ Use the Auto ON/OFF toggle and the 10s/30s/60s interval buttons to control how often the screen refreshes. Tap ↻ to refresh manually.' },
        { ja: '⑥ 「🧾履歴」リンクで過去の会計履歴（receipts.html）に、「← 管理」でメニュー画面に戻れます。EN/JPボタンで表示言語を切り替えられます。', en: '⑥ Use the "🧾 History" link for past receipts, "← Manage" to return to the menu, and EN/JP to switch language.' },
        { ja: '⑦ 入場料の明細行にある「入場時間」で入場時刻を修正できます。年・月・日・時（24時間）・分を選んで「保存して料金を再計算」を押します。店舗のタイムゾーンで通常/VIP延長料金を再計算し、注文の記録日時は変更しません。商品・入場料・延長料・VIP料金は各明細の「訂正」「✎」から修正できます。', en: '⑦ Use Entry time on the entry-fee line to correct the visit clock. Choose Year, Month, Day, Hour (24h) and Minute, then save. Standard and VIP extension charges recalculate using the store time zone without changing order timestamps. To correct individual order items, entry fees, extension counts or VIP charges, use Edit or the pencil on the corresponding line.' }
