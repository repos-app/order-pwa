<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Orders">

  <link rel="manifest" href="./admin.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <title>Orders</title>
  <style>
    :root{ --bg:#f6f7f9; --surface:#fff; --border:#e5e7eb; --navy:#0f172a; --text-3:#64748b; --red:#c62828; --green:#16a34a; }
    *{ box-sizing:border-box; }
    body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans JP',sans-serif; background:var(--bg); color:var(--navy); -webkit-tap-highlight-color:transparent; }
    .head{ position:sticky; top:0; z-index:20; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:space-between; padding:12px 16px; }
    .head h1{ font-size:18px; margin:0; font-weight:900; }
    .head .r{ display:flex; gap:8px; align-items:center; }
    .hbtn{ background:rgba(255,255,255,.14); color:#fff; border:0; border-radius:9px; padding:8px 12px; font-size:13px; font-weight:800; cursor:pointer; }
    .cnt{ background:#dc2626; border-radius:999px; padding:2px 10px; font-weight:900; font-size:13px; }
    .wrap{ padding:14px; max-width:900px; margin:0 auto; }
    .tg{ background:var(--surface); border:1px solid var(--border); border-radius:14px; margin-bottom:14px; overflow:hidden; }
    .tg-h{ display:flex; justify-content:space-between; align-items:center; padding:12px 14px; background:#0b1220; color:#fff; }
    .tg-h .ti{ font-size:17px; font-weight:900; }
    .tg-h .to{ font-size:16px; font-weight:900; color:#fbbf24; }
    .row{ display:flex; justify-content:space-between; align-items:center; padding:10px 14px; border-bottom:1px solid var(--border); }
    .row.served{ opacity:.55; }
    .row .m{ flex:1; min-width:0; }
    .row .tm{ font-size:11px; color:var(--text-3); }
    .row .it{ font-size:14px; font-weight:600; margin-top:2px; }
    .row .rt{ display:flex; align-items:center; gap:10px; flex:0 0 auto; }
    .row .pr{ font-weight:900; }
    .b-xs{ border:0; border-radius:8px; padding:8px 12px; font-size:13px; font-weight:800; cursor:pointer; font-family:inherit; }
    .b-warn{ background:#f59e0b; color:#0f172a; }
    .served-lbl{ font-size:12px; color:var(--green); font-weight:800; }
    .prepaid{ background:#dcfce7; color:#15803d; font-weight:800; font-size:11px; padding:1px 7px; border-radius:999px; }
    .tg-a{ padding:12px 14px; }
    .b-pay{ width:100%; border:0; border-radius:11px; padding:13px; font-size:14px; font-weight:900; background:var(--green); color:#fff; cursor:pointer; font-family:inherit; }
    .empty{ text-align:center; color:var(--text-3); padding:50px 20px; font-weight:700; }
    .ov{ position:fixed; inset:0; background:rgba(0,0,0,.62); z-index:9999; display:none; align-items:center; justify-content:center; }
    .ov.on{ display:flex; }
    .card{ background:#fff; border-radius:18px; padding:22px; max-width:340px; width:calc(100% - 32px); margin:16px; max-height:90vh; overflow:auto; }
    .sum{ background:#f8fafc; border:1px solid #e2e8f0; border-radius:10px; padding:14px; margin-bottom:16px; }
    .sr{ display:flex; justify-content:space-between; font-size:13px; color:#555; margin-bottom:3px; }
    .big{ font-size:22px; font-weight:900; color:var(--red); margin-top:4px; }
    .pbtn{ border:0; padding:15px; font-size:15px; font-weight:800; border-radius:12px; cursor:pointer; color:#fff; font-family:inherit; width:100%; margin-bottom:10px; }
    .cancel{ width:100%; padding:11px; background:none; border:1.5px solid #ddd; border-radius:9px; color:#888; font-size:14px; cursor:pointer; font-weight:700; font-family:inherit; }
    .alert{ display:none; padding:11px; border-radius:9px; font-size:13px; margin-bottom:10px; text-align:left; line-height:1.5; }
    .calls-box{ background:#fffbeb; border:1px solid #fcd34d; border-radius:12px; padding:10px 12px; }
    .calls-h{ font-weight:900; font-size:13px; color:#92400e; margin-bottom:6px; }
    .call-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:5px 0; font-size:14px; font-weight:700; border-top:1px solid #fde68a; }
    .call-row:first-of-type{ border-top:0; }
    .dwell{ font-size:11px; font-weight:800; color:#0f766e; background:#ccfbf1; border-radius:6px; padding:1px 6px; }
    .ctlbar{ display:flex; align-items:center; gap:10px; padding:10px 16px; flex-wrap:wrap; position:sticky; top:0; z-index:15; background:var(--bg,#f6f7f9); border-bottom:1px solid #e5e7eb; }
    .auto-toggle{ border:0; border-radius:12px; padding:12px 20px; font-size:16px; font-weight:900; cursor:pointer; font-family:inherit; min-width:150px; }
    .auto-toggle.on{ background:#16a34a; color:#fff; } .auto-toggle.off{ background:#e2e8f0; color:#64748b; }
    .int-group{ display:flex; gap:6px; }
    .int-btn{ border:1px solid #cbd5e1; background:#fff; color:#334155; border-radius:9px; padding:9px 13px; font-size:14px; font-weight:800; cursor:pointer; font-family:inherit; }
    .int-btn.on{ background:#0f172a; color:#fff; border-color:#0f172a; }
    @keyframes izspin2{ to{ transform:rotate(360deg); } }
    .spin-once{ display:inline-block; animation:izspin2 .6s linear; }
    #izToast{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px); background:#0f172a; color:#fff; font-size:13px; font-weight:800; padding:10px 18px; border-radius:999px; box-shadow:0 8px 24px rgba(0,0,0,.25); z-index:100000; opacity:0; pointer-events:none; transition:opacity .18s, transform .18s; }
    #izToast.on{ opacity:1; transform:translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div class="head">
    <h1 id="title">注文管理</h1>
    <div class="r">
      <span class="cnt" id="headClock" style="background:transparent;font-weight:700;font-variant-numeric:tabular-nums;"></span>
      <a class="hbtn" href="./manage.html">← 管理</a>
      <span class="cnt" id="cnt">0</span>
      <button class="hbtn" id="langBtn" data-tlang onclick="I18n.toggle()">EN</button>
      <button class="hbtn" id="refreshBtn" onclick="manualRefresh()">↻</button>
    </div>
  </div>
  <div class="ctlbar">
    <button id="autoBtn" class="auto-toggle" onclick="toggleAuto()">—</button>
    <div class="int-group" id="intGroup"></div>
    <button class="int-btn" onclick="manualRefresh()" id="manualBtn">↻</button>
    <a class="int-btn" href="./receipts.html" style="text-decoration:none;display:inline-flex;align-items:center;">🧾 <span id="histLbl" style="margin-left:4px;">履歴</span></a>
  </div>
  <div class="wrap" id="callsWrap" style="display:none;"></div>
  <div class="wrap" id="list"><div class="empty" id="loadMsg">読み込み中…</div></div>

  <!-- Payment modal -->
  <div class="ov" id="payModal">
    <div class="card">
      <div id="ps1">
        <div style="font-size:17px;font-weight:900;margin-bottom:12px;" id="ps1t">お会計</div>
        <div class="sum" id="paySum"></div>
        <div id="payDisc" style="border:1px solid #e5e7eb;border-radius:10px;padding:10px;margin-bottom:10px;font-size:13px;">
          <label style="display:flex;gap:8px;align-items:center;font-weight:800;cursor:pointer;"><input type="checkbox" id="dcOn" onchange="recompPay()"><span id="dcLbl">割引</span></label>
          <div id="dcBody" style="display:none;margin-top:8px;">
            <div style="margin-bottom:8px;"><select id="dcRule" onchange="recompPay()" style="width:100%;padding:8px;border:1px solid #e5e7eb;border-radius:8px;font-family:inherit;"></select></div>
            <div style="display:flex;gap:8px;margin-bottom:6px;">
              <input id="dcName" placeholder="対象者氏名" style="flex:1;padding:8px;border:1px solid #e5e7eb;border-radius:8px;font-family:inherit;">
              <input id="dcId" placeholder="ID番号" style="flex:1;padding:8px;border:1px solid #e5e7eb;border-radius:8px;font-family:inherit;">
            </div>
            <div style="display:flex;gap:8px;">
              <input id="dcElig" type="number" min="0" step="any" placeholder="対象額" style="width:120px;padding:8px;border:1px solid #e5e7eb;border-radius:8px;font-family:inherit;" oninput="recompPay()">
            </div>
            <div id="dcNote" style="color:#64748b;margin-top:6px;"></div>
            <div id="dcApprBox" style="margin-top:10px;padding-top:10px;border-top:1px dashed #e5e7eb;">
              <div id="dcApprL" style="font-size:12px;font-weight:800;margin-bottom:4px;">承認者（マネージャー以上のログイン）</div>
              <div style="display:flex;gap:8px;">
                <input id="dcApprLogin" placeholder="ログインID" autocomplete="off" style="flex:1;padding:8px;border:1px solid #e5e7eb;border-radius:8px;font-family:inherit;">
                <input id="dcApprPass" type="password" placeholder="パスワード" autocomplete="off" style="flex:1;padding:8px;border:1px solid #e5e7eb;border-radius:8px;font-family:inherit;">
              </div>
              <div id="dcApprAlert" style="display:none;color:#b91c1c;margin-top:6px;font-weight:700;"></div>
            </div>
          </div>
        </div>
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px;font-size:13px;">
          <span id="splitLbl">割り勘 ÷</span>
          <input id="splitN" type="number" min="1" value="1" style="width:70px;padding:7px;border:1px solid #e5e7eb;border-radius:8px;font-family:inherit;" oninput="updSplit()">
          <span id="splitRes" style="font-weight:800;"></span>
        </div>
        <div hidden aria-hidden="true" style="display:none;margin-bottom:10px;"><input id="payEmail" type="email" placeholder="e-receipt email (任意)" autocomplete="off" tabindex="-1" style="width:100%;padding:9px;border:1px solid #e5e7eb;border-radius:8px;font-family:inherit;box-sizing:border-box;"></div>
        <button class="pbtn" id="payBtnGcash" style="background:linear-gradient(135deg,#0f4c81,#1565c0);" onclick="gcashPay()">📱 <span id="qrPayLbl">QR決済</span></button>
        <button class="pbtn" id="payBtnCard" style="background:linear-gradient(135deg,#2e7d32,#43a047);" onclick="cardPay()">💳 <span id="cardPayLbl">カード</span></button>
        <button class="pbtn" id="payBtnCash" style="background:#334155;" onclick="cashPay()">💴 <span id="cashLbl">現金</span></button>
        <button class="cancel" onclick="closePay()" id="cxl1">キャンセル</button>
      </div>
      <div id="ps2" style="display:none;text-align:center;">
        <div style="font-size:17px;font-weight:900;margin-bottom:4px;" id="ps2t">QR決済</div>
        <div style="display:inline-block;padding:8px;border:2px solid #e0e8f5;border-radius:12px;margin-bottom:12px;">
          <img id="payQr" src="" alt="QR" style="width:200px;height:200px;display:none;border-radius:6px;">
        </div>
        <div id="ps2hint" style="font-size:12px;color:#64748b;margin-bottom:12px;"></div>
        <button class="pbtn" style="background:#f59e0b;color:#0f172a;" onclick="confirmGcashPaid()" id="checkBtn">入金を確認した</button>
        <div class="alert" id="payAlert"></div>
        <button class="cancel" onclick="closePay()">キャンセル</button>
      </div>
      <div id="ps3" style="display:none;text-align:center;padding:12px 0;">
        <div style="font-size:40px;">✅</div>
        <div id="ps3lbl" style="font-weight:800;margin:8px 0;"></div>
        <div id="ps3amt" style="font-size:20px;font-weight:900;color:var(--green);margin-bottom:16px;"></div>
        <button class="pbtn" style="background:var(--green);" onclick="finalize()" id="doneBtn">完了（会計済にする）</button>
        <button class="cancel" onclick="closePay()" id="cxl3">キャンセル</button>
      </div>
    </div>
  </div>

  <!-- Partial checkout modal -->
  <div class="ov" id="partModal">
    <div class="card">
      <div style="font-size:17px;font-weight:900;margin-bottom:10px;" id="partT">一部会計 — 明細選択</div>
      <div id="partList" style="max-height:46vh;overflow:auto;margin-bottom:10px;"></div>
      <div style="display:flex;justify-content:space-between;font-weight:900;margin-bottom:10px;"><span id="partSelLbl">選択</span><span id="partSel">₱0</span></div>
      <button class="pbtn" style="background:var(--green);" onclick="goPartial()" id="partGo">選択分を会計</button>
      <button class="cancel" onclick="closePart()" id="partCxl">キャンセル</button>
    </div>
  </div>

  <!-- Void (cancel) modal -->
  <div class="ov" id="voidModal">
    <div class="card">
      <div style="font-size:17px;font-weight:900;margin-bottom:6px;" id="vdT">注文の取消</div>
      <div id="vdItem" style="font-size:13px;color:#475569;margin-bottom:10px;"></div>
      <label style="font-size:12px;font-weight:800;" id="vdReasonL">取消理由</label>
      <input id="vdReason" style="width:100%;padding:9px;border:1px solid #e5e7eb;border-radius:8px;font-family:inherit;margin:4px 0 10px;box-sizing:border-box;">
      <div style="font-size:12px;font-weight:800;margin-bottom:4px;" id="vdApprL">承認者（責任者ログイン）</div>
      <input id="vdLogin" placeholder="ログインID" autocomplete="off" style="width:100%;padding:9px;border:1px solid #e5e7eb;border-radius:8px;font-family:inherit;margin-bottom:6px;box-sizing:border-box;">
      <input id="vdPass" type="password" placeholder="パスワード" autocomplete="off" style="width:100%;padding:9px;border:1px solid #e5e7eb;border-radius:8px;font-family:inherit;margin-bottom:10px;box-sizing:border-box;">
      <div class="alert" id="vdAlert"></div>
      <button class="pbtn" style="background:#b91c1c;" onclick="doVoid()" id="vdGo">取消を承認</button>
      <button class="cancel" onclick="closeVoid()" id="vdCxl">キャンセル</button>
    </div>
  </div>

  <script src="./date-display.js?v=auth4" data-iz-date-display></script><script src="./config.js?v=auth2"></script>
  <script src="./api.js?v=auth2"></script>
  <script src="./i18n.js?v=auth3"></script>
  <script src="./confirm.js?v=auth2"></script>

    function breakdown(subtotal){
      var s = Number(subtotal)||0;
      var svcRate = Number(SETTINGS.serviceRate)||0, taxRate = Number(SETTINGS.taxRate)||0;
      var svcIncl = String(SETTINGS.serviceInclusive)==='true', taxIncl = String(SETTINGS.taxInclusive)==='true';
      var svc, afterSvc, tax, total;
      if (svcIncl) { svc = roundCharge(s - s/(1+svcRate/100)); afterSvc = s; }
      else { svc = roundCharge(s * (svcRate/100)); afterSvc = roundCharge(s + svc); }

    // [C1修正] Senior/PWD割引の計算式。src/billing.js の seniorPwdCalc と必ず同じ式にすること
    // （2026-08-25: GAS版ManagementSystemDev/code.jsは完全廃止済み。現在の正はsrc/billing.js）
    // （画面プレビューと会計確定額がズレていた不具合の修正。片方だけ直すと再びズレる）。
    function seniorPwdCalc(subtotal, eligible, b){
      var taxRate = Number(SETTINGS.taxRate)||0, taxIncl = String(SETTINGS.taxInclusive)==='true';
      var r = taxRate/100;
      var netEligible = taxIncl ? (eligible/(1+r)) : eligible;
      var discount20 = roundCharge(netEligible*0.20);
      var vatExempt;
      if (taxIncl){ vatExempt = roundCharge(eligible - netEligible); }
      else {
        var nonEligibleAfterSvc = Math.max(0, b.afterSvc - eligible);
        var vatCorrect = roundCharge(nonEligibleAfterSvc*r);
        vatExempt = Math.max(0, b.tax - vatCorrect);
      }
      var totalDiscount = discount20 + vatExempt;
      var nonEligibleSub = Math.max(0, subtotal - eligible);
      var vatDisplay = taxIncl ? roundCharge(nonEligibleSub - nonEligibleSub/(1+r)) : roundCharge(nonEligibleSub*r);
      var total = Math.max(0, b.total - totalDiscount);
      return { discountAmount: totalDiscount, vat: vatDisplay, total: total };
    }
    function selectedDiscountRule(){ var id=document.getElementById('dcRule').value; return DISCOUNT_RULES.find(function(r){return String(r.id)===String(id);})||null; }
    function genericDiscountCalc(subtotal, eligible, b, rule){
      if(rule.legacyType) return seniorPwdCalc(subtotal,eligible,b);
      var taxRate=Math.max(0,Number(SETTINGS.taxRate)||0)/100,taxIncl=String(SETTINGS.taxInclusive)==='true';
      var netEligible=(rule.taxExempt&&taxIncl&&taxRate>0)?eligible/(1+taxRate):eligible;
      var base=rule.taxExempt?netEligible:eligible;
      var ordinary=rule.calculationType==='fixed'?roundCharge(Math.min(Number(rule.value)||0,base)):roundCharge(base*(Number(rule.value)||0)/100);
      var taxExemption=0,vat=b.tax;
      if(rule.taxExempt){if(taxIncl)taxExemption=roundCharge(eligible-netEligible);else{var correct=roundCharge(Math.max(0,b.afterSvc-eligible)*taxRate);taxExemption=Math.max(0,b.tax-correct);}var nonEligible=Math.max(0,subtotal-eligible);vat=taxIncl?roundCharge(nonEligible-nonEligible/(1+taxRate)):roundCharge(nonEligible*taxRate);}
      var amount=roundCharge(ordinary+taxExemption);return {discountAmount:amount,vat:vat,total:Math.max(0,roundCharge(b.total-amount))};

    // skipForSplit引数はopenPay（会計モーダル）専用。一覧表示（render）ではpayOrderIdsという
    // グローバル状態を参照すべきでないため、明示的な引数として切り出した。
    function feeSettingEnabled(enabledKey, amountKey){
      if (Object.prototype.hasOwnProperty.call(SETTINGS, enabledKey)) {
        var v=SETTINGS[enabledKey]; return v===true || v===1 || v==='1' || v==='on' || v==='true';
      }

    function computeEntryFeesPreview(party, skipForSplit){
      var entryUnit = Number(SETTINGS.entryFeeAmount)||0, extUnit = Number(SETTINGS.extensionFeeAmount)||0;
      var entryEnabled=feeSettingEnabled('entryFeeEnabled','entryFeeAmount') && entryUnit>=1;
      var extensionEnabled=feeSettingEnabled('extensionFeeEnabled','extensionFeeAmount') && extUnit>=1;
      if (skipForSplit || (!entryEnabled && !extensionEnabled) || !party || !(Number(party.count)>0)) return { entryFee:0, extensionFee:0, partySize:0, extensionUnits:0 };
      var count = Number(party.count)||0;
      var entryFee = entryEnabled ? Math.round(entryUnit*count) : 0;
      var extensionFee = 0, extensionUnits = 0;
      if (extensionEnabled && party.enteredAt){
        var baseMin = Math.max(0, Number(SETTINGS.baseUsageMinutes)||0);
        var unitMin = Math.max(1, Number(SETTINGS.extensionUnitMinutes)||0) || 30;
        var extraMin = (Date.now() - Number(party.enteredAt))/60000 - baseMin;
        if (extraMin > 0){ extensionUnits = Math.ceil(extraMin/unitMin); extensionFee = Math.round(extUnit*count*extensionUnits); }
      }

    function computeGroupTotal(subtotal, table){

      payTable = tn; payCheckoutId = null; payOrderIds = (orderIds && orderIds.length) ? orderIds : null; paySub = Number(subtotal)||0; payBase = breakdown(paySub);
      var shouldPreviewFees = !payOrderIds || partialCoversAllActive(tn, payOrderIds);
      var initialFees = shouldPreviewFees ? computeEntryFeesPreview(PARTY_SIZES[tn], false) : { entryFee:0, extensionFee:0, partySize:0 };
      payEntryFee = initialFees.entryFee; payExtensionFee = initialFees.extensionFee; payPartySize = initialFees.partySize;
      document.getElementById('dcOn').checked = false; document.getElementById('dcId').value=''; document.getElementById('dcElig').value=''; document.getElementById('dcName').value='';
      document.getElementById('dcApprLogin').value=''; document.getElementById('dcApprPass').value='';
      var _da=document.getElementById('dcApprAlert'); _da.style.display='none';
      // [要望対応] シニア/PWD割引は設定で無効化されている場合、選択肢自体を非表示にする
      // （従業員が不正に操作することを防ぐため、UI上に触れる余地を残さない）。
      populateDiscountRules();
      // 2026-08-23: クレジットカードは設定で許可されている場合のみボタンを表示（否の場合は別端末で
      // 処理する運用のためボタン自体を出さない）。GCashは店舗QRコードが登録されている場合のみ表示。
      var settingOn=function(v,def){ return v===undefined?!!def:(v===true||v===1||v==='1'||v==='on'||v==='true'); };
      document.getElementById('payBtnCash').style.display = settingOn(SETTINGS.cashPaymentEnabled,true) ? '' : 'none';
      document.getElementById('payBtnCard').style.display = settingOn(SETTINGS.creditCardEnabled,false) ? '' : 'none';
      document.getElementById('payBtnGcash').style.display = (settingOn(SETTINGS.qrPaymentEnabled,!!SETTINGS.gcashQr) && !!SETTINGS.gcashQr) ? '' : 'none';
      var _pe=document.getElementById('payEmail'); if(_pe){ _pe.value=''; _pe.placeholder=t().eReceipt; }
      document.getElementById('splitN').value = 1; document.getElementById('splitLbl').innerText = t().splitLbl;
      document.getElementById('ps1t').innerText = t().pTitle;
      document.getElementById('cashLbl').innerText = settingLoc('cashPaymentLabel',t().cash);
      document.getElementById('cardPayLbl').innerText = settingLoc('cardPaymentLabel',t().card);
      document.getElementById('qrPayLbl').innerText = settingLoc('qrPaymentLabel',t().qrPayment);
      document.getElementById('cxl1').innerText = t().cancel;
      document.getElementById('dcLbl').innerText = t().disc;
      document.getElementById('dcId').placeholder = t().idPh;
      document.getElementById('dcElig').placeholder = t().eligPh;
      document.getElementById('dcApprL').innerText = t().discApprover;
      document.getElementById('dcApprLogin').placeholder = t().loginPh;
      document.getElementById('dcApprPass').placeholder = t().passPh;
      recompPay();
      step(1);
      document.getElementById('payModal').classList.add('on');
      if (shouldPreviewFees){
        API.post('getTablePartySize', { table: tn }).then(function(r){
          if (payTable !== tn) return; // その間にモーダルが閉じ/別卓が開かれていたら無視
          var f = computeEntryFeesPreview(r && r.data, false);
          if (r && r.data) PARTY_SIZES[tn] = r.data;
          payEntryFee = f.entryFee; payExtensionFee = f.extensionFee; payPartySize = f.partySize;
          recompPay();
        }).catch(function(){});
      }
    };
    window.recompPay = function(){
      if (!payBase) return;
      var on = document.getElementById('dcOn').checked;
      document.getElementById('dcBody').style.display = on ? 'block' : 'none';
      var sub = paySub, b = payBase, disc = 0, eligible = 0, dtype = '', rule=null;
      if (on){
        rule=selectedDiscountRule(); if(!rule){document.getElementById('dcOn').checked=false;on=false;} else dtype=rule.legacyType||('rule:'+rule.code);
        var ei = Number(document.getElementById('dcElig').value);
        eligible = (ei>0) ? Math.min(ei, sub) : sub;
      }
      var vat;
      var spc = on ? genericDiscountCalc(sub, eligible, b, rule) : null;
      if (on) { disc = spc.discountAmount; vat = spc.vat; }
      else { vat = b.tax; }
      var total = (on ? spc.total : Math.max(0, (b.total||0))) + payEntryFee + payExtensionFee;
      payTotal = total;
      // 表示用のプレビュー計算（実際の会計金額はサーバー側finalizeBillが対象注文の登録価格・卓の人数/入店時刻
      // から再計算する。クライアントのこの値は画面表示のみに使い、送信するのは種別・対象額・氏名・ID番号のみ）。
      document.getElementById('dcId').style.display=on&&rule&&rule.idRequired?'':'none';
      document.getElementById('dcApprBox').style.display=on&&rule&&rule.managerApprovalRequired?'':'none';
      window._bill = { subtotal: sub, vat: vat, service: b.service, discountType: on?(rule.legacyType||''):'', discountRuleId:on&&!rule.legacyType?rule.id:'', discountId: on?document.getElementById('dcId').value:'',
        discountName: on?document.getElementById('dcName').value:'', discountEligible: on?eligible:0, discountAmount: disc, total: total,
        entryFee: payEntryFee, extensionFee: payExtensionFee };
      var html = '<div style="font-weight:900;font-size:15px;margin-bottom:8px;">🪑 '+esc(seatLabel(payTable))+'</div>';
      html += '<div class="sr"><span>'+t().sub+'</span><span>'+money(sub)+'</span></div>';
      if (b.service>0) html += '<div class="sr"><span>'+t().svc+'</span><span>'+money(b.service)+'</span></div>';
      if (b.tax>0) html += '<div class="sr"><span>'+esc(taxName())+'</span><span>'+money(b.tax)+'</span></div>';
      if (disc>0) html += '<div class="sr" style="color:#b91c1c;"><span>'+t().discLine+' ('+esc(lang==='en'?(rule.nameEn||rule.nameJa||rule.name):(rule.nameJa||rule.nameEn||rule.name))+')</span><span>− '+money(disc)+'</span></div>';
      if (payEntryFee>0) html += '<div class="sr"><span>'+t().entryFeeLbl+' × '+payPartySize+'</span><span>'+money(payEntryFee)+'</span></div>';
      if (payExtensionFee>0) html += '<div class="sr"><span>'+t().extFeeLbl+'</span><span>'+money(payExtensionFee)+'</span></div>';
      html += '<div class="big">'+money(total)+'</div>';
      document.getElementById('paySum').innerHTML = html;
      document.getElementById('dcNote').innerText = on ? ((lang==='en'?'incl. ':'うち')+taxName()+' '+money(vat)) : '';
      updSplit();
    };
    window.updSplit = function(){
      var n = Math.max(1, parseInt(document.getElementById('splitN').value,10)||1);
      document.getElementById('splitRes').innerText = n>1 ? (money(Math.ceil((payTotal||0)/n))+' '+t().each) : '';
    };
    window.openPartial = function(tn){
      partTable = tn;
      var rows = orders.filter(function(o){ return String(o.table)===String(tn) && o.status!=='会計済'; });
      document.getElementById('partList').innerHTML = rows.map(function(o){
        return '<label style="display:flex;gap:8px;align-items:center;padding:9px 2px;border-bottom:1px solid #eee;cursor:pointer;">'
          + '<input type="checkbox" class="pchk" data-id="'+esc(o.id)+'" data-price="'+(Number(o.price)||0)+'" onchange="updPart()">'
          + '<span style="flex:1;">'+esc(orderDetailsText(o))+'</span><span style="font-weight:800;">'+money(o.price||0)+'</span></label>';
      }).join('') || '<div style="color:#aaa;padding:14px;">-</div>';
      document.getElementById('partT').innerText = t().partTitle;
      document.getElementById('partSelLbl').innerText = t().selected;
      document.getElementById('partGo').innerText = t().selPay;
      updPart();
      document.getElementById('partModal').classList.add('on');
    };
    window.updPart = function(){ var s=0; document.querySelectorAll('.pchk:checked').forEach(function(c){ s += Number(c.getAttribute('data-price'))||0; }); document.getElementById('partSel').innerText = money(s); };
    window.closePart = function(){ document.getElementById('partModal').classList.remove('on'); };
    window.goPartial = function(){
      var ids=[], tot=0; document.querySelectorAll('.pchk:checked').forEach(function(c){ ids.push(c.getAttribute('data-id')); tot += Number(c.getAttribute('data-price'))||0; });
      if(!ids.length) return;
      closePart(); openPay(partTable, tot, ids);
    };
    function showReceipt(orNo, bill){
      var html = '<div style="font-size:40px;">✅</div>';
      html += '<div style="font-weight:800;margin:6px 0;">'+t().orLbl+': <b>'+esc(orNo)+'</b></div>';
      html += '<div style="font-size:20px;font-weight:900;color:var(--green);margin-bottom:6px;">'+money(bill.total)+' — '+esc(seatLabel(bill.table))+'</div>';
      if (bill.discountAmount>0) html += '<div style="font-size:13px;color:#64748b;">'+t().discLine+' '+money(bill.discountAmount)+(bill.discountId?(' / ID '+esc(bill.discountId)):'')+'</div>';
      html += '<div style="display:flex;gap:8px;margin-top:14px;"><button class="pbtn" style="background:var(--green);flex:1;margin:0;" onclick="closePay();load();">'+t().close+'</button></div>';
      document.getElementById('ps3').innerHTML = html;
      window._lastBill = { orNo: orNo, bill: bill };
      step(3);
    }
    window.printReceipt = function(orNo){
      var b = (window._lastBill&&window._lastBill.bill) || window._bill || {};
      var shop = SETTINGS.shopName || 'Shop'; var nowDate = new Date(); var now = window.DateDisplay?DateDisplay.formatDateTime(nowDate.toISOString()):nowDate.toLocaleString();
      var documentTitle = I18n.lang()==='en' ? (SETTINGS.receiptDocumentTitleEn||SETTINGS.receiptDocumentTitleJa||'Receipt') : (SETTINGS.receiptDocumentTitleJa||SETTINGS.receiptDocumentTitleEn||'レシート');
      var lines = '<div>'+t().sub+': '+money(b.subtotal)+'</div>';
      if (b.service>0) lines += '<div>'+t().svc+': '+money(b.service)+'</div>';
      if (b.discountAmount>0) lines += '<div>'+t().discLine+': -'+money(b.discountAmount)+(b.discountId?(' (ID '+esc(b.discountId)+')'):'')+'</div>';
      lines += '<div>'+esc(taxName())+': '+money(b.vat)+'</div>';
      var w = window.open('', '_blank', 'width=320,height=520'); if(!w) return;
      w.document.write('<html><head><meta charset="utf-8"><title>'+esc(orNo)+'</title></head><body style="font-family:monospace;padding:10px;width:280px;">'
        + '<div style="text-align:center;font-weight:bold;font-size:16px;">'+esc(shop)+'</div>'
        + '<div style="text-align:center;font-weight:bold;font-size:14px;margin-bottom:4px;">'+esc(documentTitle)+'</div>'
        + '<div style="text-align:center;font-size:12px;margin-bottom:8px;">'+esc(orNo)+'<br>'+esc(now)+'<br>'+esc(seatLabel(b.table||''))+'</div>'
        + '<hr>'+lines+'<hr>'
        + '<div style="font-weight:bold;font-size:15px;display:flex;justify-content:space-between;"><span>'+t().totalW+'</span><span>'+money(b.total)+'</span></div>'
        + '<div style="font-size:11px;margin-top:6px;">'+esc(billPaymentLabel(b))+'</div>'
        + '<scr'+'ipt>window.print();<\/scr'+'ipt></body></html>');
      w.document.close();
    };
    window.closePay = function(){ document.getElementById('payModal').classList.remove('on'); payCheckoutId=null; resetPs3(); };
    function step(n){ [1,2,3].forEach(function(i){ document.getElementById('ps'+i).style.display = (i===n)?'block':'none'; }); }
    // レシート表示でps3の中身を差し替えるため、会計開始時に標準スケルトンへ復元（#doneBtn等の消失防止）
    function resetPs3(){
      document.getElementById('ps3').innerHTML =
        '<div style="font-size:40px;">✅</div>'
        + '<div id="ps3lbl" style="font-weight:800;margin:8px 0;"></div>'
        + '<div id="ps3amt" style="font-size:20px;font-weight:900;color:var(--green);margin-bottom:16px;"></div>'
        + '<button class="pbtn" style="background:var(--green);" onclick="finalize()" id="doneBtn">'+t().done+'</button>'
        + '<button class="cancel" onclick="closePay()" id="cxl3">'+t().cancel+'</button>';
    }

    // [要望対応] シニア/PWD割引を使う場合、実際の支払い開始（現金確定・オンライン決済QR発行）より前に
    // 責任者（マネージャー以上）の承認を必須にする。オンライン決済は先に決済が動いてしまうため、
    // finalizeBillでの検証だけに頼らず、ここで事前確認する（finalizeBill側も二重防御として必ず再検証する）。
    function _dcAlert(msg){ var a=document.getElementById('dcApprAlert'); a.style.display='block'; a.innerText=msg; }
    function _dcVerifyThenGo(proceedFn){
      var on = document.getElementById('dcOn').checked;
      if (!on) { proceedFn(); return; }
      var rule=selectedDiscountRule();
      if(!rule){_dcAlert('Discount rule is required');return;}
      if(rule.idRequired && !document.getElementById('dcId').value.trim()){_dcAlert(lang==='en'?'ID is required':'ID番号を入力してください');return;}
      if(!rule.managerApprovalRequired){proceedFn();return;}
      var login = document.getElementById('dcApprLogin').value.trim();
      var pass = document.getElementById('dcApprPass').value;
      if (!login || !pass) { _dcAlert(t().discNeedAppr); return; }
      document.getElementById('dcApprAlert').style.display='none';
      API.post('verifyManagerApproval', { login: login, pass: pass, token: TOKEN }).then(function(r){
        var d = r.data || {};
        if (d.error==='discount_auth'){ _dcAlert(t().authFail); return; }
        if (d.error==='discount_not_manager'){ _dcAlert(t().discNotManager); return; }
        if (d.error){ _dcAlert('Error: '+API.userErrorText(d.error)); return; }
        proceedFn();
      }).catch(function(e){ _dcAlert('Error: '+API.userErrorText(e)); });
    }
    window.cashPay = function(){
      _dcVerifyThenGo(function(){
        payMethod = 'cash';
        document.getElementById('ps3lbl').innerText = t().cashRecv;
        document.getElementById('ps3amt').innerText = money(payTotal)+' — '+seatLabel(payTable);
        document.getElementById('doneBtn').innerText = t().done;
        step(3);
      });
    };
    // 2026-08-23: クレジットカードは通常、別のカード決済端末で処理される想定のため、この画面では
    // 「カード決済ボタンを押した＝店舗側の別端末で決済済み」という扱いで、そのまま完了画面(ps3)へ進む。
    // PayMongo等の決済APIとの連携は行わない（設定画面でボタン自体の表示可否のみ制御する）。
    window.cardPay = function(){
      _dcVerifyThenGo(function(){
        payMethod = 'card';
        document.getElementById('ps3lbl').innerText = settingLoc('cardPaymentInstruction',t().cardRecv);
        document.getElementById('ps3amt').innerText = money(payTotal)+' — '+seatLabel(payTable);
        document.getElementById('doneBtn').innerText = t().done;
        step(3);
      });
    };
    // 2026-08-23: GCashは設定画面に登録した店舗側の送金先QRコード画像をそのまま表示するだけの
    // 簡易な仕組み。決済APIとの連携は行わず、入金確認は従来どおりスタッフが目視で行い、
    // 「入金を確認した」ボタンを押すと会計完了画面(ps3)へ進む。
    window.gcashPay = function(){
      _dcVerifyThenGo(function(){
        payMethod = 'gcash';
        document.getElementById('ps2t').innerText = settingLoc('qrPaymentLabel',t().qrPayment);
        var qr = SETTINGS.gcashQr || '';
        var img = document.getElementById('payQr');
        if (qr){ img.src = qr; img.style.display='block'; } else { img.style.display='none'; }
        document.getElementById('ps2hint').innerText = settingLoc('qrPaymentInstruction',t().gcashHint);
        document.getElementById('checkBtn').innerText = t().gcashConfirm;
        document.getElementById('payAlert').style.display='none';
        step(2);
      });
    };
    window.confirmGcashPaid = function(){
      document.getElementById('ps3lbl').innerText = t().confirmed;
      document.getElementById('ps3amt').innerText = money(payTotal)+' — '+seatLabel(payTable);
      document.getElementById('doneBtn').innerText = t().done;
      step(3);
    };
    window.finalize = function(){
      var btn = document.getElementById('doneBtn'); btn.disabled=true; btn.innerText=t().processing;
      var _em=document.getElementById('payEmail'); var email=_em?_em.value.trim():'';
      var pv = window._bill||{};
      // [P0-1] 会計金額はクライアントから送らず、サーバーが対象注文から再計算する。
      // ここで送るのは対象(orderIds/table)・支払方法・割引の入力値（種別/対象額/ID/氏名）・メールのみ。
      // [修正点一覧C-1対応] card/gcashはサーバー側が決済台帳とPayMongoの実際の支払状況を突き合わせて検証する
      // ため、発行済みのcheckoutIdも一緒に送る。
      var discOn = document.getElementById('dcOn').checked;
      var req = { table: payTable, method: payMethod, orderIds: payOrderIds, email: email, token: TOKEN, checkoutId: payCheckoutId,
        discountType: pv.discountType||'', discountRuleId:pv.discountRuleId||'', discountId: pv.discountId||'', discountName: pv.discountName||'', discountEligible: pv.discountEligible||0,
        discountApproverLogin: discOn?document.getElementById('dcApprLogin').value.trim():'', discountApproverPass: discOn?document.getElementById('dcApprPass').value:'',
        __timeoutMs: API.TIMEOUT_MS.write }; // [タイムアウト共通化] 会計確定は複数注文まとめての場合もあり時間がかかり得るため専用枠を使う
      API.post('finalizeBill', req).then(function(r){
        btn.disabled=false; btn.innerText=t().done; var d=r.data||{};
        if (d.error==='discount_auth'){ UIAlert(t().authFail); return; }
        if (d.error==='discount_not_manager'){ UIAlert(t().discNotManager); return; }
        if (d.error==='senior_discount_disabled'){ UIAlert(t().discDisabled); return; }
        if (d.error==='discount_rule_not_found'){ UIAlert(lang==='en'?'The discount is disabled or no longer exists.':'割引が無効化または削除されています。'); return; }
        if (d.error==='discount_id_required'){ UIAlert(lang==='en'?'ID is required.':'ID番号を入力してください。'); return; }
        if (d.error==='unserved_orders'){ UIAlert(t().unservedBill); step(1); return; }
        if (d.error){ UIAlert('Error: '+API.userErrorText(d.error)); return; }
        if (d.demo){ closePay(); load(true); UIAlert(t().demoDone); return; }
        // 表示・印刷・eレシートは全てサーバーが再計算した金額を正とする。
        var bill = { table: payTable, method: payMethod, paymentLabel:d.paymentLabel||'', paymentLabelJa:d.paymentLabelJa||'', paymentLabelEn:d.paymentLabelEn||'', receiptPaymentLabel:d.receiptPaymentLabel||'', receiptPaymentLabelJa:d.receiptPaymentLabelJa||'', receiptPaymentLabelEn:d.receiptPaymentLabelEn||'', subtotal: d.subtotal, vat: d.vat, service: d.service,
          discountType: d.discountType||pv.discountType||'', discountId: pv.discountId||'', discountAmount: d.discountAmount, total: d.total };
        showReceipt(d.orNo||'', bill);
      }).catch(function(e){ btn.disabled=false; btn.innerText=t().done; UIAlert('Error: '+API.userErrorText(e)); });
    };

    // ヘッダの現在日時表示
    function _pad2(n){ return (n<10?'0':'')+n; }
    function updateHeadClock(){
      var el = document.getElementById('headClock'); if(!el) return;
      var d = new Date();
      el.textContent = window.DateDisplay ? DateDisplay.formatDateTime(d.toISOString()).slice(0,16) : d.getFullYear()+'-'+_pad2(d.getMonth()+1)+'-'+_pad2(d.getDate())+' '+_pad2(d.getHours())+':'+_pad2(d.getMinutes());
    }

    function boot(){
      // 言語の初期化・切替・永続化は共通部品I18nに一本化（他のスタッフ向け画面と同じ仕組み）。
      I18n.init(i18n, onLangChange);
      updateHeadClock();
      setInterval(updateHeadClock, 15000);
      API.post('bootstrap', {token:TOKEN}).then(function(r){
        SETTINGS = r.settings || {}; PAYMONGO = !!r.paymongo; BASE_DISCOUNT_RULES = r.discountRules || [];
        MENU_MAP=Object.create(null);
        (r.menu||[]).forEach(function(m){
          var key=String(m['商品名']||'').trim();if(!key)return;
          var entry={ja:String(m['商品名_JA']||'').trim(),en:String(m['商品名_EN']||'').trim(),choices:Object.create(null)};
          try{var groups=typeof m['オプション']==='string'?JSON.parse(m['オプション']||'[]'):m['オプション'];(Array.isArray(groups)?groups:[]).forEach(function(g){(g.choices||[]).forEach(function(c){[c.label,c.labelJa,c.labelEn].forEach(function(a){a=String(a||'').trim();if(a&&!entry.choices[a])entry.choices[a]={ja:String(c.labelJa||'').trim(),en:String(c.labelEn||'').trim()};});});});}catch(e){}
          MENU_MAP[key]=entry;
        });
        load();
      }).catch(function(){ load(); });
      loadCalls();
      resetTimer();
      // [P0][慎重レビューH5対応] タブが非表示の間はポーリング間隔を落とし、再表示時に即最新化する。
      // 固定8秒の別タイマーは廃止し、resetTimer（_pollIntervalMs）へ一本化した。
      document.addEventListener('visibilitychange', function(){
        resetTimer();
        if (document.visibilityState === 'visible' && autoOn && !paused()) load(true);
      });
      // [慎重レビューH1対応] バージョン不一致検知に万一漏れがあっても数分以内に必ず復帰する安全弁。
      setInterval(function(){ if(autoOn && !paused()) load(true); }, 180000); // 3分ごと強制フルリフレッシュ
      if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js').catch(function(){}); }
    }
    document.addEventListener('DOMContentLoaded', boot);
  </script>
  <script src="./help.js?v=auth2"></script>
  <script>
    HelpUI.register({
      title: '注文管理画面の使い方',
      titleEn: 'How to use Orders',
      items: [
