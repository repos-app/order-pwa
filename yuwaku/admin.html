<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Orders">

  <link rel="manifest" href="./admin.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <title>Orders</title>
  <style>
    :root{ --bg:#f6f7f9; --surface:#fff; --border:#e5e7eb; --navy:#0f172a; --text-3:#64748b; --red:#c62828; --green:#16a34a; }
    *{ box-sizing:border-box; }
    body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans JP',sans-serif; background:var(--bg); color:var(--navy); -webkit-tap-highlight-color:transparent; }
    .head{ position:sticky; top:0; z-index:20; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:space-between; padding:12px 16px; }
    .head h1{ font-size:18px; margin:0; font-weight:900; }
    .head .r{ display:flex; gap:8px; align-items:center; }
    .hbtn{ background:rgba(255,255,255,.14); color:#fff; border:0; border-radius:9px; padding:8px 12px; font-size:13px; font-weight:800; cursor:pointer; }
    .cnt{ background:#dc2626; border-radius:999px; padding:2px 10px; font-weight:900; font-size:13px; }
    .wrap{ padding:14px; max-width:900px; margin:0 auto; }
    .tg{ background:var(--surface); border:1px solid var(--border); border-radius:14px; margin-bottom:14px; overflow:hidden; }
    .tg-h{ display:flex; justify-content:space-between; align-items:center; padding:12px 14px; background:#0b1220; color:#fff; }
    .tg-h .ti{ font-size:17px; font-weight:900; }
    .tg-h .to{ font-size:16px; font-weight:900; color:#fbbf24; }
    .row{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; padding:10px 14px; border-bottom:1px solid var(--border); }
    .row.served{ opacity:.55; }
    .row .m{ flex:1; min-width:0; }
    .row .tm{ font-size:11px; color:var(--text-3); }
    .row .it{ font-size:14px; font-weight:600; margin-top:2px; overflow-wrap:normal; word-break:normal; max-width:100%; overflow-x:auto; }
    .row .rt{ display:flex; align-items:center; justify-content:flex-end; flex-wrap:wrap; gap:5px; flex:0 1 auto; max-width:50%; min-width:0; }
    .row .pr{ font-weight:900; max-width:100%; white-space:nowrap; overflow-x:auto; text-align:right; }
    /* Keep long item names and order actions in separate rows on narrow devices. */
    @media (max-width:480px){
      .tg .row{ flex-direction:column; align-items:stretch; }
      .tg .row .m{ width:100%; }
      .tg .row .rt{ width:100%; max-width:none; justify-content:flex-start; }
      .tg .row .pr{ margin-right:auto; text-align:left; }
      .tg .row .b-xs{ min-height:44px; white-space:nowrap; }
    }
    .b-xs{ border:0; border-radius:8px; padding:8px 12px; font-size:13px; font-weight:800; cursor:pointer; font-family:inherit; }
    .b-warn{ background:#f59e0b; color:#0f172a; }
    .served-lbl{ font-size:12px; color:var(--green); font-weight:800; }
    .prepaid{ background:#dcfce7; color:#15803d; font-weight:800; font-size:11px; padding:1px 7px; border-radius:999px; }
    .tg-a{ padding:12px 14px; }
    .b-pay{ width:100%; border:0; border-radius:11px; padding:13px; font-size:14px; font-weight:900; background:var(--green); color:#fff; cursor:pointer; font-family:inherit; }
    .empty{ text-align:center; color:var(--text-3); padding:50px 20px; font-weight:700; }
    .ov{ position:fixed; inset:0; background:rgba(0,0,0,.62); z-index:9999; display:none; align-items:center; justify-content:center; }
    .ov.on{ display:flex; }
    .card{ background:#fff; border-radius:18px; padding:22px; max-width:340px; width:calc(100% - 32px); margin:16px; max-height:90vh; overflow:auto; }
    .sum{ background:#f8fafc; border:1px solid #e2e8f0; border-radius:10px; padding:14px; margin-bottom:16px; }
    .sr{ display:flex; justify-content:space-between; font-size:13px; color:#555; margin-bottom:3px; }
    .big{ font-size:22px; font-weight:900; color:var(--red); margin-top:4px; }
    .pbtn{ border:0; padding:15px; font-size:15px; font-weight:800; border-radius:12px; cursor:pointer; color:#fff; font-family:inherit; width:100%; margin-bottom:10px; }
    .cancel{ width:100%; padding:11px; background:none; border:1.5px solid #ddd; border-radius:9px; color:#888; font-size:14px; cursor:pointer; font-weight:700; font-family:inherit; }
    .alert{ display:none; padding:11px; border-radius:9px; font-size:13px; margin-bottom:10px; text-align:left; line-height:1.5; }
    .calls-box{ background:#fffbeb; border:1px solid #fcd34d; border-radius:12px; padding:10px 12px; }
    .calls-h{ font-weight:900; font-size:13px; color:#92400e; margin-bottom:6px; }
    .call-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:5px 0; font-size:14px; font-weight:700; border-top:1px solid #fde68a; }
    .call-row:first-of-type{ border-top:0; }
    .dwell{ font-size:11px; font-weight:800; color:#0f766e; background:#ccfbf1; border-radius:6px; padding:1px 6px; }
    .ctlbar{ display:flex; align-items:center; gap:10px; padding:10px 16px; flex-wrap:wrap; position:sticky; top:0; z-index:15; background:var(--bg,#f6f7f9); border-bottom:1px solid #e5e7eb; }
    .auto-toggle{ border:0; border-radius:12px; padding:12px 20px; font-size:16px; font-weight:900; cursor:pointer; font-family:inherit; min-width:150px; }
    .auto-toggle.on{ background:#16a34a; color:#fff; } .auto-toggle.off{ background:#e2e8f0; color:#64748b; }
    .int-group{ display:flex; gap:6px; }
    .int-btn{ border:1px solid #cbd5e1; background:#fff; color:#334155; border-radius:9px; padding:9px 13px; font-size:14px; font-weight:800; cursor:pointer; font-family:inherit; }
    .int-btn.on{ background:#0f172a; color:#fff; border-color:#0f172a; }
    @keyframes izspin2{ to{ transform:rotate(360deg); } }
    .spin-once{ display:inline-block; animation:izspin2 .6s linear; }
    #izToast{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px); background:#0f172a; color:#fff; font-size:13px; font-weight:800; padding:10px 18px; border-radius:999px; box-shadow:0 8px 24px rgba(0,0,0,.25); z-index:100000; opacity:0; pointer-events:none; transition:opacity .18s, transform .18s; }
    #izToast.on{ opacity:1; transform:translateX(-50%) translateY(0); }
    #opsReadError{display:none;margin:10px 14px 0;padding:12px 14px;border:1px solid #fca5a5;border-radius:10px;background:#fef2f2;color:#991b1b;font-size:13px;line-height:1.5;font-weight:700;}
    #opsReadError.on{display:block;}
  /* Formal Android PT-CTL touch target: independent of common header injection. */
  #autoBtn{min-height:44px;min-width:44px;box-sizing:border-box}
  </style>
</head>
<body>
  <div class="head">
    <h1 id="title">注文管理</h1>
    <div class="r">
      <span class="cnt" id="headClock" style="background:transparent;font-weight:700;font-variant-numeric:tabular-nums;"></span>
      <a class="hbtn" href="./manage.html">← 管理</a>
      <span class="cnt" id="cnt">0</span>
      <button class="hbtn" id="langBtn" data-tlang onclick="I18n.toggle()">EN</button>
      <button class="hbtn" id="refreshBtn" onclick="manualRefresh()">↻</button>
    </div>
  </div>
  <div class="ctlbar">
    <button id="autoBtn" class="auto-toggle" onclick="toggleAuto()">—</button>
    <div class="int-group" id="intGroup"></div>
    <button class="int-btn" onclick="manualRefresh()" id="manualBtn">↻</button>
    <a class="int-btn" href="./receipts.html" style="text-decoration:none;display:inline-flex;align-items:center;">🧾 <span id="histLbl" style="margin-left:4px;">履歴</span></a>
  </div>
  <div class="wrap" id="callsWrap" style="display:none;"></div>
  <div id="opsReadError" role="alert" aria-live="assertive" aria-atomic="true"></div>
  <div id="offlineCashStatus" class="wrap" role="status" aria-live="polite" style="display:none;margin-top:8px;margin-bottom:8px;"></div>
  <div class="wrap" id="list"><div class="empty" id="loadMsg">読み込み中…</div></div>

  <!-- Payment modal -->
  <div class="ov" id="payModal">
    <div class="card">
      <div id="ps1">
        <div style="font-size:17px;font-weight:900;margin-bottom:12px;" id="ps1t">お会計</div>
        <div class="sum" id="paySum"></div>
        <div id="payDisc" style="border:1px solid #e5e7eb;border-radius:10px;padding:10px;margin-bottom:10px;font-size:13px;">
          <label style="display:flex;gap:8px;align-items:center;font-weight:800;cursor:pointer;"><input type="checkbox" id="dcOn" onchange="recompPay()"><span id="dcLbl">割引</span></label>
          <div id="dcBody" style="display:none;margin-top:8px;">
            <div style="margin-bottom:8px;"><select id="dcRule" onchange="recompPay()" style="width:100%;padding:8px;border:1px solid #e5e7eb;border-radius:8px;font-family:inherit;"></select></div>
            <div style="display:flex;gap:8px;margin-bottom:6px;">
              <input id="dcName" placeholder="対象者氏名" style="flex:1;padding:8px;border:1px solid #e5e7eb;border-radius:8px;font-family:inherit;">
              <input id="dcId" placeholder="ID番号" style="flex:1;padding:8px;border:1px solid #e5e7eb;border-radius:8px;font-family:inherit;">
            </div>
            <div style="display:flex;gap:8px;">
              <input id="dcElig" type="number" min="0" step="any" placeholder="対象額" style="width:120px;padding:8px;border:1px solid #e5e7eb;border-radius:8px;font-family:inherit;" oninput="recompPay()">
            </div>
            <div id="dcNote" style="color:#64748b;margin-top:6px;"></div>
            <div id="dcApprBox" style="margin-top:10px;padding-top:10px;border-top:1px dashed #e5e7eb;">
              <div id="dcApprL" style="font-size:12px;font-weight:800;margin-bottom:4px;">承認者（マネージャー以上のログイン）</div>
              <div style="display:flex;gap:8px;">
                <input id="dcApprLogin" placeholder="ログインID" autocomplete="off" style="flex:1;padding:8px;border:1px solid #e5e7eb;border-radius:8px;font-family:inherit;">
                <input id="dcApprPass" type="password" placeholder="パスワード" autocomplete="off" style="flex:1;padding:8px;border:1px solid #e5e7eb;border-radius:8px;font-family:inherit;">
              </div>
              <div id="dcApprAlert" style="display:none;color:#b91c1c;margin-top:6px;font-weight:700;"></div>
            </div>
          </div>
        </div>
        <div hidden aria-hidden="true" style="display:none;margin-bottom:10px;"><input id="payEmail" type="email" placeholder="e-receipt email (任意)" autocomplete="off" tabindex="-1" style="width:100%;padding:9px;border:1px solid #e5e7eb;border-radius:8px;font-family:inherit;box-sizing:border-box;"></div>
        <button class="pbtn" id="payBtnGcash" style="background:linear-gradient(135deg,#0f4c81,#1565c0);" onclick="gcashPay()">📱 <span id="qrPayLbl">QR決済</span></button>
        <button class="pbtn" id="payBtnCard" style="background:linear-gradient(135deg,#2e7d32,#43a047);" onclick="cardPay()">💳 <span id="cardPayLbl">カード</span></button>
        <button class="pbtn" id="payBtnCash" style="background:#334155;" onclick="cashPay()">💴 <span id="cashLbl">現金</span></button>
        <button class="cancel" onclick="closePay()" id="cxl1">キャンセル</button>
      </div>
      <div id="ps2" style="display:none;text-align:center;">
        <div style="font-size:17px;font-weight:900;margin-bottom:4px;" id="ps2t">QR決済</div>
        <div style="display:inline-block;padding:8px;border:2px solid #e0e8f5;border-radius:12px;margin-bottom:12px;">
          <img id="payQr" src="" alt="QR" style="width:200px;height:200px;display:none;border-radius:6px;">
        </div>
        <div id="ps2hint" style="font-size:12px;color:#64748b;margin-bottom:12px;"></div>
        <button class="pbtn" style="background:#f59e0b;color:#0f172a;" onclick="confirmGcashPaid()" id="checkBtn">入金を確認した</button>
        <div class="alert" id="payAlert"></div>
        <button class="cancel" onclick="closePay()">キャンセル</button>
      </div>
      <div id="ps3" style="display:none;text-align:center;padding:12px 0;">
        <div style="font-size:40px;">✅</div>
        <div id="ps3lbl" style="font-weight:800;margin:8px 0;"></div>
        <div id="ps3amt" style="font-size:20px;font-weight:900;color:var(--green);margin-bottom:16px;"></div>
        <button class="pbtn" style="background:var(--green);" onclick="finalize()" id="doneBtn">完了（会計済にする）</button>
        <button class="cancel" onclick="closePay()" id="cxl3">キャンセル</button>
      </div>
    </div>
  </div>

  <!-- Partial checkout modal -->
  <div class="ov" id="partModal">
    <div class="card">
      <div style="font-size:17px;font-weight:900;margin-bottom:10px;" id="partT">一部会計 — 明細選択</div>
      <div id="partList" style="max-height:46vh;overflow:auto;margin-bottom:10px;"></div>
      <div style="display:flex;justify-content:space-between;font-weight:900;margin-bottom:10px;"><span id="partSelLbl">選択</span><span id="partSel">₱0</span></div>
      <button class="pbtn" style="background:var(--green);" onclick="goPartial()" id="partGo">選択分を会計</button>
      <button class="cancel" onclick="closePart()" id="partCxl">キャンセル</button>
    </div>
  </div>

  <!-- Void (cancel) modal -->
  <div class="ov" id="voidModal">
    <div class="card">
      <div style="font-size:17px;font-weight:900;margin-bottom:6px;" id="vdT">注文の取消</div>
      <div id="vdItem" style="font-size:13px;color:#475569;margin-bottom:10px;"></div>
      <label style="font-size:12px;font-weight:800;" id="vdReasonL">取消理由</label>
      <input id="vdReason" style="width:100%;padding:9px;border:1px solid #e5e7eb;border-radius:8px;font-family:inherit;margin:4px 0 10px;box-sizing:border-box;">
      <div id="vdApproverFields">
        <div style="font-size:12px;font-weight:800;margin-bottom:4px;" id="vdApprL">承認者（マネージャー以上のログイン）</div>
        <input id="vdLogin" placeholder="ログインID" autocomplete="off" style="width:100%;padding:9px;border:1px solid #e5e7eb;border-radius:8px;font-family:inherit;margin-bottom:6px;box-sizing:border-box;">
        <input id="vdPass" type="password" placeholder="パスワード" autocomplete="off" style="width:100%;padding:9px;border:1px solid #e5e7eb;border-radius:8px;font-family:inherit;margin-bottom:10px;box-sizing:border-box;">
      </div>
      <div class="alert" id="vdAlert"></div>
      <button class="pbtn" style="background:#b91c1c;" onclick="doVoid()" id="vdGo">取消を承認</button>
      <button class="cancel" onclick="closeVoid()" id="vdCxl">キャンセル</button>
    </div>
  </div>

  <script src="./date-display.js?v=auth4" data-iz-date-display></script><script src="./config.js?v=auth2"></script>
  <script src="./api.js?v=auth2"></script>
  <script src="./i18n.js?v=auth3"></script>
  <script src="./confirm.js?v=auth2"></script>
  <script>
    // [P0-2] 会計・注文操作はスタッフ操作のため、事前ログイン（1回のみ）を必須にする。
    var TOKEN = localStorage.getItem(window.APP_CONFIG.AUTH_STORAGE_PREFIX + 'mgmtToken') || '';
    if (!TOKEN) location.href = './manage.html';
    var SETTINGS = {}, PAYMONGO = false, orders = [], calls = [], voidId = '', MENU_MAP = {}, PARTY_SIZES = {}, BASE_DISCOUNT_RULES = [], DISCOUNT_RULES = [];
    var autoOn = (function(){ try{ var v=localStorage.getItem('adminAuto'); return v===null?true:(v==='1'); }catch(e){ return true; } })();
    var refreshSec = (function(){ try{ var v=parseInt(localStorage.getItem('adminRefreshSec'),10); return (v===10||v===30||v===60)?v:30; }catch(e){ return 30; } })();
    var refreshTimer = null;
    function currentRole(){ try{return localStorage.getItem(window.APP_CONFIG.AUTH_STORAGE_PREFIX+'mgmtRole')||'';}catch(e){return'';} }
    function currentUserCanApprove(){return ['マネージャー','管理者','システム','manager','admin','system'].indexOf(String(currentRole()))>=0;}
    // 言語の切替・優先順位・永続化は共通部品 i18n.js（I18n）に統一。この画面は現在言語を表す
    // ローカル変数 lang を持つのみで、実際の切替ロジックはI18n.init()のonChangeコールバック経由で更新する
    // （他画面（kds.html/register.html/inventory.html/settings.html/expenses.html等）と同じ仕組みを利用）。
    var lang = 'en'; // I18n.init()完了後、正しい値に更新される（初期値は暫定）
    // Partial checkout logic stays in source but is not available in the Orders UI.
    var PARTIAL_CHECKOUT_UI_ENABLED = false;
    var payTable = '', payTotal = 0, payCheckoutId = null, payMethod = 'cash', paySub = 0, payBase = null, payOrderIds = null, partTable = '';
    var offlineCashRows = [], offlineCashBusy = false, offlineSnapshotRestore = null;
    var payEntryFee = 0, payExtensionFee = 0, payPartySize = 0; // [要望対応] 入場料・延長料のプレビュー

    var i18n = {
      ja: { title:'注文管理', served:'✓ 提供済', servedBtn:'提供済にする', pay:'💳 会計する', noOrder:'未会計の注文はありません',

            disc:'割引', senior:'シニア', idPh:'ID番号', eligPh:'対象額', discLine:'割引', vatNote:'うちVAT', orLbl:'レシート番号', printBtn:'🖨️ レシート印刷', close:'閉じる', tableW:'卓', totalW:'合計',
            partial:'🧾 一部会計', partTitle:'一部会計 — 明細を選択', selected:'選択', selPay:'選択分を会計',
            callHdr:'🔔 呼び出し', callLbl:'スタッフ呼出', billLbl:'お会計希望', resolve:'対応済', agoMin:'分前', stay:'滞在', voidBtn:'取消', voidT:'注文の取消', reason:'取消理由', approver:'承認者（マネージャー以上のログイン）', loginPh:'ログインID', passPh:'パスワード', voidGo:'取消を承認', voidGoNoApproval:'取消を実行', needReason:'取消理由を入力してください', needApprover:'マネージャー以上の承認者ID・パスワードを入力してください', authFail:'マネージャー以上の承認者IDまたはパスワードを確認してください', voided:'取消しました', alreadySettled:'会計済のため取消できません', eReceipt:'eレシート送信先メール（任意）',
            entryFeeLbl:'入場料', extFeeLbl:'延長料',
            discApprover:'承認者（マネージャー以上のログイン）', discNeedAppr:'マネージャー以上の承認者ログインID・パスワードを入力してください', discNotManager:'マネージャー以上の権限が必要です', discDisabled:'シニア/PWD割引は現在無効化されています', discVerifying:'承認確認中…', unservedBill:'未提供の注文が含まれています。先に対象明細を「提供済」にしてから会計してください。', demoTag:'🧪 デモ', demoDone:'デモ会計が完了しました。売上・レシート・ポイント・在庫には計上されません。' },

            cash:'Cash', card:'Card', qrPayment:'QR Payment', cancel:'Cancel', pTitle:'Payment', sub:'Subtotal', svc:'Service', tax:'Tax',
            openPay:'Open payment page', checkBtn:'Check status', checking:'Checking…', notYet:'Payment not confirmed yet.',
            noKey:'Online payment is not set up.', cashRecv:'Cash received?', cardRecv:'💳 Please process the credit card payment on the card terminal. Once confirmed, press the button below to complete checkout.', gcashHint:'Ask the customer to scan the QR code and pay, then press the button below once you\'ve confirmed the payment.', gcashConfirm:'Payment confirmed', confirmed:'Paid', done:'Done (settle)', processing:'Processing…', lang:'JP',
            disc:'Discount', senior:'Senior', idPh:'ID no.', eligPh:'Eligible amt', discLine:'Discount', vatNote:'incl. VAT', orLbl:'Receipt no.', printBtn:'🖨️ Print receipt', close:'Close', tableW:'Table', totalW:'TOTAL',
            partial:'🧾 Partial', partTitle:'Partial checkout — select items', selected:'Selected', selPay:'Checkout selected',
            callHdr:'🔔 Requests', callLbl:'Call staff', billLbl:'Bill please', resolve:'Done', agoMin:'m ago', stay:'Seated', voidBtn:'Void', voidT:'Void order', reason:'Reason', approver:'Approver (Manager or above login)', loginPh:'Login ID', passPh:'Password', voidGo:'Approve void', voidGoNoApproval:'Void order', needReason:'Please enter a reason', needApprover:'Enter a Manager-or-above approver login ID and password', authFail:'Check the Manager-or-above approver login ID and password', voided:'Order voided', alreadySettled:'Cannot void a settled order', eReceipt:'e-receipt email (optional)',
            entryFeeLbl:'Entry fee', extFeeLbl:'Extension fee',

    function breakdown(subtotal){
      var s = Number(subtotal)||0;

    // [C1修正] Senior/PWD割引の計算式。src/billing.js の seniorPwdCalc と必ず同じ式にすること
    // （2026-08-25: GAS版ManagementSystemDev/code.jsは完全廃止済み。現在の正はsrc/billing.js）
    // （画面プレビューと会計確定額がズレていた不具合の修正。片方だけ直すと再びズレる）。
    function seniorPwdCalc(subtotal, eligible, b){
      var taxRate = Number(SETTINGS.taxRate)||0, taxIncl = String(SETTINGS.taxInclusive)==='true';
      var r = taxRate/100;
      var netEligible = taxIncl ? (eligible/(1+r)) : eligible;
      var discount20 = roundCharge(netEligible*0.20);
      var vatExempt;
      if (taxIncl){ vatExempt = roundCharge(eligible - netEligible); }
      else {
        var nonEligibleAfterSvc = Math.max(0, b.afterSvc - eligible);
        var vatCorrect = roundCharge(nonEligibleAfterSvc*r);
        vatExempt = Math.max(0, b.tax - vatCorrect);
      }
      var totalDiscount = discount20 + vatExempt;
      var nonEligibleSub = Math.max(0, subtotal - eligible);
      var vatDisplay = taxIncl ? roundCharge(nonEligibleSub - nonEligibleSub/(1+r)) : roundCharge(nonEligibleSub*r);
      var total = Math.max(0, b.total - totalDiscount);
      return { discountAmount: totalDiscount, vat: vatDisplay, total: total };
    }

    function genericDiscountCalc(subtotal, eligible, b, rule){
      if(rule.legacyType) return seniorPwdCalc(subtotal,eligible,b);
      var taxRate=Math.max(0,Number(SETTINGS.taxRate)||0)/100,taxIncl=String(SETTINGS.taxInclusive)==='true';
      var netEligible=(rule.taxExempt&&taxIncl&&taxRate>0)?eligible/(1+taxRate):eligible;
      var base=rule.taxExempt?netEligible:eligible;
      var ordinary=rule.calculationType==='fixed'?roundCharge(Math.min(Number(rule.value)||0,base)):roundCharge(base*(Number(rule.value)||0)/100);
      var taxExemption=0,vat=b.tax;
      if(rule.taxExempt){if(taxIncl)taxExemption=roundCharge(eligible-netEligible);else{var correct=roundCharge(Math.max(0,b.afterSvc-eligible)*taxRate);taxExemption=Math.max(0,b.tax-correct);}var nonEligible=Math.max(0,subtotal-eligible);vat=taxIncl?roundCharge(nonEligible-nonEligible/(1+taxRate)):roundCharge(nonEligible*taxRate);}
      var amount=roundCharge(ordinary+taxExemption);return {discountAmount:amount,vat:vat,total:Math.max(0,roundCharge(b.total-amount))};
    }

    function _dcVerifyThenGo(proceedFn){

      if(!rule.managerApprovalRequired){proceedFn();return;}

      var login = document.getElementById('dcApprLogin').value.trim();

      document.getElementById('dcApprAlert').style.display='none';

      loadCalls();
      resetTimer();
      // [P0][慎重レビューH5対応] タブが非表示の間はポーリング間隔を落とし、再表示時に即最新化する。
      // 固定8秒の別タイマーは廃止し、resetTimer（_pollIntervalMs）へ一本化した。
      document.addEventListener('visibilitychange', function(){
        resetTimer();
        if (document.visibilityState === 'visible' && autoOn && !paused()) load(true);
      });
      // [慎重レビューH1対応] バージョン不一致検知に万一漏れがあっても数分以内に必ず復帰する安全弁。
      setInterval(function(){ if(autoOn && !paused()) load(true); }, 180000); // 3分ごと強制フルリフレッシュ
      if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js').catch(function(){}); }
    }
    document.addEventListener('DOMContentLoaded', boot);
  </script>
