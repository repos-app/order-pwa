<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Recipe">

  <link rel="manifest" href="./recipe.webmanifest">
  <title>Recipe</title>
  <style>
    :root{ --bg:#f6f7f9; --surface:#fff; --border:#e5e7eb; --navy:#0f172a; --text-3:#64748b; }
    *{ box-sizing:border-box; }
    body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans JP',sans-serif; background:var(--bg); color:var(--navy); }
    .head{ position:sticky; top:0; z-index:20; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:space-between; padding:12px 16px; }
    .head h1{ font-size:18px; margin:0; font-weight:900; }
    .hbtn{ background:rgba(255,255,255,.14); color:#fff; border:0; border-radius:9px; padding:8px 12px; font-size:13px; font-weight:800; cursor:pointer; text-decoration:none; }
    .wrap{ padding:16px; max-width:800px; margin:0 auto; }
    .card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; }
    .hint{ color:var(--text-3); font-size:13px; line-height:1.7; margin-bottom:12px; }
    table{ width:100%; border-collapse:collapse; font-size:13px; }
    th,td{ padding:8px 6px; border-bottom:1px solid var(--border); text-align:left; white-space:nowrap; }
    th{ font-size:11px; color:var(--text-3); }
    select,input{ width:100%; padding:8px; border:1px solid var(--border); border-radius:8px; font-size:14px; font-family:inherit; background:var(--surface); }
    .btn{ border:0; border-radius:11px; padding:13px; font-size:15px; font-weight:900; cursor:pointer; font-family:inherit; }
    .btn-sec{ background:#eef2f7; color:var(--navy); width:100%; margin-top:10px; }
    .btn-pri{ background:var(--navy); color:#fff; width:100%; margin-top:10px; }
    .btn-sm{ background:#eef2f7; color:var(--navy); padding:8px 10px; border-radius:8px; font-weight:800; border:0; cursor:pointer; }
    .alert{ margin-top:10px; display:none; padding:11px; border-radius:9px; font-size:14px; font-weight:700; }
  </style>
</head>
<body>
  <div class="head"><h1 data-t="title">📖 レシピ・原価</h1><div style="display:flex;gap:8px;"><button class="hbtn" data-tlang onclick="I18n.toggle()">EN</button><a class="hbtn" href="./manage.html" data-t="back">← 管理へ</a></div></div>
  <div class="wrap"><div class="card">
    <div class="hint" data-t="hint">メニューが使う在庫材料と消費量を登録すると、提供時に自動減算され、売上分析で原価率が算出されます。材料は「ドリンク在庫」の登録名から選べます（例: 生ビール → ビール樽 0.33）。</div>
    <div style="overflow:auto;">
      <table><thead><tr><th style="min-width:150px;" data-t="thMenu">メニュー</th><th style="min-width:150px;" data-t="thMat">材料（在庫）</th><th style="width:100px;" data-t="thQty">消費量</th><th style="width:44px;"></th></tr></thead>
      <tbody id="rows"><tr><td colspan="4" style="color:#aaa;padding:16px;text-align:center;" data-t="loading">読み込み中…</td></tr></tbody></table>
    </div>
    <button class="btn btn-sec" onclick="addRow()" data-t="addRow">＋ 行を追加</button>
    <button class="btn btn-pri" id="saveBtn" onclick="save()" data-t="save">💾 保存</button>
    <div class="alert" id="msg"></div>
  </div></div>

  <script src="./config.js?v=auth2"></script>
  <script src="./api.js?v=auth2"></script>
  <script src="./i18n.js?v=auth3"></script>
  <script>
    var TOKEN = localStorage.getItem(window.APP_CONFIG.AUTH_STORAGE_PREFIX + 'mgmtToken') || '';
    if (!TOKEN) location.href = './manage.html';
    function rpc(fn,args){ return API.post('rpc',{fn:fn,args:args||[],token:TOKEN}).then(function(r){ return r.data; }); }
    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
    // 言語切替の一元ヘルパー（新しい選択肢・候補リストを追加する際は必ずこれを通すこと）
    function isEN(){ return !!(window.I18n && I18n.lang && I18n.lang()==='en'); }
    function loc(ja, en){ ja=(ja||'').trim(); en=(en||'').trim(); return isEN() ? (en || ja) : (ja || en); }
    window.rows = []; var MATERIALS = [], MENUS = [];

    // value（送信値・バックエンド照合キー）はcanonical名、表示テキストのみ現在の言語に合わせる。
    function opts(list, sel){ return '<option value=""></option>' + (list||[]).map(function(n){ return '<option value="'+esc(n.key)+'"'+(n.key===sel?' selected':'')+'>'+esc(loc(n.ja, n.en))+'</option>'; }).join(''); }
    function render(){
      var html = '';
      window.rows.forEach(function(r,i){
        html += '<tr>'+
          '<td><select required aria-required="true" data-recipe-row="'+i+'" data-recipe-field="menu" onchange="window.rows['+i+'].menu=this.value">'+opts(MENUS, r.menu)+'</select></td>'+
          '<td><select required aria-required="true" data-recipe-row="'+i+'" data-recipe-field="material" onchange="window.rows['+i+'].material=this.value">'+opts(MATERIALS, r.material)+'</select></td>'+
          '<td><input required aria-required="true" data-recipe-row="'+i+'" data-recipe-field="qty" type="number" min="0.000001" step="any" value="'+(r.qty||'')+'" oninput="window.rows['+i+'].qty=Number(this.value)||0"></td>'+
          '<td><button class="btn-sm" onclick="delRow('+i+')">🗑</button></td></tr>';
      });
      if (!window.rows.length) html = '<tr><td colspan="4" style="color:#aaa;padding:16px;text-align:center;">'+I18n.t('empty')+'</td></tr>';
      document.getElementById('rows').innerHTML = html;
    }
    window.addRow = function(){ window.rows.push({ menu:'', material:'', qty:1 }); render(); };
    window.delRow = function(i){ window.rows.splice(i,1); render(); };
    window.save = function(){
      for(var i=0;i<window.rows.length;i++){
        var r=window.rows[i], prefix=I18n.t('rowPrefix')+(i+1)+': ';
        if(!String(r.menu||'').trim()){msg(prefix+I18n.t('needMenu'),false);var me=document.querySelector('[data-recipe-row="'+i+'"][data-recipe-field="menu"]');if(me)me.focus();return;}
        if(!String(r.material||'').trim()){msg(prefix+I18n.t('needMaterial'),false);var ma=document.querySelector('[data-recipe-row="'+i+'"][data-recipe-field="material"]');if(ma)ma.focus();return;}
        if(!Number.isFinite(Number(r.qty))||Number(r.qty)<=0){msg(prefix+I18n.t('needQty'),false);var qe=document.querySelector('[data-recipe-row="'+i+'"][data-recipe-field="qty"]');if(qe)qe.focus();return;}
      }
      var clean = window.rows.map(function(r){ return {menu:String(r.menu).trim(),material:String(r.material).trim(),qty:Number(r.qty)}; });
      var btn = document.getElementById('saveBtn'); btn.disabled=true;
      rpc('saveRecipes',[clean]).then(function(r){ if(!r||r.success!==true) throw new Error((r&&r.error)||'save_failed'); btn.disabled=false; msg(I18n.t('saved'), true); })
        .catch(function(e){ btn.disabled=false; msg(I18n.t('errPrefix')+API.userErrorText(e), false); });
    };
    function msg(text, ok){ var m=document.getElementById('msg'); m.style.display='block'; m.style.background=ok?'#dcfce7':'#fee2e2'; m.style.color=ok?'#15803d':'#b91c1c'; m.innerText=text; }

    Promise.all([ rpc('getRecipes',[]), rpc('getDrinkInventory',[]), rpc('getAllMenuForAdmin',[]) ]).then(function(res){
      window.rows = (res[0]||[]).slice();
      MATERIALS = (res[1]||[]).map(function(m){ return { key:m.name, ja:(m.nameJa!==undefined?m.nameJa:m.name), en:m.nameEn }; }).filter(function(m){ return m.key; });
      MENUS = (res[2]||[]).map(function(m){ return { key:m['商品名'], ja:(m['商品名_JA']!==undefined?m['商品名_JA']:m['商品名']), en:m['商品名_EN'] }; }).filter(function(m){ return m.key; });
      __loaded = true; render();
    }).catch(function(e){ if(String(e.message||e).indexOf('unauthorized')>=0){ location.href='./manage.html'; return; } document.getElementById('rows').innerHTML='<tr><td colspan="4" style="color:#b91c1c;padding:16px;">'+I18n.t('loadErr')+esc(API.userErrorText(e))+'</td></tr>'; });

    I18n.init({
      ja:{ title:'📖 レシピ・原価', back:'← 管理へ', hint:'メニューが使う在庫材料と消費量を登録すると、提供時に自動減算され、売上分析で原価率が算出されます。材料は「ドリンク在庫」の登録名から選べます（例: 生ビール → ビール樽 0.33）。', thMenu:'メニュー', thMat:'材料（在庫）', thQty:'消費量', addRow:'＋ 行を追加', save:'💾 保存', loading:'読み込み中…', empty:'「＋ 行を追加」で登録してください', rowPrefix:'行 ', needMenu:'メニューを選択してください。', needMaterial:'材料を選択してください。', needQty:'消費量は0より大きい数値を入力してください。', saved:'✅ 保存しました', errPrefix:'エラー: ', loadErr:'読み込みエラー: ' },
      en:{ title:'📖 Recipes · Cost', back:'← Manage', hint:'Register the stock ingredients and amounts each menu item uses. Stock is auto-deducted on serving, and the cost ratio appears in sales analytics. Ingredients come from your Drink Stock names (e.g. Draft beer → Beer keg 0.33).', thMenu:'Menu', thMat:'Ingredient (stock)', thQty:'Amount', addRow:'＋ Add row', save:'💾 Save', loading:'Loading…', empty:'Tap “＋ Add row” to register', rowPrefix:'Row ', needMenu:'Select a menu item.', needMaterial:'Select an ingredient.', needQty:'Enter an amount greater than 0.', saved:'✅ Saved', errPrefix:'Error: ', loadErr:'Load error: ' }
    }, function(){ if(__loaded) render(); });
  </script>

  <script src="./help.js?v=auth2"></script>
  <script>
    HelpUI.register({
      title: 'レシピ・原価',
      titleEn: 'Recipes · Cost',
      items: [
        { ja: '① 「＋ 行を追加」で行を追加し、「メニュー」欄で商品、「材料（在庫）」欄で使う在庫材料、「消費量」欄で1回の提供に使う量を選んで入力します（例: 生ビール → ビール樽 0.33）。', en: '① Press "＋ Add row", then choose a menu item, the stock ingredient it uses, and the amount consumed per serving (e.g. Draft beer → Beer keg 0.33).' },
        { ja: '② 1つのメニューに複数の材料が必要な場合は、同じメニューで行を分けて複数登録できます。', en: '② If a menu item needs multiple ingredients, add a separate row for each one using the same menu item.' },
        { ja: '③ 「💾 保存」を押すとレシピが確定します。以降、そのメニューが注文されるたびに登録した消費量ぶん在庫が自動で減算されます。', en: '③ Press "💾 Save" to confirm the recipe. From then on, stock is automatically deducted by the registered amount every time that menu item is ordered.' },
        { ja: '④ 登録したレシピは売上分析での原価率の算出にも使われます。材料の選択肢は「在庫管理」に登録済みの商品名から選びます。', en: '④ Registered recipes are also used to calculate the cost ratio in sales analytics. Ingredient choices come from the item names already registered in "Inventory".' },
        { ja: '⑤ 各行の🗑ボタンでその行（メニューと材料の組み合わせ）を削除できます。', en: '⑤ Use the 🗑 button on a row to delete that menu-to-ingredient pairing.' }
      ]
    });
  </script>
</body>
</html>
