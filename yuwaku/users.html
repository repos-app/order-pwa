<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Users &amp; ">

  <link rel="manifest" href="./users.webmanifest">
  <title>Users &amp; Roles</title>
  <style>
    :root{ --bg:#f6f7f9; --surface:#fff; --border:#e5e7eb; --navy:#0f172a; --text-3:#64748b; --red:#c62828; }
    *{ box-sizing:border-box; }
    body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans JP',sans-serif; background:var(--bg); color:var(--navy); }
    .head{ position:sticky; top:0; z-index:20; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:space-between; padding:12px 16px; }
    .head h1{ font-size:18px; margin:0; font-weight:900; }
    .hbtn{ background:rgba(255,255,255,.14); color:#fff; border:0; border-radius:9px; padding:8px 12px; font-size:13px; font-weight:800; cursor:pointer; text-decoration:none; }
    .wrap{ padding:16px; max-width:900px; margin:0 auto; }
    .card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:14px; }
    .card-title{ font-weight:900; font-size:15px; margin-bottom:12px; }
    .tabs{ display:flex; gap:6px; margin-bottom:14px; }
    .tab{ flex:1; padding:10px; text-align:center; border:1px solid var(--border); background:var(--surface); border-radius:10px; font-size:13px; font-weight:800; cursor:pointer; color:var(--text-3); }
    .tab.active{ background:var(--navy); color:#fff; border-color:var(--navy); }
    .pane{ display:none; } .pane.active{ display:block; }
    .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .fg{ margin-bottom:8px; }
    .form-label{ font-size:12px; font-weight:700; display:block; margin-bottom:4px; }
    .fc{ width:100%; padding:10px; border:1px solid var(--border); border-radius:9px; font-size:15px; font-family:inherit; background:var(--surface); }
    .btn{ border:0; border-radius:11px; padding:13px; font-size:15px; font-weight:900; cursor:pointer; font-family:inherit; }
    .btn-pri{ background:var(--navy); color:#fff; width:100%; margin-top:10px; }
    .btn-sec{ background:#eef2f7; color:var(--navy); width:100%; margin-top:8px; }
    .btn-sm{ border:0; border-radius:8px; padding:7px 11px; font-size:12px; font-weight:800; cursor:pointer; }
    .b-edit{ background:#eff6ff; color:#2563eb; } .b-del{ background:#fee2e2; color:#b91c1c; }
    .u-row{ display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--border); flex-wrap:wrap; }
    .u-row .nm{ font-weight:800; } .u-row .lid{ font-family:monospace; font-size:12px; color:var(--text-3); }
    .chip{ font-size:11px; font-weight:800; padding:2px 9px; border-radius:999px; background:#eef2f7; color:#475569; }
    .muted{ color:var(--text-3); font-size:12px; }
    table{ width:100%; border-collapse:collapse; font-size:13px; }
    table.pm{ min-width:0; table-layout:fixed; }
    .pm th,.pm td{ padding:8px 6px; text-align:center; border-bottom:1px solid var(--border); }
    .pm th:first-child,.pm td:first-child{ text-align:left; font-weight:800; width:40%; }
    .pm th:not(:first-child),.pm td:not(:first-child){ width:15%; overflow-wrap:anywhere; }
    .pm input{ width:20px; height:20px; }
    .alert{ margin-top:10px; display:none; padding:11px; border-radius:9px; font-size:14px; font-weight:700; }
    @media (max-width:520px){ #pane-p .card{ padding:12px 10px; } .pm{ font-size:11px; } .pm th,.pm td{ padding:7px 2px; line-height:1.25; } .pm input{ width:18px; height:18px; margin:0; } }
  </style>
</head>
<body>
  <div class="head"><h1 data-t="title">👥 ユーザー管理</h1><div style="display:flex;gap:8px;"><button class="hbtn" data-tlang onclick="I18n.toggle()">EN</button><a class="hbtn" href="./manage.html" data-t="back">← 管理へ</a></div></div>
  <div class="wrap">
    <div class="tabs">
      <div class="tab active" id="tab-u" onclick="switchTab('u')" data-t="tabU">👤 ユーザー</div>
      <div class="tab" id="tab-p" onclick="switchTab('p')" data-t="tabP">🔑 権限マスタ</div>
    </div>

    <div class="pane active" id="pane-u">
      <div class="card" id="guide-user-form" data-guide-anchor>
        <div class="card-title" data-t="formTitle">➕ ユーザーの追加 / 編集</div>
        <input type="hidden" id="uId">
        <div class="grid2">
          <div class="fg"><label class="form-label" data-t="lblName">名前</label><input id="uName" class="fc" required aria-required="true"></div>
          <div class="fg"><label class="form-label" data-t="lblRole">権限グループ</label><select id="uRole" class="fc"><option value="一般" data-t="rGen">一般</option><option value="マネージャー" data-t="rMgr">マネージャー</option><option value="管理者" data-t="rAdmin">管理者</option><option value="システム" data-t="rSys">システム</option></select></div>
          <div class="fg"><label class="form-label" data-t="lblLogin">ログインID</label><input id="uLogin" class="fc" autocomplete="off"></div>
          <div class="fg"><label class="form-label" data-t="lblWage">時給</label><input id="uWage" type="number" min="0" class="fc"></div>
          <div class="fg"><label class="form-label" data-t="lblPass">パスワード</label><input id="uPass" type="password" class="fc" autocomplete="new-password" minlength="8"><div class="muted" data-t="passHint">空欄なら変更しません（新規は8文字以上必須）</div></div>
          <div class="fg"><label class="form-label" data-t="lblStatus">ステータス</label><select id="uStatus" class="fc"><option value="在籍" data-t="stActive">在籍</option><option value="退職" data-t="stLeft">退職</option></select></div>
        </div>
        <button class="btn btn-pri" id="saveU" onclick="saveUser()" data-t="save">💾 保存</button>
        <button class="btn btn-sec" onclick="clearForm()" data-t="clear">クリア</button>
        <div class="alert" id="uMsg"></div>
      </div>
      <div class="card">
        <div class="card-title" data-t="listTitle">👥 ユーザー一覧</div>
        <div id="uList"><div class="muted" data-t="loading">読み込み中…</div></div>
      </div>
    </div>

    <div class="pane" id="pane-p">
      <div class="card">
        <div class="card-title" data-t="pmTitle">🔑 権限マトリクス</div>
        <div class="muted" style="margin-bottom:10px;line-height:1.7;" data-t="pmHint">権限グループ×メニューでアクセス可否を設定します。✓＝表示/アクセス可。システムは常に全権限（ロックアウト防止）。</div>
        <div style="overflow:auto;"><table class="pm" id="pmTable"><tbody><tr><td class="muted" data-t="loading">読み込み中…</td></tr></tbody></table></div>
        <button class="btn btn-pri" id="saveP" onclick="savePerms()" data-t="save">💾 保存</button>
        <div class="alert" id="pMsg"></div>
      </div>
    </div>
  </div>

  <script src="./config.js?v=auth2"></script>
  <script src="./api.js?v=auth2"></script>
  <script src="./i18n.js?v=auth3"></script>
  <script src="./confirm.js?v=auth2"></script>
  <script>
    var TOKEN = localStorage.getItem(window.APP_CONFIG.AUTH_STORAGE_PREFIX + 'mgmtToken') || '';
    if (!TOKEN) location.href = './manage.html';
    function rpc(fn,args){ return API.post('rpc',{fn:fn,args:args||[],token:TOKEN}).then(function(r){ return r.data; }); }
    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
    var allUsers = [], pmData = null;
    function LBL(k){ var en=(window.I18n&&I18n.lang()==='en'); if(pmData&&pmData.labels&&pmData.labels[k]) return en?pmData.labels[k].en:pmData.labels[k].ja; return I18n.t('pg_'+k) || k; }

    window.switchTab = function(w){
      document.getElementById('tab-u').classList.toggle('active', w==='u');
      document.getElementById('tab-p').classList.toggle('active', w==='p');
      document.getElementById('pane-u').classList.toggle('active', w==='u');
      document.getElementById('pane-p').classList.toggle('active', w==='p');
      if (w==='p' && !pmData) loadMatrix();
    };
    function msg(id, text, ok){ var e=document.getElementById(id); e.style.display='block'; e.style.background=ok?'#dcfce7':'#fee2e2'; e.style.color=ok?'#15803d':'#b91c1c'; e.innerText=text; }

    function renderUsers(){
      if (!allUsers.length){ document.getElementById('uList').innerHTML='<div class="muted" style="padding:14px 0;">'+I18n.t('noData')+'</div>'; return; }
      document.getElementById('uList').innerHTML = allUsers.map(function(u){
        return '<div class="u-row"><div style="flex:1;min-width:120px;"><div class="nm">'+esc(u.name)+'</div>'+
          '<div class="lid">'+(u.loginId?esc(u.loginId):'<span class="muted">'+I18n.t('notSet')+'</span>')+'</div></div>'+
          '<span class="chip">'+esc(I18n.systemText(u.role))+'</span>'+
          '<span class="muted">PW: '+(u.hasPassword?I18n.t('pwSet'):'—')+'</span>'+
          (u.status==='退職'?'<span class="muted">('+I18n.t('stLeft')+')</span>':'')+
          '<button class="btn-sm b-edit" onclick="editUser(\''+u.id+'\')">'+I18n.t('edit')+'</button>'+
          '<button class="btn-sm b-del" onclick="delUser(\''+u.id+'\')">'+I18n.t('del')+'</button></div>';
      }).join('');
    }
    var EMPLOYEE_REQUEST_ID='', EMPLOYEE_REQUEST_SIG='';
    function nextEmployeeRequestId(){ try{return crypto.randomUUID();}catch(e){return Date.now()+'-'+Math.random().toString(16).slice(2);} }
    function resetEmployeeRequest(){ EMPLOYEE_REQUEST_ID=''; EMPLOYEE_REQUEST_SIG=''; }
    window.editUser = function(id){
      resetEmployeeRequest();
      var u = allUsers.filter(function(x){return x.id===id;})[0]; if(!u) return;
      document.getElementById('uId').value=u.id; document.getElementById('uName').value=u.name;
      document.getElementById('uRole').value=u.role; document.getElementById('uLogin').value=u.loginId||'';
      document.getElementById('uWage').value=u.wage||0; document.getElementById('uPass').value='';
      document.getElementById('uStatus').value=u.status||'在籍';
      window.scrollTo({top:0,behavior:'smooth'});
    };
    window.clearForm = function(){ resetEmployeeRequest(); ['uId','uName','uLogin','uWage','uPass'].forEach(function(id){ document.getElementById(id).value=''; }); document.getElementById('uRole').value='一般'; document.getElementById('uStatus').value='在籍'; document.getElementById('uMsg').style.display='none'; };
    window.saveUser = function(){
      var name = document.getElementById('uName').value.trim();
      if (!name){ msg('uMsg',I18n.t('needName'), false); document.getElementById('uName').focus(); return; }
      var emp = { id:document.getElementById('uId').value||'', name:name, role:document.getElementById('uRole').value,
        loginId:document.getElementById('uLogin').value.trim(), wage:Number(document.getElementById('uWage').value)||0,
        password:document.getElementById('uPass').value, status:document.getElementById('uStatus').value };
      if(!emp.id && emp.loginId && !emp.password){ msg('uMsg',I18n.t('needPassword'), false); document.getElementById('uPass').focus(); return; }
      if(emp.password && emp.password.length<8){ msg('uMsg',I18n.t('pwShort'), false); document.getElementById('uPass').focus(); return; }
      if(!emp.id){ var sig=JSON.stringify(emp); if(!EMPLOYEE_REQUEST_ID||EMPLOYEE_REQUEST_SIG!==sig){ EMPLOYEE_REQUEST_SIG=sig; EMPLOYEE_REQUEST_ID=nextEmployeeRequestId(); } emp.clientRequestId=EMPLOYEE_REQUEST_ID; }
      var btn=document.getElementById('saveU'); btn.disabled=true;
      rpc('saveEmployee',[emp]).then(function(r){
        btn.disabled=false;
        if (r && r.success){
          clearForm(); msg('uMsg',I18n.t('saved'), true);
          rpc('getAllEmployees',[]).then(function(l){ allUsers=l||[]; renderUsers(); })
            .catch(function(e){ document.getElementById('uList').innerHTML='<div style="color:#b91c1c;">'+I18n.t('loadErr')+esc(API.userErrorText(e))+'</div>'; });
          return;
        }
        else { var er=r&&r.error; msg('uMsg', er==='duplicate_login_id'?I18n.t('dupLogin'):((er==='password_too_short'||er==='password_required')?I18n.t('pwShort'):(er==='forbidden'?I18n.t('forbidden'):(er==='invalid_role'?I18n.t('invalidRole'):I18n.t('errG')))), false); }
      }).catch(function(e){ btn.disabled=false; msg('uMsg',I18n.t('errPrefix')+API.userErrorText(e), false); });
    };
    window.delUser = function(id){
      UIConfirm(I18n.t('delConfirm')).then(function(ok){
        if (!ok) return;
        rpc('deleteEmployee',[id]).then(function(r){ if(!r||r.success!==true) throw new Error((r&&r.error)||'delete_failed'); allUsers=allUsers.filter(function(u){return u.id!==id;}); renderUsers(); })
          .catch(function(e){ msg('uMsg',I18n.t('errPrefix')+API.userErrorText(e), false); });
      });
    };

    function loadMatrix(){
      rpc('getPermissionMatrixForUI',[]).then(function(d){ pmData=d; renderMatrix(); })
        .catch(function(e){ document.getElementById('pmTable').innerHTML='<tbody><tr><td class="muted">'+I18n.t('errPrefix')+esc(API.userErrorText(e))+'</td></tr></tbody>'; });
    }
    function renderMatrix(){
      if (!pmData) return;
      var en = (window.I18n && I18n.lang()==='en');
      var roles = pmData.roles;
      var nCol = roles.length + 1;
      // ヘッダ: メニュー + 各ロール
      var html = '<thead><tr><th style="text-align:left;">'+I18n.t('colMenu')+'</th>';
      roles.forEach(function(r){ html += '<th>'+esc(I18n.systemText(r))+'</th>'; });
      html += '</tr></thead><tbody>';
      // タブ（グループ）ごとにセクション
      var order = (pmData.groupOrder||[]).length ? pmData.groupOrder : [null];
      var seen = {};
      function rowFor(k){
        var h = '<tr><td style="text-align:left;font-weight:700;">'+esc(LBL(k))+'</td>';
        roles.forEach(function(role){
          var on = !!(pmData.matrix[role] && pmData.matrix[role][k]); var sys = (role==='システム');
          h += '<td><input type="checkbox" data-role="'+esc(role)+'" data-key="'+esc(k)+'"'+((on||sys)?' checked':'')+(sys?' disabled':'')+'></td>';
        });
        return h + '</tr>';
      }
      order.forEach(function(gid){
        var keys = pmData.pages.filter(function(k){ return (pmData.groups&&pmData.groups[k])===gid; });
        if(!keys.length) return;
        var gl = (pmData.groupLabels&&pmData.groupLabels[gid]) ? (en?pmData.groupLabels[gid].en:pmData.groupLabels[gid].ja) : gid;
        html += '<tr><td colspan="'+nCol+'" style="background:#f1f5f9;font-weight:900;font-size:12px;color:#475569;text-align:left;">'+esc(gl)+'</td></tr>';
        keys.forEach(function(k){ seen[k]=1; html += rowFor(k); });
      });
      // グループ未割当のページ（保険）
      pmData.pages.forEach(function(k){ if(!seen[k]) html += rowFor(k); });
      html += '</tbody>';
      document.getElementById('pmTable').innerHTML = html;
    }
    window.savePerms = function(){
      if (!pmData) return;
      var matrix = {}; pmData.roles.forEach(function(r){ matrix[r]={}; });
      var boxes = document.querySelectorAll('#pmTable input[type="checkbox"]');
      for (var i=0;i<boxes.length;i++){ matrix[boxes[i].getAttribute('data-role')][boxes[i].getAttribute('data-key')] = boxes[i].checked; }
      var btn=document.getElementById('saveP'); btn.disabled=true;
      rpc('savePermissionMatrix',[matrix]).then(function(res){ btn.disabled=false; if(res&&res.success){ msg('pMsg',I18n.t('saved'), true); pmData.matrix=matrix; } else { msg('pMsg', res&&res.error==='forbidden'?I18n.t('forbidden'):I18n.t('errG'), false); } })
        .catch(function(e){ btn.disabled=false; msg('pMsg',I18n.t('errPrefix')+API.userErrorText(e), false); });
    };

    var __loaded=false;
    rpc('getAllEmployees',[]).then(function(l){ allUsers=l||[]; __loaded=true; renderUsers(); })
      .catch(function(e){ if(String(e.message||e).indexOf('unauthorized')>=0){ location.href='./manage.html'; return; } document.getElementById('uList').innerHTML='<div style="color:#b91c1c;">'+I18n.t('loadErr')+esc(API.userErrorText(e))+'</div>'; });

    I18n.init({
      ja:{ title:'👥 ユーザー管理', back:'← 管理へ', tabU:'👤 ユーザー', tabP:'🔑 権限マスタ', formTitle:'➕ ユーザーの追加 / 編集', lblName:'名前', lblRole:'権限グループ', rGen:'一般', rMgr:'マネージャー', rAdmin:'管理者', rSys:'システム', lblLogin:'ログインID', lblWage:'時給', lblPass:'パスワード', passHint:'空欄なら変更しません（新規は8文字以上必須）', lblStatus:'ステータス', stActive:'在籍', stLeft:'退職', save:'💾 保存', clear:'クリア', listTitle:'👥 ユーザー一覧', loading:'読み込み中…', pmTitle:'🔑 権限マトリクス', pmHint:'権限グループ×メニューでアクセス可否を設定します。✓＝表示/アクセス可。システムは常に全権限（ロックアウト防止）。', colRole:'権限', colMenu:'管理メニュー', noData:'データがありません', notSet:'(未設定)', pwSet:'設定済', edit:'編集', del:'削除', needName:'名前を入力してください', needPassword:'新規ユーザーにログインIDを設定する場合はパスワードを入力してください', saved:'✅ 保存しました', dupLogin:'そのログインIDは既に使われています', pwShort:'パスワードは8文字以上で入力してください', invalidRole:'権限グループを選択してください', errG:'エラー', delConfirm:'このユーザーを削除しますか？', forbidden:'ユーザーを管理する権限がありません', errPrefix:'エラー: ', loadErr:'読み込みエラー: ', pg_admin:'注文管理', pg_menu_editor:'メニュー', pg_inventory:'在庫', pg_drink_inv:'ドリンク', pg_sales:'売上', pg_attendance:'勤怠', pg_printers:'プリンタ', pg_settings:'設定', pg_users:'ユーザー', pg_members:'会員', pg_coupons:'クーポン' },
      en:{ title:'👥 Users', back:'← Manage', tabU:'👤 Users', tabP:'🔑 Permissions', formTitle:'➕ Add / Edit user', lblName:'Name', lblRole:'Role group', rGen:'General', rMgr:'Manager', rAdmin:'Admin', rSys:'System', lblLogin:'Login ID', lblWage:'Hourly wage', lblPass:'Password', passHint:'Leave blank to keep unchanged (new users need 8+ chars)', lblStatus:'Status', stActive:'Active', stLeft:'Left', save:'💾 Save', clear:'Clear', listTitle:'👥 User list', loading:'Loading…', pmTitle:'🔑 Permission matrix', pmHint:'Set access per role × menu. ✓ = visible/allowed. System always has full access (lockout prevention).', colRole:'Role', colMenu:'Management menu', noData:'No data', notSet:'(not set)', pwSet:'Set', edit:'Edit', del:'Delete', needName:'Please enter a name', needPassword:'Enter a password when assigning a login ID to a new user', saved:'✅ Saved', dupLogin:'That login ID is already in use', pwShort:'Password must be at least 8 characters', invalidRole:'Select a role group', errG:'Error', delConfirm:'Delete this user?', forbidden:'You do not have permission to manage users', errPrefix:'Error: ', loadErr:'Load error: ', pg_admin:'Orders', pg_menu_editor:'Menu', pg_inventory:'Inventory', pg_drink_inv:'Drinks', pg_sales:'Sales', pg_attendance:'Attendance', pg_printers:'Printers', pg_settings:'Settings', pg_users:'Users', pg_members:'Members', pg_coupons:'Coupons' }
    }, function(){ if(__loaded) renderUsers(); if(pmData) renderMatrix(); });
  </script>

  <script src="./help.js?v=auth2"></script>
  <script>
    HelpUI.register({
      title: 'ユーザー・権限管理',
      titleEn: 'Users & Permissions',
      items: [
        { ja: '① 「👤 ユーザー」タブで、名前・権限グループ（一般/マネージャー/管理者/システム）・ログインID・時給・パスワード・ステータス（在籍/退職）を入力し「💾 保存」で新規ユーザーを追加できます。登録・変更・削除は管理者またはシステム権限が必要です。', en: '① On the "👤 Users" tab, enter name, role group (general/manager/admin/system), login ID, hourly wage, password, and status (active/left), then press "💾 Save" to add a user. Admin or System permission is required to add, edit, or delete users.' },
        { ja: '② パスワード欄は空欄のままにすると変更されません。新規登録の場合は8文字以上のパスワードが必須です。', en: '② Leave the password field blank to keep it unchanged. New users require a password of 8+ characters.' },
        { ja: '③ ユーザー一覧の「編集」で内容をフォームに呼び出して修正、「削除」でユーザーを削除できます。', en: '③ Use "Edit" in the user list to load a user into the form for changes, or "Delete" to remove a user.' },
        { ja: '④ 「🔑 権限マスタ」タブでは、権限グループ×管理メニューのマトリクスでチェックを入れ、そのグループがアクセスできる画面を設定できます。「システム」権限は常に全権限でロックできません。', en: '④ On the "🔑 Permissions" tab, check boxes in the role × menu matrix to control which management screens each role can access. "System" always has full access and cannot be restricted.' },
        { ja: '⑤ 権限マトリクスを変更したら「💾 保存」を押さないと反映されません。', en: '⑤ Changes to the permission matrix are not saved until you press "💾 Save".' }
      ]
    });
  </script>
</body>
</html>
