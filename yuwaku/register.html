<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Register">

  <link rel="manifest" href="./register.webmanifest">
  <title>Register open/close</title>
  <style>
    :root{ --bg:#f6f7f9; --surface:#fff; --border:#e5e7eb; --navy:#0f172a; --text-3:#64748b; --green:#16a34a; --red:#c62828; }
    *{ box-sizing:border-box; }
    body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans JP',sans-serif; background:var(--bg); color:var(--navy); }
    .head{ position:sticky; top:0; z-index:20; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:space-between; padding:12px 16px; }
    .head h1{ font-size:18px; margin:0; font-weight:900; }
    .hbtn{ background:rgba(255,255,255,.14); color:#fff; border:0; border-radius:9px; padding:8px 12px; font-size:13px; font-weight:800; cursor:pointer; text-decoration:none; }
    .wrap{ padding:16px; max-width:640px; margin:0 auto; }
    .card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:14px; }
    .card-title{ font-weight:900; font-size:15px; margin-bottom:12px; }
    .fg{ margin-bottom:10px; }
    .form-label{ font-size:12px; font-weight:700; display:block; margin-bottom:4px; }
    .fc{ width:100%; padding:11px; border:1px solid var(--border); border-radius:9px; font-size:16px; font-family:inherit; background:var(--surface); }
    .btn{ border:0; border-radius:11px; padding:14px; font-size:15px; font-weight:900; cursor:pointer; font-family:inherit; width:100%; }
    .btn-pri{ background:var(--navy); color:#fff; } .btn-green{ background:var(--green); color:#fff; }
    .row{ display:flex; justify-content:space-between; padding:9px 2px; border-bottom:1px solid var(--border); font-size:14px; }
    .row .amt{ font-weight:800; font-variant-numeric:tabular-nums; }
    .big{ display:flex; justify-content:space-between; align-items:center; padding:14px 12px; border-radius:12px; margin-top:8px; }
    .big .amt{ font-size:22px; font-weight:900; }
    .muted{ color:var(--text-3); font-size:12px; }
    .alert{ margin-top:10px; display:none; padding:11px; border-radius:9px; font-size:14px; font-weight:700; }
    table{ width:100%; border-collapse:collapse; font-size:12.5px; }
    th,td{ padding:7px 5px; border-bottom:1px solid var(--border); text-align:left; white-space:nowrap; }
    th{ font-size:11px; color:var(--text-3); }
    td.num,th.num{ text-align:right; }
    .loading{ text-align:center; color:var(--text-3); padding:30px 0; }
  </style>
</head>
<body>
  <div class="head"><h1 data-t="title">💵 レジ開け／締め</h1><div style="display:flex;gap:8px;"><button class="hbtn" data-tlang onclick="I18n.toggle()">EN</button><a class="hbtn" href="./manage.html" data-t="back">← 管理へ</a></div></div>
  <div class="wrap" id="wrap"><div class="loading" data-t="loading">読み込み中…</div></div>

  <script src="./config.js?v=auth2"></script>
  <script src="./api.js?v=auth2"></script>
  <script src="./i18n.js?v=auth3"></script>
  <script src="./confirm.js?v=auth2"></script>
  <script>
    var TOKEN = localStorage.getItem(window.APP_CONFIG.AUTH_STORAGE_PREFIX + 'mgmtToken') || '';
    var NAME = localStorage.getItem(window.APP_CONFIG.AUTH_STORAGE_PREFIX + 'mgmtName') || '';
    if (!TOKEN) location.href = './manage.html';
    function rpc(fn,args,timeoutMs,noInternalRetry){ var p={fn:fn,args:args||[],token:TOKEN}; if(timeoutMs)p.__timeoutMs=timeoutMs; if(noInternalRetry)p.__noInternalRetry=true; return API.post('rpc',p).then(function(r){ return r.data; }); }
    function requestId(){ try { return crypto.randomUUID(); } catch(e) { return 'xxxxxxxx-xxxx-4xxx-8xxx-xxxxxxxxxxxx'.replace(/x/g,function(){return Math.floor(Math.random()*16).toString(16);}); } }
    function isTransportError(e){ return !(e&&e.__server); }
    function registerCompareText(s){ return String(s==null?'':s).replace(/[\x00-\x1f\x7f]/g,''); }
    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
    var SYM='₱', CUR=null, HIST=[], STAFF=[], PENDING_OPEN_ID='';
    var REGISTER_WRITE_TIMEOUT_MS=10000, REGISTER_RECONCILE_TIMEOUT_MS=8000;
    var THIS_MONTH = API.dateKeysInTimeZone('UTC').month;
    function money(v){ return SYM+(Math.round(Number(v)||0)).toLocaleString(); }

    window.doOpen = function(){
      var f = Number(document.getElementById('flt').value)||0;
      var st = document.getElementById('stf').value;
      var btn=document.getElementById('openBtn'); if(btn) btn.disabled=true;
      var rid=PENDING_OPEN_ID||requestId(); PENDING_OPEN_ID=rid;
      function done(r){ if(btn) btn.disabled=false; if(r&&r.success){ PENDING_OPEN_ID=''; reload(); return; } PENDING_OPEN_ID=''; UIAlert(API.userErrorText((r&&r.error)||'error')); }
      function reconcile(e){ rpc('getRegisterBundle',[THIS_MONTH],REGISTER_RECONCILE_TIMEOUT_MS,true).then(function(b){ b=b||{}; var persisted=(b.current&&b.current.id===rid)||(b.shifts||[]).some(function(s){return s&&s.id===rid;}); if(persisted){ PENDING_OPEN_ID=''; if(btn) btn.disabled=false; reload(); return; } if(btn) btn.disabled=false; UIAlert(API.userErrorText(e)); }).catch(function(){ if(btn) btn.disabled=false; UIAlert(API.userErrorText(e)); }); }
      rpc('openShift',[f, st, rid],REGISTER_WRITE_TIMEOUT_MS,true).then(done).catch(function(e){
        if(!isTransportError(e)){ PENDING_OPEN_ID=''; if(btn) btn.disabled=false; UIAlert(API.userErrorText(e)); return; }
        setTimeout(function(){ rpc('openShift',[f, st, rid],REGISTER_WRITE_TIMEOUT_MS,true).then(done).catch(reconcile); },600);
      });
    };
    window.doClose = function(){
      var counted = Number(document.getElementById('cnt').value);
      if(!(counted>=0)){ msg(I18n.t('needCount'), false); return; }
      var cio = Number(document.getElementById('cio').value)||0;
      var memo = document.getElementById('memo').value;
      var btn=document.getElementById('closeBtn'); btn.disabled=true;
      var expectedId=CUR&&CUR.id||'';
      function done(r){ btn.disabled=false; if(r&&r.success){ showZ(r.z); } else { msg(API.userErrorText((r&&r.error)||'error'), false); } }
      function reconcileClose(e){ rpc('getRegisterBundle',[THIS_MONTH],REGISTER_RECONCILE_TIMEOUT_MS,true).then(function(b){ b=b||{}; var closed=(b.shifts||[]).find(function(s){ return s&&s.id===expectedId; }); if(closed&&Number(closed.countedCash||0)===counted&&Number(closed.cashInOut||0)===cio&&registerCompareText(closed.memo)===registerCompareText(memo)){ reload(); return; } btn.disabled=false; msg(I18n.t('errPrefix')+API.userErrorText(e), false); }).catch(function(){ btn.disabled=false; msg(I18n.t('errPrefix')+API.userErrorText(e), false); }); }
      rpc('closeShift',[counted, cio, memo, expectedId],REGISTER_WRITE_TIMEOUT_MS,true).then(done).catch(function(e){
        if(!isTransportError(e)){ btn.disabled=false; msg(I18n.t('errPrefix')+API.userErrorText(e), false); return; }
        setTimeout(function(){ rpc('closeShift',[counted, cio, memo, expectedId],REGISTER_WRITE_TIMEOUT_MS,true).then(done).catch(reconcileClose); },600);
      });
    };
    function msg(text, ok){ var m=document.getElementById('msg'); if(!m) return; m.style.display='block'; m.style.background=ok?'#dcfce7':'#fee2e2'; m.style.color=ok?'#15803d':'#b91c1c'; m.innerText=text; }

    function showZ(z){
      var over = z.overShort||0;
      var html = '<div class="card"><div class="card-title">'+I18n.t('zTitle')+'</div>'
        + line(I18n.t('openAt'), z.openAt, true) + line(I18n.t('closeAt'), z.closeAt, true)
        + row(I18n.t('float'), money(z.float)) + row(I18n.t('cashSales'), money(z.sales.cash))
        + row(I18n.t('cardSales'), money(z.sales.card)) + (z.sales.other>0?row(I18n.t('otherSales'), money(z.sales.other)):'')
        + row(I18n.t('cashInOut'), money(z.cashInOut)) + row(I18n.t('expected'), money(z.expectedCash))
        + row(I18n.t('counted'), money(z.countedCash))
        + '<div class="big" style="background:'+(over===0?'#0f172a':(over>0?'#14532d':'#7f1d1d'))+';color:#fff;"><span>'+I18n.t('overShort')+'</span><span class="amt">'+(over>0?'+':'')+money(over)+'</span></div>'
        + '<button class="btn btn-pri" style="margin-top:12px;" onclick="reload()">'+I18n.t('done')+'</button></div>';
      document.getElementById('wrap').innerHTML = html;
    }
    function line(k,v){ return '<div class="row"><span>'+k+'</span><span class="muted">'+esc(v)+'</span></div>'; }
    function row(k,v){ return '<div class="row"><span>'+k+'</span><span class="amt">'+v+'</span></div>'; }

    function render(){
      var html='';
      if(!CUR || !CUR.open){
        html += '<div class="card" style="background:#eff6ff;border-color:#bfdbfe;"><div class="card-title" style="color:#1e40af;">'+I18n.t('helpOpenTitle')+'</div><div style="font-size:13px;line-height:1.8;color:#1e3a8a;">'+I18n.t('helpOpenBody')+'</div></div>';
        html += '<div class="card"><div class="card-title">'+I18n.t('openTitle')+'</div>'
          + '<div class="fg"><label class="form-label">'+I18n.t('float')+'</label><input id="flt" type="number" min="0" step="any" class="fc" placeholder="0"></div>'
          + '<div class="fg"><label class="form-label">'+I18n.t('staff')+'</label><input id="stf" class="fc" value="'+esc(NAME)+'" readonly style="background:#f1f5f9;color:#64748b;"></div>'
          + '<button class="btn btn-green" id="openBtn" onclick="doOpen()">'+I18n.t('openBtn')+'</button></div>';
      } else {
        var s=CUR.sales||{};
        html += '<div class="card" style="background:#eff6ff;border-color:#bfdbfe;"><div class="card-title" style="color:#1e40af;">'+I18n.t('helpCloseTitle')+'</div><div style="font-size:13px;line-height:1.8;color:#1e3a8a;">'+I18n.t('helpCloseBody')+'</div></div>';
        html += '<div class="card"><div class="card-title">'+I18n.t('xTitle')+' <span class="muted">('+esc(CUR.openAt)+(CUR.staff?(' / '+esc(CUR.staff)):'')+')</span></div>'
          + row(I18n.t('float'), money(CUR.float)) + row(I18n.t('cashSales'), money(s.cash))
          + row(I18n.t('cardSales'), money(s.card)) + (s.other>0?row(I18n.t('otherSales'), money(s.other)):'')
          + '<div class="big" style="background:#eef1f5;"><span>'+I18n.t('expected')+'</span><span class="amt">'+money(CUR.expectedCash)+'</span></div>'
          + '<button class="hbtn" style="background:var(--navy);margin-top:8px;" onclick="reload()">🔄 '+I18n.t('refresh')+'</button></div>';
        html += '<div class="card"><div class="card-title">'+I18n.t('closeTitle')+'</div>'
          + '<div class="fg"><label class="form-label">'+I18n.t('cashInOut')+' <span class="muted">('+I18n.t('cioHint')+')</span></label><input id="cio" type="number" step="any" class="fc" value="0"></div>'
          + '<div class="fg"><label class="form-label">'+I18n.t('counted')+'</label><input id="cnt" type="number" min="0" step="any" class="fc" placeholder="0"></div>'
          + '<div class="fg"><label class="form-label">'+I18n.t('memo')+'</label><input id="memo" class="fc"></div>'
          + '<button class="btn btn-pri" id="closeBtn" onclick="doClose()">'+I18n.t('closeBtn')+'</button><div class="alert" id="msg"></div></div>';
      }
      // 履歴
      if(HIST.length){
        var rows = HIST.map(function(h){ var o=h.overShort||0; return '<tr><td>'+esc(h.closeAt)+'</td><td class="num">'+money(h.cashSales)+'</td><td class="num">'+money(h.cardSales)+'</td><td class="num" style="color:'+(o===0?'inherit':(o>0?'#15803d':'#b91c1c'))+';">'+(o>0?'+':'')+money(o)+'</td></tr>'; }).join('');
        html += '<div class="card"><div class="card-title">'+I18n.t('histTitle')+'</div><div style="overflow:auto;"><table><thead><tr><th>'+I18n.t('closeAt')+'</th><th class="num">'+I18n.t('cashSales')+'</th><th class="num">'+I18n.t('cardSales')+'</th><th class="num">'+I18n.t('overShort')+'</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
      }
      // スタッフ別売上（今月・締めたシフト集計）
      if(STAFF.length){
        var srows = STAFF.map(function(s){ var o=s.overShort||0; return '<tr><td>'+esc(s.staff)+'</td><td class="num">'+s.shifts+'</td><td class="num" style="font-weight:800;">'+money(s.total)+'</td><td class="num" style="color:'+(o===0?'inherit':(o>0?'#15803d':'#b91c1c'))+';">'+(o>0?'+':'')+money(o)+'</td></tr>'; }).join('');
        html += '<div class="card"><div class="card-title">'+I18n.t('staffTitle')+' <span class="muted">('+esc(THIS_MONTH)+')</span></div><div style="overflow:auto;"><table><thead><tr><th>'+I18n.t('thStaff')+'</th><th class="num">'+I18n.t('thShifts')+'</th><th class="num">'+I18n.t('thTotal')+'</th><th class="num">'+I18n.t('overShort')+'</th></tr></thead><tbody>'+srows+'</tbody></table></div></div>';
      }
      document.getElementById('wrap').innerHTML = html;
    }

    // [P1] 従来はgetSettings＋getCurrentShift＋getShifts＋getStaffSalesの4往復だった初期表示を、
    // 画面単位のbundle API（getRegisterBundle）1回にまとめる。
    window.reload = function(){
      rpc('getRegisterBundle',[THIS_MONTH]).then(function(b){
        b = b || {};
        if (b.settings && b.settings.currencySymbol) SYM = b.settings.currencySymbol;
        CUR = b.current || {open:false}; HIST = b.shifts || []; STAFF = b.staff || []; render();
      }).catch(function(e){ if(String(e.message||e).indexOf('unauthorized')>=0){ location.href='./manage.html'; return; } document.getElementById('wrap').innerHTML='<div style="color:#b91c1c;padding:14px;">'+I18n.t('loadErr')+esc(API.userErrorText(e))+'</div>'; });
    };

    I18n.init({
      ja:{ title:'💵 レジ開け／締め', back:'← 管理へ', loading:'読み込み中…', openTitle:'🔓 レジを開ける', float:'開店フロート（釣銭準備金）', staff:'担当', optional:'任意', openBtn:'🔓 レジを開ける', xTitle:'📋 現在のシフト（X）', cashSales:'現金売上', cardSales:'キャッシュレス売上', otherSales:'その他売上', expected:'想定現金', refresh:'更新', closeTitle:'🔒 レジ締め（Z）', cashInOut:'現金入出金', cioHint:'入金+ / 出金−', counted:'実現金（数えた金額）', memo:'メモ', closeBtn:'🔒 レジを締める', zTitle:'✅ レジ締め結果（Z）', openAt:'開始', closeAt:'終了', overShort:'過不足', done:'完了', histTitle:'📖 締め履歴', staffTitle:'👤 スタッフ別売上', thStaff:'担当', thShifts:'シフト数', thTotal:'売上合計', needCount:'実現金を入力してください', errPrefix:'エラー: ', loadErr:'読み込みエラー: ',
        helpOpenTitle:'📘 使い方（開店時）', helpOpenBody:'① 開店フロート（釣銭用の準備金）を入力<br>② 担当者はログイン中のアカウント名が自動設定されます<br>③「🔓 レジを開ける」を押す<br>これで営業中の売上集計が始まります。',
        helpCloseTitle:'📘 使い方（閉店時）', helpCloseBody:'① 両替や釣銭補充などがあれば「現金入出金」に入力（入金は+、出金は−）<br>② レジ内の現金を実際に数えて「実現金」に入力<br>③ 必要ならメモを入力<br>④「🔒 レジを締める」を押す<br>想定現金との差（過不足）が自動計算されます。' },
      en:{ title:'💵 Register open/close', back:'← Manage', loading:'Loading…', openTitle:'🔓 Open register', float:'Opening float (change fund)', staff:'Staff', optional:'optional', openBtn:'🔓 Open register', xTitle:'📋 Current shift (X)', cashSales:'Cash sales', cardSales:'Cashless sales', otherSales:'Other sales', expected:'Expected cash', refresh:'Refresh', closeTitle:'🔒 Close register (Z)', cashInOut:'Cash in/out', cioHint:'in + / out −', counted:'Counted cash', memo:'Memo', closeBtn:'🔒 Close register', zTitle:'✅ Register close (Z)', openAt:'Open', closeAt:'Close', overShort:'Over/Short', done:'Done', histTitle:'📖 History', staffTitle:'👤 Sales by staff', thStaff:'Staff', thShifts:'Shifts', thTotal:'Total sales', needCount:'Please enter counted cash', errPrefix:'Error: ', loadErr:'Load error: ',
        helpOpenTitle:'📘 How to use (opening)', helpOpenBody:'① Enter the opening float (change fund)<br>② Staff is set automatically to your logged-in account<br>③ Tap "🔓 Open register"<br>This starts tracking sales for the shift.',
        helpCloseTitle:'📘 How to use (closing)', helpCloseBody:'① If you exchanged cash or added change, enter it under "Cash in/out" (in +, out −)<br>② Count the cash in the drawer and enter it as "Counted cash"<br>③ Add a memo if needed<br>④ Tap "🔒 Close register"<br>The difference from the expected cash (over/short) is calculated automatically.' }
    }, function(){ if(CUR!==null) render(); });

    API.getStoreDateKeys().then(function(k){ THIS_MONTH=k.month; reload(); }).catch(reload);
  </script>
  <script src="./help.js?v=auth2"></script>
  <script>
    HelpUI.register({
      title: 'レジ開け／締め',
      titleEn: 'Register open/close',
      items: [
        { ja: '① レジがまだ開いていない場合は「開店フロート（釣銭準備金）」を入力し「🔓 レジを開ける」を押すと、担当者名は自動でログイン中のアカウントが設定され、営業中の売上集計が始まります。', en: '① If the register is not open, enter the "Opening float (change fund)" and tap "🔓 Open register" — your logged-in account is set as staff automatically, and sales tracking begins.' },
        { ja: '② レジを開けている間は「📋 現在のシフト（X）」で現金売上・キャッシュレス売上・想定現金がリアルタイムに確認できます。「🔄 更新」で再取得できます。', en: '② While open, "📋 Current shift (X)" shows cash sales, cashless sales, and expected cash in real time. Tap "🔄 Refresh" to reload.' },
        { ja: '③ 閉店時は「現金入出金」に両替・釣銭補充があれば入力（入金は+、出金は−）し、「実現金」にレジ内の現金を実際に数えた金額を入力します。', en: '③ At close, enter any cash exchanged/added under "Cash in/out" (in +, out −), and enter the actually counted drawer cash as "Counted cash".' },
        { ja: '④ 必要なら「メモ」を入力し、「🔒 レジを締める」を押すと、想定現金との差（過不足）が自動計算されZ結果として表示されます。', en: '④ Add a "Memo" if needed and tap "🔒 Close register" — the difference from expected cash (over/short) is calculated automatically and shown as the Z result.' },
        { ja: '⑤ 「📖 締め履歴」で過去のレジ締め結果（現金売上・カード売上・過不足）を確認できます。', en: '⑤ "📖 History" lists past register closes (cash sales, card sales, over/short).' },
        { ja: '⑥ 「👤 スタッフ別売上」で今月の担当者ごとのシフト数・売上合計・過不足を確認できます。', en: '⑥ "👤 Sales by staff" shows this month\'s shift count, total sales, and over/short per staff member.' }
      ]
    });
  </script>
</body>
</html>
