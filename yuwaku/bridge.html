<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Bluetooth Printer">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>Bluetooth Printer</title>
<style>
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans JP',sans-serif; background:#0f172a; color:#e2e8f0; padding:14px; }
  h1{ font-size:17px; margin:0 0 2px; }
  p.sub{ font-size:12px; color:#94a3b8; margin:0 0 12px; line-height:1.6; }
  .stat{ font-size:15px; font-weight:800; padding:12px 14px; border-radius:12px; background:#1e293b; margin-bottom:10px; display:flex; align-items:center; gap:10px; }
  .stat.ok{ background:#064e3b; color:#6ee7b7; }
  .stat.err{ background:#4c0519; color:#fda4af; }
  .stat.run{ background:#0c4a6e; color:#7dd3fc; }
  .dot{ width:10px; height:10px; border-radius:50%; background:currentColor; box-shadow:0 0 0 0 currentColor; }
  .row{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
  button{ flex:1 1 auto; min-width:120px; border:0; border-radius:12px; padding:15px 12px; font-size:15px; font-weight:800; font-family:inherit; cursor:pointer; }
  #btnStart{ background:#22c55e; color:#052e16; }
  #btnStop{ background:#ef4444; color:#450a0a; }
  #btnConn{ background:#38bdf8; color:#082f49; }
  #btnForget{ background:#fee2e2; color:#991b1b; }
  button:disabled{ opacity:.4; }
  .kv{ display:flex; gap:14px; flex-wrap:wrap; margin:4px 0 12px; font-size:13px; color:#cbd5e1; }
  .kv b{ color:#fff; font-size:16px; }
  .opt{ display:flex; align-items:center; gap:8px; font-size:12.5px; color:#cbd5e1; margin-bottom:8px; }
  input[type=text]{ background:#020617; border:1px solid #334155; color:#e2e8f0; border-radius:8px; padding:8px 10px; font-size:13px; font-family:inherit; }
  #log{ background:#020617; border:1px solid #1e293b; border-radius:10px; padding:10px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11.5px; white-space:pre-wrap; word-break:break-all; height:34vh; overflow:auto; }
  canvas{ display:none; }
  .note{ font-size:11.5px; color:#64748b; margin-top:10px; line-height:1.7; }
  body.setup-only #btnStart,body.setup-only #btnStop,body.setup-only label.opt:has(#key),body.setup-only label.opt:has(#safeMode),body.setup-only .kv,body.setup-only #log,body.setup-only .note{ display:none!important; }
  body.embedded{padding:0;background:transparent;}
  body.embedded > div:first-child{display:none!important;}
</style>
</head>
<body>
  <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;">
    <h1 data-i="title">🖨️ Bluetoothプリンタ</h1>
    <button id="langBtn" onclick="toggleLang()" style="flex:0 0 auto;background:#334155;color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;">EN</button>
  </div>
  <p class="sub" data-i="sub">Bluetoothプリンタを検索・接続します。Android・Windows・Mac・Linuxの対応Chromeで利用できます（iOSブラウザは非対応。iOSはネイティブアプリを利用してください）。<br><b>動作確認済みプリンタ: PT-210</b></p>

  <div class="stat" id="stat"><span class="dot"></span><span id="statText">未接続</span></div>

  <div class="kv">
    <div><span data-i="kDone">印刷済</span> <b id="cntOk">0</b></div>
    <div><span data-i="kFail">失敗</span> <b id="cntErr">0</b></div>
    <div><span data-i="kConn">接続</span> <b id="cntPrinter">—</b></div>
  </div>

  <div class="row" id="guide-bridge-connect" data-guide-anchor>
    <button id="btnConn" onclick="connect()" data-i="bConn">🔗 Bluetoothプリンタに接続</button>
    <button id="btnDisconnect" onclick="disconnectPrinter()" data-i="bDisconnect">切断</button>
    <button id="btnForget" onclick="unregisterPrinter()" data-i="bForget">登録解除</button>
    <button id="btnStart" onclick="startLoop()" disabled data-i="bStart">▶ 監視開始</button>
    <button id="btnStop" onclick="stopLoop()" disabled data-i="bStop">■ 停止</button>
  </div>

  <label class="opt"><span>担当プリンタ：</span><select id="logicalPrinter" style="flex:1;min-width:0;padding:10px;border-radius:8px;border:1px solid #475569;"></select></label>
  <label class="opt"><span data-i="keyLabel">キー(任意)：</span><input type="text" id="key" placeholder="BRIDGE_KEY を設定した場合のみ" style="flex:1;"></label>
  <label class="opt"><input type="checkbox" id="safeMode"> <span data-i="safe">低速安全モード（20バイト送信）</span></label>

  <div id="log"></div>
  <p class="note" data-i="note">画面が消えると印刷が止まります（Wake Lockで常時点灯を試みます）。Bluetoothが切れたら再接続してください。困ったらこのログを共有してください。</p>

  <canvas id="cv" width="384" height="10"></canvas>

<script src="./config.js?v=auth2"></script><script src="./api.js?v=auth2"></script><script src="./confirm.js?v=auth2"></script>
<script>
// 2026-08-24: このページ自体はBRIDGE_KEY(任意)だけでバックエンド呼び出しをしており、
// URLを直接開けばログイン無しで店舗設定(getSettings)等が見える状態だった。
// 他の管理画面と同じくmgmtTokenでのログインを必須にし、未ログインならmanage.htmlへ戻す。
(function(){
  var __t = null;
  try { __t = localStorage.getItem(window.APP_CONFIG.AUTH_STORAGE_PREFIX + 'mgmtToken') || ''; } catch(e){}
  if (!__t) { location.href = './manage.html'; }
})();
var PRINT_WIDTH = 384;
var SETUP_ONLY=(function(){try{return new URLSearchParams(location.search).get('setup')==='1';}catch(e){return false;}})();
var EMBEDDED=(function(){try{return new URLSearchParams(location.search).get('embedded')==='1';}catch(e){return false;}})();
var PRINT_CHANNEL=(function(){try{return new URLSearchParams(location.search).get('channel')||'general';}catch(e){return 'general';}})();
var API_URL = (window.APP_CONFIG && window.APP_CONFIG.API_URL) || '';
var device=null, server=null, writeChar=null;
var looping=false, busy=false, timer=null, wakeLock=null;
var cntOk=0, cntErr=0;
var POLL_MS=1200; // 印刷キュー確認間隔（設定画面「印刷ブリッジ」カードで変更可能。既定1.2秒）
var logoImg=null; // レシートロゴ（設定画面でアップロード）
var logoScale=100; // ロゴ印字サイズ（58mm=100%）

var CANDIDATE_SERVICES = [
  0x18F0,0x18F1,0xFF00,0xFFE0,0xFFF0,0xFEE7,0xFB00,0xFEA0,0xE0FF,
  '000018f0-0000-1000-8000-00805f9b34fb','0000ff00-0000-1000-8000-00805f9b34fb',
  '0000ffe0-0000-1000-8000-00805f9b34fb','0000fff0-0000-1000-8000-00805f9b34fb',
  '49535343-fe7d-4ae5-8fa9-9fafd205e455','6e400001-b5a3-f393-e0a9-e50e24dcca9e',
  'e7810a71-73ae-499d-8c15-faa9aef0c3f2'
];

var T={
  ja:{ title:'🖨️ Bluetoothプリンタ', sub:'Bluetoothプリンタを検索・接続します。Android・Windows・Mac・Linuxの対応Chromeで利用できます（iOSブラウザは非対応。iOSはネイティブアプリを利用してください）。<br><b>動作確認済みプリンタ: PT-210</b>', kDone:'印刷済', kFail:'失敗', kConn:'接続', bConn:'🔗 Bluetoothプリンタに接続', bDisconnect:'切断', bForget:'登録解除', bStart:'▶ 監視開始', bStop:'■ 停止', keyLabel:'キー(任意)：', keyPh:'BRIDGE_KEY を設定した場合のみ', safe:'低速安全モード（20バイト送信）', note:'画面が消えると印刷が止まります。Bluetoothが切れたら再接続してください。困ったらこのログを共有してください。', langBtn:'EN',
    disconnected:'未接続', selecting:'デバイス選択中…', noWrite:'このBluetooth機器では印刷設定を自動判定できませんでした', connFail:'接続失敗', connected:'接続完了（監視開始できます）', needConn:'先に接続してください', watching:'監視中…', stopped:'停止中', disconnErr:'切断：再接続してください', noBt:'この端末は Web Bluetooth 非対応', forgetConfirm:'この出力先のBluetoothプリンタ登録を解除しますか？ 現在の接続を切り、Izakanpai内の接続情報を削除します。ブラウザのBluetooth許可は残る場合があります。', forgetDone:'登録解除しました。Izakanpai内の接続情報を削除しました。ブラウザのBluetooth許可を消す場合はブラウザのサイト設定から解除してください。', forgetFailed:'登録解除に失敗しました' },
  en:{ title:'🖨️ Bluetooth Printer', sub:'Search for and connect to a Bluetooth printer in supported Chrome on Android, Windows, Mac, or Linux (iOS browsers are not supported; use the native iOS app).<br><b>Verified printer: PT-210</b>', kDone:'Printed', kFail:'Failed', kConn:'Printer', bConn:'🔗 Connect Bluetooth printer', bDisconnect:'Disconnect', bForget:'Unregister', bStart:'▶ Start', bStop:'■ Stop', keyLabel:'Key (optional): ', keyPh:'Only if BRIDGE_KEY is set', safe:'Safe slow mode (20-byte writes)', note:'If the screen sleeps, printing stops. Reconnect if Bluetooth drops and share this log if troubleshooting is needed.', langBtn:'日本語',
    disconnected:'Not connected', selecting:'Selecting device…', noWrite:'Print settings could not be detected automatically for this Bluetooth device', connFail:'Connection failed', connected:'Connected (you can start)', needConn:'Connect first', watching:'Monitoring…', stopped:'Stopped', disconnErr:'Disconnected: reconnect', noBt:'This device has no Web Bluetooth', forgetConfirm:'Unregister the Bluetooth printer for this output? Izakanpai will disconnect it and clear its app-side connection profile. Browser Bluetooth permission may remain.', forgetDone:'Printer unregistered in Izakanpai. To remove browser Bluetooth permission too, use the browser site settings.', forgetFailed:'Could not unregister the printer' }
};
var curLang=(function(){ try{ var s=localStorage.getItem('lang');if(s==='ja'||s==='en')return s;var first=(navigator.languages&&navigator.languages.length)?navigator.languages[0]:navigator.language;var d=String(first||'').toLowerCase().indexOf('ja')===0?'ja':'en';localStorage.setItem('lang',d);return d;}catch(e){ return 'en'; } })();
function tt(k){ return (T[curLang]&&T[curLang][k])||k; }
function applyLang(l){
  curLang=(l==='en')?'en':'ja'; try{ localStorage.setItem('lang',curLang); }catch(e){}
  document.querySelectorAll('[data-i]').forEach(function(el){ var k=el.getAttribute('data-i'); if(T[curLang][k]!=null) el.innerHTML=T[curLang][k]; });
  var key=document.getElementById('key'); if(key) key.placeholder=T[curLang].keyPh;
  var lb=document.getElementById('langBtn'); if(lb) lb.textContent=T[curLang].langBtn;
}
function toggleLang(){ applyLang(curLang==='ja'?'en':'ja'); }

function log(m){ var el=document.getElementById('log'); var t=new Date().toLocaleTimeString('ja-JP'); el.textContent += '['+t+'] '+m+"\n"; el.scrollTop=el.scrollHeight; }
function setStat(t, cls){ document.getElementById('statText').textContent=t; document.getElementById('stat').className='stat'+(cls?' '+cls:''); }
function sleep(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }
function short(u){ u=String(u); var m=/0000([0-9a-f]{4})-0000-1000-8000-00805f9b34fb/.exec(u); return m?('0x'+m[1].toUpperCase()):u; }
function getKey(){ return (document.getElementById('key').value||'').trim(); }
function bridgeStoreId(){
  try{
    var prefix=(window.APP_CONFIG&&window.APP_CONFIG.STORAGE_PREFIX)||'';
    var storageKey=prefix+'bridgeStoreId';
    var query=new URLSearchParams(location.search).get('store')||'';
    var current=(window.API&&typeof API.currentStoreId==='function')?(API.currentStoreId()||''):'';
    var configured=(window.APP_CONFIG&&window.APP_CONFIG.STORE_ID)||'';
    var saved=localStorage.getItem(storageKey)||'';
    var value=String(query||current||configured||saved).trim().toLowerCase();
    if(!/^[a-z0-9][a-z0-9-]{2,31}$/.test(value)) return '';
    localStorage.setItem(storageKey,value);
    return value;
  }catch(e){ return ''; }
}
function bridgePrintHostDeviceId(){
  var storeId=bridgeStoreId(),prefix=(window.APP_CONFIG&&window.APP_CONFIG.STORAGE_PREFIX)||'',key=prefix+'printHostDeviceId.'+encodeURIComponent(storeId||'unknown'),id='';
  try{id=localStorage.getItem(key)||'';}catch(e){}
  if(!/^[A-Za-z0-9][A-Za-z0-9._:-]{15,119}$/.test(id)){
    try{id='webprint-'+crypto.randomUUID();}catch(e){id='webprint-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);}
    try{localStorage.setItem(key,id);}catch(e){}
  }
  return id;
}
function bridgePayload(extra){
  var storeId=bridgeStoreId();
  if(!storeId) throw new Error('bridge_store_required');
  return Object.assign({storeId:storeId},extra||{});
}
function selectedLogicalPrinterId(){var el=document.getElementById('logicalPrinter');return String(el&&el.value||'').trim();}
function printerProfileScopeId(){return selectedLogicalPrinterId()||String(PRINT_CHANNEL||'general').trim()||'general';}
function printerProfileStorageKey(suffix){var storeId=bridgeStoreId();if(!storeId)return '';return ((window.APP_CONFIG&&window.APP_CONFIG.STORAGE_PREFIX)||'')+'nativePrinter.'+encodeURIComponent(storeId)+'.'+encodeURIComponent(printerProfileScopeId())+'.'+suffix;}
function clearSavedPrinterProfile(){['deviceId','serviceUUID','characteristicUUID','profile'].forEach(function(s){var key=printerProfileStorageKey(s);if(key)localStorage.removeItem(key);});}
function bridgePrinterStorageKey(){var storeId=bridgeStoreId();return ((window.APP_CONFIG&&window.APP_CONFIG.STORAGE_PREFIX)||'')+'bridgePrinterId.'+encodeURIComponent(storeId||'unknown');}
function legacyBridgePrinterStorageKey(){return ((window.APP_CONFIG&&window.APP_CONFIG.STORAGE_PREFIX)||'')+'bridgePrinterId';}
function pendingPrintAckKey(){return ((window.APP_CONFIG&&window.APP_CONFIG.STORAGE_PREFIX)||'')+'print.pendingSuccessAck.bridge.'+(selectedLogicalPrinterId()||'none');}
function rememberPendingSuccessAck(id){try{if(id)localStorage.setItem(pendingPrintAckKey(),String(id));}catch(e){}}
function clearPendingSuccessAck(){try{localStorage.removeItem(pendingPrintAckKey());}catch(e){}}
async function recoverPendingSuccessAck(){var id='';try{id=localStorage.getItem(pendingPrintAckKey())||'';}catch(e){}if(!id)return false;await apiAck(id,true);clearPendingSuccessAck();log('前回印刷済みジョブの完了通知を復旧しました');return true;}
async function loadLogicalPrinters(){
  try{
    var token=localStorage.getItem(window.APP_CONFIG.AUTH_STORAGE_PREFIX+'mgmtToken')||'';
    if(!token)throw new Error('unauthorized');
    var r=await API.post('rpc',{fn:'getAllPrinters',args:[],token:token,__silent:true,__noInternalRetry:true});
    var list=(r&&r.data)||[],sel=document.getElementById('logicalPrinter'),key=bridgePrinterStorageKey(),legacyKey=legacyBridgePrinterStorageKey(),saved=localStorage.getItem(key)||'';
    if(!saved){saved=localStorage.getItem(legacyKey)||'';if(saved){localStorage.setItem(key,saved);localStorage.removeItem(legacyKey);}}
    sel.innerHTML='<option value="">--</option>';
    list.filter(function(p){return p&&p.enabled;}).forEach(function(p){var o=document.createElement('option');o.value=p.id;o.textContent=p.name+(p.categories&&p.categories.length?' / '+p.categories.join(', '):' / General');sel.appendChild(o);});
    if(saved&&list.some(function(p){return p.id===saved&&p.enabled;}))sel.value=saved;
    sel.onchange=function(){try{localStorage.setItem(bridgePrinterStorageKey(),sel.value||'');}catch(e){}};
  }catch(e){log('プリンタ一覧取得失敗: '+API.userErrorText(e));}
}

// URLの ?key= を初期値に
(function(){ try{ var sk=(window.APP_CONFIG.STORAGE_PREFIX||'')+'bridgeKey'; var k=new URLSearchParams(location.search).get('key'); if(k){ document.getElementById('key').value=k; localStorage.setItem(sk,k);} else { var s=localStorage.getItem(sk); if(s) document.getElementById('key').value=s; } }catch(e){} })();
applyLang(curLang); setStat(tt('disconnected'));

async function connect(){
  if(!navigator.bluetooth){ setStat(tt('noBt'),'err'); log('navigator.bluetooth なし（iOS不可）'); return; }
  try{
    setStat(tt('selecting'),'run'); log('プリンタを選択してください…');
    device = await navigator.bluetooth.requestDevice({ acceptAllDevices:true, optionalServices:CANDIDATE_SERVICES });
    device.addEventListener('gattserverdisconnected', onDisconnect);
    server = await device.gatt.connect();
    var services = await server.getPrimaryServices();
    writeChar=null;
    for(var i=0;i<services.length;i++){ var chs=[]; try{ chs=await services[i].getCharacteristics(); }catch(e){ continue; }
      for(var j=0;j<chs.length;j++){ var p=chs[j].properties; if(!writeChar && (p.write||p.writeWithoutResponse)) writeChar=chs[j]; } }
    if(!writeChar){ setStat(tt('noWrite'),'err'); log('！write特性が見つかりません'); return; }
    document.getElementById('cntPrinter').textContent = device.name || 'OK';
    log('接続OK: '+(device.name||'(no name)')+' / 特性 '+short(writeChar.uuid));
    setStat(tt('connected'),'ok');
    document.getElementById('btnStart').disabled=false;
  }catch(err){ setStat(tt('connFail'),'err'); log('接続エラー: '+API.userErrorText(err)); }
}
async function disconnectPrinter(){
  stopLoop();
  try{if(device&&device.gatt&&device.gatt.connected)device.gatt.disconnect();}catch(e){log('切断処理: '+API.userErrorText(e));}
  writeChar=null;server=null;device=null;document.getElementById('cntPrinter').textContent='—';document.getElementById('btnStart').disabled=true;setStat(tt('disconnected'),'');
}
async function unregisterPrinter(){
  var ok=await UIConfirm(tt('forgetConfirm'),{danger:true,okLabel:tt('bForget')});
  if(!ok)return;
  try{await disconnectPrinter();clearSavedPrinterProfile();log(tt('forgetDone'));await UIAlert(tt('forgetDone'));}
  catch(e){var detail=API.userErrorText(e);log(tt('forgetFailed')+': '+detail);setStat(tt('forgetFailed'),'err');await UIAlert(tt('forgetFailed')+': '+detail);}
}
function onDisconnect(){
  writeChar=null; document.getElementById('cntPrinter').textContent='—';
  log('！ プリンタ切断');
  if(looping){ setStat(tt('disconnErr'),'err'); }
}

async function startLoop(){
  if(!writeChar){ setStat(tt('needConn'),'err'); return; }
  if(!selectedLogicalPrinterId()){setStat(curLang==='en'?'Select the assigned printer first':'先に担当プリンタを選択してください','err');return;}
  looping=true;
  document.getElementById('btnStart').disabled=true;
  document.getElementById('btnStop').disabled=false;
  await requestWake();
  await loadLogo(); // レシートロゴを取得（設定画面のもの）
  await loadPollInterval(); // キュー確認間隔（設定画面で変更可能）を取得
  setStat(tt('watching'),'run'); log('監視開始 (interval='+POLL_MS+'ms)');
  tick();
  timer=setInterval(tick, POLL_MS);
}
// 設定画面「印刷ブリッジ」カードの間隔（ミリ秒）を取得。未設定/取得失敗時は既定値1200msのまま。
async function loadPollInterval(){
  try{
    var j = await API.post('getSettings',bridgePayload({__silent:true,__noInternalRetry:true}));
    var ms = j && j.ok && j.data ? Number(j.data.bridgePollMs) : NaN;
    if(!isNaN(ms) && ms >= 500 && ms <= 60000) POLL_MS = ms;
  }catch(e){}
}
function stopLoop(){
  looping=false; if(timer){ clearInterval(timer); timer=null; }
  document.getElementById('btnStart').disabled=false;
  document.getElementById('btnStop').disabled=true;
  releaseWake();
  setStat(tt('stopped'),'');
  log('監視停止');
}

async function tick(){
  if(!looping || busy) return;
  if(!writeChar){ return; } // 切断中はスキップ
  busy=true;
  try{
    try{await recoverPendingSuccessAck();}catch(recoverErr){log('完了通知の復旧待ち: '+API.userErrorText(recoverErr));stopLoop();return;}
    var jobs = await apiPoll();
    for(var i=0;i<jobs.length && looping && writeChar;i++){
      var job=jobs[i];
      try{
        log('印刷: '+job.id.slice(0,8)+'…');
        await printText(job.content||'');
      }catch(pe){
        log('印刷失敗: '+API.userErrorText(pe)+' → 再キュー');
        try{await apiAck(job.id,false);}catch(ae){log('失敗ACKも送信できませんでした: '+API.userErrorText(ae));}
        cntErr++; document.getElementById('cntErr').textContent=cntErr;
        break; // 失敗したら今サイクルは中断（次周期で再試行）
      }
      try{await apiAck(job.id,true);}
      catch(ae1){try{await sleep(500);await apiAck(job.id,true);}catch(ae2){rememberPendingSuccessAck(job.id);log('印刷済みですが完了通知を確認できません。二重印刷防止のため監視を停止します: '+API.userErrorText(ae2));stopLoop();cntErr++;document.getElementById('cntErr').textContent=cntErr;break;}}
      cntOk++; document.getElementById('cntOk').textContent=cntOk;
    }
    if(looping && writeChar) setStat(tt('watching')+'（'+cntOk+'）','run');
    if(jobs.length && looping) setTimeout(function(){ tick(); }, 300); // 連続ジョブは待たず即処理
  }catch(err){
    log('通信エラー: '+API.userErrorText(err));
  }finally{ busy=false; }
}

async function apiPoll(){
  var j = await API.post('bridgePoll',bridgePayload({ key:getKey(), printerId:selectedLogicalPrinterId(), deviceId:bridgePrintHostDeviceId(), __silent:true, __noInternalRetry:true }));
  if(!j.ok) throw new Error(j.error||'poll_ng');
  return j.jobs||[];
}
async function apiAck(id, ok){
  await API.post('bridgeAck',bridgePayload({ id:id, ok:ok, key:getKey(), printerId:selectedLogicalPrinterId(), deviceId:bridgePrintHostDeviceId(), __silent:true, __noInternalRetry:true }));
}

// テキスト → 58mm幅の画像 → ESC/POSラスター送信
async function printText(text){
  await printReceipt(String(text).replace(/₱/g,'P'));
}
// BLE書き込み（1バンド分のバイト列を分割送信）
async function sendChunks(bytes){
  var canNR=!!writeChar.properties.writeWithoutResponse;
  var safe=document.getElementById('safeMode').checked;
  var chunk=safe?20:128, d=safe?12:5;
  for(var i=0;i<bytes.length;i+=chunk){
    var s=bytes.slice(i, Math.min(i+chunk,bytes.length));
    if(canNR) await writeChar.writeValueWithoutResponse(s); else await writeChar.writeValue(s);
    await sleep(d);
  }
}
function buildCanvasFromText(text){
  var cv=document.getElementById('cv'); var ctx=cv.getContext('2d');
  var FS=22, LH=FS+8, pad=8;
  ctx.font=FS+"px 'Noto Sans JP',monospace";
  // ペソ記号(₱ U+20B1)など端末フォントに無い記号は化けるため安全な文字へ置換
  text=String(text).replace(/₱/g,'P');
  // 行を幅に合わせて折り返し
  var raw=text.replace(/\r/g,'').split('\n');
  var lines=[];
  raw.forEach(function(ln){
    if(ln===''){ lines.push(''); return; }
    var cur='';
    for(var i=0;i<ln.length;i++){
      var test=cur+ln[i];
      if(ctx.measureText(test).width > (PRINT_WIDTH-2*pad) && cur){ lines.push(cur); cur=ln[i]; }
      else cur=test;
    }
    lines.push(cur);
  });
  cv.height = pad*2 + lines.length*LH + 24; // 末尾に紙送り余白
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.fillStyle='#000'; ctx.textBaseline='top'; ctx.font=FS+"px 'Noto Sans JP',monospace";
  var y=pad;
  lines.forEach(function(ln){ ctx.fillText(ln, pad, y); y+=LH; });
  return cv;
}
// 混在印刷：ASCII行は高速なESC/POSテキストモード、日本語を含む行だけ1行画像化。
// これでデータ量が激減し大幅に高速化。行頭の制御 (0x01=中央大 / 0x02=中央) でヘッダーを装飾。
async function printReceipt(text){
  await sendChunks(new Uint8Array([0x1B,0x40])); // 初期化
  // レシート（店名ヘッダー[[B]]を含む）のときは先頭にロゴを中央印字
  if (logoImg && text.indexOf('[[B]]') >= 0) { log('ロゴ印字'); try { await printLogo(); } catch(e){ log('ロゴ印字失敗: '+API.userErrorText(e)); } }
  var lines = text.replace(/\r/g,'').split('\n');
  var buf = []; // テキストモードのバイトをまとめて送る
  async function flush(){ if(buf.length){ await sendChunks(new Uint8Array(buf)); buf=[]; } }
  async function emit(seg, align, big){
    if (seg === ''){ buf.push(0x0A); return; }
    var tab = seg.indexOf('\t');
    if (tab >= 0){
      // ラベル\t金額の2カラム行（レシート明細・小計等）。金額を右端にピクセル単位で揃えるため
      // プロポーショナルフォントでの画像化時は実測幅で右寄せする（文字数ベースの空白埋めはズレるため廃止）。
      var label = seg.slice(0,tab), val = seg.slice(tab+1);
      if (/^[\x20-\x7E]*$/.test(label) && /^[\x20-\x7E]*$/.test(val)){
        // 全角文字を含まない行はプリンタ本体の等幅フォントで印字（文字数ベースの空白埋めで正しく揃う）
        var pad = 20 - label.length - val.length; if (pad < 1) pad = 1;
        seg = label + Array(pad+1).join(' ') + val;
      } else {
        await flush();
        await rasterLine2Col(label, val);
        return;
      }
    }
    if (/^[\x20-\x7E]*$/.test(seg)){
      // ASCII → テキストモード（高速）
      buf.push(0x1B,0x61,align);                       // 整列(0左/1中央)
      if (big) buf.push(0x1D,0x21,0x11, 0x1B,0x45,0x01); // 倍角＋太字
      for (var c=0;c<seg.length;c++) buf.push(seg.charCodeAt(c) & 0x7F);
      buf.push(0x0A);
      if (big) buf.push(0x1D,0x21,0x00, 0x1B,0x45,0x00); // 解除
      buf.push(0x1B,0x61,0x00);                         // 左寄せへ戻す
    } else {
      // 日本語を含む行 → その1行だけ画像化（小さいのでバッファ安全）
      await flush();
      await rasterLine(seg, align, big);
    }
  }
  for (var i=0;i<lines.length;i++){
    var ln = lines[i], align = 0, big = false;
    if (ln.slice(0,7) === '[[IMG]]'){
      // 埋め込み画像（テーブルQRコード等）：dataURLを読み込み、閾値2値化してそのまま印字（誤差拡散はしない＝QRの升目を鮮明に保つ）
      await flush();
      try { var im = await loadImageAsync(ln.slice(7)); await printImageCentered(im, 300, 320, false); }
      catch(e){ log('画像印字失敗: '+API.userErrorText(e)); }
      continue;
    }
    if (ln.slice(0,5) === '[[B]]'){ align=1; big=true; ln=ln.slice(5); }
    else if (ln.slice(0,5) === '[[C]]'){ align=1; ln=ln.slice(5); }
    if (big){
      // 大きい見出し（店名）は幅を取るので 半角20文字（全角10文字）で折り返す
      var segs = wrapWidth(ln, 20);
      for (var s=0;s<segs.length;s++) await emit(segs[s], align, true);
    } else {
      await emit(ln, align, false);
    }
  }
  await flush();
  await sendChunks(new Uint8Array([0x0A,0x0A,0x0A]));
  await sleep(120);
}
// 表示幅（全角=2/半角=1）で折り返し
function wrapWidth(str, maxHalf){
  var out=[], cur='', w=0;
  for (var i=0;i<str.length;i++){
    var ch=str[i], cw=(str.charCodeAt(i)>255)?2:1;
    if (w+cw>maxHalf && cur){ out.push(cur); cur=ch; w=cw; }
    else { cur+=ch; w+=cw; }
  }
  if (cur) out.push(cur);
  return out.length?out:[''];
}
// 1行だけを画像化して送る（日本語対応・中央寄せ/大に対応）
async function rasterLine(text, align, big){
  var cv=document.getElementById('cv'); var ctx=cv.getContext('2d');
  var FS = big?34:24, H = FS + 12, W=384, bpr=48;
  cv.width=W; cv.height=H;
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#000'; ctx.textBaseline='top';
  ctx.font=(big?'bold ':'')+FS+"px 'Noto Sans JP',sans-serif";
  var w=ctx.measureText(text).width;
  var x = (align===1) ? Math.max(0,(W-w)/2) : 6;
  ctx.fillText(text, x, 6);
  var img=ctx.getImageData(0,0,W,H).data;
  var job=[0x1D,0x76,0x30,0x00, bpr&0xff,0, H&0xff,(H>>8)&0xff];
  for(var y=0;y<H;y++){ for(var bx=0;bx<bpr;bx++){ var b=0;
    for(var bit=0;bit<8;bit++){ var px=bx*8+bit, idx=(y*W+px)*4;
      if(img[idx+3]>32 && (img[idx]*0.299+img[idx+1]*0.587+img[idx+2]*0.114)<128) b|=(0x80>>bit); }
    job.push(b); } }
  await sendChunks(new Uint8Array(job));
  await sleep(H*2 + 20); // この行が印字されるのを待つ
}
// ラベル＋金額の2カラム行を画像化（金額は実測ピクセル幅で右端に揃える。プロポーショナルフォントでも
// 文字数ベースの空白埋めのようにズレない）
async function rasterLine2Col(label, val){
  var cv=document.getElementById('cv'); var ctx=cv.getContext('2d');
  var FS=24, H=FS+12, W=384, bpr=48, pad=6;
  cv.width=W; cv.height=H;
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#000'; ctx.textBaseline='top';
  ctx.font=FS+"px 'Noto Sans JP',sans-serif";
  var valW = ctx.measureText(val).width;
  var valX = Math.max(0, W - pad - valW);
  ctx.fillText(label, pad, 6);
  ctx.fillText(val, valX, 6);
  var img=ctx.getImageData(0,0,W,H).data;
  var job=[0x1D,0x76,0x30,0x00, bpr&0xff,0, H&0xff,(H>>8)&0xff];
  for(var y=0;y<H;y++){ for(var bx=0;bx<bpr;bx++){ var b=0;
    for(var bit=0;bit<8;bit++){ var px=bx*8+bit, idx=(y*W+px)*4;
      if(img[idx+3]>32 && (img[idx]*0.299+img[idx+1]*0.587+img[idx+2]*0.114)<128) b|=(0x80>>bit); }
    job.push(b); } }
  await sendChunks(new Uint8Array(job));
  await sleep(H*2 + 20);
}
// サーバーからレシートロゴを取得（設定画面でアップロードされた画像）
async function loadLogo(){
  try{
    var j=await API.post('getReceiptLogo',bridgePayload({ key:getKey(), __silent:true, __noInternalRetry:true }));
    logoScale = Math.max(20, Math.min(100, Number(j.scale)||100));
    if(j.ok && j.data){ var im=new Image(); im.onload=function(){ logoImg=im; log('ロゴ読込OK ('+logoScale+'%)'); }; im.onerror=function(){ logoImg=null; }; im.src=j.data; }
    else logoImg=null;
  }catch(e){ /* ロゴ無しでも印刷は継続 */ }
}
// ロゴを中央・58mm幅に収めてディザ印字（小バンド分割でバッファ安全）
async function printLogo(){
  if(!logoImg) return;
  var maxW=Math.max(48, Math.round(384*(logoScale/100)));
  await printImageCentered(logoImg, maxW, 150, true);
}
// 汎用：任意の画像を中央配置して印字（小バンド分割でバッファ安全）。
// dither=trueなら誤差拡散（写真調のロゴ向き）、falseなら単純閾値2値化（QRコード等、升目を鮮明に保つ必要がある場合向き）。
async function printImageCentered(img, maxWpx, maxHpx, dither){
  var sc=Math.min(maxWpx/img.width, maxHpx/img.height, 1);
  var w=Math.max(1,Math.round(img.width*sc)), h=Math.max(1,Math.round(img.height*sc));
  var W=384, H=h, bpr=48;
  var cv=document.getElementById('cv'); var ctx=cv.getContext('2d');
  cv.width=W; cv.height=H;
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
  ctx.drawImage(img, Math.floor((W-w)/2), 0, w, h);
  var d=ctx.getImageData(0,0,W,H).data;
  var g=new Float32Array(W*H);
  for(var i=0;i<W*H;i++){ var a=d[i*4+3]; g[i]=(a>32)?(d[i*4]*0.299+d[i*4+1]*0.587+d[i*4+2]*0.114):255; }
  if (dither){
    for(var yy=0;yy<H;yy++){ for(var xx=0;xx<W;xx++){ var idx=yy*W+xx, old=g[idx], nw=old<128?0:255, err=old-nw; g[idx]=nw;
      if(xx+1<W) g[idx+1]+=err*7/16;
      if(yy+1<H){ if(xx>0) g[idx+W-1]+=err*3/16; g[idx+W]+=err*5/16; if(xx+1<W) g[idx+W+1]+=err*1/16; } } }
  } else {
    for(var k=0;k<W*H;k++){ g[k]=(g[k]<128)?0:255; }
  }
  var BAND=48;
  for(var y0=0;y0<H;y0+=BAND){
    var rows=Math.min(BAND,H-y0);
    var job=[0x1D,0x76,0x30,0x00, bpr&0xff,0, rows&0xff,(rows>>8)&0xff];
    for(var y=0;y<rows;y++){ for(var bx=0;bx<bpr;bx++){ var b=0;
      for(var bit=0;bit<8;bit++){ var px=bx*8+bit; if(g[(y0+y)*W+px]<128) b|=(0x80>>bit); }
      job.push(b); } }
    await sendChunks(new Uint8Array(job));
    await sleep(rows*3 + 30);
  }
  await sendChunks(new Uint8Array([0x0A])); // 画像下に1行送り
}
// dataURLを<img>として非同期読み込み
function loadImageAsync(src){
  return new Promise(function(resolve, reject){
    var im=new Image();
    im.onload=function(){ resolve(im); };
    im.onerror=function(e){ reject(new Error('image_load_failed')); };
    im.src=src;
  });
}

async function requestWake(){ try{ if('wakeLock' in navigator){ wakeLock=await navigator.wakeLock.request('screen'); log('画面常時点灯ON'); } }catch(e){ log('WakeLock不可: '+API.userErrorText(e)); } }
function releaseWake(){ try{ if(wakeLock){ wakeLock.release(); wakeLock=null; } }catch(e){} }
document.addEventListener('visibilitychange', async function(){ if(document.visibilityState==='visible' && looping && !wakeLock){ await requestWake(); } });
if(EMBEDDED){ document.body.classList.add('embedded'); }
if(SETUP_ONLY){ document.body.classList.add('setup-only'); }
loadLogicalPrinters();
