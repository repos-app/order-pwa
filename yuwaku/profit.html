<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Gross Profit">

  <link rel="manifest" href="./profit.webmanifest">
  <title>Gross Profit</title>
  <style>
    :root{ --bg:#f6f7f9; --surface:#fff; --border:#e5e7eb; --navy:#0f172a; --text-3:#64748b; --green:#16a34a; --red:#c62828; --filter-control-h:46px; }
    *{ box-sizing:border-box; }
    body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans JP',sans-serif; background:var(--bg); color:var(--navy); }
    .head{ position:sticky; top:0; z-index:20; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:space-between; padding:12px 16px; }
    .head h1{ font-size:18px; margin:0; font-weight:900; }
    .hbtn{ background:rgba(255,255,255,.14); color:#fff; border:0; border-radius:9px; padding:8px 12px; font-size:13px; font-weight:800; cursor:pointer; text-decoration:none; }
    .wrap{ padding:16px; max-width:720px; margin:0 auto; }
    .card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:14px; }
    .bar{ display:flex; gap:12px; align-items:flex-end; margin-bottom:6px; flex-wrap:wrap; }
    .fc{ width:100%; padding:10px; border:1px solid var(--border); border-radius:9px; font-size:15px; font-family:inherit; background:var(--surface); }
    .month-field{ flex:0 0 188px; min-width:0; max-width:188px; padding-right:8px; overflow:visible; }
    .month-field .fc{ display:block; inline-size:100%!important; width:100%!important; min-inline-size:0!important; min-width:0!important; max-inline-size:100%!important; max-width:100%!important; box-sizing:border-box; }
    .bar > .hbtn{ height:var(--filter-control-h); padding-top:0; padding-bottom:0; display:inline-flex; align-items:center; justify-content:center; }
    .form-label{ font-size:12px; font-weight:700; display:block; margin-bottom:4px; }
    @media (max-width:520px){ .fc{ min-width:0; font-size:16px; } }
    .row{ display:flex; justify-content:space-between; align-items:center; padding:11px 2px; border-bottom:1px solid var(--border); }
    .row .lb{ font-weight:700; } .row .amt{ font-variant-numeric:tabular-nums; font-weight:800; }
    .row.sub .lb{ font-weight:600; color:var(--text-3); padding-left:12px; }
    .row.sub .amt{ color:var(--text-3); font-weight:700; }
    .row.rev .amt{ color:var(--green); font-size:18px; }
    .cost .amt{ color:var(--red); }
    .profit{ display:flex; justify-content:space-between; align-items:center; padding:16px 12px; margin-top:6px; border-radius:12px; background:#0f172a; color:#fff; }
    .profit .lb{ font-weight:900; font-size:16px; } .profit .amt{ font-weight:900; font-size:22px; font-variant-numeric:tabular-nums; }
    .profit .rate{ font-size:13px; opacity:.85; margin-left:8px; }
    .cogsopt{ display:flex; gap:14px; margin:4px 0 2px; font-size:13px; }
    .cogsopt label{ display:flex; gap:5px; align-items:center; cursor:pointer; }
    .muted{ color:var(--text-3); font-size:12px; }
    .hint{ color:var(--text-3); font-size:12px; line-height:1.7; }
    .loading{ text-align:center; color:var(--text-3); padding:30px 0; }
  </style>
  <link rel="stylesheet" href="./date-controls.css?v=3">
</head>
<body>
  <div class="head"><h1 data-t="title">📈 月間粗利</h1><div style="display:flex;gap:8px;"><button class="hbtn" data-tlang onclick="I18n.toggle()">EN</button><a class="hbtn" href="./manage.html" data-t="back">← 管理へ</a></div></div>
  <div class="wrap">
    <div class="card">
      <div class="bar">
        <div class="month-field"><label class="form-label" for="month" data-t="month">対象月</label><input id="month" type="month" class="fc"></div>
        <button class="hbtn" style="background:var(--navy);" onclick="load()" data-t="calc">🔄 計算</button>
      </div>
      <div class="hint" data-t="hint">売上・商品原価(レシピ自動)・従業員給与(勤怠)はシステムから自動取得。固定費・備品・その他は「経費一覧」の登録額を集計します。</div>
    </div>

    <div class="card" id="result"><div class="loading" data-t="loading">読み込み中…</div></div>
  </div>

  <script src="./date-display.js?v=auth4" data-iz-date-display></script><script src="./config.js?v=auth2"></script>
  <script src="./api.js?v=auth2"></script>
  <script src="./i18n.js?v=auth3"></script>
  <script>
    var TOKEN = localStorage.getItem(window.APP_CONFIG.AUTH_STORAGE_PREFIX + 'mgmtToken') || '';
    if (!TOKEN) location.href = './manage.html';
    // opts: {silent:bool, timeoutMs:number, noInternalRetry:bool}（[GPT第22回レポート対応/G22-1・G22-2]）
    function rpc(fn,args,opts){
      opts = opts || {};
      var payload = { fn:fn, args:args||[], token:TOKEN };
      if (opts.silent) payload.__silent = true;
      if (typeof opts.timeoutMs === 'number') payload.__timeoutMs = opts.timeoutMs;
      if (opts.noInternalRetry) payload.__noInternalRetry = true;
      return API.post('rpc',payload).then(function(r){ return r.data; });
    }
    function isEN(){ return !!(window.I18n && I18n.lang && I18n.lang()==='en'); }
    // [GPT第22回レポート対応/G22-1・G22-2] getMonthlyProfitもgetSalesAnalytics等と同じ
    // single-flight機構を使う重い集計RPC。sales.html/dashboard.htmlと同じ対策
    // （再試行の一本化・fetchタイムアウト個別指定・全画面オーバーレイの回避・再試行ボタン）を適用する。
    var _HEAVY_RPC_TIMEOUT_MS = API.TIMEOUT_MS.heavy; // [タイムアウト共通化] 値の定義元はapi.js（=23000）
    function _isBusyOrTimeoutError(e){
      if (!e) return false;
      var msg = String(e.message||e||'');
      if (msg === 'server_busy_retry') return true;
      if (e.name === 'AbortError') return true;
      if (/timeout|abort/i.test(msg)) return true;
      return false;
    }
    function rpcBusyRetry(fn, args, retriesLeft){
      retriesLeft = (retriesLeft==null) ? 1 : retriesLeft;
      return rpc(fn, args, { silent:true, timeoutMs:_HEAVY_RPC_TIMEOUT_MS, noInternalRetry:true }).catch(function(e){
        var isBusy = _isBusyOrTimeoutError(e);
        if (isBusy && retriesLeft > 0) {
          var waitMs = 1000 + Math.floor(Math.random()*2000);
          return new Promise(function(resolve){ setTimeout(resolve, waitMs); }).then(function(){
            return rpcBusyRetry(fn, args, retriesLeft - 1);
          });
        }
        if (isBusy) {
          var busyErr = new Error(isEN() ? 'This calculation is busy. Please wait a moment and tap Retry.' : '集計が混み合っています。しばらくしてから「再試行」を押してください。');
          throw busyErr;
        }
        throw e;
      });
    }
    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
    var SYM='₱', DATA=null, cogsMode='auto';
    function money(v){ return SYM+(Math.round(Number(v)||0)).toLocaleString(); }

    window.setCogs = function(mode){ cogsMode=mode; render(); };

    function render(){
      if(!DATA){ return; }
      var d = DATA, e = d.exp||{};
      var cogs = (cogsMode==='purchase') ? (e['商品仕入']||0) : (d.cogsAuto||0);
      var fixed = (e['賃料']||0)+(e['電気代']||0)+(e['水道代']||0);
      var totalCost = cogs + (d.wages||0) + fixed + (e['備品購入']||0) + (e['その他']||0);
      var profit = (d.revenue||0) - totalCost;
      var rate = d.revenue>0 ? Math.round(profit/d.revenue*1000)/10 : 0;
      var html = '';
      html += '<div class="row rev"><span class="lb">'+I18n.t('revenue')+' <span class="muted">('+d.orders+I18n.t('ordersU')+')</span></span><span class="amt">'+money(d.revenue)+'</span></div>';
      // 商品原価（選択）
      html += '<div class="row cost"><span class="lb">'+I18n.t('cogs')+'</span><span class="amt">− '+money(cogs)+'</span></div>';
      html += '<div class="cogsopt">'
        + '<label><input type="radio" name="cogs" '+(cogsMode==='auto'?'checked':'')+' onchange="setCogs(\'auto\')"> '+I18n.t('cogsAuto')+' ('+money(d.cogsAuto)+')</label>'
        + '<label><input type="radio" name="cogs" '+(cogsMode==='purchase'?'checked':'')+' onchange="setCogs(\'purchase\')"> '+I18n.t('cogsBuy')+' ('+money(e['商品仕入']||0)+')</label>'
        + '</div>';
      html += '<div class="row cost"><span class="lb">'+I18n.t('wages')+'</span><span class="amt">− '+money(d.wages)+'</span></div>';
      html += '<div class="row cost"><span class="lb">'+I18n.t('rent')+' / '+I18n.t('elec')+' / '+I18n.t('water')+'</span><span class="amt">− '+money(fixed)+'</span></div>';
      html += '<div class="row sub"><span class="lb">'+I18n.t('rent')+'</span><span class="amt">'+money(e['賃料']||0)+'</span></div>';
      html += '<div class="row sub"><span class="lb">'+I18n.t('elec')+'</span><span class="amt">'+money(e['電気代']||0)+'</span></div>';
      html += '<div class="row sub"><span class="lb">'+I18n.t('water')+'</span><span class="amt">'+money(e['水道代']||0)+'</span></div>';
      html += '<div class="row cost"><span class="lb">'+I18n.t('supply')+'</span><span class="amt">− '+money(e['備品購入']||0)+'</span></div>';
      html += '<div class="row cost"><span class="lb">'+I18n.t('other')+'</span><span class="amt">− '+money(e['その他']||0)+'</span></div>';
      html += '<div class="profit"><span class="lb">'+I18n.t('profit')+'<span class="rate">'+I18n.t('rate')+' '+rate+'%</span></span><span class="amt">'+money(profit)+'</span></div>';
      html += '<div class="hint" style="margin-top:10px;" data-t="note2">※ 固定費・備品・その他・仕入は「経費一覧」で当月に登録した金額の合計です。</div>';
      document.getElementById('result').innerHTML = html;
      I18n && I18n.lang && applyNote();
    }
    function applyNote(){ var n=document.querySelector('#result [data-t="note2"]'); if(n) n.textContent=I18n.t('note2'); }

    window.load = function(){
      var mo = document.getElementById('month').value; if(!mo) return;
      document.getElementById('result').innerHTML='<div class="loading">'+I18n.t('loading')+'</div>';
      rpcBusyRetry('getMonthlyProfit',[mo]).then(function(d){ DATA=d||null; render(); })
        .catch(function(e){
          if(String(e.message||e).indexOf('unauthorized')>=0){ location.href='./manage.html'; return; }
          var ts = new Date().toLocaleTimeString(isEN()?'en-US':'ja-JP');
          document.getElementById('result').innerHTML = '<div style="color:#b91c1c;padding:14px;">'+I18n.t('loadErr')+esc(API.userErrorText(e))
            +'<div style="margin-top:6px;font-size:12px;color:var(--text-3);">'+(isEN()?'Last attempt: ':'最終試行: ')+ts+'</div>'
            +'<button type="button" class="hbtn" style="background:var(--navy);margin-top:8px;" onclick="load()">'+(isEN()?'🔄 Retry':'🔄 再試行')+'</button>'
            +'</div>';
        });
    };

    API.post('getSettings', {}).then(function(r){ if(r.data && r.data.currencySymbol) SYM=r.data.currencySymbol; if(DATA) render(); }).catch(function(){});
    // 2026-08-24修正: toISOString()はUTC基準のため、フィリピン時間で月初の午前0〜8時頃に開くと
    // 前月が選択されてしまう不具合があった（profit_sim.htmlで先に見つけて修正済みだった同じ問題を
    // 横展開）。ローカル時間（店舗のタイムゾーン）で当月を決める。
    API.initStoreDateInputs([{id:'month',kind:'month'}], load);

    I18n.init({
      ja:{ title:'📈 月間粗利', back:'← 管理へ', month:'対象月', calc:'🔄 計算', hint:'売上・商品原価(レシピ自動)・従業員給与(勤怠)はシステムから自動取得。固定費・備品・その他は「経費一覧」の登録額を集計します。', loading:'読み込み中…', revenue:'売上', ordersU:'件', cogs:'商品原価', cogsAuto:'自動(レシピ)', cogsBuy:'仕入実績', wages:'従業員給与', rent:'賃料', elec:'電気代', water:'水道代', supply:'備品購入', other:'その他', profit:'粗利', rate:'粗利率', note2:'※ 固定費・備品・その他・仕入は「経費一覧」で当月に登録した金額の合計です。', errPrefix:'エラー: ', loadErr:'読み込みエラー: ' },
      en:{ title:'📈 Monthly Gross Profit', back:'← Manage', month:'Target month', calc:'🔄 Calculate', hint:'Revenue, product cost (auto via recipes) and wages (attendance) are pulled from the system. Fixed costs / supplies / other are summed from the Expenses list.', loading:'Loading…', revenue:'Revenue', ordersU:' orders', cogs:'Product cost', cogsAuto:'Auto (recipe)', cogsBuy:'Purchases', wages:'Wages', rent:'Rent', elec:'Electricity', water:'Water', supply:'Supplies', other:'Other', profit:'Gross profit', rate:'Margin', note2:'* Fixed costs / supplies / other / purchases are totals registered for the month in the Expenses list.', errPrefix:'Error: ', loadErr:'Load error: ' }
    }, function(){ if(DATA) render(); });

    load();
  </script>
  <script src="./help.js?v=auth2"></script>
  <script>
    HelpUI.register({
      title: '月間粗利',
      titleEn: 'Monthly gross profit',
      items: [
        { ja: '① 「対象月」を選んで「🔄 計算」を押すと、その月の売上から粗利（売上−原価）を計算して表示します。', en: '① Pick a "Target month" and tap "🔄 Calculate" to compute that month\'s gross profit (revenue − costs).' },
        { ja: '② 売上・商品原価（レシピから自動算出）・従業員給与（勤怠から自動算出）はシステムから自動取得されます。', en: '② Revenue, product cost (auto from recipes), and wages (auto from attendance) are pulled automatically from the system.' },
        { ja: '③ 商品原価は「自動(レシピ)」と「仕入実績」のどちらかをラジオボタンで選んで比較できます。', en: '③ Choose between "Auto (recipe)" and "Purchases" for product cost using the radio buttons to compare.' },
        { ja: '④ 賃料・電気代・水道代・備品購入・その他の経費は「経費一覧」で当月に登録した金額が集計されます。', en: '④ Rent, electricity, water, supplies, and other costs are totals registered for the month in the Expenses list.' },
        { ja: '⑤ 画面下部に粗利額と粗利率がまとめて表示され、経営状況を一目で把握できます。', en: '⑤ The bottom shows the gross profit amount and margin together for a quick view of financial health.' }
      ]
    });
  </script>
</body>
</html>
